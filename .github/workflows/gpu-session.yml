name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      # ============================================================
      # CHECK CONFIG
      # ============================================================

      - name: Check configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"

          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo
          echo "API_URL:"
          echo "$API_URL"

          echo
          echo "WORKER_TOKEN:"
          echo "${#WORKER_TOKEN} characters"

          echo

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is empty"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL is empty"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN is empty"
            exit 1
          fi

      # ============================================================
      # CREATE KAGGLE WORKER
      # ============================================================

      - name: Prepare Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          mkdir -p kaggle_submit

          python - <<'PY'
          import os
          from pathlib import Path

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"]
          worker_token = os.environ["WORKER_TOKEN"]

          source = Path("kaggle_worker.py")

          if not source.exists():
              raise SystemExit(
                  "ERROR: kaggle_worker.py was not found in repository root"
              )

          code = source.read_text(encoding="utf-8")

          # Replace placeholders in the worker.
          code = code.replace(
              "__SESSION_ID__",
              session_id
          )

          code = code.replace(
              "__API_URL__",
              api_url.rstrip("/")
          )

          code = code.replace(
              "__WORKER_TOKEN__",
              worker_token
          )

          # Also replace shell-style placeholders in case they exist.
          code = code.replace(
              "${SESSION_ID}",
              session_id
          )

          code = code.replace(
              "${API_URL}",
              api_url.rstrip("/")
          )

          code = code.replace(
              "${WORKER_TOKEN}",
              worker_token
          )

          output = Path("kaggle_submit/kaggle_worker.py")
          output.write_text(code, encoding="utf-8")

          print("Kaggle worker prepared.")
          print("SESSION_ID injected:", session_id)
          print("API_URL injected:", api_url.rstrip("/"))
          print("WORKER_TOKEN injected:", len(worker_token), "chars")

          # Safety checks.
          if "__SESSION_ID__" in code:
              raise SystemExit("ERROR: SESSION_ID placeholder still exists")

          if "__API_URL__" in code:
              raise SystemExit("ERROR: API_URL placeholder still exists")

          if "__WORKER_TOKEN__" in code:
              raise SystemExit("ERROR: WORKER_TOKEN placeholder still exists")

          if "${SESSION_ID}" in code:
              raise SystemExit("ERROR: ${SESSION_ID} still exists")

          if "${API_URL}" in code:
              raise SystemExit("ERROR: ${API_URL} still exists")

          if "${WORKER_TOKEN}" in code:
              raise SystemExit("ERROR: ${WORKER_TOKEN} still exists")
          PY

      # ============================================================
      # KAGGLE METADATA
      # ============================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_submit/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "kaggle_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle_submit/kernel-metadata.json

      # ============================================================
      # PUSH / RUN KAGGLE
      # ============================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e

          cd kaggle_submit

          echo "========================================"
          echo "STARTING KAGGLE GPU WORKER"
          echo "========================================"

          kaggle kernels push -p .

      # ============================================================
      # WAIT FOR KAGGLE
      # ============================================================

      - name: Monitor Kaggle worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "Kernel:"
          echo "$KERNEL"

          echo

          for i in $(seq 1 120); do

            echo "----------------------------------------"
            echo "CHECK $i / 120"
            echo "----------------------------------------"

            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "complete"; then
              echo
              echo "KAGGLE WORKER COMPLETED"
              break
            fi

            if echo "$STATUS" | grep -qi "error"; then
              echo
              echo "KAGGLE WORKER ERROR"
              break
            fi

            if echo "$STATUS" | grep -qi "failed"; then
              echo
              echo "KAGGLE WORKER FAILED"
              break
            fi

            sleep 5

          done

      # ============================================================
      # FINAL
      # ============================================================

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "GPU SESSION WORKFLOW FINISHED"
          echo "========================================"

          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo
          echo "KAGGLE KERNEL:"
          echo "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"
