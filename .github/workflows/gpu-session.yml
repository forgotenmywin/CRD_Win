name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          kaggle --version


      # ======================================================
      # VALIDATE ENVIRONMENT
      # ======================================================

      - name: Validate environment
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "Session:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"

          echo "Worker token length:"
          echo "${#WORKER_TOKEN}"

          echo "Kaggle username:"
          echo "$KAGGLE_USERNAME"

          echo "Kaggle token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID missing"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL missing"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN missing"
            exit 1
          fi

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

          echo "Validation OK."


      # ======================================================
      # KAGGLE AUTH TEST
      # ======================================================

      - name: Test Kaggle authentication
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "KAGGLE AUTHENTICATION"
          echo "========================================"

          python -m kaggle --version

          echo "Kaggle credentials detected."


      # ======================================================
      # PREPARE WORKER
      # ======================================================

      - name: Prepare Kaggle worker
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          test -f kaggle_worker/script.py

          mkdir -p /tmp/kaggle_kernel

          cp kaggle_worker/script.py \
             /tmp/kaggle_kernel/script.py

          echo "Worker source exists."

          python -m py_compile \
            /tmp/kaggle_kernel/script.py

          echo "Worker Python syntax OK."


      # ======================================================
      # INJECT SESSION VALUES
      # ======================================================

      - name: Configure worker
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "CONFIGURING WORKER"
          echo "========================================"

          python <<'PY'

          import os
          from pathlib import Path

          src = Path("/tmp/kaggle_kernel/script.py")

          text = src.read_text()

          replacements = {
              'os.environ.get("SESSION_ID", "").strip()':
                  repr(os.environ["SESSION_ID"]),

              'os.environ.get("API_URL", "").strip()':
                  repr(os.environ["API_URL"]),

              'os.environ.get("WORKER_TOKEN", "").strip()':
                  repr(os.environ["WORKER_TOKEN"]),
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          src.write_text(text)

          PY

          python -m py_compile \
            /tmp/kaggle_kernel/script.py

          echo "Worker configured successfully."


      # ======================================================
      # CREATE KAGGLE METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          KERNEL_SLUG="gpu-session-${SESSION_ID}"

          cat > /tmp/kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat /tmp/kaggle_kernel/kernel-metadata.json


      # ======================================================
      # PUSH KAGGLE
      # ======================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          cd /tmp/kaggle_kernel

          kaggle kernels push \
            -p .

          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT FOR WORKER
      # ======================================================

      - name: Wait for worker
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"

          for i in $(seq 1 300); do

            echo "CHECK $i / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "$STATUS_URL")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | \
              python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status",""))
          except:
              print("")
          ')

            echo "Current status: $STATUS"

            if [ "$STATUS" = "active" ]; then

              echo ""
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              exit 0

            fi

            if [ "$STATUS" = "error" ]; then

              echo ""
              echo "========================================"
              echo "GPU WORKER ERROR"
              echo "========================================"

              exit 1

            fi

            if [ "$STATUS" = "stopped" ]; then

              echo "Worker stopped."
              exit 1

            fi

            sleep 5

          done

          echo "Worker did not become ready."

          exit 1


      # ======================================================
      # KEEP GITHUB ACTION ALIVE
      # ======================================================

      - name: Keep workflow alive
        if: always()
        shell: bash
        run: |

          echo "GPU worker lifecycle handled by Kaggle."

          echo "Session:"
          echo "$SESSION_ID"

          echo "Final Railway status:"

          curl \
            -sS \
            --max-time 20 \
            "${API_URL}/gpu/session/${SESSION_ID}" \
            || true


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Save debug information
        if: always()
        shell: bash
        run: |

          mkdir -p artifacts

          echo "$SESSION_ID" \
            > artifacts/session_id.txt

          curl \
            -sS \
            --max-time 20 \
            "${API_URL}/gpu/session/${SESSION_ID}" \
            > artifacts/final_status.json \
            || true


      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: artifacts/
