name: Kaggle GPU System Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Install Kaggle CLI
      # =========================================================
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version


      # =========================================================
      # 2. Check credentials
      # =========================================================
      - name: Check Kaggle Credentials
        run: |
          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials loaded successfully."


      # =========================================================
      # 3. Test Kaggle API
      # =========================================================
      - name: Test Kaggle API
        run: |
          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          kaggle kernels list \
            --mine \
            --page-size 1

          echo "Kaggle API authentication OK."


      # =========================================================
      # 4. Create Kaggle GPU Kernel
      # =========================================================
      - name: Create GPU Kernel
        run: |

          rm -rf kaggle-gpu-test
          mkdir -p kaggle-gpu-test


          # =====================================================
          # Python script that runs INSIDE Kaggle GPU
          # =====================================================

          cat > kaggle-gpu-test/gpu_test.py <<'PY'

          import subprocess
          import sys
          import os


          def run(command):
              print()
              print("=" * 80)
              print("$", command)
              print("=" * 80)

              try:

                  result = subprocess.run(
                      command,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=300
                  )

                  if result.stdout:
                      print(result.stdout)

                  if result.stderr:
                      print("STDERR:")
                      print(result.stderr)

                  print("Return code:", result.returncode)

                  return result.returncode

              except Exception as e:

                  print("ERROR:", e)

                  return -1


          print("=" * 80)
          print("KAGGLE GPU SYSTEM TEST")
          print("=" * 80)


          # =====================================================
          # Python information
          # =====================================================

          print()
          print("=" * 80)
          print("PYTHON")
          print("=" * 80)

          print(sys.version)


          # =====================================================
          # Environment information
          # =====================================================

          run("uname -a")


          # =====================================================
          # Linux distribution
          # =====================================================

          run("cat /etc/os-release")


          # =====================================================
          # CPU information
          # =====================================================

          run("lscpu")


          # =====================================================
          # Memory information
          # =====================================================

          run("free -h")


          # =====================================================
          # Disk information
          # =====================================================

          run("df -h")


          # =====================================================
          # NVIDIA GPU list
          # =====================================================

          run("nvidia-smi -L")


          # =====================================================
          # Full NVIDIA information
          # =====================================================

          run("nvidia-smi")


          # =====================================================
          # NVIDIA driver information
          # =====================================================

          run("nvidia-smi --query-gpu=name,driver_version,memory.total,temperature.gpu,power.draw,power.limit,utilization.gpu --format=csv")


          # =====================================================
          # CUDA information
          # =====================================================

          run("nvidia-smi --query-gpu=name,compute_cap --format=csv")


          # =====================================================
          # Check apt
          # =====================================================

          run("apt-get --version")


          # =====================================================
          # Update package list
          # =====================================================

          run("apt-get update")


          # =====================================================
          # Install pciutils
          # =====================================================

          run("apt-get install -y pciutils")


          # =====================================================
          # Check lspci
          # =====================================================

          run("which lspci")


          # =====================================================
          # lspci version
          # =====================================================

          run("lspci --version")


          # =====================================================
          # VGA devices
          # =====================================================

          run("lspci | grep -i vga")


          # =====================================================
          # NVIDIA PCI devices
          # =====================================================

          run("lspci | grep -i nvidia")


          # =====================================================
          # Full PCI NVIDIA information
          # =====================================================

          run("lspci -nn | grep -i nvidia")


          # =====================================================
          # NVIDIA PCI device detailed information
          # =====================================================

          run("lspci -vv | grep -A 20 -B 5 -i nvidia")


          # =====================================================
          # Final GPU test
          # =====================================================

          print()
          print("=" * 80)
          print("FINAL GPU TEST")
          print("=" * 80)

          run("nvidia-smi -L")


          print()
          print("=" * 80)
          print("KAGGLE GPU SYSTEM TEST FINISHED")
          print("=" * 80)

          PY


          # =====================================================
          # Kaggle metadata
          # =====================================================

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-system-test",
            "title": "GPU System Test",
            "code_file": "gpu_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF


          echo "========================================"
          echo "KERNEL METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 5. Push Kernel to Kaggle
      # =========================================================
      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "SUBMITTING KAGGLE GPU KERNEL"
          echo "========================================"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 6. Wait for Kernel
      # =========================================================
      - name: Wait for Kaggle Kernel
        run: |

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..20}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 20"
            echo "========================================"

            kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-system-test" || true

            sleep 15

          done


      # =========================================================
      # 7. Download output
      # =========================================================
      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output
          mkdir -p kaggle-output

          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-system-test" \
            -p kaggle-output || true


      # =========================================================
      # 8. Display result
      # =========================================================
      - name: Display Complete GPU Information
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          echo ""
          echo "OUTPUT FILES:"
          find kaggle-output -type f -print

          echo ""
          echo "============================================================"
          echo "COMPLETE KAGGLE OUTPUT"
          echo "============================================================"

          if find kaggle-output -type f | grep -q .
          then

              cat kaggle-output/*

          else

              echo "No output files found."

          fi

          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
