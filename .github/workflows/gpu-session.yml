name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Railway API URL"
        required: true
        type: string
      worker_token:
        description: "Worker token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Validate files
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
          echo "TOKEN_LENGTH=${#WORKER_TOKEN}"

          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          test -f kaggle_worker/script.py

          python -m py_compile kaggle_worker/script.py

          echo "Validation OK."

      - name: Prepare Kaggle worker
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          mkdir -p kaggle_upload

          cp kaggle_worker/script.py kaggle_upload/script.py

          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("kaggle_upload/script.py")

          text = path.read_text()

          replacements = {
              "__SESSION_ID__": os.environ["SESSION_ID"],
              "__API_URL__": os.environ["API_URL"].rstrip("/"),
              "__WORKER_TOKEN__": os.environ["WORKER_TOKEN"],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          print("========================================")
          print("PLACEHOLDER CHECK")
          print("========================================")

          for placeholder in replacements:
              if placeholder in text:
                  raise RuntimeError(
                      f"Placeholder was NOT replaced: {placeholder}"
                  )

          print("All placeholders replaced.")
          print("SESSION_ID:", os.environ["SESSION_ID"])
          print("API_URL:", os.environ["API_URL"])
          print("Worker script ready.")
          PY

      - name: Configure Kaggle
        run: |
          set -e

          mkdir -p ~/.kaggle

          cat > ~/.kaggle/kaggle.json <<EOF
          {
            "username": "${{ secrets.KAGGLE_USERNAME }}",
            "key": "${{ secrets.KAGGLE_API_TOKEN }}"
          }
          EOF

          chmod 600 ~/.kaggle/kaggle.json

          kaggle --version

      - name: Create Kaggle metadata
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_upload/kernel-metadata.json

      - name: Push Kaggle GPU worker
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          cd kaggle_upload

          kaggle kernels push -p .

          echo "Kaggle worker submitted."

      - name: Wait for GPU worker
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"

          for i in $(seq 1 300); do

            echo "CHECK $i / 300"

            RESPONSE=$(curl -s \
              --max-time 15 \
              "$STATUS_URL")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status",""))
          except:
              print("")
          ')

            echo "Current status: $STATUS"

            if [ "$STATUS" = "active" ]; then
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"
              exit 0
            fi

            if [ "$STATUS" = "error" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "expired" ]; then
              echo "GPU worker failed."
              exit 1
            fi

            sleep 5

          done

          echo "Worker timeout."
          exit 1

      - name: Keep workflow alive while worker is active
        if: success()
        run: |
          set +e

          echo "========================================"
          echo "KEEP-ALIVE LOOP"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          while true; do

            RESPONSE=$(curl -s \
              --max-time 15 \
              "$STATUS_URL")

            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status",""))
          except:
              print("")
          ')

            echo "STATUS=$STATUS"

            case "$STATUS" in
              active)
                echo "GPU worker still active."
                ;;

              stopped|expired|failed|error)
                echo "GPU worker ended."
                exit 0
                ;;

              *)
                echo "Unknown status: $STATUS"
                ;;
            esac

            sleep 15

          done

      - name: Upload worker files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: |
            kaggle_worker/script.py
            kaggle_upload/script.py
          if-no-files-found: ignore
