name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker Token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 35

    env:

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install kaggle requests

          python --version

          kaggle --version


      # ======================================================
      # VALIDATION
      # ======================================================

      - name: Validate configuration
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "VALIDATION"
          echo "======================================"

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"
          echo "Token length: ${#WORKER_TOKEN}"

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "Validation OK."


      # ======================================================
      # PREPARE WORKER
      # ======================================================

      - name: Prepare worker
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "PREPARING WORKER"
          echo "======================================"

          mkdir -p kaggle_session

          cp worker.py kaggle_session/script.py


          # --------------------------------------------------
          # IMPORTANT
          # Instead of sed replacement, inject environment
          # values directly into Python source.
          # --------------------------------------------------

          python - <<'PY'

          from pathlib import Path
          import os

          src = Path("kaggle_session/script.py")

          text = src.read_text()

          api = os.environ["API_URL"]
          sid = os.environ["SESSION_ID"]
          token = os.environ["WORKER_TOKEN"]

          marker = (
              'API_URL = os.environ.get("GPU_API_URL", "")'
          )

          if marker not in text:
              raise RuntimeError(
                  "worker.py does not contain expected API_URL configuration"
              )

          text = text.replace(
              marker,
              f'API_URL = {api!r}'
          )

          marker = (
              'SESSION_ID = os.environ.get("GPU_SESSION_ID", "")'
          )

          if marker not in text:
              raise RuntimeError(
                  "worker.py does not contain expected SESSION_ID configuration"
              )

          text = text.replace(
              marker,
              f'SESSION_ID = {sid!r}'
          )

          marker = (
              'WORKER_TOKEN = os.environ.get("GPU_WORKER_TOKEN", "")'
          )

          if marker not in text:
              raise RuntimeError(
                  "worker.py does not contain expected WORKER_TOKEN configuration"
              )

          text = text.replace(
              marker,
              f'WORKER_TOKEN = {token!r}'
          )

          src.write_text(text)

          PY


          # --------------------------------------------------
          # VERIFY
          # --------------------------------------------------

          echo ""
          echo "Checking generated worker..."

          if grep -Fq "%%API_URL%%" kaggle_session/script.py; then
              echo "ERROR: API_URL placeholder remains"
              exit 1
          fi

          if grep -Fq "%%SESSION_ID%%" kaggle_session/script.py; then
              echo "ERROR: SESSION_ID placeholder remains"
              exit 1
          fi

          if grep -Fq "%%WORKER_TOKEN%%" kaggle_session/script.py; then
              echo "ERROR: WORKER_TOKEN placeholder remains"
              exit 1
          fi


          python -m py_compile kaggle_session/script.py


          echo ""
          echo "Worker generated successfully."

          echo ""
          echo "API inside generated worker:"

          grep "^API_URL =" kaggle_session/script.py

          echo ""

          echo "SESSION inside generated worker:"

          grep "^SESSION_ID =" kaggle_session/script.py

          echo ""

          echo "TOKEN length:"

          grep "^WORKER_TOKEN =" kaggle_session/script.py | awk '{print length($0)}'


      # ======================================================
      # KAGGLE METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          python - <<'PY'

          import json
          import os

          username = os.environ["KAGGLE_USERNAME"]
          session = os.environ["SESSION_ID"]

          metadata = {

              "id":
                  f"{username}/gpu-session-{session}",

              "title":
                  f"GPU Session {session}",

              "code_file":
                  "script.py",

              "language":
                  "python",

              "kernel_type":
                  "script",

              "is_private":
                  True,

              "enable_gpu":
                  True,

              "enable_tpu":
                  False,

              "enable_internet":
                  True
          }

          with open(
              "kaggle_session/kernel-metadata.json",
              "w"
          ) as f:

              json.dump(
                  metadata,
                  f,
                  indent=2
              )

          print(
              json.dumps(
                  metadata,
                  indent=2
              )
          )

          PY


      # ======================================================
      # PUSH KAGGLE
      # ======================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "PUSHING KAGGLE WORKER"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT FOR RAILWAY WORKER
      # ======================================================

      - name: Wait for GPU worker
        shell: bash
        run: |

          set +e

          echo "======================================"
          echo "WAITING FOR RAILWAY WORKER"
          echo "======================================"


          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"


          for i in $(seq 1 300); do

              echo ""
              echo "CHECK $i / 300"

              RESPONSE=$(curl \
                -s \
                --max-time 20 \
                "$STATUS_URL")

              echo "$RESPONSE"


              STATUS=$(echo "$RESPONSE" \
                | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status",""))
          except:
              print("")
          ')


              echo "Current status: $STATUS"


              if [ "$STATUS" = "active" ]; then

                  echo ""
                  echo "======================================"
                  echo "GPU WORKER IS READY"
                  echo "======================================"

                  exit 0

              fi


              if [ "$STATUS" = "error" ]; then

                  echo ""
                  echo "Railway reported worker error."

                  exit 1

              fi


              if [ "$STATUS" = "expired" ]; then

                  echo ""
                  echo "Session expired."

                  exit 1

              fi


              sleep 5

          done


          echo ""
          echo "Timed out waiting for GPU worker."

          exit 1


      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Save worker files
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: gpu-worker-${{ inputs.session_id }}

          path: kaggle_session/

          if-no-files-found: warn
