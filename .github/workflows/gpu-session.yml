name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # KAGGLE CLI
      # ======================================================

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          kaggle --version


      # ======================================================
      # VALIDATE
      # ======================================================

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          if [ -z "${SESSION_ID}" ]; then
            echo "SESSION_ID missing"
            exit 1
          fi

          if [ -z "${API_URL}" ]; then
            echo "API_URL missing"
            exit 1
          fi

          if [ -z "${WORKER_TOKEN}" ]; then
            echo "WORKER_TOKEN missing"
            exit 1
          fi

          if [ -z "${KAGGLE_USERNAME}" ]; then
            echo "KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "KAGGLE_API_TOKEN missing"
            exit 1
          fi

          if [ ! -f "kaggle_worker/script.py" ]; then
            echo "kaggle_worker/script.py missing"
            exit 1
          fi

          echo "Session:"
          echo "${SESSION_ID}"

          echo "API:"
          echo "${API_URL}"

          echo "Worker token: PRESENT"

          echo "Validation OK."


      # ======================================================
      # BUILD FINAL KAGGLE SCRIPT
      # ======================================================

      - name: Build final Kaggle script
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FINAL KAGGLE SCRIPT"
          echo "========================================"

          rm -rf kaggle_upload

          mkdir -p kaggle_upload


          python - <<'PY'
          from pathlib import Path
          import os

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          source = Path(
              "kaggle_worker/script.py"
          ).read_text(
              encoding="utf-8"
          )

          header = (
              "# ==============================================\n"
              "# RUNTIME CONFIG GENERATED BY GITHUB ACTIONS\n"
              "# ==============================================\n\n"
              f"SESSION_ID = {session_id!r}\n"
              f"API_URL = {api_url!r}\n"
              f"WORKER_TOKEN = {worker_token!r}\n\n"
              "# ==============================================\n"
              "# WORKER SOURCE\n"
              "# ==============================================\n\n"
          )

          final_script = header + source

          Path(
              "kaggle_upload/script.py"
          ).write_text(
              final_script,
              encoding="utf-8"
          )

          print("Final script generated.")
          print(
              "Session injected:",
              session_id
          )
          print(
              "API injected:",
              api_url
          )
          print(
              "Worker token injected: YES"
          )
          PY


          # --------------------------------------------------
          # Python syntax
          # --------------------------------------------------

          python -m py_compile \
            kaggle_upload/script.py


          echo "Python syntax OK."


          # --------------------------------------------------
          # Verify the FIRST definitions only.
          # There must be exactly one runtime definition.
          # --------------------------------------------------

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path(
              "kaggle_upload/script.py"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(text)

          found = {}

          for node in tree.body:

              if not isinstance(
                  node,
                  ast.Assign
              ):
                  continue

              if len(node.targets) != 1:
                  continue

              target = node.targets[0]

              if not isinstance(
                  target,
                  ast.Name
              ):
                  continue

              name = target.id

              if name not in {
                  "SESSION_ID",
                  "API_URL",
                  "WORKER_TOKEN",
              }:
                  continue

              if name in found:
                  raise RuntimeError(
                      f"Duplicate runtime variable: {name}"
                  )

              found[name] = ast.literal_eval(
                  node.value
              )


          required = {
              "SESSION_ID",
              "API_URL",
              "WORKER_TOKEN",
          }

          missing = required - set(found)

          if missing:
              raise RuntimeError(
                  "Missing runtime variables: "
                  + ", ".join(
                      sorted(missing)
                  )
              )


          if found["SESSION_ID"].startswith("__"):
              raise RuntimeError(
                  "SESSION_ID still looks like placeholder"
              )


          if found["API_URL"].startswith("__"):
              raise RuntimeError(
                  "API_URL still looks like placeholder"
              )


          if found["WORKER_TOKEN"].startswith("__"):
              raise RuntimeError(
                  "WORKER_TOKEN still looks like placeholder"
              )


          print("Runtime configuration validated.")
          print("SESSION_ID: OK")
          print("API_URL: OK")
          print("WORKER_TOKEN: OK")
          PY


      # ======================================================
      # METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF


          echo "Metadata:"
          cat kaggle_upload/kernel-metadata.json


      # ======================================================
      # PUSH KAGGLE
      # ======================================================

      - name: Push Kaggle GPU Worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          export KAGGLE_API_TOKEN="${KAGGLE_API_TOKEN}"

          kaggle kernels push \
            -p kaggle_upload

          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT FOR RAILWAY
      # ======================================================

      - name: Wait for worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          for i in $(seq 1 300); do

            echo
            echo "CHECK ${i} / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            if [ $? -ne 0 ]; then

              echo "Railway request failed."

              sleep 5

              continue

            fi


            echo "${RESPONSE}"


            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')


            echo "Current status: ${STATUS}"


            if [ "${STATUS}" = "active" ]; then

              echo
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              exit 0

            fi


            if [ "${STATUS}" = "error" ]; then

              echo
              echo "GPU SESSION ERROR"

              exit 1

            fi


            if [ "${STATUS}" = "stopped" ]; then

              echo "Session stopped."

              exit 1

            fi


            if [ "${STATUS}" = "expired" ]; then

              echo "Session expired."

              exit 1

            fi


            sleep 5

          done


          echo "Worker timeout."

          exit 1


      # ======================================================
      # KEEP GITHUB WORKFLOW ALIVE
      # ======================================================

      - name: Keep workflow alive
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "GITHUB KEEP-ALIVE"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          while true; do

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")


            echo
            echo "${RESPONSE}"


            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')


            echo "STATUS=${STATUS}"


            case "${STATUS}" in

              active)

                sleep 30
                ;;

              starting)

                sleep 15
                ;;

              stopped)

                echo "Session stopped."
                exit 0
                ;;

              expired)

                echo "Session expired."
                exit 0
                ;;

              error)

                echo "Session error."
                exit 1
                ;;

              *)

                sleep 15
                ;;

            esac

          done


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}

          path: |
            kaggle_upload/script.py
            kaggle_upload/kernel-metadata.json

          if-no-files-found: warn
