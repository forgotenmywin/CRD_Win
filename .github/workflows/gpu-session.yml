name: Kaggle GPU Session
run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Public GPU API URL"
        required: true
        type: string
      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}
      KERNEL_NAME: gpu-session-${{ inputs.session_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & Kaggle CLI
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle requests
          
          echo "Python: $(python --version)"
          echo "Kaggle: $(kaggle --version)"
          
          for var in KAGGLE_USERNAME KAGGLE_API_TOKEN SESSION_ID API_URL WORKER_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::Required variable $var is missing"
              exit 1
            fi
          done
          echo "✓ All variables validated"

      - name: Cleanup existing kernel
        shell: bash
        continue-on-error: true
        run: |
          set +e
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_NAME}"
          echo "Checking for existing kernel: $KERNEL"
          kaggle kernels delete -y "$KERNEL" 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "✓ Cleaned up existing kernel"
            sleep 3
          fi

      - name: Prepare Kaggle worker package
        shell: bash
        run: |
          set -e
          rm -rf kaggle_session
          mkdir -p kaggle_session

          if [ ! -f "worker.py" ]; then
            echo "::error::worker.py not found in repository root"
            exit 1
          fi
          cp worker.py kaggle_session/script.py

          cat > kaggle_session/config.json <<EOF
          {
            "api_url": "${API_URL}",
            "session_id": "${SESSION_ID}",
            "worker_token": "${WORKER_TOKEN}",
            "kernel_name": "${KERNEL_NAME}"
          }
          EOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_NAME}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF

          echo "--- config.json ---"
          cat kaggle_session/config.json
          echo "--- kernel-metadata.json ---"
          cat kaggle_session/kernel-metadata.json

      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e
          kaggle kernels push -p kaggle_session
          echo "✓ Kaggle worker submitted"

      - name: Wait for kernel to start
        shell: bash
        run: |
          set +e
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_NAME}"
          
          echo "Waiting for Kaggle Kernel: $KERNEL"
          
          for i in $(seq 1 72); do
            STATUS_OUTPUT="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "[$i/72] $STATUS_OUTPUT"
            
            # Check for RUNNING (case insensitive)
            if echo "$STATUS_OUTPUT" | grep -qi "RUNNING"; then
              echo ""
              echo "✅ KAGGLE KERNEL IS RUNNING!"
              exit 0
            fi
            
            # Check for failure states
            if echo "$STATUS_OUTPUT" | grep -qi "ERROR"; then
              echo "::error::KAGGLE KERNEL ERROR"
              exit 1
            fi
            
            if echo "$STATUS_OUTPUT" | grep -qi "FAILED"; then
              echo "::error::KAGGLE KERNEL FAILED"
              exit 1
            fi
            
            if echo "$STATUS_OUTPUT" | grep -qi "CANCEL"; then
              echo "::error::KAGGLE KERNEL CANCELLED"
              exit 1
            fi
            
            # 404 in early iterations is normal (kernel not yet created)
            sleep 5
          done
          
          echo "::warning::Timeout waiting for kernel to start, but it may still be starting..."
          exit 0

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "GPU SESSION STATUS"
          echo "======================================"
          echo "SESSION_ID: $SESSION_ID"
          echo "API_URL: $API_URL"
          echo "KERNEL: ${KAGGLE_USERNAME}/${KERNEL_NAME}"
          echo "STATUS: ${{ job.status }}"
