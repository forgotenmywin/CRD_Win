name: Kaggle GPU One Time Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: gpu-runner-${{ github.run_number }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle
        run: |
          pip install -U kaggle
          kaggle --version

      - name: Verify Kaggle Auth
        run: |
          echo "========================================"
          echo "VERIFYING KAGGLE AUTH"
          echo "========================================"

          kaggle kernels list --mine

      - name: Create GPU Kernel
        run: |
          rm -rf kaggle-gpu-test
          mkdir kaggle-gpu-test

          cat > kaggle-gpu-test/commands.txt <<'EOF'
          nvidia-smi -L
          nvidia-smi
          cat /etc/os-release
          apt-get update
          apt-get install -y pciutils
          lspci --version
          lspci | grep -i vga
          lspci | grep -i nvidia
          EOF

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'
          import subprocess
          from pathlib import Path

          commands_file = Path("/kaggle/src/commands.txt")
          result_file = Path("/kaggle/working/result.txt")

          print("=" * 80)
          print("KAGGLE GPU TEST")
          print("=" * 80)

          with result_file.open("w") as result:

              for number, line in enumerate(
                  commands_file.read_text().splitlines(), 1
              ):

                  command = line.strip()

                  if not command:
                      continue

                  print()
                  print("=" * 80)
                  print(f"COMMAND {number}")
                  print("$", command)
                  print("=" * 80)

                  process = subprocess.run(
                      command,
                      shell=True,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT
                  )

                  output = process.stdout or ""

                  print(output)
                  print("Return code:", process.returncode)

                  result.write(
                      f"\n{'=' * 80}\n"
                      f"COMMAND {number}\n"
                      f"$ {command}\n"
                      f"{'=' * 80}\n"
                      f"{output}\n"
                      f"Return code: {process.returncode}\n"
                  )

          print()
          print("=" * 80)
          print("GPU TEST FINISHED")
          print("=" * 80)
          PY

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

      - name: Show Kernel
        run: |
          echo "========================================"
          echo "KERNEL SLUG: ${KERNEL_SLUG}"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json

          echo ""
          echo "========================================"
          echo "COMMANDS"
          echo "========================================"

          nl -ba kaggle-gpu-test/commands.txt

      - name: Push Kernel
        run: |
          echo "========================================"
          echo "PUSHING KERNEL: ${KERNEL_SLUG}"
          echo "========================================"

          kaggle kernels push -p kaggle-gpu-test

      - name: Wait for completion
        run: |
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR: ${KERNEL}"
          echo "========================================"

          for i in $(seq 1 30); do

            echo "STATUS $i / 30"

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "DONE"
              exit 0
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "KAGGLE KERNEL ERROR"
              exit 1
            fi

            sleep 10

          done

          echo "TIMEOUT"

      - name: Download result
        if: always()
        run: |
          mkdir -p output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/${KERNEL_SLUG}" \
            -p output || true

          echo "========================================"
          echo "OUTPUT"
          echo "========================================"

          find output -type f -print || true

          if [ -f output/result.txt ]; then
            cat output/result.txt
          fi
