name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands
        run: |

          echo "========================================"
          echo "CHECKING COMMANDS.TXT"
          echo "========================================"

          if [ ! -f commands.txt ]; then

            echo "ERROR: commands.txt does not exist."

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print

            exit 1

          fi

          echo ""
          echo "Commands:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          echo "========================================"
          echo "INSTALLING KAGGLE CLI"
          echo "========================================"

          python -m pip install --upgrade pip

          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # 4. Check credentials
      # =========================================================

      - name: Check Kaggle Credentials
        run: |

          echo "========================================"
          echo "CHECKING KAGGLE CREDENTIALS"
          echo "========================================"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then

            echo ""
            echo "ERROR: KAGGLE_USERNAME is empty."

            exit 1

          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then

            echo ""
            echo "ERROR: KAGGLE_API_TOKEN is empty."

            exit 1

          fi

          echo ""
          echo "Credentials are present."


      # =========================================================
      # 5. Test Kaggle API
      # =========================================================

      - name: Test Kaggle API
        run: |

          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          set +e

          kaggle kernels list \
            --mine \
            --page-size 10

          RESULT=$?

          set -e

          echo ""
          echo "Return code:"
          echo "$RESULT"

          if [ "$RESULT" -ne 0 ]; then

            echo ""
            echo "ERROR: Kaggle API test failed."

            exit "$RESULT"

          fi

          echo ""
          echo "Kaggle API OK."


      # =========================================================
      # 6. Create unique slug
      # =========================================================

      - name: Create Kernel Slug
        run: |

          echo "========================================"
          echo "CREATING KERNEL SLUG"
          echo "========================================"

          KERNEL_SLUG="gpu-command-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel slug:"
          echo "$KERNEL_SLUG"

          echo ""
          echo "Kernel ID:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # 7. Create GPU worker
      # =========================================================

      - name: Create GPU Worker
        run: |

          echo "========================================"
          echo "CREATING GPU WORKER"
          echo "========================================"

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test

          python3 <<'PY'

          from pathlib import Path


          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )


          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # Open result file
          # =====================================================

          result_file = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          # =====================================================
          # Output helper
          # =====================================================

          def output(text=""):

              print(
                  text,
                  flush=True
              )

              result_file.write(
                  str(text) + "\n"
              )

              result_file.flush()


          # =====================================================
          # Header
          # =====================================================

          output("=" * 80)
          output("KAGGLE GPU COMMAND RUNNER")
          output("=" * 80)

          output()

          output("Python:")
          output(sys.version)

          output()

          output("Working directory:")
          output(os.getcwd())

          output()

          output("User:")

          try:

              output(
                  subprocess.check_output(
                      "whoami",
                      shell=True,
                      text=True
                  ).strip()
              )

          except Exception:

              output("unknown")


          # =====================================================
          # Commands from GitHub
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""


          # =====================================================
          # Parse commands
          # =====================================================

          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          output()
          output("=" * 80)
          output("COMMANDS LOADED")
          output("=" * 80)

          output(
              "Number of commands: "
              + str(len(commands))
          )


          # =====================================================
          # Run command
          # =====================================================

          def run_command(command):

              output()
              output("=" * 80)
              output("$ " + command)
              output("=" * 80)

              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      output(
                          line.rstrip()
                      )


                  return_code = process.wait()


                  output()

                  output(
                      "Return code: "
                      + str(return_code)
                  )


              except Exception:

                  output()
                  output("COMMAND ERROR")

                  output(
                      traceback.format_exc()
                  )


          # =====================================================
          # Run all commands
          # =====================================================

          if not commands:

              output()
              output("No commands found.")

          else:

              for index, command in enumerate(
                  commands,
                  1
              ):

                  output()
                  output("#" * 80)

                  output(
                      "# COMMAND "
                      + str(index)
                      + " / "
                      + str(len(commands))
                  )

                  output("#" * 80)

                  run_command(
                      command
                  )


          # =====================================================
          # Finish
          # =====================================================

          output()
          output("=" * 80)
          output("ALL COMMANDS FINISHED")
          output("=" * 80)

          result_file.close()
          '''


          # =====================================================
          # Insert commands safely
          # =====================================================

          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )


          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )


          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )


          print(
              "gpu_worker.py created."
          )

          PY


          echo ""
          echo "Worker files:"
          find kaggle-gpu-test \
            -maxdepth 2 \
            -type f \
            -print


      # =========================================================
      # 8. Create Kaggle metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          echo "========================================"
          echo "CREATING KAGGLE METADATA"
          echo "========================================"

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 9. Debug account
      # =========================================================

      - name: Debug Kaggle Account
        run: |

          echo "========================================"
          echo "KAGGLE ACCOUNT DEBUG"
          echo "========================================"

          echo ""
          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "CLI:"
          kaggle --version

          echo ""
          echo "Existing kernels:"

          set +e

          kaggle kernels list \
            --mine \
            --page-size 10

          RESULT=$?

          set -e

          echo ""
          echo "Return code:"
          echo "$RESULT"


      # =========================================================
      # 10. Push to Kaggle
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "PUSHING GPU KERNEL"
          echo "========================================"

          echo ""
          echo "ID:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json

          echo ""

          set +e

          kaggle kernels push \
            -p kaggle-gpu-test

          RESULT=$?

          set -e

          echo ""
          echo "Push return code:"
          echo "$RESULT"

          if [ "$RESULT" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KAGGLE PUSH FAILED"
            echo "========================================"

            echo ""
            echo "The failure happened while creating/updating the Kaggle Kernel."

            exit "$RESULT"

          fi


      # =========================================================
      # 11. Wait for Kaggle
      # =========================================================

      - name: Wait For Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "$KERNEL"


          for i in {1..40}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 40"
            echo "========================================"


            set +e

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            RESULT=$?

            set -e


            echo "$STATUS"

            echo ""
            echo "Return code:"
            echo "$RESULT"


            if echo "$STATUS" | grep -qi "COMPLETE"
            then

              echo ""
              echo "KERNEL COMPLETE."

              break

            fi


            if echo "$STATUS" | grep -qi "ERROR"
            then

              echo ""
              echo "KERNEL ERROR."

              break

            fi


            if echo "$STATUS" | grep -qi "CANCEL"
            then

              echo ""
              echo "KERNEL CANCELLED."

              break

            fi


            sleep 10

          done


      # =========================================================
      # 12. Download output
      # =========================================================

      - name: Download Kaggle Output
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "DOWNLOADING OUTPUT"
          echo "========================================"

          rm -rf kaggle-output

          mkdir -p kaggle-output


          set +e

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output

          RESULT=$?

          set -e


          echo ""
          echo "Download return code:"
          echo "$RESULT"

          echo ""
          echo "Files:"

          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # 13. Display result
      # =========================================================

      - name: Display Result
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"


          if [ -f kaggle-output/result.txt ]; then

            echo ""
            echo "========================================"
            echo "RESULT.TXT"
            echo "========================================"

            cat kaggle-output/result.txt

          else

            echo ""
            echo "result.txt not found."

            echo ""
            echo "All downloaded files:"

            find kaggle-output \
              -type f \
              -print

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"


      # =========================================================
      # 14. Upload result
      # =========================================================

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn
