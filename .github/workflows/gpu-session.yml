name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: GPU Session ID
        required: true
        type: string

      api_url:
        description: Railway API URL
        required: true
        type: string

      worker_token:
        description: Worker authentication token
        required: true
        type: string

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install kaggle

          python --version
          kaggle --version

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"

          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "Session:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"


      - name: Create Kaggle Worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'
          import os
          import time
          import json
          import traceback
          import subprocess

          import requests
          import numpy as np

          from numba import cuda


          SESSION_ID = os.environ["SESSION_ID"]

          API_URL = os.environ[
              "API_URL"
          ].rstrip("/")

          WORKER_TOKEN = os.environ[
              "WORKER_TOKEN"
          ]


          def headers():

              return {
                  "X-Worker-Token":
                      WORKER_TOKEN
              }


          def worker_ready(
              gpu_name,
              capability
          ):

              url = (
                  API_URL
                  + "/gpu/session/"
                  + SESSION_ID
                  + "/worker-ready"
              )

              payload = {

                  "gpu":
                      gpu_name,

                  "compute_capability":
                      [
                          int(
                              capability[0]
                          ),
                          int(
                              capability[1]
                          )
                      ]
              }

              response = requests.post(

                  url,

                  headers=headers(),

                  json=payload,

                  timeout=30
              )

              print(
                  "Railway worker-ready:",
                  response.status_code
              )

              print(
                  response.text
              )

              if response.status_code != 200:

                  raise RuntimeError(
                      "Railway worker-ready failed"
                  )


          def get_command():

              url = (
                  API_URL
                  + "/internal/session/"
                  + SESSION_ID
                  + "/command"
              )

              response = requests.get(

                  url,

                  headers=headers(),

                  timeout=30
              )

              if response.status_code != 200:

                  print(
                      "Command request failed:",
                      response.status_code,
                      response.text
                  )

                  return None, False

              data = response.json()

              if data.get(
                  "expired"
              ):

                  return None, True

              return (
                  data.get(
                      "command"
                  ),
                  False
              )


          def send_result(
              result
          ):

              url = (
                  API_URL
                  + "/internal/session/"
                  + SESSION_ID
                  + "/result"
              )

              response = requests.post(

                  url,

                  headers=headers(),

                  json=result,

                  timeout=30
              )

              print(
                  "Result upload:",
                  response.status_code
              )

              print(
                  response.text
              )


          # ==================================================
          # MATRIX KERNEL
          # ==================================================

          @cuda.jit
          def matrix_kernel(
              a,
              b,
              c
          ):

              row, col = cuda.grid(2)

              if (
                  row < c.shape[0]
                  and
                  col < c.shape[1]
              ):

                  total = 0.0

                  for k in range(
                      a.shape[1]
                  ):

                      total += (
                          a[row, k]
                          * b[k, col]
                      )

                  c[row, col] = total


          def matrix_job(
              size
          ):

              size = int(size)

              if size < 1:
                  raise ValueError(
                      "size must be positive"
                  )

              if size > 4096:
                  raise ValueError(
                      "size cannot exceed 4096"
                  )


              print(
                  "Running matrix:",
                  size,
                  "x",
                  size
              )


              a = np.random.rand(
                  size,
                  size
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  size,
                  size
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  (
                      size,
                      size
                  ),
                  dtype=np.float32
              )


              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)


              threads = (
                  16,
                  16
              )

              blocks = (

                  (
                      size
                      + threads[0]
                      - 1
                  )
                  // threads[0],

                  (
                      size
                      + threads[1]
                      - 1
                  )
                  // threads[1]
              )


              # Warmup
              matrix_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()


              # Benchmark
              start = time.perf_counter()

              matrix_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )


              result_matrix = (
                  d_c.copy_to_host()
              )

              checksum = float(
                  np.sum(result_matrix)
              )


              return {

                  "status":
                      "SUCCESS",

                  "operation":
                      "matrix",

                  "size":
                      size,

                  "shape":
                      [
                          size,
                          size
                      ],

                  "time_seconds":
                      elapsed,

                  "checksum":
                      checksum,

                  "blocks":
                      blocks,

                  "threads":
                      threads
              }


          # ==================================================
          # GPU INIT
          # ==================================================

          try:

              print("=" * 70)
              print("                  KAGGLE GPU WORKER")
              print("=" * 70)

              print(
                  "SESSION:",
                  SESSION_ID
              )

              print(
                  "API:",
                  API_URL
              )


              # ------------------------------------------------
              # NVIDIA
              # ------------------------------------------------

              nvidia = subprocess.run(

                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],

                  capture_output=True,

                  text=True
              )

              print(
                  nvidia.stdout
              )


              if nvidia.returncode != 0:

                  raise RuntimeError(
                      "nvidia-smi failed"
                  )


              # ------------------------------------------------
              # CUDA
              # ------------------------------------------------

              if not cuda.is_available():

                  raise RuntimeError(
                      "CUDA unavailable"
                  )


              device = (
                  cuda.get_current_device()
              )


              gpu_name = str(
                  device.name
              )

              capability = (
                  device.compute_capability
              )


              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )


              # ------------------------------------------------
              # Real GPU test
              # ------------------------------------------------

              test_result = matrix_job(
                  1024
              )


              print(
                  "GPU test:",
                  json.dumps(
                      test_result,
                      indent=2
                  )
              )


              # ------------------------------------------------
              # IMPORTANT:
              # Tell Railway that the GPU is ready.
              # ------------------------------------------------

              worker_ready(
                  gpu_name,
                  capability
              )


              print("")
              print("=" * 70)
              print("                 GPU SESSION ACTIVE")
              print("=" * 70)


              # ==================================================
              # COMMAND LOOP
              # ==================================================

              while True:

                  command, expired = (
                      get_command()
                  )


                  if expired:

                      print(
                          "Session expired."
                      )

                      break


                  if command is None:

                      time.sleep(2)

                      continue


                  print("")
                  print("=" * 70)
                  print("                  NEW GPU COMMAND")
                  print("=" * 70)

                  print(
                      json.dumps(
                          command,
                          indent=2
                      )
                  )


                  command_id = command.get(
                      "command_id"
                  )

                  operation = command.get(
                      "operation"
                  )

                  parameters = command.get(
                      "parameters",
                      {}
                  )


                  try:

                      if operation == "matrix":

                          result = matrix_job(

                              parameters.get(
                                  "size",
                                  1024
                              )

                          )

                      else:

                          result = {

                              "status":
                                  "ERROR",

                              "error":
                                  "Unsupported operation"
                          }


                  except Exception as e:

                      result = {

                          "status":
                              "ERROR",

                          "error":
                              str(e),

                          "traceback":
                              traceback.format_exc()
                      }


                  result[
                      "command_id"
                  ] = command_id


                  send_result(
                      result
                  )


          except Exception as e:

              print("")
              print("=" * 70)
              print("                  GPU WORKER ERROR")
              print("=" * 70)

              traceback.print_exc()

              raise


          finally:

              print(
                  "GPU worker stopped."
              )

          PYEOF


          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      - name: Submit Kaggle Worker
        shell: bash
        run: |
          set -e

          kaggle kernels push \
            -p kaggle_session

          echo "Kaggle worker submitted."


      - name: Wait for Kaggle Worker
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "WAITING FOR KAGGLE"
          echo "======================================"

          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 240)
          do

            echo ""
            echo "CHECK $i/240"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.CANCEL"
            then

              FINAL_STATUS="CANCELLED"

              break

            fi


            sleep 5

          done


          echo ""
          echo "======================================"
          echo "FINAL STATUS"
          echo "======================================"

          echo "$FINAL_STATUS"


          if [ "$FINAL_STATUS" = "COMPLETE" ]
          then

            echo "Kaggle completed."

            exit 0

          fi


          echo "Kaggle worker did not complete."

          exit 1


      - name: Download Kaggle logs
        if: always()
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p final_output

          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force \
            2>&1 || true

          echo ""
          echo "======================================"
          echo "FINAL FILES"
          echo "======================================"

          find final_output \
            -type f \
            -print \
            2>/dev/null || true


      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
          retention-days: 1


      - name: Final
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
