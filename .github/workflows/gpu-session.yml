name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:

      SESSION_ID: ${{ inputs.session_id }}

      API_URL: ${{ inputs.api_url }}

      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          kaggle --version


      # ======================================================
      # VALIDATE
      # ======================================================

      - name: Validate environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "SESSION_ID=${SESSION_ID}"
          echo "API_URL=${API_URL}"

          if [ -z "${SESSION_ID}" ]; then
            echo "ERROR: SESSION_ID missing"
            exit 1
          fi

          if [ -z "${API_URL}" ]; then
            echo "ERROR: API_URL missing"
            exit 1
          fi

          if [ -z "${WORKER_TOKEN}" ]; then
            echo "ERROR: WORKER_TOKEN missing"
            exit 1
          fi

          if [ -z "${KAGGLE_USERNAME}" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

          test -f kaggle_worker/script.py

          echo "Validation OK."


      # ======================================================
      # BUILD FINAL KAGGLE SCRIPT
      # ======================================================

      - name: Build final Kaggle script
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FINAL KAGGLE SCRIPT"
          echo "========================================"

          rm -rf kaggle_upload

          mkdir -p kaggle_upload


          # --------------------------------------------------
          # Create runtime header.
          # --------------------------------------------------

          python - <<'PY'
          from pathlib import Path
          import os

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          header = (
              "# ==============================================\n"
              "# RUNTIME CONFIG - GENERATED BY GITHUB ACTIONS\n"
              "# ==============================================\n\n"
              f"SESSION_ID = {session_id!r}\n"
              f"API_URL = {api_url!r}\n"
              f"WORKER_TOKEN = {worker_token!r}\n\n"
              "# ==============================================\n"
              "# WORKER SOURCE\n"
              "# ==============================================\n\n"
          )

          source = Path(
              "kaggle_worker/script.py"
          ).read_text(
              encoding="utf-8"
          )

          final = header + source

          Path(
              "kaggle_upload/script.py"
          ).write_text(
              final,
              encoding="utf-8"
          )

          print("Final worker generated.")
          print(
              "Session injected:",
              session_id
          )
          print(
              "API injected:",
              api_url
          )
          print(
              "Token injected: YES"
          )
          PY


          # --------------------------------------------------
          # Verify
          # --------------------------------------------------

          echo
          echo "FIRST 20 LINES OF FINAL SCRIPT:"

          head -20 kaggle_upload/script.py


          echo
          echo "Checking placeholder absence..."


          if grep -q "__SESSION_ID__" \
              kaggle_upload/script.py; then

            echo "ERROR: __SESSION_ID__ remains"

            exit 1

          fi


          if grep -q "__API_URL__" \
              kaggle_upload/script.py; then

            echo "ERROR: __API_URL__ remains"

            exit 1

          fi


          if grep -q "__WORKER_TOKEN__" \
              kaggle_upload/script.py; then

            echo "ERROR: __WORKER_TOKEN__ remains"

            exit 1

          fi


          python -m py_compile \
            kaggle_upload/script.py


          echo
          echo "Final worker syntax OK."


      # ======================================================
      # KAGGLE METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle_upload/kernel-metadata.json


      # ======================================================
      # PUSH
      # ======================================================

      - name: Push Kaggle GPU Worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          export KAGGLE_API_TOKEN="${KAGGLE_API_TOKEN}"

          kaggle kernels push \
            -p kaggle_upload

          echo
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for GPU worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          for i in $(seq 1 300); do

            echo
            echo "CHECK ${i} / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            if [ $? -ne 0 ]; then

              echo "Railway status request failed."

              sleep 5

              continue

            fi

            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')


            echo "Current status: ${STATUS}"


            if [ "${STATUS}" = "active" ]; then

              echo
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              exit 0

            fi


            if [ "${STATUS}" = "error" ]; then

              echo
              echo "========================================"
              echo "WORKER ERROR"
              echo "========================================"

              exit 1

            fi


            if [ "${STATUS}" = "stopped" ]; then

              echo "Session stopped."

              exit 1

            fi


            if [ "${STATUS}" = "expired" ]; then

              echo "Session expired."

              exit 1

            fi


            sleep 5

          done


          echo "Worker timed out."

          exit 1


      # ======================================================
      # KEEP GITHUB WORKFLOW ALIVE
      # ======================================================

      - name: Keep workflow alive
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "GITHUB KEEP-ALIVE"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          while true; do

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")


            echo
            echo "${RESPONSE}"


            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')


            echo "STATUS=${STATUS}"


            case "${STATUS}" in

              active)

                echo "Worker active."

                sleep 30

                ;;


              starting)

                echo "Worker starting."

                sleep 15

                ;;


              stopped)

                echo "Session stopped."

                exit 0

                ;;


              expired)

                echo "Session expired."

                exit 0

                ;;


              error)

                echo "Session error."

                exit 1

                ;;


              *)

                sleep 15

                ;;

            esac

          done


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: gpu-worker-${{ inputs.session_id }}

          path: |
            kaggle_upload/script.py
            kaggle_upload/kernel-metadata.json

          if-no-files-found: warn
