name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout Repository
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands File
        run: |

          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"

          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 2 -type f -print

          echo ""
          echo "Checking commands.txt..."

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found in repository root."
            exit 1
          fi

          echo "commands.txt found."

          echo ""
          echo "========================================"
          echo "COMMANDS"
          echo "========================================"

          cat commands.txt


      # =========================================================
      # 3. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version


      # =========================================================
      # 4. Check Credentials
      # =========================================================

      - name: Check Kaggle Credentials
        run: |

          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials loaded successfully."


      # =========================================================
      # 5. Test Kaggle API
      # =========================================================

      - name: Test Kaggle API
        run: |

          echo "========================================"
          echo "KAGGLE API TEST"
          echo "========================================"

          kaggle kernels list \
            --mine \
            --page-size 1

          echo "Kaggle API authentication OK."


      # =========================================================
      # 6. Create Kaggle Kernel
      # =========================================================

      - name: Create Kaggle GPU Kernel
        run: |

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test


          # -----------------------------------------------------
          # Copy commands.txt
          # -----------------------------------------------------

          cp commands.txt kaggle-gpu-test/commands.txt


          echo "========================================"
          echo "KAGGLE KERNEL FILES"
          echo "========================================"

          find kaggle-gpu-test -type f -maxdepth 2 -print


          # =====================================================
          # Create GPU Worker
          # =====================================================

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'

import subprocess
import sys
import os
import time


# =============================================================
# Command Runner
# =============================================================

def run_command(command):

    print()
    print("=" * 80)
    print("$", command)
    print("=" * 80)

    try:

        result = subprocess.run(
            command,
            shell=True,
            capture_output=True,
            text=True,
            timeout=600
        )

        if result.stdout:
            print(result.stdout)

        if result.stderr:
            print("STDERR:")
            print(result.stderr)

        print("Return code:", result.returncode)

        return result.returncode

    except subprocess.TimeoutExpired:

        print("ERROR: command timed out after 600 seconds")

        return -1

    except Exception as e:

        print("ERROR:", e)

        return -1


# =============================================================
# Start
# =============================================================

print("=" * 80)
print("KAGGLE GPU COMMAND RUNNER")
print("=" * 80)


print()
print("Python:")
print(sys.version)


# =============================================================
# Current directory
# =============================================================

print()
print("=" * 80)
print("ENVIRONMENT")
print("=" * 80)

print("Current directory:")
print(os.getcwd())

print()

print("Script:")
print(os.path.abspath(__file__))


# =============================================================
# Find commands.txt
# =============================================================

script_directory = os.path.dirname(
    os.path.abspath(__file__)
)

commands_file = os.path.join(
    script_directory,
    "commands.txt"
)


print()
print("Commands file:")
print(commands_file)


# =============================================================
# Check commands.txt
# =============================================================

if not os.path.isfile(commands_file):

    print()
    print("=" * 80)
    print("ERROR: commands.txt NOT FOUND")
    print("=" * 80)

    print()
    print("Files available in script directory:")

    try:

        for filename in os.listdir(script_directory):

            print("-", filename)

    except Exception as e:

        print("Directory listing error:", e)

    sys.exit(1)


print()
print("commands.txt FOUND.")


# =============================================================
# Read commands
# =============================================================

print()
print("=" * 80)
print("READING COMMANDS.TXT")
print("=" * 80)


with open(
    commands_file,
    "r",
    encoding="utf-8"
) as file:

    lines = file.readlines()


commands = []


for line in lines:

    line = line.strip()

    # Empty line
    if not line:
        continue

    # Comment
    if line.startswith("#"):
        continue

    commands.append(line)


print()
print("Total commands:", len(commands))


# =============================================================
# Execute commands
# =============================================================

if len(commands) == 0:

    print()
    print("No commands found.")

else:

    for index, command in enumerate(commands, 1):

        print()
        print()
        print("#" * 80)

        print(
            f"# COMMAND {index} / {len(commands)}"
        )

        print("#" * 80)

        run_command(command)


# =============================================================
# Finished
# =============================================================

print()
print()
print("=" * 80)
print("ALL COMMANDS FINISHED")
print("=" * 80)

PY


      # =========================================================
      # 7. Kaggle Metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "GPU Command Runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo "========================================"
          echo "KERNEL METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 8. Push Kernel
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "SUBMITTING KAGGLE KERNEL"
          echo "========================================"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 9. Wait for Kernel
      # =========================================================

      - name: Wait for Kaggle Kernel
        run: |

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..30}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 30"
            echo "========================================"

            STATUS="$(
              kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-command-runner" \
              2>&1 || true
            )"

            echo "$STATUS"


            # ---------------------------------------------------
            # Complete
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "COMPLETE"; then

              echo ""
              echo "Kaggle Kernel completed."

              break

            fi


            # ---------------------------------------------------
            # Error
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "ERROR"; then

              echo ""
              echo "Kaggle Kernel reported ERROR."

              break

            fi


            # ---------------------------------------------------
            # Cancelled
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "CANCEL"; then

              echo ""
              echo "Kaggle Kernel was cancelled."

              break

            fi


            sleep 10

          done


      # =========================================================
      # 10. Download Output
      # =========================================================

      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output

          mkdir -p kaggle-output

          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p kaggle-output || true


      # =========================================================
      # 11. Display Output
      # =========================================================

      - name: Display Kaggle Result
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          echo ""
          echo "Output files:"

          find kaggle-output \
            -type f \
            -print


          echo ""
          echo "============================================================"
          echo "COMMAND OUTPUT"
          echo "============================================================"


          if find kaggle-output -type f | grep -q .
          then

            for file in kaggle-output/*
            do

              echo ""
              echo "============================================================"
              echo "FILE: $file"
              echo "============================================================"

              cat "$file"

            done

          else

            echo "No output files found."

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
