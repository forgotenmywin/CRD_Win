name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string

jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install kaggle requests

          echo "Kaggle CLI:"
          kaggle --version

      # ======================================================
      # VALIDATION
      # ======================================================

      - name: Validate environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"

          if [ -z "$SESSION_ID" ]; then
            echo "SESSION_ID is missing"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "API_URL is missing"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "WORKER_TOKEN is missing"
            exit 1
          fi

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "KAGGLE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing"
            exit 1
          fi

          echo "Validation OK."

      # ======================================================
      # PREPARE WORKER
      # ======================================================

      - name: Prepare Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          if [ ! -f "kaggle_worker/script.py" ]; then
            echo "ERROR: kaggle_worker/script.py not found"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p build

          cp kaggle_worker/script.py build/script.py

          python -m py_compile build/script.py

          echo "Worker Python syntax OK."

      # ======================================================
      # KAGGLE METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > build/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat build/kernel-metadata.json

      # ======================================================
      # PUSH KAGGLE
      # ======================================================

      - name: Push Kaggle GPU worker
        shell: bash
        working-directory: build
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          kaggle kernels push \
            -p .

          echo "Kaggle worker submitted."

      # ======================================================
      # WAIT FOR WORKER
      # ======================================================

      - name: Wait for GPU worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"

          for i in $(seq 1 300); do

            echo "CHECK $i / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "$STATUS_URL")

            echo "$RESPONSE"

            STATUS=$(python -c "
          import json,sys
          try:
              d=json.loads(sys.stdin.read())
              print(d.get('status',''))
          except:
              print('')
          " <<< "$RESPONSE")

            echo "Current status: $STATUS"

            if [ "$STATUS" = "active" ]; then

              echo ""
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              exit 0

            fi

            if [ "$STATUS" = "error" ]; then

              echo ""
              echo "========================================"
              echo "GPU WORKER ERROR"
              echo "========================================"

              exit 1

            fi

            if [ "$STATUS" = "expired" ]; then

              echo ""
              echo "Session expired."

              exit 1

            fi

            sleep 5

          done

          echo ""
          echo "Timed out waiting for worker."

          exit 1

      # ======================================================
      # SAVE WORKER FILE
      # ======================================================

      - name: Upload worker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: build/
          if-no-files-found: warn
