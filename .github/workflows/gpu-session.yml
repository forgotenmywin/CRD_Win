name: Kaggle GPU Session
run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Public GPU API URL"
        required: true
        type: string
      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ══════════════════════════════════════════════════════════════
      # 1. SETUP
      # ══════════════════════════════════════════════════════════════
      - name: Setup Python & install deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kaggle + requests
        run: |
          python -m pip install --upgrade pip kaggle requests
          python --version
          kaggle --version

      - name: Validate secrets & inputs
        run: |
          [ -z "$KAGGLE_USERNAME"  ] && { echo "KAGGLE_USERNAME missing";  exit 1; }
          [ -z "$KAGGLE_API_TOKEN" ] && { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          [ -z "$SESSION_ID"       ] && { echo "SESSION_ID missing";       exit 1; }
          [ -z "$API_URL"          ] && { echo "API_URL missing";          exit 1; }
          [ -z "$WORKER_TOKEN"     ] && { echo "WORKER_TOKEN missing";     exit 1; }
          echo "OK — SESSION=$SESSION_ID  API=$API_URL"

      # ══════════════════════════════════════════════════════════════
      # 2. BUILD KAGGLE KERNEL  (Python script embedded here)
      # ══════════════════════════════════════════════════════════════
      - name: Write Kaggle kernel files
        run: |
          mkdir -p kaggle_session

          # ── kernel-metadata.json ────────────────────────────────
          cat > kaggle_session/kernel-metadata.json << EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          # ── script.py  (heredoc — bash does NOT expand variables) ──
          # Variables are injected afterwards with sed.
          cat > kaggle_session/script.py << 'PYEOF'
import os, sys, json, time, socket, platform, traceback, subprocess

try:
    import requests
except ImportError:
    subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "requests"])
    import requests

# ── injected by sed ─────────────────────────────────────
API_URL      = "%%API_URL%%".rstrip("/")
SESSION_ID   = "%%SESSION_ID%%"
WORKER_TOKEN = "%%WORKER_TOKEN%%"
# ────────────────────────────────────────────────────────

HEADERS = {"Content-Type": "application/json", "X-Worker-Token": WORKER_TOKEN}

print("=" * 60)
print("KAGGLE GPU WORKER")
print("SESSION  :", SESSION_ID)
print("API      :", API_URL)
print("TOKEN len:", len(WORKER_TOKEN))
print("=" * 60)


def api(method, path, body=None, timeout=30):
    url = f"{API_URL}{path}"
    try:
        if method == "GET":
            r = requests.get(url, headers=HEADERS, timeout=timeout)
        else:
            r = requests.post(url, headers=HEADERS, json=body or {}, timeout=timeout)
        print(f"[API] {method} {path} → {r.status_code}")
        return r
    except Exception as e:
        print(f"[API] {method} {path} error: {e}")
        return None


result = {
    "session_id": SESSION_ID, "status": "starting",
    "gpu": None, "compute_capability": None,
    "cuda_available": False, "test": None, "error": None,
}

try:
    # ── nvidia-smi ──────────────────────────────────────────
    smi = subprocess.run(["nvidia-smi"], capture_output=True, text=True, timeout=30)
    print(smi.stdout)
    if smi.returncode != 0:
        raise RuntimeError("nvidia-smi failed — no GPU")

    gpu_csv = subprocess.run(
        ["nvidia-smi", "--query-gpu=name,memory.total,driver_version",
         "--format=csv,noheader"],
        capture_output=True, text=True, timeout=30,
    )
    lines = gpu_csv.stdout.strip().splitlines()
    if lines:
        result["gpu"] = lines[0]
    print("GPU:", result["gpu"])

    # ── numba / CUDA ─────────────────────────────────────────
    try:
        import numpy as np
        from numba import cuda
    except ImportError:
        subprocess.check_call(
            [sys.executable, "-m", "pip", "install", "-q", "numba", "numpy"])
        import numpy as np
        from numba import cuda

    result["cuda_available"] = bool(cuda.is_available())
    if not result["cuda_available"]:
        raise RuntimeError("CUDA not available")

    cap = cuda.get_current_device().compute_capability
    result["compute_capability"] = [int(cap[0]), int(cap[1])]
    print("Compute:", cap)

    # ── kernel smoke-test ─────────────────────────────────────
    N = 1024 * 1024

    @cuda.jit
    def _add(a, b, c):
        i = cuda.grid(1)
        if i < a.size:
            c[i] = a[i] + b[i]

    a, b, c = (np.ones(N, np.float32), np.ones(N, np.float32),
                np.zeros(N, np.float32))
    da, db, dc = cuda.to_device(a), cuda.to_device(b), cuda.to_device(c)
    threads, blocks = 256, (N + 255) // 256

    t0 = time.perf_counter()
    _add[blocks, threads](da, db, dc)
    cuda.synchronize()
    elapsed = time.perf_counter() - t0

    out = dc.copy_to_host()
    if abs(float(np.sum(out)) - N * 2) > 0.01:
        raise RuntimeError("GPU result verification failed")

    result["test"] = {"elements": N, "time_seconds": elapsed}
    result["status"] = "READY"
    print(f"Kernel OK — {N} elems in {elapsed:.4f}s")

    # ── notify API ────────────────────────────────────────────
    r = api("POST", f"/gpu/session/{SESSION_ID}/worker-ready", {
        "gpu": result["gpu"],
        "compute_capability": result["compute_capability"],
        "cuda_available": result["cuda_available"],
    })
    if r and r.status_code in (200, 202):
        print("API acknowledged worker-ready.")
    else:
        print("WARNING: API did not acknowledge worker-ready.")

    with open("/kaggle/working/session_result.json", "w") as f:
        json.dump(result, f, indent=2)

    # ── command poll loop ─────────────────────────────────────
    print("\n=== COMMAND LOOP ===")
    for tick in range(600):          # 600 × 1 s = 10 min max
        time.sleep(1)

        if tick > 0 and tick % 30 == 0:
            hb = api("POST", f"/gpu/session/{SESSION_ID}/heartbeat")
            if hb and hb.status_code == 410:
                print("Session expired. Exiting.")
                break

        if tick % 5 != 0:
            continue

        try:
            cr = api("GET", f"/internal/session/{SESSION_ID}/command")
            if not (cr and cr.status_code == 200):
                continue
            data = cr.json()
            if data.get("expired"):
                print("Session expired. Exiting.")
                break
            cmd = data.get("command")
            if not cmd:
                continue

            op, params, cid = cmd.get("operation",""), cmd.get("parameters",{}), cmd["command_id"]
            print(f"\n>>> {cid} op={op}")
            t_start = time.time()

            try:
                if op == "execute_python":
                    g = {"__builtins__": __builtins__, "np": np, "cuda": cuda}
                    try:
                        import torch; g["torch"] = torch
                    except ImportError:
                        pass
                    loc = {}
                    exec(params.get("code",""), g, loc)
                    out = {"status":"ok",
                           "output": {k:str(v) for k,v in loc.items() if not k.startswith("_")},
                           "execution_time": time.time()-t_start}

                elif op == "nvidia_smi":
                    s2 = subprocess.run(["nvidia-smi"], capture_output=True, text=True, timeout=30)
                    out = {"status":"ok","stdout":s2.stdout,"stderr":s2.stderr,"returncode":s2.returncode}

                elif op == "shell":
                    sh = subprocess.run(params.get("command",""), shell=True,
                                        capture_output=True, text=True, timeout=60)
                    out = {"status":"ok","stdout":sh.stdout,"stderr":sh.stderr,"returncode":sh.returncode}

                elif op == "info":
                    mem = subprocess.run(
                        ["nvidia-smi",
                         "--query-gpu=name,memory.total,memory.used,memory.free,temperature.gpu,utilization.gpu",
                         "--format=csv,noheader"],
                        capture_output=True, text=True, timeout=30)
                    out = {"status":"ok","gpu":result["gpu"],
                           "compute_capability":result["compute_capability"],
                           "cuda_available":result["cuda_available"],
                           "gpu_details":mem.stdout.strip(),
                           "hostname":socket.gethostname(),"python":sys.version,
                           "platform":platform.platform()}

                else:
                    out = {"status":"error","error":f"Unknown operation: {op}"}

            except Exception as ex:
                out = {"status":"error","error":str(ex),"traceback":traceback.format_exc()}

            api("POST", f"/internal/session/{SESSION_ID}/result", {"command_id":cid, **out})
            print(f"<<< {cid} done.")

        except Exception as poll_err:
            print(f"[POLL] {poll_err}")

    print("Worker loop finished.")

except Exception as e:
    result.update({"status":"ERROR","error":str(e),
                   "exception":type(e).__name__,"traceback":traceback.format_exc()})
    traceback.print_exc()
    try:
        with open("/kaggle/working/session_result.json","w") as f:
            json.dump(result, f, indent=2)
    except Exception:
        pass
    raise
PYEOF

          # ── inject env-vars into placeholders ───────────────────
          sed -i "s|%%API_URL%%|${API_URL}|g"           kaggle_session/script.py
          sed -i "s|%%SESSION_ID%%|${SESSION_ID}|g"     kaggle_session/script.py
          sed -i "s|%%WORKER_TOKEN%%|${WORKER_TOKEN}|g" kaggle_session/script.py

          echo "── kernel-metadata.json ──"
          cat kaggle_session/kernel-metadata.json
          echo ""
          echo "── first 10 lines of script.py ──"
          head -10 kaggle_session/script.py

      # ══════════════════════════════════════════════════════════════
      # 3. PUSH TO KAGGLE
      # ══════════════════════════════════════════════════════════════
      - name: Push Kaggle kernel
        run: |
          kaggle kernels push -p kaggle_session
          echo "Kaggle kernel submitted."

      # ══════════════════════════════════════════════════════════════
      # 4. WAIT  →  DOWNLOAD OUTPUT  →  PRINT LOG
      # ══════════════════════════════════════════════════════════════
      - name: Wait & collect results
        run: |
          set +e
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"
          echo "Watching: $KERNEL"

          FINAL="UNKNOWN"
          for i in $(seq 1 240); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "[$i/240] $STATUS"
            echo "$STATUS" | grep -qi "complete" && { FINAL="COMPLETE"; break; }
            echo "$STATUS" | grep -qi "error"    && { FINAL="ERROR";    break; }
            echo "$STATUS" | grep -qi "cancel"   && { FINAL="CANCELLED";break; }
            sleep 5
          done
          echo "── FINAL: $FINAL ──"

          mkdir -p final_output
          kaggle kernels output "$KERNEL" -p final_output -o \
            || echo "output download failed"

          [ -f final_output/session_result.json ] \
            && cat final_output/session_result.json \
            || echo "session_result.json not found"

          LOG="final_output/worker.log"
          kaggle kernels logs "$KERNEL" > "$LOG" 2>&1 || true
          echo "── last 200 log lines ──"
          tail -n 200 "$LOG" || true

      # ══════════════════════════════════════════════════════════════
      # 5. UPLOAD ARTIFACTS
      # ══════════════════════════════════════════════════════════════
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
