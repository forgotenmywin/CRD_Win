name: Kaggle GPU Auto Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Configure Kaggle API
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle

          cat > ~/.kaggle/kaggle.json <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 ~/.kaggle/kaggle.json

      - name: Create GPU Kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle-gpu-test

          cat > kaggle-gpu-test/gpu_test.py <<'PY'
          import subprocess

          print("=" * 70)
          print("KAGGLE GPU TEST")
          print("=" * 70)

          commands = [
              "nvidia-smi -L",
              "nvidia-smi",
              "lspci | grep -i nvidia"
          ]

          for command in commands:
              print()
              print("=" * 70)
              print("$", command)
              print("=" * 70)

              result = subprocess.run(
                  command,
                  shell=True,
                  capture_output=True,
                  text=True
              )

              print(result.stdout)

              if result.stderr:
                  print("STDERR:")
                  print(result.stderr)

          print()
          print("=" * 70)
          print("GPU TEST FINISHED")
          print("=" * 70)
          PY

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-auto-test",
            "title": "GPU Auto Test",
            "code_file": "gpu_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

      - name: Create and Run Kaggle Kernel
        working-directory: kaggle-gpu-test
        run: |
          kaggle kernels push -p .

      - name: Wait for Kaggle GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          echo "Waiting for Kaggle..."
          
          for i in {1..12}; do
            echo "Check $i/12"

            kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-auto-test" || true

            sleep 15
          done

      - name: Download Kaggle Output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle-output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-auto-test" \
            -p kaggle-output || true

      - name: Show GPU Information
        run: |
          echo ""
          echo "========================================"
          echo "KAGGLE GPU OUTPUT"
          echo "========================================"

          find kaggle-output -type f -print

          echo ""
          cat kaggle-output/* 2>/dev/null || true
