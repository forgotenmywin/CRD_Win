name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: GPU Session ID
        required: true
        type: string

      api_url:
        description: Public Railway API URL
        required: true
        type: string

      worker_token:
        description: Worker authentication token
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install kaggle

          python --version
          kaggle --version

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<PYEOF
          import time
          import json
          import traceback
          import subprocess

          import requests

          try:
              import numba
              from numba import cuda
              import numpy as np
          except ImportError:
              subprocess.run(
                  [
                      "python",
                      "-m",
                      "pip",
                      "install",
                      "--no-cache-dir",
                      "numba==0.60.0",
                      "numpy",
                      "requests",
                  ],
                  check=True,
              )

              import numba
              from numba import cuda
              import numpy as np


          SESSION_ID = "${{ inputs.session_id }}"
          API_URL = "${{ inputs.api_url }}".rstrip("/")
          WORKER_TOKEN = "${{ inputs.worker_token }}"


          print("=" * 70)
          print("GPU SESSION WORKER")
          print("=" * 70)

          print("SESSION:", SESSION_ID)
          print("API:", API_URL)


          def worker_headers():
              return {
                  "X-Worker-Token": WORKER_TOKEN
              }


          def notify_ready(gpu_name, capability):
              url = (
                  API_URL
                  + "/gpu/session/"
                  + SESSION_ID
                  + "/worker-ready"
              )

              payload = {
                  "worker_token": WORKER_TOKEN,
                  "gpu": gpu_name,
                  "compute_capability": [
                      int(capability[0]),
                      int(capability[1]),
                  ],
              }

              response = requests.post(
                  url,
                  headers=worker_headers(),
                  json=payload,
                  timeout=30,
              )

              print(
                  "worker-ready:",
                  response.status_code,
                  response.text
              )

              if response.status_code != 200:
                  raise RuntimeError(
                      "worker-ready failed: "
                      + response.text
                  )


          def get_command():

              url = (
                  API_URL
                  + "/internal/session/"
                  + SESSION_ID
                  + "/command"
              )

              response = requests.get(
                  url,
                  headers=worker_headers(),
                  timeout=30,
              )

              if response.status_code != 200:
                  print(
                      "command HTTP:",
                      response.status_code,
                      response.text
                  )
                  return None, False

              data = response.json()

              if data.get("expired"):
                  return None, True

              return data.get("command"), False


          def send_result(result):

              url = (
                  API_URL
                  + "/internal/session/"
                  + SESSION_ID
                  + "/result"
              )

              response = requests.post(
                  url,
                  headers=worker_headers(),
                  json=result,
                  timeout=30,
              )

              print(
                  "result HTTP:",
                  response.status_code
              )

              print(
                  response.text
              )


          @cuda.jit
          def add_kernel(a, b, c):

              i = cuda.grid(1)

              if i < c.size:
                  c[i] = a[i] + b[i]


          def execute_matrix(size):

              size = int(size)

              if size < 1:
                  raise ValueError(
                      "Matrix/vector size must be positive"
                  )

              if size > 10_000_000:
                  raise ValueError(
                      "Requested size is too large"
                  )

              a = np.random.rand(
                  size
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  size
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  size,
                  dtype=np.float32
              )

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = 256

              blocks = (
                  size + threads - 1
              ) // threads

              # Warmup
              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )

              output = (
                  d_c.copy_to_host()
              )

              checksum = float(
                  np.sum(
                      output[:1000]
                  )
              )

              return {
                  "status": "SUCCESS",
                  "operation": "matrix",
                  "size": size,
                  "time_seconds": elapsed,
                  "checksum": checksum,
                  "blocks": blocks,
                  "threads": threads,
              }


          # ==================================================
          # GPU INITIALIZATION
          # ==================================================

          try:

              print("=" * 70)
              print("NVIDIA")
              print("=" * 70)

              smi = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader",
                  ],
                  capture_output=True,
                  text=True,
              )

              print(
                  smi.stdout
              )


              print("=" * 70)
              print("CUDA")
              print("=" * 70)

              print(
                  "Numba:",
                  numba.__version__
              )

              print(
                  "CUDA available:",
                  cuda.is_available()
              )

              if not cuda.is_available():
                  raise RuntimeError(
                      "CUDA unavailable"
                  )

              device = cuda.get_current_device()

              gpu_name = str(
                  device.name
              )

              capability = (
                  device.compute_capability
              )

              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )


              # ------------------------------------------------
              # TEST GPU
              # ------------------------------------------------

              test_result = execute_matrix(
                  1024 * 1024
              )

              print(
                  "GPU TEST:",
                  json.dumps(
                      test_result,
                      indent=2
                  )
              )


              # ------------------------------------------------
              # IMPORTANT:
              # Tell Railway the GPU is READY.
              # ------------------------------------------------

              notify_ready(
                  gpu_name,
                  capability
              )


              print("=" * 70)
              print("GPU SESSION ACTIVE")
              print("=" * 70)


              # =================================================
              # COMMAND LOOP
              # =================================================

              while True:

                  command, expired = get_command()

                  if expired:
                      print(
                          "Session expired."
                      )
                      break

                  if command is None:
                      time.sleep(2)
                      continue

                  print("=" * 70)
                  print("NEW COMMAND")
                  print("=" * 70)

                  print(
                      json.dumps(
                          command,
                          indent=2
                      )
                  )

                  command_id = command.get(
                      "command_id"
                  )

                  operation = command.get(
                      "operation"
                  )

                  parameters = command.get(
                      "parameters",
                      {}
                  )

                  try:

                      if operation == "matrix":

                          size = parameters.get(
                              "size",
                              1024
                          )

                          output = execute_matrix(
                              size
                          )

                      else:

                          output = {
                              "status": "ERROR",
                              "error": (
                                  "Unsupported operation"
                              ),
                          }

                  except Exception as e:

                      output = {
                          "status": "ERROR",
                          "error": str(e),
                          "traceback":
                              traceback.format_exc(),
                      }

                  output[
                      "command_id"
                  ] = command_id

                  send_result(
                      output
                  )


          except Exception as e:

              print("=" * 70)
              print("GPU WORKER ERROR")
              print("=" * 70)

              traceback.print_exc()

              raise

          finally:

              print(
                  "GPU worker stopped."
              )

          PYEOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json

      - name: Submit Kaggle worker
        shell: bash
        run: |
          set -e

          kaggle kernels push \
            -p kaggle_session

          echo "Kaggle worker submitted."

      - name: Wait for Kaggle
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "======================================"
          echo "WAITING FOR KAGGLE WORKER"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 240); do

            echo ""
            echo "CHECK $i/240"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo "Kaggle worker complete."

              break

            fi

            if echo "$STATUS" | grep -Eq \
              "KernelWorkerStatus.ERROR|KernelWorkerStatus.CANCEL_ACKNOWLEDGED|KernelWorkerStatus.CANCELLED"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "Kaggle worker stopped."

              break

            fi

            sleep 5

          done

          echo ""
          echo "FINAL_STATUS=$FINAL_STATUS"

          if [ "$FINAL_STATUS" != "COMPLETE" ]; then
            echo "Kaggle worker did not complete normally."
            exit 1
          fi

      - name: Final
        if: always()
        run: |
          echo "======================================"
          echo "GPU SESSION WORKFLOW FINISHED"
          echo "======================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
