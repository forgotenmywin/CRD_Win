name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      api_url:
        required: true
        type: string
      worker_token:
        required: true
        type: string

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      # ============================================================
      # CHECK VARIABLES
      # ============================================================

      - name: Check configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING CONFIGURATION"
          echo "========================================"

          echo "SESSION_ID length: ${#SESSION_ID}"
          echo "API_URL: ${API_URL}"
          echo "WORKER_TOKEN length: ${#WORKER_TOKEN}"

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is empty"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL is empty"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN is empty"
            exit 1
          fi

      # ============================================================
      # CREATE KAGGLE WORKER
      # ============================================================

      - name: Create Kaggle worker
        shell: bash
        run: |

          set -e

          rm -rf kaggle_worker

          mkdir -p kaggle_worker

          echo "========================================"
          echo "CREATING KAGGLE WORKER"
          echo "========================================"

          # --------------------------------------------------------
          # Copy worker template
          # --------------------------------------------------------

          cp kaggle_worker.py kaggle_worker/worker.py

          # --------------------------------------------------------
          # Inject REAL values into Python source
          # --------------------------------------------------------

          python - <<'PY'
          import os
          from pathlib import Path

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          source = Path("kaggle_worker/worker.py").read_text()

          source = source.replace(
              "__SESSION_ID__",
              session_id
          )

          source = source.replace(
              "__API_URL__",
              api_url
          )

          source = source.replace(
              "__WORKER_TOKEN__",
              worker_token
          )

          Path("kaggle_worker/worker.py").write_text(source)

          print("Injected SESSION_ID:", session_id)
          print("Injected API_URL:", api_url)
          print("Injected TOKEN length:", len(worker_token))
          PY

          # --------------------------------------------------------
          # Create metadata
          # --------------------------------------------------------

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"]
          session_id = os.environ["SESSION_ID"]

          metadata = {
              "id": f"{username}/gpu-session-{session_id}",
              "title": f"GPU Session {session_id}",
              "code_file": "worker.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True
          }

          Path("kaggle_worker/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2)
          )

          print(json.dumps(metadata, indent=2))
          PY

          # --------------------------------------------------------
          # Verify generated worker
          # --------------------------------------------------------

          echo ""
          echo "========================================"
          echo "VERIFYING WORKER"
          echo "========================================"

          grep -n "__SESSION_ID__" kaggle_worker/worker.py || true
          grep -n "__API_URL__" kaggle_worker/worker.py || true
          grep -n "__WORKER_TOKEN__" kaggle_worker/worker.py || true

          echo ""
          echo "First configuration lines:"

          grep -nE "SESSION_ID|API_URL|WORKER_TOKEN" \
            kaggle_worker/worker.py | head -20

      # ============================================================
      # PUSH TO KAGGLE
      # ============================================================

      - name: Push GPU worker to Kaggle
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "PUSHING TO KAGGLE"
          echo "========================================"

          cd kaggle_worker

          kaggle kernels push

      # ============================================================
      # MONITOR KAGGLE WORKER
      # ============================================================

      - name: Monitor worker
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "MONITORING KAGGLE WORKER"
          echo "========================================"

          for i in $(seq 1 120); do

            echo ""
            echo "[$i/120]"

            RESPONSE=$(curl -s \
              -H "X-Worker-Token: ${WORKER_TOKEN}" \
              "${API_URL}/gpu/session/${SESSION_ID}")

            echo "$RESPONSE"

            STATUS=$(python -c "
          import json
          import sys

          try:
              data=json.loads(sys.stdin.read())
              print(data.get('status','unknown'))
          except:
              print('unknown')
          " <<< "$RESPONSE")

            echo "STATUS=$STATUS"

            case "$STATUS" in

              completed)
                echo "Worker completed."
                exit 0
                ;;

              expired)
                echo "Session expired."
                exit 0
                ;;

              error)
                echo "Worker reported error."
                exit 1
                ;;

            esac

            sleep 10

          done

          echo "Monitor timeout."
          exit 0
