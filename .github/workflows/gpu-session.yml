name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Check commands
      # =====================================================

      - name: Check commands.txt
        run: |

          echo "========================================"
          echo "COMMAND FILE"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found"
            exit 1
          fi

          cat commands.txt


      # =====================================================
      # Install Kaggle
      # =====================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          kaggle --version


      # =====================================================
      # Check credentials
      # =====================================================

      - name: Check Kaggle
        run: |

          echo "========================================"
          echo "KAGGLE"
          echo "========================================"

          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: username is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: token is empty"
            exit 1
          fi

          echo ""
          echo "Testing API..."

          kaggle kernels list \
            --mine \
            --page-size 10


      # =====================================================
      # Fixed Kernel
      # =====================================================

      - name: Set Kernel ID
        run: |

          echo "========================================"
          echo "KERNEL"
          echo "========================================"

          KERNEL_SLUG="gpu-command-runner"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =====================================================
      # Create Worker
      # =====================================================

      - name: Create GPU Worker
        run: |

          echo "========================================"
          echo "CREATING WORKER"
          echo "========================================"

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test

          python3 <<'PY'

          from pathlib import Path

          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )

          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          result = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          def out(text=""):

              print(
                  text,
                  flush=True
              )

              result.write(
                  str(text) + "\n"
              )

              result.flush()


          out("=" * 80)
          out("KAGGLE GPU COMMAND RUNNER")
          out("=" * 80)

          out()
          out("Python:")
          out(sys.version)

          out()
          out("Working directory:")
          out(os.getcwd())

          out()
          out("User:")

          try:

              out(
                  subprocess.check_output(
                      "whoami",
                      shell=True,
                      text=True
                  ).strip()
              )

          except Exception:

              out("unknown")


          COMMANDS = """COMMANDS_PLACEHOLDER"""


          commands = []

          for line in COMMANDS.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          out()
          out("=" * 80)
          out("COMMANDS LOADED")
          out("=" * 80)

          out(
              "Total commands: "
              + str(len(commands))
          )


          def run_command(command, number):

              out()
              out("#" * 80)

              out(
                  "# COMMAND "
                  + str(number)
                  + " / "
                  + str(len(commands))
              )

              out("#" * 80)

              out()
              out("$ " + command)

              out()
              out("=" * 80)


              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      out(
                          line.rstrip()
                      )


                  code = process.wait()


                  out()
                  out(
                      "Return code: "
                      + str(code)
                  )


              except Exception:

                  out()
                  out("COMMAND ERROR")

                  out(
                      traceback.format_exc()
                  )


          for i, command in enumerate(
              commands,
              1
          ):

              run_command(
                  command,
                  i
              )


          out()
          out("=" * 80)
          out("ALL COMMANDS FINISHED")
          out("=" * 80)


          result.close()

          '''


          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )

          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )

          PY


          echo ""
          echo "Worker:"
          ls -lh kaggle-gpu-test/gpu_worker.py


      # =====================================================
      # Metadata
      # =====================================================

      - name: Create Metadata
        run: |

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "gpu-command-runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          cat kaggle-gpu-test/kernel-metadata.json


      # =====================================================
      # Check if Kernel already exists
      # =====================================================

      - name: Check Existing Kernel
        run: |

          echo "========================================"
          echo "CHECKING EXISTING KERNEL"
          echo "========================================"

          set +e

          kaggle kernels status \
            "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          RESULT=$?

          set -e

          echo ""
          echo "Status return code:"
          echo "$RESULT"


      # =====================================================
      # Push / Update
      # =====================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "UPLOADING GPU WORKER"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json

          echo ""

          kaggle kernels push \
            -p kaggle-gpu-test


      # =====================================================
      # Wait
      # =====================================================

      - name: Wait For Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..40}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 40"
            echo "========================================"

            set +e

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            RESULT=$?

            set -e

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then

              echo ""
              echo "KERNEL COMPLETE"

              break

            fi

            if echo "$STATUS" | grep -qi "ERROR"; then

              echo ""
              echo "KERNEL ERROR"

              break

            fi

            if echo "$STATUS" | grep -qi "CANCEL"; then

              echo ""
              echo "KERNEL CANCELLED"

              break

            fi

            sleep 10

          done


      # =====================================================
      # Download output
      # =====================================================

      - name: Download Result
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "DOWNLOADING RESULT"
          echo "========================================"

          rm -rf kaggle-output

          mkdir -p kaggle-output

          set +e

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output

          RESULT=$?

          set -e

          echo ""
          echo "Return code:"
          echo "$RESULT"

          echo ""
          echo "Files:"

          find kaggle-output \
            -type f \
            -print


      # =====================================================
      # Show result
      # =====================================================

      - name: Show Result
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          if [ -f kaggle-output/result.txt ]; then

            cat kaggle-output/result.txt

          else

            echo ""
            echo "result.txt not found."

            echo ""
            echo "Downloaded files:"

            find kaggle-output \
              -type f \
              -print

          fi

          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"


      # =====================================================
      # Artifact
      # =====================================================

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn
