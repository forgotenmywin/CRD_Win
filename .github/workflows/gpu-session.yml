name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests \
            numpy \
            numba

          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          python --version
          kaggle --version

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is missing"
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is missing"
            exit 1
          fi


      # ======================================================
      # CREATE KAGGLE WORKER
      # ======================================================

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'
          import os
          import json
          import time
          import traceback
          import subprocess

          import numpy as np
          from numba import cuda


          SESSION_ID = os.environ["SESSION_ID"]
          API_URL = os.environ["API_URL"].rstrip("/")
          WORKER_TOKEN = os.environ["WORKER_TOKEN"]


          print("=" * 60)
          print("              KAGGLE GPU WORKER")
          print("=" * 60)

          print("SESSION_ID:", SESSION_ID)


          result = {
              "session_id": SESSION_ID,
              "status": "ERROR",
              "gpu": None,
              "compute_capability": None,
              "cuda_available": False,
              "test": {}
          }


          try:

              # ==================================================
              # NVIDIA INFORMATION
              # ==================================================

              print("")
              print("=" * 60)
              print("              NVIDIA GPU")
              print("=" * 60)

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(nvidia.stdout)

              if nvidia.returncode != 0:
                  raise RuntimeError(
                      "nvidia-smi failed"
                  )


              # ==================================================
              # CUDA
              # ==================================================

              print("")
              print("=" * 60)
              print("                 CUDA")
              print("=" * 60)

              cuda_available = cuda.is_available()

              print(
                  "CUDA available:",
                  cuda_available
              )

              if not cuda_available:
                  raise RuntimeError(
                      "CUDA is not available"
                  )


              result["cuda_available"] = True


              # ==================================================
              # GPU DEVICE
              # ==================================================

              device = cuda.get_current_device()

              gpu_name = str(device.name)

              capability = device.compute_capability

              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )

              result["gpu"] = gpu_name

              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1])
              ]


              # ==================================================
              # GPU TEST
              # ==================================================

              print("")
              print("=" * 60)
              print("               GPU TEST")
              print("=" * 60)


              N = 1_000_000


              @cuda.jit
              def add_kernel(a, b, c):

                  i = cuda.grid(1)

                  if i < c.size:
                      c[i] = a[i] + b[i]


              print(
                  "Creating arrays:",
                  N
              )


              a = np.ones(
                  N,
                  dtype=np.float32
              )

              b = np.ones(
                  N,
                  dtype=np.float32
              )

              c = np.zeros(
                  N,
                  dtype=np.float32
              )


              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)


              threads = 256

              blocks = (
                  N + threads - 1
              ) // threads


              print(
                  "Blocks:",
                  blocks
              )

              print(
                  "Threads:",
                  threads
              )


              # Warm-up
              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()


              # Benchmark
              start = time.perf_counter()


              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )


              cuda.synchronize()


              elapsed = (
                  time.perf_counter()
                  - start
              )


              output = d_c.copy_to_host()


              checksum = float(
                  np.sum(output)
              )


              expected = float(
                  N * 2
              )


              print("")
              print(
                  "GPU computation finished"
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              print(
                  "Checksum:",
                  checksum
              )

              print(
                  "Expected:",
                  expected
              )


              # ==================================================
              # RESULT
              # ==================================================

              if abs(
                  checksum - expected
              ) > 0.1:

                  raise RuntimeError(
                      "GPU result verification failed"
                  )


              result["status"] = "READY"


              result["test"] = {
                  "elements": N,
                  "blocks": blocks,
                  "threads": threads,
                  "time_seconds": elapsed,
                  "checksum": checksum,
                  "expected": expected,
                  "verified": True
              }


              print("")
              print("=" * 60)
              print("             GPU WORKER READY")
              print("=" * 60)


              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


              # ==================================================
              # SAVE RESULT
              # ==================================================

              with open(
                  "/kaggle/working/session_result.json",
                  "w"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )


              # ==================================================
              # KEEP KAGGLE KERNEL ALIVE
              # ==================================================

              print("")
              print(
                  "Keeping GPU worker alive..."
              )


              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1
                  )

                  time.sleep(1)


          except Exception as e:

              result["status"] = "ERROR"

              result["error"] = str(e)

              result["exception"] = (
                  type(e).__name__
              )

              result["traceback"] = (
                  traceback.format_exc()
              )


              print("")
              print("=" * 60)
              print("               GPU ERROR")
              print("=" * 60)


              traceback.print_exc()


              try:

                  with open(
                      "/kaggle/working/session_result.json",
                      "w"
                  ) as f:

                      json.dump(
                          result,
                          f,
                          indent=2
                      )

              except Exception:
                  pass


              raise
          PYEOF


          # ======================================================
          # KAGGLE METADATA
          # ======================================================

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "======================================"
          echo "KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # ======================================================
      # SUBMIT KAGGLE
      # ======================================================

      - name: Submit Kaggle GPU
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SUBMITTING KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle kernel submitted."


      # ======================================================
      # WAIT FOR KAGGLE
      # ======================================================

      - name: Wait for Kaggle GPU
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "WAITING FOR KAGGLE WORKER"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          FINAL_STATUS="UNKNOWN"


          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"


            STATUS_OUTPUT="$(
              kaggle kernels status "$KERNEL" 2>&1
            )"


            echo "$STATUS_OUTPUT"


            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "KAGGLE WORKER COMPLETE"

              break

            fi


            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "KAGGLE WORKER ERROR"

              break

            fi


            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.CANCEL_ACKNOWLEDGED"
            then

              FINAL_STATUS="CANCELLED"

              echo ""
              echo "KAGGLE WORKER CANCELLED"

              break

            fi


            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.CANCEL_PENDING"
            then

              FINAL_STATUS="CANCEL_PENDING"

              echo ""
              echo "KAGGLE WORKER CANCELLATION PENDING"

            fi


            sleep 5

          done


          echo ""
          echo "======================================"
          echo "FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          if [ "$FINAL_STATUS" = "COMPLETE" ]
          then

            echo "Kaggle worker completed successfully."

            exit 0

          fi


          echo "Kaggle worker did not complete normally."

          exit 1


      # ======================================================
      # DOWNLOAD RESULT
      # ======================================================

      - name: Download Kaggle result
        if: always()
        shell: bash
        run: |

          mkdir -p final_output

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"


          echo "======================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"


          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            2>&1 || true


          echo ""
          echo "======================================"
          echo "FINAL FILES"
          echo "======================================"


          find final_output \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true


      # ======================================================
      # UPLOAD RESULT TO GITHUB
      # ======================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
          retention-days: 1


      # ======================================================
      # FINAL
      # ======================================================

      - name: Final status
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION_ID=$SESSION_ID"

          echo "API_URL=$API_URL"

          echo "GitHub workflow finished."
