name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle requests numba

          echo "======================================"
          echo "        ENVIRONMENT CHECK"
          echo "======================================"

          python --version
          kaggle --version

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN missing"
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "SESSION_ID missing"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "API_URL missing"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "WORKER_TOKEN missing"
            exit 1
          fi

          echo "Session:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"

      - name: Create Kaggle worker
        shell: bash
        run: |

          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<PYEOF

          import os
          import json
          import time
          import traceback
          import subprocess

          from numba import cuda
          import numpy as np

          SESSION_ID = os.environ["SESSION_ID"]
          API_URL = os.environ["API_URL"].rstrip("/")
          WORKER_TOKEN = os.environ["WORKER_TOKEN"]

          print("=" * 60)
          print("             GPU SESSION WORKER")
          print("=" * 60)

          print("SESSION_ID:", SESSION_ID)
          print("API_URL:", API_URL)

          result = {
              "session_id": SESSION_ID,
              "status": "ERROR"
          }

          try:

              # ----------------------------------------------
              # GPU INFORMATION
              # ----------------------------------------------

              print("")
              print("=" * 60)
              print("              GPU INFORMATION")
              print("=" * 60)

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(nvidia.stdout)

              # ----------------------------------------------
              # CUDA
              # ----------------------------------------------

              print("")
              print("CUDA available:", cuda.is_available())

              if not cuda.is_available():
                  raise RuntimeError(
                      "CUDA is not available"
                  )

              device = cuda.get_current_device()

              gpu_name = str(device.name)
              capability = device.compute_capability

              print("GPU:", gpu_name)
              print("Compute capability:", capability)

              result["gpu"] = gpu_name

              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1])
              ]

              result["cuda_available"] = True

              # ----------------------------------------------
              # SIMPLE GPU TEST
              # ----------------------------------------------

              print("")
              print("=" * 60)
              print("             GPU TEST")
              print("=" * 60)

              N = 1024

              @cuda.jit
              def add_kernel(a, b, c):

                  i = cuda.grid(1)

                  if i < a.size:
                      c[i] = a[i] + b[i]

              a = np.random.rand(N).astype(np.float32)
              b = np.random.rand(N).astype(np.float32)
              c = np.zeros(N, dtype=np.float32)

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = 256
              blocks = (N + threads - 1) // threads

              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )

              output = d_c.copy_to_host()

              checksum = float(
                  np.sum(output)
              )

              print("GPU computation successful")
              print("Time:", elapsed)
              print("Checksum:", checksum)

              result["status"] = "READY"

              result["test"] = {
                  "size": N,
                  "time_seconds": elapsed,
                  "checksum": checksum
              }

              print("")
              print("=" * 60)
              print("          GPU SESSION READY")
              print("=" * 60)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              # ----------------------------------------------
              # KEEP WORKER ALIVE
              # ----------------------------------------------

              print("")
              print("Worker is alive.")

              # Session lifetime is controlled by GitHub timeout.
              # Keep the GPU worker alive.

              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1
                  )

                  time.sleep(1)

          except Exception as e:

              result["status"] = "ERROR"

              result["error"] = str(e)

              result["exception"] = (
                  type(e).__name__
              )

              result["traceback"] = (
                  traceback.format_exc()
              )

              print("")
              print("=" * 60)
              print("             GPU ERROR")
              print("=" * 60)

              traceback.print_exc()

              raise

          PYEOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          echo "======================================"
          echo "       KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json

      - name: Submit Kaggle GPU
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."

      - name: Wait for Kaggle
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          for i in $(seq 1 180)
          do

            echo ""
            echo "CHECK $i/180"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              echo ""
              echo "KAGGLE SESSION COMPLETE"
              exit 0

            fi

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              echo ""
              echo "KAGGLE SESSION ERROR"

              exit 1

            fi

            sleep 5

          done

          echo ""
          echo "Kaggle timeout."

          exit 1

      - name: Final
        if: always()
        run: |

          echo ""
          echo "======================================"
          echo "        GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"
