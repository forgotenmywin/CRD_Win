name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check commands.txt
        run: |

          echo "========================================"
          echo "CHECKING COMMANDS"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found"
            exit 1
          fi

          echo ""
          echo "Commands:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          echo "========================================"
          echo "INSTALLING KAGGLE CLI"
          echo "========================================"

          python -m pip install --upgrade pip

          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # 4. Check authentication
      # =========================================================

      - name: Check Kaggle Authentication
        run: |

          echo "========================================"
          echo "KAGGLE AUTHENTICATION"
          echo "========================================"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          echo ""
          echo "Testing Kaggle API..."

          kaggle kernels list \
            --mine \
            --page-size 10


      # =========================================================
      # 5. Fixed Kernel
      # =========================================================

      - name: Set Kernel
        run: |

          echo "========================================"
          echo "KERNEL CONFIGURATION"
          echo "========================================"

          KERNEL_SLUG="gpu-command-runner"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # 6. Prepare Kernel directory
      # =========================================================

      - name: Prepare Kernel Directory
        run: |

          echo "========================================"
          echo "PREPARING KERNEL"
          echo "========================================"

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test


      # =========================================================
      # 7. Check whether kernel already exists
      # =========================================================

      - name: Check Existing Kernel
        run: |

          echo "========================================"
          echo "CHECKING EXISTING KERNEL"
          echo "========================================"

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "Kernel:"
          echo "$KERNEL"

          set +e

          kaggle kernels status "$KERNEL" > kernel_status.txt 2>&1

          STATUS_CODE=$?

          set -e

          cat kernel_status.txt

          echo ""
          echo "Status return code:"
          echo "$STATUS_CODE"

          if [ "$STATUS_CODE" -eq 0 ]; then

            echo ""
            echo "Kernel already exists."

            echo "KERNEL_EXISTS=true" >> "$GITHUB_ENV"

          else

            echo ""
            echo "Kernel does not appear to exist."

            echo "KERNEL_EXISTS=false" >> "$GITHUB_ENV"

          fi


      # =========================================================
      # 8. Pull existing kernel metadata
      # =========================================================

      - name: Pull Existing Kernel
        if: env.KERNEL_EXISTS == 'true'
        run: |

          echo "========================================"
          echo "PULLING EXISTING KERNEL"
          echo "========================================"

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          rm -rf existing-kernel

          mkdir -p existing-kernel

          set +e

          kaggle kernels pull \
            "$KERNEL" \
            -p existing-kernel \
            -m

          RESULT=$?

          set -e

          echo ""
          echo "Pull return code:"
          echo "$RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "Could not pull existing kernel."
            exit "$RESULT"
          fi

          echo ""
          echo "Existing kernel files:"

          find existing-kernel \
            -maxdepth 2 \
            -type f \
            -print


      # =========================================================
      # 9. Create Worker
      # =========================================================

      - name: Create GPU Worker
        run: |

          echo "========================================"
          echo "CREATING GPU WORKER"
          echo "========================================"

          python3 <<'PY'

          from pathlib import Path


          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )


          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # Result file
          # =====================================================

          result_file = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          # =====================================================
          # Output
          # =====================================================

          def output(text=""):

              print(
                  text,
                  flush=True
              )

              result_file.write(
                  str(text) + "\n"
              )

              result_file.flush()


          # =====================================================
          # Header
          # =====================================================

          output("=" * 80)
          output("KAGGLE GPU COMMAND RUNNER")
          output("=" * 80)

          output()

          output("Python:")
          output(sys.version)

          output()

          output("Working directory:")
          output(os.getcwd())

          output()

          output("User:")

          try:

              output(
                  subprocess.check_output(
                      "whoami",
                      shell=True,
                      text=True
                  ).strip()
              )

          except Exception:

              output("unknown")


          # =====================================================
          # Commands
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""


          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          output()
          output("=" * 80)
          output("COMMANDS LOADED")
          output("=" * 80)

          output(
              "Number of commands: "
              + str(len(commands))
          )


          # =====================================================
          # Execute command
          # =====================================================

          def run_command(
              command,
              number,
              total
          ):

              output()
              output("#" * 80)

              output(
                  "# COMMAND "
                  + str(number)
                  + " / "
                  + str(total)
              )

              output("#" * 80)

              output()
              output("$ " + command)

              output()
              output("=" * 80)


              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      output(
                          line.rstrip()
                      )


                  code = process.wait()


                  output()
                  output(
                      "Return code: "
                      + str(code)
                  )


              except Exception:

                  output()
                  output("COMMAND ERROR")

                  output(
                      traceback.format_exc()
                  )


          # =====================================================
          # Run commands
          # =====================================================

          total = len(commands)


          if total == 0:

              output()
              output("NO COMMANDS FOUND")


          else:

              for number, command in enumerate(
                  commands,
                  1
              ):

                  run_command(
                      command,
                      number,
                      total
                  )


          # =====================================================
          # Finish
          # =====================================================

          output()
          output("=" * 80)
          output("ALL COMMANDS FINISHED")
          output("=" * 80)


          result_file.close()

          '''


          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )


          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )


          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )


          print(
              "Worker created."
          )

          PY


          echo ""
          echo "Worker:"
          ls -lh kaggle-gpu-test/gpu_worker.py


      # =========================================================
      # 10. Create metadata
      # =========================================================

      - name: Create Metadata
        run: |

          echo "========================================"
          echo "CREATING METADATA"
          echo "========================================"


          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaP100"
          }
          EOF


          if [ "$KERNEL_EXISTS" = "false" ]; then

            python3 - <<'PY'

          import json

          path = "kaggle-gpu-test/kernel-metadata.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["title"] = "gpu-command-runner"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  indent=2
              )

          PY

          fi


          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 11. Push / Update
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "PUSHING GPU WORKER"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Files:"
          find kaggle-gpu-test \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json

          echo ""

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 12. Wait
      # =========================================================

      - name: Wait For Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..40}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 40"
            echo "========================================"


            set +e

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            RESULT=$?

            set -e


            echo "$STATUS"


            if echo "$STATUS" | grep -qi "COMPLETE"; then

              echo ""
              echo "========================================"
              echo "KERNEL COMPLETE"
              echo "========================================"

              break

            fi


            if echo "$STATUS" | grep -qi "ERROR"; then

              echo ""
              echo "========================================"
              echo "KERNEL ERROR"
              echo "========================================"

              break

            fi


            if echo "$STATUS" | grep -qi "CANCEL"; then

              echo ""
              echo "KERNEL CANCELLED"

              break

            fi


            sleep 10

          done


      # =========================================================
      # 13. Download output
      # =========================================================

      - name: Download Output
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "DOWNLOADING OUTPUT"
          echo "========================================"

          rm -rf kaggle-output

          mkdir -p kaggle-output


          set +e

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output

          RESULT=$?

          set -e


          echo ""
          echo "Download return code:"
          echo "$RESULT"


          echo ""
          echo "Output files:"

          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # 14. Show result
      # =========================================================

      - name: Show Result
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"


          if [ -f kaggle-output/result.txt ]; then

              echo ""
              echo "========================================"
              echo "RESULT.TXT"
              echo "========================================"

              cat kaggle-output/result.txt

          else

              echo ""
              echo "result.txt NOT FOUND"

              echo ""
              echo "Downloaded files:"

              find kaggle-output \
                -type f \
                -print

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"


      # =========================================================
      # 15. Artifact
      # =========================================================

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn
