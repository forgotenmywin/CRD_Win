name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle
        run: |
          pip install -U kaggle

      - name: Create Kaggle files
        run: |
          mkdir -p kaggle-gpu-test

          cat > kaggle-gpu-test/commands.txt <<'EOF'
          nvidia-smi -L
          nvidia-smi
          cat /etc/os-release
          lspci --version
          lspci | grep -i vga
          lspci | grep -i nvidia
          EOF

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'
          import subprocess
          from pathlib import Path

          commands = Path("/kaggle/src/commands.txt")

          for command in commands.read_text().splitlines():
              command = command.strip()

              if not command or command.startswith("#"):
                  continue

              print("=" * 80)
              print("$", command)
              print("=" * 80)

              p = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT
              )

              print(p.stdout)
              print("Return code:", p.returncode)

          print("=" * 80)
          print("GPU TEST FINISHED")
          print("=" * 80)
          PY

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "gpu-command-runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

      - name: Show metadata
        run: |
          cat kaggle-gpu-test/kernel-metadata.json
          echo "================ COMMANDS ================"
          cat kaggle-gpu-test/commands.txt

      - name: Push to Kaggle
        run: |
          kaggle kernels push -p kaggle-gpu-test

      - name: Wait
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-command-runner"

          for i in $(seq 1 30); do
            echo "CHECK $i / 30"

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              break
            fi

            sleep 10
          done

      - name: Get output
        run: |
          mkdir -p output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p output || true

          find output -type f -print || true
