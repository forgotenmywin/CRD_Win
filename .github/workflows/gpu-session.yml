name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Kaggle
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install kaggle requests


      - name: Validate
        run: |
          set -e

          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"

          test -f kaggle_worker/script.py

          echo "Validation OK."


      - name: Build Kaggle package
        run: |
          set -e

          rm -rf kaggle_upload
          mkdir -p kaggle_upload

          cp kaggle_worker/script.py \
             kaggle_upload/script.py

          python - <<'PY'
          from pathlib import Path
          import os

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          config = f'''SESSION_ID = {session_id!r}
          API_URL = {api_url!r}
          WORKER_TOKEN = {worker_token!r}
          '''

          Path(
              "kaggle_upload/config.py"
          ).write_text(
              config,
              encoding="utf-8"
          )

          print(
              "config.py generated successfully"
          )

          print(
              "SESSION_ID:",
              session_id
          )

          print(
              "API_URL:",
              api_url
          )

          print(
              "WORKER_TOKEN: injected"
          )
          PY

          python -m py_compile \
            kaggle_upload/script.py

          python -m py_compile \
            kaggle_upload/config.py

          echo
          echo "PACKAGE:"
          find kaggle_upload \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'


      - name: Create Kaggle metadata
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_upload/kernel-metadata.json


      - name: Push Kaggle GPU Worker
        working-directory: kaggle_upload
        run: |
          set -e

          export KAGGLE_API_TOKEN="$KAGGLE_API_TOKEN"

          kaggle kernels push -p .

          echo "Kaggle worker submitted."


      - name: Wait for Worker
        run: |
          set +e

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Waiting for:"
          echo "$STATUS_URL"

          for i in $(seq 1 300); do

            echo
            echo "CHECK $i / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "$STATUS_URL")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
              print(data.get("status", ""))
          except:
              print("")
          ')

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "active" ]; then

              echo
              echo "========================================"
              echo "GPU WORKER READY"
              echo "========================================"

              exit 0

            fi

            if [ "$STATUS" = "error" ]; then

              echo "Session entered error state."
              exit 1

            fi

            sleep 5

          done

          echo "Worker timeout."
          exit 1


      - name: Keep GitHub workflow alive
        if: success()
        run: |
          set +e

          while true; do

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${API_URL}/gpu/session/${SESSION_ID}")

            echo
            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import json
          import sys

          try:
              data=json.load(sys.stdin)
              print(data.get("status",""))
          except:
              print("")
          ')

            echo "STATUS=$STATUS"

            case "$STATUS" in

              active)
                sleep 30
                ;;

              expired|stopped)
                echo "Session ended."
                exit 0
                ;;

              error)
                exit 1
                ;;

              *)
                sleep 15
                ;;

            esac

          done


      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}

          path: |
            kaggle_upload/script.py
            kaggle_upload/config.py
            kaggle_upload/kernel-metadata.json

          if-no-files-found: warn
