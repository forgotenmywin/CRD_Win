name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests


      # ======================================================
      # CHECK ENVIRONMENT
      # ======================================================

      - name: Check environment
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       ENVIRONMENT CHECK"
          echo "======================================"

          python --version
          kaggle --version

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID missing"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL missing"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN missing"
            exit 1
          fi

          echo ""
          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo ""
          echo "API_URL:"
          echo "$API_URL"

          echo ""
          echo "Environment OK."


      # ======================================================
      # CREATE KAGGLE WORKER
      # ======================================================

      - name: Create Kaggle GPU worker
        shell: bash
        run: |

          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'

          import os
          import json
          import time
          import traceback
          import subprocess

          SESSION_ID = os.environ["SESSION_ID"]
          API_URL = os.environ["API_URL"]
          WORKER_TOKEN = os.environ["WORKER_TOKEN"]

          RESULT_FILE = "session_result.json"

          result = {
              "session_id": SESSION_ID,
              "status": "starting",
              "gpu": None,
              "compute_capability": None,
              "cuda_available": False,
              "worker_ready": False,
              "error": None,
              "created_at": time.time()
          }


          def save_result():

              with open(
                  RESULT_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )


          print("=" * 60)
          print("             KAGGLE GPU WORKER")
          print("=" * 60)

          print("SESSION:", SESSION_ID)

          try:

              # ==================================================
              # NVIDIA-SMI
              # ==================================================

              print("")
              print("=" * 60)
              print("              NVIDIA GPU")
              print("=" * 60)

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(nvidia.stdout)

              if nvidia.returncode != 0:

                  raise RuntimeError(
                      "nvidia-smi failed: "
                      + nvidia.stderr
                  )


              # ==================================================
              # PARSE GPU NAME
              # ==================================================

              gpu_line = nvidia.stdout.strip()

              if gpu_line:

                  result["gpu"] = (
                      gpu_line
                      .split(",")[0]
                      .strip()
                  )


              # ==================================================
              # CUDA TEST
              # ==================================================

              print("")
              print("=" * 60)
              print("               CUDA TEST")
              print("=" * 60)

              cuda_test = subprocess.run(
                  [
                      "python",
                      "-c",
                      """
          import sys

          try:
              from numba import cuda

              print("NUMBA CUDA AVAILABLE:", cuda.is_available())

              if not cuda.is_available():
                  sys.exit(2)

              device = cuda.get_current_device()

              print("DEVICE:", device.name)
              print("COMPUTE CAPABILITY:", device.compute_capability)

          except Exception as e:
              print("CUDA ERROR:", repr(e))
              sys.exit(1)
                      """
                  ],
                  capture_output=True,
                  text=True
              )

              print(cuda_test.stdout)
              print(cuda_test.stderr)

              if cuda_test.returncode != 0:

                  raise RuntimeError(
                      "CUDA test failed"
                  )


              # ==================================================
              # GET NUMBA INFO
              # ==================================================

              from numba import cuda

              if not cuda.is_available():

                  raise RuntimeError(
                      "CUDA is not available"
                  )

              device = cuda.get_current_device()

              gpu_name = str(device.name)

              capability = (
                  device.compute_capability
              )

              result["gpu"] = gpu_name

              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1])
              ]

              result["cuda_available"] = True


              # ==================================================
              # REAL GPU TEST
              # ==================================================

              print("")
              print("=" * 60)
              print("             REAL GPU TEST")
              print("=" * 60)

              import numpy as np
              from numba import cuda

              N = 1024 * 1024

              a = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  N,
                  dtype=np.float32
              )


              @cuda.jit
              def add_kernel(
                  a,
                  b,
                  c
              ):

                  i = cuda.grid(1)

                  if i < a.size:

                      c[i] = (
                          a[i]
                          + b[i]
                      )


              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = 256

              blocks = (
                  N + threads - 1
              ) // threads


              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )

              output = (
                  d_c.copy_to_host()
              )

              checksum = float(
                  np.sum(output)
              )


              print("")
              print("GPU computation successful.")
              print("GPU:", gpu_name)
              print(
                  "Compute capability:",
                  capability
              )
              print(
                  "Elements:",
                  N
              )
              print(
                  "GPU kernel time:",
                  elapsed
              )
              print(
                  "Checksum:",
                  checksum
              )


              # ==================================================
              # WORKER READY
              # ==================================================

              result["status"] = "READY"

              result["worker_ready"] = True

              result["ready_at"] = time.time()

              result["test"] = {
                  "elements": N,
                  "kernel_time_seconds": elapsed,
                  "checksum": checksum
              }

              save_result()


              print("")
              print("=" * 60)
              print("          GPU WORKER READY")
              print("=" * 60)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


              # ==================================================
              # KEEP GPU WORKER ALIVE
              # ==================================================

              print("")
              print("=" * 60)
              print("        KEEPING GPU WORKER ALIVE")
              print("=" * 60)

              # Keep Kaggle kernel alive.
              #
              # IMPORTANT:
              # We do NOT perform another GPU test here.
              #
              # The worker is already READY.

              for i in range(600):

                  print(
                      "GPU WORKER ALIVE:",
                      i + 1
                  )

                  time.sleep(1)


              # ==================================================
              # NORMAL END
              # ==================================================

              result["status"] = "COMPLETE"

              result["completed_at"] = time.time()

              save_result()

              print("")
              print("GPU worker finished normally.")


          except Exception as e:

              result["status"] = "ERROR"

              result["worker_ready"] = False

              result["error"] = str(e)

              result["exception"] = (
                  type(e).__name__
              )

              result["traceback"] = (
                  traceback.format_exc()
              )

              save_result()

              print("")
              print("=" * 60)
              print("             GPU WORKER ERROR")
              print("=" * 60)

              traceback.print_exc()

              raise

          PYEOF


          # ======================================================
          # KAGGLE METADATA
          # ======================================================

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "======================================"
          echo "       KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # ======================================================
      # SUBMIT
      # ======================================================

      - name: Submit Kaggle GPU
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for Kaggle worker
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE WORKER"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 240)
          do

              echo ""
              echo "======================================"
              echo "CHECK $i/240"
              echo "======================================"

              STATUS="$(
                kaggle kernels status \
                  "$KERNEL" \
                  2>&1
              )"

              echo "$STATUS"

              if echo "$STATUS" | grep -q \
                "KernelWorkerStatus.COMPLETE"
              then

                  FINAL_STATUS="COMPLETE"

                  echo ""
                  echo "KAGGLE SESSION COMPLETE"

                  break

              fi


              if echo "$STATUS" | grep -q \
                "KernelWorkerStatus.ERROR"
              then

                  FINAL_STATUS="ERROR"

                  echo ""
                  echo "KAGGLE SESSION ERROR"

                  break

              fi


              if echo "$STATUS" | grep -q \
                "KernelWorkerStatus.CANCEL_ACKNOWLEDGED"
              then

                  FINAL_STATUS="CANCELLED"

                  echo ""
                  echo "KAGGLE WORKER WAS CANCELLED"

                  break

              fi


              if echo "$STATUS" | grep -q \
                "KernelWorkerStatus.CANCEL_PENDING"
              then

                  FINAL_STATUS="CANCEL_PENDING"

                  echo ""
                  echo "KAGGLE WORKER CANCELLATION PENDING"

                  break

              fi


              sleep 5

          done


          echo ""
          echo "======================================"
          echo "             FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          # ====================================================
          # IMPORTANT:
          #
          # If Kaggle completed normally, this is NOT an error.
          # The GPU worker already performed its test and became
          # READY before entering the keep-alive loop.
          # ====================================================

          if [ "$FINAL_STATUS" = "COMPLETE" ]; then

              echo ""
              echo "Kaggle worker completed successfully."

              exit 0

          fi


          if [ "$FINAL_STATUS" = "CANCELLED" ]; then

              echo ""
              echo "Kaggle worker was cancelled."

              exit 1

          fi


          if [ "$FINAL_STATUS" = "CANCEL_PENDING" ]; then

              echo ""
              echo "Kaggle worker cancellation pending."

              exit 1

          fi


          if [ "$FINAL_STATUS" = "ERROR" ]; then

              echo ""
              echo "Kaggle worker failed."

              exit 1

          fi


          echo ""
          echo "Kaggle worker did not complete normally."

          exit 1


      # ======================================================
      # DOWNLOAD RESULT
      # ======================================================

      - name: Download Kaggle result
        if: always()
        shell: bash
        run: |

          set +e

          mkdir -p final_output

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "        DOWNLOADING KAGGLE RESULT"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force


          echo ""
          echo "======================================"
          echo "          FINAL KAGGLE FILES"
          echo "======================================"

          find final_output \
            -maxdepth 2 \
            -type f \
            -print


      # ======================================================
      # READ RESULT
      # ======================================================

      - name: Read GPU result
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "             GPU RESULT"
          echo "======================================"


          if [ -f "final_output/session_result.json" ]; then

              cat \
                final_output/session_result.json

          else

              echo "session_result.json not found."

          fi


      # ======================================================
      # UPLOAD ARTIFACT
      # ======================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
