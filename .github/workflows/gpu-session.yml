name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # INSTALL
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING DEPENDENCIES"
          echo "========================================"

          python -m pip install --upgrade pip

          pip install kaggle requests

          echo ""
          kaggle --version


      # ==========================================================
      # VALIDATE
      # ==========================================================

      - name: Validate configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo "API_URL:"
          echo "$API_URL"

          echo "WORKER_TOKEN length:"
          echo "${#WORKER_TOKEN}"

          echo ""

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is empty"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL is empty"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN secret is missing"
            exit 1
          fi

          if [ ! -f "kaggle_worker/script.py" ]; then
            echo "ERROR: kaggle_worker/script.py not found"
            exit 1
          fi

          echo "Validation OK."


      # ==========================================================
      # PREPARE KAGGLE WORKER
      # ==========================================================

      - name: Prepare Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          rm -rf build

          mkdir -p build

          cp kaggle_worker/script.py build/script.py

          echo ""
          echo "Injecting session configuration..."

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("build/script.py")

          text = path.read_text()

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          text = text.replace(
              "__SESSION_ID__",
              session_id
          )

          text = text.replace(
              "__API_URL__",
              api_url
          )

          text = text.replace(
              "__WORKER_TOKEN__",
              worker_token
          )

          path.write_text(text)

          print("SESSION_ID injected:", bool(session_id))
          print("API_URL injected:", bool(api_url))
          print("WORKER_TOKEN injected:", bool(worker_token))
          PY

          echo ""
          echo "Checking generated worker..."

          if grep -q "__SESSION_ID__" build/script.py; then
            echo "ERROR: SESSION_ID placeholder remains"
            exit 1
          fi

          if grep -q "__API_URL__" build/script.py; then
            echo "ERROR: API_URL placeholder remains"
            exit 1
          fi

          if grep -q "__WORKER_TOKEN__" build/script.py; then
            echo "ERROR: WORKER_TOKEN placeholder remains"
            exit 1
          fi

          echo ""
          echo "Generated configuration:"

          grep "^SESSION_ID" build/script.py
          grep "^API_URL" build/script.py

          echo ""
          echo "Checking Python syntax..."

          python -m py_compile build/script.py

          echo "Worker Python syntax OK."


      # ==========================================================
      # KAGGLE METADATA
      # ==========================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATING KAGGLE METADATA"
          echo "========================================"

          cat > build/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          cat build/kernel-metadata.json


      # ==========================================================
      # CHECK KAGGLE AUTH
      # ==========================================================

      - name: Check Kaggle authentication
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "KAGGLE AUTHENTICATION"
          echo "========================================"

          export KAGGLE_API_TOKEN="$KAGGLE_API_TOKEN"

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials detected."


      # ==========================================================
      # PUSH TO KAGGLE
      # ==========================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          export KAGGLE_API_TOKEN="$KAGGLE_API_TOKEN"

          cd build

          kaggle kernels push

          echo ""
          echo "Kaggle worker submitted."


      # ==========================================================
      # WAIT FOR WORKER
      # ==========================================================

      - name: Wait for worker
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo ""
          echo "Status URL:"
          echo "$STATUS_URL"

          echo ""

          for i in $(seq 1 300); do

            echo "----------------------------------------"
            echo "CHECK $i / 300"

            RESPONSE=$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              "$STATUS_URL")

            CURL_EXIT=$?

            if [ "$CURL_EXIT" -ne 0 ]; then

              echo "Status request failed."

              sleep 5

              continue

            fi

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys
          import json

          try:
              data = json.load(sys.stdin)
              print(data.get("status", ""))
          except Exception:
              print("")
          ')

            echo "Current status: $STATUS"

            # ==================================================
            # ACTIVE
            # ==================================================

            if [ "$STATUS" = "active" ]; then

              echo ""
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              exit 0

            fi

            # ==================================================
            # ERROR
            # ==================================================

            if [ "$STATUS" = "error" ]; then

              echo ""
              echo "========================================"
              echo "GPU SESSION ERROR"
              echo "========================================"

              exit 1

            fi

            # ==================================================
            # STOPPED
            # ==================================================

            if [ "$STATUS" = "stopped" ]; then

              echo ""
              echo "========================================"
              echo "GPU SESSION STOPPED"
              echo "========================================"

              exit 1

            fi

            sleep 5

          done

          echo ""
          echo "========================================"
          echo "TIMEOUT"
          echo "========================================"

          echo "Worker did not become ready."

          exit 1


      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload worker files
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}

          path: |
            build/script.py
            build/kernel-metadata.json
