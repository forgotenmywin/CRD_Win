name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands
        run: |

          echo "========================================"
          echo "CHECKING COMMANDS"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt does not exist."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo ""
          echo "commands.txt:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip

          pip install --upgrade kaggle

          echo ""
          echo "Kaggle version:"
          kaggle --version


      # =========================================================
      # 4. Check Secrets
      # =========================================================

      - name: Check Kaggle Credentials
        run: |

          echo "========================================"
          echo "CHECKING KAGGLE CREDENTIALS"
          echo "========================================"

          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""

          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo ""
            echo "ERROR: KAGGLE_USERNAME is empty."
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo ""
            echo "ERROR: KAGGLE_API_TOKEN is empty."
            exit 1
          fi

          echo ""
          echo "Credentials exist."


      # =========================================================
      # 5. Test Kaggle API
      # =========================================================

      - name: Test Kaggle API
        run: |

          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          set +e

          kaggle kernels list \
            --mine \
            --page-size 10

          RESULT=$?

          set -e

          echo ""
          echo "API return code: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "ERROR: Kaggle API test failed."
            exit "$RESULT"
          fi

          echo ""
          echo "Kaggle API is working."


      # =========================================================
      # 6. Create Unique Kernel ID
      # =========================================================

      - name: Create Unique Kernel ID
        run: |

          echo "========================================"
          echo "CREATING UNIQUE KERNEL"
          echo "========================================"

          KERNEL_SLUG="gpu-command-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel slug:"
          echo "$KERNEL_SLUG"

          echo ""
          echo "Full kernel ID:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # 7. Create GPU Worker
      # =========================================================

      - name: Create GPU Worker
        run: |

          echo "========================================"
          echo "CREATING GPU WORKER"
          echo "========================================"

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test

          python3 <<'PY'

          from pathlib import Path


          # =====================================================
          # Read commands.txt
          # =====================================================

          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )


          # =====================================================
          # Worker source
          # =====================================================

          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # Result file
          # =====================================================

          result_file = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          # =====================================================
          # Output
          # =====================================================

          def output(text=""):

              print(
                  text,
                  flush=True
              )

              result_file.write(
                  str(text) + "\n"
              )

              result_file.flush()


          # =====================================================
          # Header
          # =====================================================

          output("=" * 80)
          output("KAGGLE GPU COMMAND RUNNER")
          output("=" * 80)

          output()

          output("Python:")
          output(sys.version)

          output()

          output("Working directory:")
          output(os.getcwd())

          output()

          output("User:")

          try:

              output(
                  subprocess.check_output(
                      "whoami",
                      shell=True,
                      text=True
                  ).strip()
              )

          except Exception:

              output(
                  "unknown"
              )


          # =====================================================
          # Commands
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""


          # =====================================================
          # Parse commands
          # =====================================================

          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(
                  line
              )


          output()
          output("=" * 80)
          output("COMMANDS LOADED")
          output("=" * 80)

          output(
              "Number of commands: "
              + str(len(commands))
          )


          # =====================================================
          # Execute command
          # =====================================================

          def run_command(command):

              output()
              output("=" * 80)
              output("$ " + command)
              output("=" * 80)

              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      output(
                          line.rstrip()
                      )


                  return_code = process.wait()


                  output()

                  output(
                      "Return code: "
                      + str(return_code)
                  )


              except Exception:

                  output()
                  output("COMMAND ERROR")

                  output(
                      traceback.format_exc()
                  )


          # =====================================================
          # Execute all commands
          # =====================================================

          if not commands:

              output()
              output("No commands found.")


          else:

              for index, command in enumerate(
                  commands,
                  1
              ):

                  output()
                  output("#" * 80)

                  output(
                      "# COMMAND "
                      + str(index)
                      + " / "
                      + str(len(commands))
                  )

                  output("#" * 80)

                  run_command(
                      command
                  )


          # =====================================================
          # Finish
          # =====================================================

          output()
          output("=" * 80)
          output("ALL COMMANDS FINISHED")
          output("=" * 80)


          result_file.close()

          '''


          # =====================================================
          # Insert commands
          # =====================================================

          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )


          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )


          # =====================================================
          # Write worker
          # =====================================================

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )


          print(
              "gpu_worker.py created."
          )

          PY


          echo ""
          echo "Worker files:"
          find kaggle-gpu-test \
            -maxdepth 2 \
            -type f \
            -print

          echo ""
          echo "Worker size:"
          wc -c \
            kaggle-gpu-test/gpu_worker.py


      # =========================================================
      # 8. Create Metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          echo "========================================"
          echo "CREATING KAGGLE METADATA"
          echo "========================================"

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "GPU Command Runner ${GITHUB_RUN_ID}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 9. Debug Kaggle Account
      # =========================================================

      - name: Debug Kaggle Account
        run: |

          echo "========================================"
          echo "KAGGLE ACCOUNT DEBUG"
          echo "========================================"

          echo ""
          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Kaggle CLI:"
          kaggle --version

          echo ""
          echo "Existing kernels:"
          
          set +e

          kaggle kernels list \
            --mine \
            --page-size 10

          LIST_RESULT=$?

          set -e

          echo ""
          echo "List return code:"
          echo "$LIST_RESULT"


      # =========================================================
      # 10. Push Kernel
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "PUSHING GPU KERNEL"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Metadata:"
          cat kaggle-gpu-test/kernel-metadata.json

          echo ""

          set +e

          kaggle kernels push \
            -p kaggle-gpu-test

          PUSH_RESULT=$?

          set -e

          echo ""
          echo "Push return code:"
          echo "$PUSH_RESULT"

          if [ "$PUSH_RESULT" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "KAGGLE PUSH FAILED"
            echo "========================================"

            echo ""
            echo "Possible causes:"
            echo "1. Kaggle account permission"
            echo "2. GPU quota unavailable"
            echo "3. Invalid kernel metadata"
            echo "4. API token permissions"
            echo "5. Kaggle kernel creation restriction"

            exit "$PUSH_RESULT"

          fi


      # =========================================================
      # 11. Wait for Kernel
      # =========================================================

      - name: Wait for Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "$KERNEL"


          FINISHED=false


          for i in {1..40}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 40"
            echo "========================================"


            set +e

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            STATUS_RESULT=$?

            set -e


            echo "$STATUS"

            echo ""
            echo "Status command return code:"
            echo "$STATUS_RESULT"


            # ---------------------------------------------------
            # COMPLETE
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "COMPLETE"
            then

              echo ""
              echo "Kaggle Kernel completed."

              FINISHED=true

              break

            fi


            # ---------------------------------------------------
            # ERROR
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "ERROR"
            then

              echo ""
              echo "Kaggle Kernel reported ERROR."

              FINISHED=true

              break

            fi


            # ---------------------------------------------------
            # CANCEL
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "CANCEL"
            then

              echo ""
              echo "Kaggle Kernel cancelled."

              FINISHED=true

              break

            fi


            # ---------------------------------------------------
            # Permission problem
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "Permission"
            then

              echo ""
              echo "WARNING:"
              echo "Kaggle status API returned a permission error."

              echo ""
              echo "The Kernel may still be running."

              echo ""
              echo "Continuing to wait..."

            fi


            sleep 10

          done


          echo ""
          echo "========================================"
          echo "WAIT FINISHED"
          echo "========================================"


      # =========================================================
      # 12. Download Output
      # =========================================================

      - name: Download Kaggle Output
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          rm -rf kaggle-output

          mkdir -p kaggle-output

          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "$KERNEL"


          set +e

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output

          OUTPUT_RESULT=$?

          set -e


          echo ""
          echo "Output command return code:"
          echo "$OUTPUT_RESULT"


          echo ""
          echo "Downloaded files:"
          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # 13. Display Result
      # =========================================================

      - name: Display Command Results
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"


          RESULT="kaggle-output/result.txt"


          if [ -f "$RESULT" ]; then

            echo ""
            echo "========================================"
            echo "RESULT.TXT"
            echo "========================================"

            cat "$RESULT"

          else

            echo ""
            echo "WARNING: result.txt was not found."

            echo ""
            echo "Files received from Kaggle:"
            find kaggle-output \
              -type f \
              -print

            echo ""
            echo "Trying all output files:"

            find kaggle-output \
              -type f \
              -exec sh -c '
                echo ""
                echo "===== $1 ====="
                cat "$1" 2>/dev/null || true
              ' _ {} \;

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"


      # =========================================================
      # 14. Upload Result
      # =========================================================

      - name: Upload Kaggle Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn
