name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Railway API URL"
        required: true
        type: string
      worker_token:
        description: "Worker token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle requests

      - name: Verify configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY CONFIGURATION"
          echo "========================================"

          test -n "$KAGGLE_USERNAME" || {
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          }

          test -n "$KAGGLE_API_TOKEN" || {
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          }

          test -n "$SESSION_ID" || {
            echo "ERROR: SESSION_ID missing"
            exit 1
          }

          test -n "$API_URL" || {
            echo "ERROR: API_URL missing"
            exit 1
          }

          test -n "$WORKER_TOKEN" || {
            echo "ERROR: WORKER_TOKEN missing"
            exit 1
          }

          test -f kaggle_worker/worker.py || {
            echo "ERROR: kaggle_worker/worker.py missing"
            exit 1
          }

          echo "KAGGLE_USERNAME: OK"
          echo "KAGGLE_API_TOKEN: OK"
          echo "SESSION_ID: $SESSION_ID"
          echo "API_URL: $API_URL"
          echo "WORKER_TOKEN: ${#WORKER_TOKEN} chars"
          echo "worker.py: OK"

      - name: Prepare Kaggle kernel
        shell: bash
        run: |
          set -e

          rm -rf kaggle_upload
          mkdir -p kaggle_upload

          cp kaggle_worker/worker.py kaggle_upload/worker.py

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle_upload/kernel-metadata.json

      - name: Upload and start Kaggle GPU worker
        shell: bash
        run: |
          set -e

          cd kaggle_upload

          echo "========================================"
          echo "STARTING KAGGLE GPU WORKER"
          echo "========================================"

          kaggle kernels push

      - name: Monitor Kaggle worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "KAGGLE WORKER STARTED"
          echo "========================================"

          echo "SESSION_ID: $SESSION_ID"
          echo "KAGGLE KERNEL:"
          echo "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "Kaggle GPU worker has been submitted."
          echo "The worker itself maintains the Railway session."

          exit 0
