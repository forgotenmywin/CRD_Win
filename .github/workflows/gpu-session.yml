name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle requests

      # ============================================================
      # VERIFY CONFIG
      # ============================================================

      - name: Verify configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING CONFIGURATION"
          echo "========================================"

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is empty"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL is empty"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "SESSION_ID: $SESSION_ID"
          echo "API_URL: $API_URL"
          echo "WORKER_TOKEN: SET"
          echo "KAGGLE_USERNAME: $KAGGLE_USERNAME"
          echo "KAGGLE_API_TOKEN: SET"

      # ============================================================
      # CREATE KAGGLE WORKER
      # ============================================================

      - name: Create and start Kaggle GPU Worker
        run: |
          set -e

          echo "========================================"
          echo "CREATING KAGGLE GPU WORKER"
          echo "========================================"

          python kaggle_upload/create_worker.py

      # ============================================================
      # MONITOR
      # ============================================================

      - name: Monitor GPU Session
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "MONITORING WORKER"
          echo "========================================"

          for i in $(seq 1 120); do

            echo ""
            echo "[$((i * 10))s]"

            RESPONSE=$(curl -s \
              "https://${API_URL#https://}/gpu/session/${SESSION_ID}")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Session completed."
              exit 0
            fi

            if [ "$STATUS" = "stopped" ]; then
              echo "Session stopped."
              exit 0
            fi

            if [ "$STATUS" = "error" ]; then
              echo "Session error."
              exit 1
            fi

            sleep 10

          done

          echo "Monitor timeout."
