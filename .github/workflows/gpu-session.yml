name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Install Kaggle CLI
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version


      # =========================================================
      # 2. Check credentials
      # =========================================================
      - name: Check Kaggle Credentials
        run: |
          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials loaded successfully."


      # =========================================================
      # 3. Test Kaggle API
      # =========================================================
      - name: Test Kaggle API
        run: |
          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          kaggle kernels list \
            --mine \
            --page-size 1

          echo "Kaggle API authentication OK."


      # =========================================================
      # 4. Show commands file
      # =========================================================
      - name: Show Commands
        run: |
          echo "========================================"
          echo "COMMANDS TO EXECUTE ON KAGGLE"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found"
            exit 1
          fi

          cat commands.txt


      # =========================================================
      # 5. Create Kaggle GPU Kernel
      # =========================================================
      - name: Create Kaggle GPU Kernel
        run: |

          rm -rf kaggle-gpu-test
          mkdir -p kaggle-gpu-test


          # =====================================================
          # Copy commands.txt into Kaggle Kernel
          # =====================================================

          cp commands.txt kaggle-gpu-test/commands.txt


          # =====================================================
          # Create GPU Worker
          # =====================================================

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'

          import subprocess
          import sys
          import os
          import shlex


          # =====================================================
          # Command runner
          # =====================================================

          def run_command(command):

              print()
              print("=" * 80)
              print("$", command)
              print("=" * 80)

              try:

                  result = subprocess.run(
                      command,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=600
                  )

                  if result.stdout:
                      print(result.stdout)

                  if result.stderr:
                      print("STDERR:")
                      print(result.stderr)

                  print("Return code:", result.returncode)

                  return result.returncode

              except subprocess.TimeoutExpired:

                  print("ERROR: command timed out after 600 seconds")
                  return -1

              except Exception as e:

                  print("ERROR:", e)
                  return -1


          # =====================================================
          # System information
          # =====================================================

          print("=" * 80)
          print("KAGGLE GPU WORKER")
          print("=" * 80)

          print()
          print("Python:")
          print(sys.version)


          # =====================================================
          # Check commands.txt
          # =====================================================

          commands_file = "commands.txt"

          if not os.path.exists(commands_file):

              print()
              print("ERROR: commands.txt does not exist")

              sys.exit(1)


          # =====================================================
          # Read commands
          # =====================================================

          print()
          print("=" * 80)
          print("READING COMMANDS.TXT")
          print("=" * 80)


          with open(commands_file, "r", encoding="utf-8") as f:

              lines = f.readlines()


          commands = []


          for line in lines:

              line = line.strip()

              # Empty lines
              if not line:
                  continue

              # Comments
              if line.startswith("#"):
                  continue

              commands.append(line)


          print("Commands found:", len(commands))


          # =====================================================
          # Execute commands
          # =====================================================

          if not commands:

              print("No commands found.")

          else:

              for index, command in enumerate(commands, 1):

                  print()
                  print()
                  print("#" * 80)
                  print(f"# COMMAND {index} / {len(commands)}")
                  print("#" * 80)

                  run_command(command)


          # =====================================================
          # Finished
          # =====================================================

          print()
          print()
          print("=" * 80)
          print("ALL COMMANDS FINISHED")
          print("=" * 80)

          PY


          # =====================================================
          # Kaggle metadata
          # =====================================================

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "GPU Command Runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF


          echo "========================================"
          echo "KERNEL METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 6. Push Kernel to Kaggle
      # =========================================================
      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "SUBMITTING KAGGLE GPU KERNEL"
          echo "========================================"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 7. Wait for Kaggle
      # =========================================================
      - name: Wait for Kaggle Kernel
        run: |

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..20}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 20"
            echo "========================================"

            STATUS=$(kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-command-runner" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "COMPLETE"; then
              echo "Kaggle Kernel completed."
              break
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo "Kaggle Kernel reported an error."
              break
            fi

            if echo "$STATUS" | grep -q "CANCEL"; then
              echo "Kaggle Kernel was cancelled."
              break
            fi

            sleep 15

          done


      # =========================================================
      # 8. Download Kaggle output
      # =========================================================
      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output
          mkdir -p kaggle-output

          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p kaggle-output || true


      # =========================================================
      # 9. Display result
      # =========================================================
      - name: Display Kaggle Result
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          echo ""
          echo "OUTPUT FILES:"
          find kaggle-output -type f -print

          echo ""
          echo "============================================================"
          echo "COMMAND OUTPUT"
          echo "============================================================"

          if find kaggle-output -type f | grep -q .
          then
              cat kaggle-output/*
          else
              echo "No output files found."
          fi

          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
