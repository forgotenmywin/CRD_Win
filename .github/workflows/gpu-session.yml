name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 35

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle requests

          python --version
          kaggle --version


      - name: Validate environment
        run: |
          set -e

          echo "======================================"
          echo "VALIDATION"
          echo "======================================"

          test -n "$KAGGLE_USERNAME" || {
            echo "KAGGLE_USERNAME missing"
            exit 1
          }

          test -n "$KAGGLE_API_TOKEN" || {
            echo "KAGGLE_API_TOKEN missing"
            exit 1
          }

          test -n "$SESSION_ID" || {
            echo "SESSION_ID missing"
            exit 1
          }

          test -n "$API_URL" || {
            echo "API_URL missing"
            exit 1
          }

          test -n "$WORKER_TOKEN" || {
            echo "WORKER_TOKEN missing"
            exit 1
          }

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"
          echo "Token length: ${#WORKER_TOKEN}"

          echo "Validation OK."


      - name: Prepare Kaggle worker
        run: |
          set -e

          echo "======================================"
          echo "PREPARING WORKER"
          echo "======================================"

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cp worker.py kaggle_session/script.py

          export WORKER_SOURCE="kaggle_session/script.py"

          sed -i "s|%%API_URL%%|$API_URL|g" "$WORKER_SOURCE"
          sed -i "s|%%SESSION_ID%%|$SESSION_ID|g" "$WORKER_SOURCE"
          sed -i "s|%%WORKER_TOKEN%%|$WORKER_TOKEN|g" "$WORKER_SOURCE"

          echo ""
          echo "Checking placeholders..."

          if grep -q "%%API_URL%%" "$WORKER_SOURCE"; then
            echo "API_URL placeholder still exists"
            exit 1
          fi

          if grep -q "%%SESSION_ID%%" "$WORKER_SOURCE"; then
            echo "SESSION_ID placeholder still exists"
            exit 1
          fi

          if grep -q "%%WORKER_TOKEN%%" "$WORKER_SOURCE"; then
            echo "WORKER_TOKEN placeholder still exists"
            exit 1
          fi

          echo "All placeholders replaced."


      - name: Check worker syntax
        run: |
          set -e

          python -m py_compile \
            kaggle_session/script.py

          echo "Worker Python syntax OK."


      - name: Create Kaggle metadata
        run: |
          set -e

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      - name: Push Kaggle GPU worker
        run: |
          set -e

          echo "======================================"
          echo "PUSHING KAGGLE"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      - name: Wait for Railway worker
        run: |
          set +e

          echo "======================================"
          echo "WAITING FOR WORKER"
          echo "======================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"

          WORKER_READY=false

          for i in $(seq 1 300)
          do

            echo ""
            echo "CHECK $i / 300"

            RESPONSE=$(curl -sS \
              --max-time 20 \
              "$STATUS_URL")

            if [ $? -ne 0 ]; then
              echo "Railway request failed"
              sleep 5
              continue
            fi

            echo "$RESPONSE"

            READY=$(echo "$RESPONSE" | \
              grep -o '"worker_ready_at":[^,}]*' | \
              grep -v 'null')

            if [ -n "$READY" ]; then

              WORKER_READY=true

              echo ""
              echo "======================================"
              echo "WORKER READY"
              echo "======================================"

              break
            fi

            STATUS=$(echo "$RESPONSE" | \
              grep -o '"status":"[^"]*"' | \
              head -1)

            echo "Current status: $STATUS"

            sleep 5

          done

          echo ""
          echo "======================================"
          echo "FINAL"
          echo "======================================"

          echo "WORKER_READY=$WORKER_READY"

          if [ "$WORKER_READY" != "true" ]; then

            echo ""
            echo "Worker did not become ready."

            exit 1
          fi


      - name: Keep GitHub bridge alive
        if: success()
        run: |
          echo "======================================"
          echo "GPU SESSION ACTIVE"
          echo "======================================"

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"

          echo ""
          echo "Worker is connected to Railway."
          echo "Waiting..."

          for i in $(seq 1 1200)
          do
            sleep 1

            if [ $((i % 30)) -eq 0 ]; then
              echo "Bridge alive: ${i}s"
            fi
          done


      - name: Upload worker files
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: kaggle_session/
          if-no-files-found: warn
