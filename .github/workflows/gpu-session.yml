name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker Token"
        required: true
        type: string


jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL KAGGLE
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install --upgrade kaggle


      # ======================================================
      # CHECK FILES
      # ======================================================

      - name: Check repository
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING REPOSITORY"
          echo "========================================"

          echo "PWD:"
          pwd

          echo
          echo "FILES:"
          find . -maxdepth 3 -type f | sort


      # ======================================================
      # PREPARE KAGGLE WORKER
      # ======================================================

      - name: Prepare Kaggle GPU Worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE GPU WORKER"
          echo "========================================"

          rm -rf kaggle_upload

          mkdir -p kaggle_upload


          # --------------------------------------------------
          # FIND SCRIPT
          # --------------------------------------------------

          if [ -f "kaggle_worker/script.py" ]; then
            SOURCE_SCRIPT="kaggle_worker/script.py"

          elif [ -f "script.py" ]; then
            SOURCE_SCRIPT="script.py"

          else
            echo "ERROR: script.py not found"

            find . -maxdepth 4 -type f | sort

            exit 1
          fi


          echo "Using:"
          echo "$SOURCE_SCRIPT"


          # --------------------------------------------------
          # COPY SCRIPT
          # --------------------------------------------------

          cp "$SOURCE_SCRIPT" \
             kaggle_upload/script.py


          # --------------------------------------------------
          # INJECT SESSION VALUES
          # --------------------------------------------------

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("kaggle_upload/script.py")

          text = path.read_text()

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          text = text.replace(
              '__SESSION_ID__',
              session_id
          )

          text = text.replace(
              '__API_URL__',
              api_url
          )

          text = text.replace(
              '__WORKER_TOKEN__',
              worker_token
          )

          path.write_text(text)

          print("SESSION_ID injected")
          print("API_URL injected")
          print("WORKER_TOKEN injected")


          # Safety check

          final = path.read_text()

          if "__SESSION_ID__" in final:
              raise RuntimeError(
                  "SESSION_ID was NOT injected"
              )

          if "__API_URL__" in final:
              raise RuntimeError(
                  "API_URL was NOT injected"
              )

          if "__WORKER_TOKEN__" in final:
              raise RuntimeError(
                  "WORKER_TOKEN was NOT injected"
              )
          PY


          # --------------------------------------------------
          # CREATE KAGGLE METADATA
          # --------------------------------------------------

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-worker-${SESSION_ID}",
            "title": "GPU Worker ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF


          # --------------------------------------------------
          # SHOW RESULT
          # --------------------------------------------------

          echo
          echo "========================================"
          echo "KAGGLE PACKAGE"
          echo "========================================"

          find kaggle_upload \
            -maxdepth 2 \
            -type f \
            -print


          echo
          echo "METADATA:"
          cat kaggle_upload/kernel-metadata.json


          echo
          echo "SCRIPT CHECK:"

          grep -E \
            'SESSION_ID|API_URL|WORKER_TOKEN' \
            kaggle_upload/script.py || true


          # --------------------------------------------------
          # VALIDATE JSON
          # --------------------------------------------------

          python -m json.tool \
            kaggle_upload/kernel-metadata.json \
            > /dev/null

          echo
          echo "Metadata JSON: OK"


      # ======================================================
      # PUSH TO KAGGLE
      # ======================================================

      - name: Push Kaggle GPU Worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          echo "Kaggle user: ${KAGGLE_USERNAME}"

          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          if [ -z "${KAGGLE_USERNAME}" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi


          echo
          echo "Metadata:"
          cat kaggle_upload/kernel-metadata.json


          echo
          echo "Pushing..."

          kaggle kernels push \
            -p kaggle_upload


          echo
          echo "========================================"
          echo "KAGGLE WORKER PUSHED"
          echo "========================================"


      # ======================================================
      # WAIT FOR RAILWAY WORKER
      # ======================================================

      - name: Wait for worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "$STATUS_URL"

          echo "----------------------------------------"


          for i in $(seq 1 300); do

            echo "CHECK $i / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "$STATUS_URL")


            CURL_EXIT=$?


            if [ $CURL_EXIT -ne 0 ]; then

              echo "curl failed: $CURL_EXIT"

            else

              echo "$RESPONSE"

              STATUS=$(echo "$RESPONSE" | \
                python -c '
          import sys,json
          try:
              d=json.load(sys.stdin)
              print(d.get("status",""))
          except:
              print("")
          ')

              echo "Current status: $STATUS"


              if [ "$STATUS" = "active" ]; then

                echo
                echo "========================================"
                echo "GPU WORKER IS READY"
                echo "========================================"

                exit 0

              fi


              if [ "$STATUS" = "error" ]; then

                echo
                echo "========================================"
                echo "WORKER ERROR"
                echo "========================================"

                exit 1

              fi


              if [ "$STATUS" = "stopped" ]; then

                echo
                echo "GPU SESSION STOPPED"

                exit 1

              fi

            fi


            sleep 5

          done


          echo
          echo "Worker did not become ready."

          exit 1


      # ======================================================
      # KEEP ALIVE
      # ======================================================

      - name: Keep GPU session alive
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "KEEP-ALIVE LOOP"
          echo "========================================"

          echo "Session:"
          echo "$SESSION_ID"

          echo "----------------------------------------"


          while true; do

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "$API_URL/gpu/session/$SESSION_ID")


            if [ $? -ne 0 ]; then

              echo "[KEEP-ALIVE] API request failed"

              sleep 15

              continue

            fi


            STATUS=$(echo "$RESPONSE" | \
              python -c '
          import sys,json
          try:
              d=json.load(sys.stdin)
              print(d.get("status",""))
          except:
              print("")
          ')


            REMAINING=$(echo "$RESPONSE" | \
              python -c '
          import sys,json
          try:
              d=json.load(sys.stdin)
              print(d.get("remaining_seconds",""))
          except:
              print("")
          ')


            echo
            echo "[KEEP-ALIVE]"
            echo "Status: $STATUS"
            echo "Remaining: $REMAINING"


            if [ "$STATUS" = "active" ]; then

              curl \
                -sS \
                -X POST \
                --max-time 20 \
                "$API_URL/gpu/session/$SESSION_ID/heartbeat" \
                -H "Content-Type: application/json" \
                -H "X-Worker-Token: $WORKER_TOKEN" \
                -d "{\"timestamp\":$(date +%s)}" \
                || true

            fi


            if [ "$STATUS" = "error" ]; then
              echo "Session entered error state."
              exit 1
            fi


            if [ "$STATUS" = "stopped" ]; then
              echo "Session stopped."
              exit 0
            fi


            sleep 15

          done


      # ======================================================
      # UPLOAD DEBUG ARTIFACT
      # ======================================================

      - name: Upload worker files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: |
            kaggle_upload/script.py
            kaggle_upload/kernel-metadata.json
