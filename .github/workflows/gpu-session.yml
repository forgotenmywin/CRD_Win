name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:

      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 35

    env:

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}

      API_URL: ${{ inputs.api_url }}

      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repo
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          echo "Python:"
          python --version

          echo "Kaggle:"
          kaggle --version


      # ======================================================
      # VALIDATE
      # ======================================================

      - name: Validate inputs
        run: |

          set -e

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "All inputs exist."

          echo "SESSION:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"


      # ======================================================
      # BUILD KERNEL
      # ======================================================

      - name: Build Kaggle kernel
        run: |

          set -e

          rm -rf kaggle_session

          mkdir -p kaggle_session


          cp worker.py \
            kaggle_session/script.py


          # --------------------------------------------------
          # Inject values
          # --------------------------------------------------

          python - <<'PY'

          import os
          from pathlib import Path

          p = Path("kaggle_session/script.py")

          text = p.read_text()

          replacements = {
              "%%API_URL%%": os.environ["API_URL"],
              "%%SESSION_ID%%": os.environ["SESSION_ID"],
              "%%WORKER_TOKEN%%": os.environ["WORKER_TOKEN"],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text)

          PY


          # --------------------------------------------------
          # Metadata
          # --------------------------------------------------

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "========================================"
          echo "KERNEL METADATA"
          echo "========================================"

          cat kaggle_session/kernel-metadata.json


          echo ""
          echo "========================================"
          echo "SCRIPT CHECK"
          echo "========================================"

          python -m py_compile \
            kaggle_session/script.py

          echo "Python syntax OK."


          echo ""
          echo "First lines:"

          head -20 \
            kaggle_session/script.py


      # ======================================================
      # PUSH
      # ======================================================

      - name: Push Kaggle kernel
        run: |

          set -e

          echo "Pushing Kaggle kernel..."

          kaggle kernels push \
            -p kaggle_session

          echo "Push command finished."


      # ======================================================
      # WAIT
      # ======================================================

      - name: Monitor Kaggle kernel
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "========================================"
          echo "KERNEL"
          echo "========================================"

          echo "$KERNEL"


          echo ""
          echo "Waiting for Kaggle registration..."

          sleep 20


          SEEN_RUNNING=false
          WORKER_READY=false

          FINAL="UNKNOWN"


          # ==================================================
          # MONITOR 20 MINUTES
          # ==================================================

          for i in $(seq 1 240); do

            echo ""
            echo ""
            echo "########################################"
            echo "CHECK $i / 240"
            echo "########################################"


            # =================================================
            # KAGGLE STATUS
            # =================================================

            STATUS_OUTPUT="$(
              kaggle kernels status "$KERNEL" 2>&1
            )"

            STATUS_RC=$?


            echo ""
            echo "===== KAGGLE STATUS ====="

            echo "$STATUS_OUTPUT"

            echo ""
            echo "Kaggle status exit code: $STATUS_RC"


            # =================================================
            # RAILWAY STATUS
            # =================================================

            echo ""
            echo "===== RAILWAY ====="


            RAILWAY_STATUS="$(
              curl \
                -sS \
                --max-time 15 \
                "${API_URL}/gpu/session/${SESSION_ID}" \
                2>&1
            )"


            echo "$RAILWAY_STATUS"


            # =================================================
            # CHECK WORKER READY
            # =================================================

            if echo "$RAILWAY_STATUS" | grep -q \
              '"status":"active"'; then

              if [ "$WORKER_READY" = false ]; then

                echo ""
                echo "########################################"
                echo "# GPU WORKER READY                     #"
                echo "########################################"

              fi

              WORKER_READY=true

            fi


            # =================================================
            # CHECK RUNNING
            # =================================================

            if echo "$STATUS_OUTPUT" | grep -qi \
              "running"; then

              SEEN_RUNNING=true

              echo "Kaggle kernel is RUNNING."

            fi


            if echo "$STATUS_OUTPUT" | grep -qi \
              "queued"; then

              echo "Kaggle kernel is QUEUED."

            fi


            # =================================================
            # IF WORKER READY
            # =================================================

            if [ "$WORKER_READY" = true ]; then

              echo ""
              echo "Worker is alive."

              # Do NOT stop monitoring.
              # Worker needs this GitHub job alive.

            fi


            # =================================================
            # EXPLICIT KERNEL COMPLETION
            # =================================================

            if [ "$SEEN_RUNNING" = true ]; then

              if echo "$STATUS_OUTPUT" | grep -qi \
                "complete"; then

                echo ""
                echo "Kaggle kernel completed."

                FINAL="COMPLETE"

                break

              fi

            fi


            # =================================================
            # EXPLICIT ERROR
            # =================================================

            if echo "$STATUS_OUTPUT" | grep -qi \
              "error"; then

              echo ""
              echo "KAGGLE REPORTED ERROR."


              echo ""
              echo "========================================"
              echo "KERNEL LOGS"
              echo "========================================"


              kaggle kernels logs \
                "$KERNEL" \
                2>&1 \
                | tail -n 300


              FINAL="ERROR"

              break

            fi


            # =================================================
            # EXPLICIT CANCEL
            # =================================================

            if echo "$STATUS_OUTPUT" | grep -qi \
              "cancel"; then

              echo ""
              echo "Kaggle kernel cancelled."

              FINAL="CANCELLED"

              break

            fi


            sleep 5

          done


          # ==================================================
          # FINAL
          # ==================================================

          if [ "$FINAL" = "UNKNOWN" ]; then

            FINAL="TIMEOUT"

          fi


          echo ""
          echo ""
          echo "========================================"
          echo "FINAL"
          echo "========================================"

          echo "FINAL=$FINAL"

          echo "WORKER_READY=$WORKER_READY"

          echo "SEEN_RUNNING=$SEEN_RUNNING"


          # ==================================================
          # ALWAYS TRY LOGS
          # ==================================================

          mkdir -p final_output


          echo ""
          echo "========================================"
          echo "FINAL KAGGLE LOG"
          echo "========================================"


          kaggle kernels logs \
            "$KERNEL" \
            > final_output/worker.log \
            2>&1


          LOG_RC=$?


          echo "logs exit code: $LOG_RC"


          tail -n 300 \
            final_output/worker.log


          # ==================================================
          # OUTPUT
          # ==================================================

          echo ""
          echo "========================================"
          echo "KAGGLE OUTPUT"
          echo "========================================"


          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            -o \
            2>&1


          OUTPUT_RC=$?


          echo ""
          echo "output exit code: $OUTPUT_RC"


          # ==================================================
          # SESSION RESULT
          # ==================================================

          if [ -f final_output/session_result.json ]; then

            echo ""
            echo "========================================"
            echo "SESSION RESULT"
            echo "========================================"

            cat final_output/session_result.json

          else

            echo ""
            echo "No session_result.json."

          fi


          # ==================================================
          # FAIL ONLY AFTER LOGGING EVERYTHING
          # ==================================================

          if [ "$FINAL" = "ERROR" ]; then
            exit 1
          fi


          if [ "$FINAL" = "CANCELLED" ]; then
            exit 1
          fi


      # ======================================================
      # ARTIFACTS
      # ======================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
