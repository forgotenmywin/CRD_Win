name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands File
        run: |

          echo "========================================"
          echo "CHECKING COMMANDS.TXT"
          echo "========================================"

          pwd

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found!"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "commands.txt found."

          echo ""
          echo "Commands:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # 4. Check Credentials
      # =========================================================

      - name: Check Kaggle Credentials
        run: |

          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials OK."


      # =========================================================
      # 5. Test Kaggle API
      # =========================================================

      - name: Test Kaggle API
        run: |

          kaggle kernels list \
            --mine \
            --page-size 1

          echo "Kaggle API OK."


      # =========================================================
      # 6. Create Kaggle Worker
      # =========================================================

      - name: Create Kaggle GPU Worker
        run: |

          rm -rf kaggle-gpu-test
          mkdir -p kaggle-gpu-test


          # =====================================================
          # Convert commands.txt into Python list
          # =====================================================

          python3 <<'PY'
          from pathlib import Path

          commands = Path("commands.txt").read_text(
              encoding="utf-8"
          )

          worker = r'''
          import subprocess
          import sys
          import os

          print("=" * 80)
          print("KAGGLE GPU COMMAND RUNNER")
          print("=" * 80)

          print()
          print("Python:")
          print(sys.version)

          print()
          print("Current directory:")
          print(os.getcwd())

          # =====================================================
          # Commands embedded by GitHub Actions
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""

          # =====================================================
          # Parse commands
          # =====================================================

          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)

          print()
          print("=" * 80)
          print("COMMANDS LOADED")
          print("=" * 80)

          print("Commands found:", len(commands))


          # =====================================================
          # Command runner
          # =====================================================

          def run_command(command):

              print()
              print("=" * 80)
              print("$", command)
              print("=" * 80)

              try:

                  result = subprocess.run(
                      command,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=600
                  )

                  if result.stdout:
                      print(result.stdout)

                  if result.stderr:
                      print("STDERR:")
                      print(result.stderr)

                  print(
                      "Return code:",
                      result.returncode
                  )

              except subprocess.TimeoutExpired:

                  print(
                      "ERROR: command timed out after 600 seconds"
                  )

              except Exception as e:

                  print("ERROR:", e)


          # =====================================================
          # Execute commands
          # =====================================================

          if not commands:

              print("No commands found.")

          else:

              for index, command in enumerate(
                  commands,
                  1
              ):

                  print()
                  print("#" * 80)
                  print(
                      f"# COMMAND {index} / {len(commands)}"
                  )
                  print("#" * 80)

                  run_command(command)


          # =====================================================
          # Finished
          # =====================================================

          print()
          print("=" * 80)
          print("ALL COMMANDS FINISHED")
          print("=" * 80)
          '''

          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands.replace("\\", "\\\\").replace(
                  '"""',
                  '\\"\\"\\"'
              )
          )

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )

          print("GPU worker created.")
          PY


          echo ""
          echo "========================================"
          echo "WORKER CREATED"
          echo "========================================"

          ls -lh kaggle-gpu-test/

          echo ""
          echo "Worker size:"
          wc -c kaggle-gpu-test/gpu_worker.py


      # =========================================================
      # 7. Create Kaggle Metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "GPU Command Runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo ""
          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 8. Push to Kaggle
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo ""
          echo "========================================"
          echo "PUSHING KERNEL TO KAGGLE"
          echo "========================================"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 9. Wait for Kaggle
      # =========================================================

      - name: Wait for Kaggle Kernel
        run: |

          echo ""
          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..30}
          do

            echo ""
            echo "STATUS CHECK $i / 30"

            STATUS="$(
              kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-command-runner" \
              2>&1 || true
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "Kernel completed."
              break
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "Kernel reported ERROR."
              break
            fi

            if echo "$STATUS" | grep -qi "CANCEL"; then
              echo "Kernel cancelled."
              break
            fi

            sleep 10

          done


      # =========================================================
      # 10. Download Output
      # =========================================================

      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output
          mkdir -p kaggle-output

          echo "========================================"
          echo "DOWNLOADING OUTPUT"
          echo "========================================"

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p kaggle-output || true


      # =========================================================
      # 11. Display Output
      # =========================================================

      - name: Display Result
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          echo ""
          echo "Output files:"

          find kaggle-output \
            -type f \
            -print

          echo ""
          echo "============================================================"
          echo "COMMAND OUTPUT"
          echo "============================================================"

          if find kaggle-output -type f | grep -q .
          then

            for file in kaggle-output/*
            do

              echo ""
              echo "============================================================"
              echo "FILE: $file"
              echo "============================================================"

              cat "$file"

            done

          else

            echo "No output files found."

          fi

          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
