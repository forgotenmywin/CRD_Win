name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install kaggle requests

          echo "Kaggle version:"
          kaggle --version


      # ============================================================
      # VALIDATION
      # ============================================================

      - name: Validate session
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "Session: ${SESSION_ID}"
          echo "API: ${API_URL}"
          echo "Token length: ${#WORKER_TOKEN}"

          test -n "${SESSION_ID}"
          test -n "${API_URL}"
          test -n "${WORKER_TOKEN}"

          test -n "${KAGGLE_USERNAME}"
          test -n "${KAGGLE_API_TOKEN}"

          echo "Validation OK."


      # ============================================================
      # PREPARE WORKER
      # ============================================================

      - name: Prepare Kaggle Worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          if [ ! -f "kaggle_worker/script.py" ]; then
            echo "ERROR:"
            echo "kaggle_worker/script.py does not exist."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p build

          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("kaggle_worker/script.py")
          target = Path("build/script.py")

          text = source.read_text()

          replacements = {
              "%%SESSION_ID%%": os.environ["SESSION_ID"],
              "%%API_URL%%": os.environ["API_URL"].rstrip("/"),
              "%%WORKER_TOKEN%%": os.environ["WORKER_TOKEN"],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          target.write_text(text)

          print("Worker generated:", target)
          PY

          echo ""
          echo "Checking placeholders..."

          if grep -q "%%SESSION_ID%%" build/script.py; then
            echo "SESSION_ID placeholder still exists"
            exit 1
          fi

          if grep -q "%%API_URL%%" build/script.py; then
            echo "API_URL placeholder still exists"
            exit 1
          fi

          if grep -q "%%WORKER_TOKEN%%" build/script.py; then
            echo "WORKER_TOKEN placeholder still exists"
            exit 1
          fi

          echo "All placeholders replaced."


      # ============================================================
      # PYTHON SYNTAX
      # ============================================================

      - name: Validate Worker Python
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PYTHON VALIDATION"
          echo "========================================"

          python -m py_compile build/script.py

          echo "Worker Python syntax OK."


      # ============================================================
      # CREATE KAGGLE METADATA
      # ============================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat > build/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat build/kernel-metadata.json


      # ============================================================
      # PUSH TO KAGGLE
      # ============================================================

      - name: Push Kaggle GPU Worker
        shell: bash
        working-directory: build
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE"
          echo "========================================"

          kaggle kernels push -p .

          echo ""
          echo "Kaggle worker submitted."


      # ============================================================
      # WAIT FOR WORKER
      # ============================================================

      - name: Wait for Worker Ready
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "${STATUS_URL}"

          MAX_CHECKS=300
          CHECK=0

          WORKER_READY=false

          while [ "$CHECK" -lt "$MAX_CHECKS" ]; do

            CHECK=$((CHECK + 1))

            echo ""
            echo "CHECK ${CHECK} / ${MAX_CHECKS}"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            CURL_EXIT=$?

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "Railway request failed."
              echo "curl exit code: ${CURL_EXIT}"
              sleep 5
              continue
            fi

            echo "${RESPONSE}"

            STATUS=$(python -c "
          import json
          import sys

          try:
              d=json.loads(sys.argv[1])
              print(d.get('status',''))
          except Exception:
              print('')
          " "${RESPONSE}")

            echo "Current status: ${STATUS}"

            if [ "${STATUS}" = "active" ]; then

              WORKER_READY=true

              echo ""
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"

              break
            fi

            if [ "${STATUS}" = "error" ]; then

              echo ""
              echo "========================================"
              echo "RAILWAY REPORTED ERROR"
              echo "========================================"

              exit 1
            fi

            if [ "${STATUS}" = "stopped" ]; then

              echo ""
              echo "GPU SESSION STOPPED."

              exit 1
            fi

            sleep 5

          done


          if [ "${WORKER_READY}" != "true" ]; then

            echo ""
            echo "========================================"
            echo "WORKER READY TIMEOUT"
            echo "========================================"

            curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}" || true

            exit 1
          fi


      # ============================================================
      # KEEP GITHUB ACTION ALIVE
      # ============================================================

      - name: Keep Session Alive
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "KEEP-ALIVE"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          MAX_SECONDS=1200
          START_TIME=$(date +%s)

          while true; do

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Maximum session time reached."
              break
            fi

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            echo ""
            echo "[$(date '+%H:%M:%S')]"
            echo "${RESPONSE}"

            STATUS=$(python -c "
          import json
          import sys

          try:
              d=json.loads(sys.argv[1])
              print(d.get('status',''))
          except Exception:
              print('')
          " "${RESPONSE}")

            echo "Status: ${STATUS}"

            if [ "${STATUS}" = "stopped" ]; then
              echo "Session stopped."
              break
            fi

            if [ "${STATUS}" = "expired" ]; then
              echo "Session expired."
              break
            fi

            if [ "${STATUS}" = "error" ]; then
              echo "Session error."
              break
            fi

            sleep 15

          done


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Save Worker Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: |
            build/script.py
            build/kernel-metadata.json
          if-no-files-found: warn
