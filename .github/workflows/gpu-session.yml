name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          python --version
          kaggle --version

          echo "SESSION_ID=$SESSION_ID"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

      - name: Create Kaggle GPU test
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'
          import os
          import json
          import time
          import subprocess
          import traceback


          print("=" * 70)
          print("                 KAGGLE GPU TEST")
          print("=" * 70)

          print("SESSION_ID:", os.environ.get("SESSION_ID"))
          print("")


          result = {
              "status": "ERROR",
              "session_id": os.environ.get("SESSION_ID"),
              "gpu": None
          }


          try:

              # ==================================================
              # PYTHON
              # ==================================================

              print("=" * 70)
              print("PYTHON")
              print("=" * 70)

              print(
                  subprocess.check_output(
                      ["python", "--version"],
                      text=True
                  )
              )


              # ==================================================
              # NVIDIA-SMI
              # ==================================================

              print("=" * 70)
              print("NVIDIA-SMI")
              print("=" * 70)

              smi = subprocess.run(
                  ["nvidia-smi"],
                  capture_output=True,
                  text=True
              )

              print(smi.stdout)

              if smi.stderr:
                  print(smi.stderr)

              if smi.returncode != 0:

                  raise RuntimeError(
                      "nvidia-smi failed with code "
                      + str(smi.returncode)
                  )


              # ==================================================
              # NVIDIA QUERY
              # ==================================================

              print("=" * 70)
              print("GPU INFORMATION")
              print("=" * 70)

              query = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(query.stdout)


              # ==================================================
              # GPU NAME
              # ==================================================

              gpu_name = (
                  query.stdout.strip()
                  .split(",")[0]
                  .strip()
              )

              result["gpu"] = gpu_name


              # ==================================================
              # CUDA TOOLKIT CHECK
              # ==================================================

              print("=" * 70)
              print("CUDA TOOLKIT")
              print("=" * 70)

              nvcc = subprocess.run(
                  ["nvcc", "--version"],
                  capture_output=True,
                  text=True
              )

              print(nvcc.stdout)

              if nvcc.stderr:
                  print(nvcc.stderr)


              # ==================================================
              # CUDA LIBRARY CHECK
              # ==================================================

              print("=" * 70)
              print("CUDA LIBRARIES")
              print("=" * 70)

              ldconfig = subprocess.run(
                  [
                      "bash",
                      "-c",
                      "ldconfig -p 2>/dev/null | grep -i cuda | head -30"
                  ],
                  capture_output=True,
                  text=True
              )

              print(ldconfig.stdout)


              # ==================================================
              # RESULT
              # ==================================================

              result["status"] = "READY"

              print("=" * 70)
              print("GPU TEST SUCCESS")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


              # ==================================================
              # SAVE RESULT
              # ==================================================

              os.makedirs(
                  "/kaggle/working",
                  exist_ok=True
              )

              with open(
                  "/kaggle/working/session_result.json",
                  "w"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )


              # ==================================================
              # KEEP ALIVE
              # ==================================================

              print("")
              print("=" * 70)
              print("KEEPING KAGGLE WORKER ALIVE")
              print("=" * 70)

              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1
                  )

                  time.sleep(1)


          except Exception as e:

              result["status"] = "ERROR"
              result["error"] = str(e)
              result["traceback"] = traceback.format_exc()

              print("")
              print("=" * 70)
              print("GPU TEST FAILED")
              print("=" * 70)

              traceback.print_exc()


              try:

                  os.makedirs(
                      "/kaggle/working",
                      exist_ok=True
                  )

                  with open(
                      "/kaggle/working/session_result.json",
                      "w"
                  ) as f:

                      json.dump(
                          result,
                          f,
                          indent=2
                      )

              except Exception:
                  pass


              raise
          PYEOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json

      - name: Submit Kaggle GPU
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SUBMIT KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo "Kaggle kernel submitted."

      - name: Wait for Kaggle
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "======================================"
          echo "WAITING FOR KAGGLE WORKER"
          echo "======================================"

          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 180)
          do

            echo ""
            echo "CHECK $i/180"

            STATUS_OUTPUT="$(
              kaggle kernels status "$KERNEL" 2>&1
            )"

            echo "$STATUS_OUTPUT"

            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.COMPLETE"
            then
              FINAL_STATUS="COMPLETE"
              echo "KAGGLE WORKER COMPLETE"
              break
            fi

            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.ERROR"
            then
              FINAL_STATUS="ERROR"
              echo "KAGGLE WORKER ERROR"
              break
            fi

            if echo "$STATUS_OUTPUT" | grep -q "KernelWorkerStatus.CANCEL_ACKNOWLEDGED"
            then
              FINAL_STATUS="CANCELLED"
              echo "KAGGLE WORKER CANCELLED"
              break
            fi

            sleep 5

          done

          echo ""
          echo "======================================"
          echo "FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"

          if [ "$FINAL_STATUS" = "COMPLETE" ]
          then
            echo "Kaggle worker completed successfully."
            exit 0
          fi

          echo "Kaggle worker failed."

          exit 1

      - name: Download Kaggle output
        if: always()
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p final_output

          echo "======================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"

          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force \
            2>&1 || true

          echo ""
          echo "======================================"
          echo "FILES"
          echo "======================================"

          find final_output \
            -type f \
            -print \
            2>/dev/null || true

      - name: Upload Kaggle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
          retention-days: 1

      - name: Final
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
