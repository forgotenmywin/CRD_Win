name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU session ID"
        required: true
        type: string
      api_url:
        description: "Railway API URL"
        required: true
        type: string
      worker_token:
        description: "Worker token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Check configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING CONFIGURATION"
          echo "========================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
          echo "WORKER_TOKEN length=${#WORKER_TOKEN}"

          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

      - name: Build Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KAGGLE WORKER"
          echo "========================================"

          mkdir -p kaggle_build

          cp kaggle_worker.py kaggle_build/script.py

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("kaggle_build/script.py")
          text = path.read_text()

          replacements = {
              "__SESSION_ID__": os.environ["SESSION_ID"],
              "__API_URL__": os.environ["API_URL"],
              "__WORKER_TOKEN__": os.environ["WORKER_TOKEN"],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          print("Worker generated.")
          print("SESSION_ID injected:", "__SESSION_ID__" not in text)
          print("API_URL injected:", "__API_URL__" not in text)
          print("TOKEN injected:", "__WORKER_TOKEN__" not in text)
          PY

          echo
          echo "========================================"
          echo "VALIDATING INJECTION"
          echo "========================================"

          if grep -qE '__SESSION_ID__|__API_URL__|__WORKER_TOKEN__' kaggle_build/script.py; then
            echo "ERROR: Placeholder remains!"
            exit 1
          fi

          echo "All placeholders replaced."

          echo
          echo "FIRST 20 LINES:"
          sed -n '1,20p' kaggle_build/script.py

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_build/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          cat kaggle_build/kernel-metadata.json

      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING KAGGLE GPU"
          echo "========================================"

          kaggle kernels push \
            -p kaggle_build

          echo
          echo "KAGGLE WORKER STARTED"

      - name: Monitor Railway session
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "MONITORING WORKER"
          echo "========================================"

          for i in $(seq 1 150); do

            RESPONSE=$(curl -sS \
              --max-time 10 \
              "${API_URL}/gpu/session/${SESSION_ID}" 2>/dev/null)

            echo "[$((i * 2))s]"
            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=$STATUS"

            case "$STATUS" in
              completed|stopped|expired|error)
                echo "Session finished."
                break
                ;;
            esac

            sleep 2
          done
