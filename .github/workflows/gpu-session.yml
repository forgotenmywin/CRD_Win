name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Commands File
        run: |
          echo "========================================"
          echo "CHECKING COMMANDS.TXT"
          echo "========================================"

          pwd

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found!"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "commands.txt found."
          echo ""
          cat commands.txt

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      - name: Check Kaggle Credentials
        run: |
          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials OK."

      - name: Test Kaggle API
        run: |
          kaggle kernels list --mine --page-size 1

      - name: Create Kaggle Kernel
        run: |
          rm -rf kaggle-gpu-test
          mkdir -p kaggle-gpu-test

          cp commands.txt kaggle-gpu-test/commands.txt

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'
          import subprocess
          import sys
          import os

          print("=" * 80)
          print("KAGGLE GPU COMMAND RUNNER")
          print("=" * 80)

          print("Python:")
          print(sys.version)

          print()
          print("Current directory:")
          print(os.getcwd())

          print()
          print("Script:")
          print(os.path.abspath(__file__))

          script_dir = os.path.dirname(os.path.abspath(__file__))
          commands_file = os.path.join(script_dir, "commands.txt")

          print()
          print("Commands file:")
          print(commands_file)

          if not os.path.isfile(commands_file):
              print()
              print("ERROR: commands.txt NOT FOUND")
              print()
              print("Available files:")

              try:
                  for name in os.listdir(script_dir):
                      print("-", name)
              except Exception as e:
                  print("Directory error:", e)

              sys.exit(1)

          print()
          print("commands.txt FOUND")

          with open(commands_file, "r", encoding="utf-8") as f:
              lines = f.readlines()

          commands = []

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)

          print()
          print("Commands found:", len(commands))

          def run_command(command):
              print()
              print("=" * 80)
              print("$", command)
              print("=" * 80)

              try:
                  result = subprocess.run(
                      command,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=600
                  )

                  if result.stdout:
                      print(result.stdout)

                  if result.stderr:
                      print("STDERR:")
                      print(result.stderr)

                  print("Return code:", result.returncode)

              except subprocess.TimeoutExpired:
                  print("ERROR: command timed out")

              except Exception as e:
                  print("ERROR:", e)

          for index, command in enumerate(commands, 1):
              print()
              print("#" * 80)
              print("# COMMAND", index, "/", len(commands))
              print("#" * 80)

              run_command(command)

          print()
          print("=" * 80)
          print("ALL COMMANDS FINISHED")
          print("=" * 80)
          PY

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "GPU Command Runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo ""
          echo "Kaggle files:"
          find kaggle-gpu-test -maxdepth 1 -type f -print

      - name: Push GPU Kernel
        run: |
          echo "Submitting kernel..."

          kaggle kernels push -p kaggle-gpu-test

      - name: Wait for Kaggle
        run: |
          for i in {1..30}
          do
            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 30"
            echo "========================================"

            STATUS="$(kaggle kernels status "${KAGGLE_USERNAME}/gpu-command-runner" 2>&1 || true)"

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "Kernel completed."
              break
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "Kernel error."
              break
            fi

            if echo "$STATUS" | grep -qi "CANCEL"; then
              echo "Kernel cancelled."
              break
            fi

            sleep 10
          done

      - name: Download Kaggle Output
        run: |
          rm -rf kaggle-output
          mkdir -p kaggle-output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p kaggle-output || true

      - name: Display Result
        run: |
          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"

          echo ""
          echo "Output files:"

          find kaggle-output -type f -print

          echo ""
          echo "============================================================"
          echo "COMMAND OUTPUT"
          echo "============================================================"

          if find kaggle-output -type f | grep -q .
          then
            for file in kaggle-output/*
            do
              echo ""
              echo "============================================================"
              echo "FILE: $file"
              echo "============================================================"

              cat "$file"
            done
          else
            echo "No output files found."
          fi

          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
