name: Kaggle GPU Auto Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Check Kaggle Authentication
        run: |
          echo "Kaggle username: $KAGGLE_USERNAME"
          kaggle --version
          kaggle kernels list --mine --page-size 1

      - name: Create GPU Kernel
        run: |
          mkdir -p kaggle-gpu-test

          cat > kaggle-gpu-test/gpu_test.py <<'PY'
          import subprocess

          print("=" * 70)
          print("KAGGLE GPU TEST")
          print("=" * 70)

          commands = [
              "nvidia-smi -L",
              "nvidia-smi",
              "lspci | grep -i nvidia"
          ]

          for command in commands:
              print()
              print("=" * 70)
              print("$ " + command)
              print("=" * 70)

              result = subprocess.run(
                  command,
                  shell=True,
                  capture_output=True,
                  text=True
              )

              print(result.stdout)

              if result.stderr:
                  print("STDERR:")
                  print(result.stderr)

          print()
          print("=" * 70)
          print("GPU TEST FINISHED")
          print("=" * 70)
          PY

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-auto-test",
            "title": "GPU Auto Test",
            "code_file": "gpu_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          cat kaggle-gpu-test/kernel-metadata.json

      - name: Push Kernel to Kaggle
        run: |
          kaggle kernels push -p kaggle-gpu-test

      - name: Wait for Kaggle
        run: |
          for i in {1..20}; do
            echo "========== CHECK $i/20 =========="

            kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-auto-test" || true

            sleep 15
          done

      - name: Download Kaggle Output
        run: |
          mkdir -p kaggle-output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-auto-test" \
            -p kaggle-output || true

      - name: Display GPU Result
        run: |
          echo "========================================"
          echo "KAGGLE GPU RESULT"
          echo "========================================"

          find kaggle-output -type f -print

          echo ""
          cat kaggle-output/* 2>/dev/null || true
