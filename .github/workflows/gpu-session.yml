name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          echo "Kaggle CLI:"
          kaggle --version

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          echo "SESSION_ID: ${SESSION_ID}"
          echo "API_URL: ${API_URL}"

          if [ -z "${SESSION_ID}" ]; then
            echo "ERROR: SESSION_ID is empty"
            exit 1
          fi

          if [ -z "${API_URL}" ]; then
            echo "ERROR: API_URL is empty"
            exit 1
          fi

          if [ -z "${WORKER_TOKEN}" ]; then
            echo "ERROR: WORKER_TOKEN is empty"
            exit 1
          fi

          if [ -z "${KAGGLE_USERNAME}" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Validation OK."

      # ============================================================
      # PREPARE KAGGLE SCRIPT
      # ============================================================

      - name: Prepare Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE WORKER"
          echo "========================================"

          test -f kaggle_worker/script.py

          echo "Template found:"
          ls -lh kaggle_worker/script.py

          mkdir -p build

          cp kaggle_worker/script.py build/script.py

          # Use Python for replacement instead of sed.
          # This avoids problems with URLs, tokens and special characters.

          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("build/script.py")
          text = source.read_text(encoding="utf-8")

          replacements = {
              "__SESSION_ID__": os.environ["SESSION_ID"],
              "__API_URL__": os.environ["API_URL"].rstrip("/"),
              "__WORKER_TOKEN__": os.environ["WORKER_TOKEN"],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          source.write_text(text, encoding="utf-8")

          # Verify that no placeholders remain.
          remaining = [
              x for x in [
                  "__SESSION_ID__",
                  "__API_URL__",
                  "__WORKER_TOKEN__"
              ]
              if x in text
          ]

          if remaining:
              raise RuntimeError(
                  "Placeholders were not replaced: "
                  + ", ".join(remaining)
              )

          # Do not print the token.
          print("SESSION_ID injected:", os.environ["SESSION_ID"])
          print("API_URL injected:", os.environ["API_URL"])
          print("WORKER_TOKEN injected: YES")
          print("Worker script prepared successfully.")
          PY

          echo
          echo "Checking Python syntax..."

          python -m py_compile build/script.py

          echo "Python syntax OK."

          echo
          echo "Checking injected values..."

          grep -q "__SESSION_ID__" build/script.py && {
            echo "ERROR: SESSION_ID placeholder remains"
            exit 1
          } || true

          grep -q "__API_URL__" build/script.py && {
            echo "ERROR: API_URL placeholder remains"
            exit 1
          } || true

          grep -q "__WORKER_TOKEN__" build/script.py && {
            echo "ERROR: WORKER_TOKEN placeholder remains"
            exit 1
          } || true

          echo "Injection validation OK."

      # ============================================================
      # CREATE KAGGLE METADATA
      # ============================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          mkdir -p kaggle_upload

          cp build/script.py kaggle_upload/script.py

          cat > kaggle_upload/dataset-metadata.json <<EOF
          {
            "title": "GPU Session ${SESSION_ID}",
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "licenses": [
              {
                "name": "CC0-1.0"
              }
            ]
          }
          EOF

          echo "Kaggle metadata created."

          cat kaggle_upload/dataset-metadata.json

      # ============================================================
      # PUSH KAGGLE SCRIPT
      # ============================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          mkdir -p ~/.kaggle

          # Kaggle CLI supports KAGGLE_API_TOKEN directly.
          export KAGGLE_API_TOKEN="${KAGGLE_API_TOKEN}"

          echo "Kaggle user: ${KAGGLE_USERNAME}"

          # Remove old local auth files if any.
          rm -f ~/.kaggle/kaggle.json
          rm -f ~/.kaggle/access_token

          # Push the notebook/script.
          kaggle kernels push \
            -p kaggle_upload

          echo
          echo "Kaggle worker submitted."

      # ============================================================
      # WAIT FOR WORKER
      # ============================================================

      - name: Wait for GPU worker
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "${STATUS_URL}"

          echo "----------------------------------------"

          for i in $(seq 1 300); do

            echo "CHECK ${i} / 300"

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --max-time 15 \
              "${STATUS_URL}")

            CURL_CODE=$?

            if [ ${CURL_CODE} -ne 0 ]; then
              echo "Status request failed: curl=${CURL_CODE}"
              sleep 5
              continue
            fi

            echo "${RESPONSE}"

            STATUS=$(python -c '
          import json
          import sys

          try:
              data=json.loads(sys.stdin.read())
              print(data.get("status","unknown"))
          except Exception:
              print("unknown")
          ' <<< "${RESPONSE}")

            echo "Current status: ${STATUS}"

            if [ "${STATUS}" = "active" ]; then
              echo
              echo "========================================"
              echo "GPU WORKER IS READY"
              echo "========================================"
              exit 0
            fi

            if [ "${STATUS}" = "error" ]; then
              echo
              echo "========================================"
              echo "GPU WORKER FAILED"
              echo "========================================"
              exit 1
            fi

            if [ "${STATUS}" = "stopped" ]; then
              echo "Worker stopped."
              exit 1
            fi

            if [ "${STATUS}" = "expired" ]; then
              echo "Session expired."
              exit 1
            fi

            sleep 5
          done

          echo
          echo "Worker did not become ready within timeout."
          exit 1

      # ============================================================
      # KEEP GITHUB JOB ALIVE
      # ============================================================

      - name: Keep workflow alive
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WORKER KEEP-ALIVE"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          while true; do

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --max-time 15 \
              "${STATUS_URL}")

            echo
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
            echo "${RESPONSE}"

            STATUS=$(python -c '
          import json
          import sys

          try:
              data=json.loads(sys.stdin.read())
              print(data.get("status","unknown"))
          except Exception:
              print("unknown")
          ' <<< "${RESPONSE}")

            echo "Session status: ${STATUS}"

            case "${STATUS}" in

              active)
                echo "GPU session still active."
                ;;

              stopped)
                echo "GPU session stopped."
                exit 0
                ;;

              expired)
                echo "GPU session expired."
                exit 0
                ;;

              error)
                echo "GPU session entered error state."
                exit 1
                ;;

              *)
                echo "Session state: ${STATUS}"
                ;;

            esac

            sleep 30

          done

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload worker source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-worker-${{ inputs.session_id }}
          path: |
            build/script.py
            kaggle_upload/dataset-metadata.json
          if-no-files-found: ignore
