name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:

    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # CHECK COMMANDS
      # =========================================================

      - name: Check commands.txt
        run: |

          echo "========================================"
          echo "COMMANDS"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found"
            exit 1
          fi

          echo ""
          cat commands.txt


      # =========================================================
      # INSTALL KAGGLE
      # =========================================================

      - name: Install Kaggle
        run: |

          python -m pip install --upgrade pip

          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # AUTH TEST
      # =========================================================

      - name: Test Kaggle Authentication
        run: |

          echo "========================================"
          echo "KAGGLE AUTH"
          echo "========================================"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Testing API..."

          kaggle kernels list \
            --mine \
            --page-size 5


      # =========================================================
      # CREATE UNIQUE KERNEL NAME
      # =========================================================

      - name: Create Unique Kernel ID
        run: |

          echo "========================================"
          echo "CREATING UNIQUE KERNEL"
          echo "========================================"

          KERNEL_SLUG="gpu-command-runner-${GITHUB_RUN_ID}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # CREATE DIRECTORY
      # =========================================================

      - name: Create Kernel Directory
        run: |

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test


      # =========================================================
      # CREATE GPU WORKER
      # =========================================================

      - name: Create GPU Worker
        run: |

          python3 <<'PY'

          from pathlib import Path

          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )

          worker = r'''
          import os
          import sys
          import subprocess
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # OUTPUT
          # =====================================================

          result = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          def out(text=""):

              print(
                  text,
                  flush=True
              )

              result.write(
                  str(text) + "\n"
              )

              result.flush()


          # =====================================================
          # HEADER
          # =====================================================

          out("=" * 80)
          out("KAGGLE GPU COMMAND RUNNER")
          out("=" * 80)

          out()
          out("Python:")
          out(sys.version)

          out()
          out("Working directory:")
          out(os.getcwd())

          out()


          # =====================================================
          # COMMANDS
          # =====================================================

          COMMANDS = """COMMANDS_PLACEHOLDER"""


          commands = []

          for line in COMMANDS.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          out("=" * 80)
          out("COMMANDS LOADED")
          out("=" * 80)

          out(
              "Total commands: "
              + str(len(commands))
          )


          # =====================================================
          # RUN COMMAND
          # =====================================================

          def run_command(
              command,
              number,
              total
          ):

              out()
              out("#" * 80)

              out(
                  "COMMAND "
                  + str(number)
                  + " / "
                  + str(total)
              )

              out("#" * 80)

              out()
              out("$ " + command)

              out()
              out("=" * 80)


              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      out(
                          line.rstrip()
                      )


                  code = process.wait()


                  out()
                  out(
                      "Return code: "
                      + str(code)
                  )


              except Exception:

                  out()
                  out("COMMAND ERROR")

                  out(
                      traceback.format_exc()
                  )


          # =====================================================
          # EXECUTE
          # =====================================================

          for number, command in enumerate(
              commands,
              1
          ):

              run_command(
                  command,
                  number,
                  len(commands)
              )


          # =====================================================
          # GPU SUMMARY
          # =====================================================

          out()
          out("=" * 80)
          out("GPU COMMAND RUNNER FINISHED")
          out("=" * 80)


          result.close()

          '''


          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )

          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )

          print("GPU worker created.")

          PY


      # =========================================================
      # METADATA
      # =========================================================

      - name: Create Kernel Metadata
        run: |

          echo "========================================"
          echo "CREATING METADATA"
          echo "========================================"

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaP100"
          }
          EOF

          echo ""
          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # PUSH
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "PUSHING GPU KERNEL"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # WAIT
      # =========================================================

      - name: Wait For GPU
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          FINISHED=false

          for i in {1..60}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 60"
            echo "========================================"

            STATUS=$(

              kaggle kernels status \
                "$KERNEL" \
                2>&1

            ) || true

            echo "$STATUS"


            if echo "$STATUS" | grep -q "COMPLETE"; then

              echo ""
              echo "GPU JOB COMPLETE"

              FINISHED=true

              break

            fi


            if echo "$STATUS" | grep -qi "ERROR"; then

              echo ""
              echo "GPU JOB ERROR"

              break

            fi


            if echo "$STATUS" | grep -qi "FAILED"; then

              echo ""
              echo "GPU JOB FAILED"

              break

            fi


            sleep 10

          done


          if [ "$FINISHED" = "false" ]; then

            echo ""
            echo "WARNING: TIMEOUT WAITING FOR KAGGLE"

          fi


      # =========================================================
      # DOWNLOAD OUTPUT
      # =========================================================

      - name: Download GPU Result
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "DOWNLOADING RESULT"
          echo "========================================"

          rm -rf kaggle-output

          mkdir -p kaggle-output


          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output \
            -o \
          || true


          echo ""
          echo "OUTPUT FILES"

          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # SHOW RESULT
      # =========================================================

      - name: Show Result
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                    GPU RESULT                            #"
          echo "############################################################"

          if [ -f kaggle-output/result.txt ]; then

            cat kaggle-output/result.txt

          else

            echo "result.txt was not found."

            echo ""
            echo "Downloaded files:"

            find kaggle-output \
              -type f \
              -print

          fi


      # =========================================================
      # SAVE ARTIFACT
      # =========================================================

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn


      # =========================================================
      # DELETE KERNEL
      # =========================================================

      - name: Delete Temporary Kernel
        if: always()
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "DELETING TEMPORARY KERNEL"
          echo "========================================"

          kaggle kernels delete \
            "$KERNEL" \
            --yes \
          || true

          echo ""
          echo "Temporary kernel cleanup finished."
