name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:

    inputs:

      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 35


    env:

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}

      API_URL: ${{ inputs.api_url }}

      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:


      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ====================================================
      # PYTHON
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ====================================================
      # INSTALL
      # ====================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          kaggle --version


      # ====================================================
      # VALIDATE
      # ====================================================

      - name: Validate
        run: |

          set -e

          test -n "$KAGGLE_USERNAME"

          test -n "$KAGGLE_API_TOKEN"

          test -n "$SESSION_ID"

          test -n "$API_URL"

          test -n "$WORKER_TOKEN"

          echo "Validation OK."


      # ====================================================
      # BUILD KERNEL
      # ====================================================

      - name: Build kernel
        run: |

          set -e

          rm -rf kaggle_session

          mkdir -p kaggle_session


          cp worker.py \
            kaggle_session/script.py


          python - <<'PY'

          import os
          from pathlib import Path

          p = Path("kaggle_session/script.py")

          text = p.read_text()

          text = text.replace(
              "%%API_URL%%",
              os.environ["API_URL"]
          )

          text = text.replace(
              "%%SESSION_ID%%",
              os.environ["SESSION_ID"]
          )

          text = text.replace(
              "%%WORKER_TOKEN%%",
              os.environ["WORKER_TOKEN"]
          )

          p.write_text(text)

          PY


          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          python -m py_compile \
            kaggle_session/script.py


          echo "Kernel built successfully."


      # ====================================================
      # PUSH TO KAGGLE
      # ====================================================

      - name: Push Kaggle kernel
        run: |

          set -e

          echo "======================================"

          echo "PUSHING KAGGLE WORKER"

          echo "======================================"


          kaggle kernels push \
            -p kaggle_session


          echo ""

          echo "Kaggle kernel submitted."

          echo ""

          echo "We will NOT use"

          echo "kaggle kernels status"

          echo "because that endpoint is returning 404."


      # ====================================================
      # WAIT FOR WORKER
      # ====================================================

      - name: Wait for GPU worker
        run: |

          set +e


          echo ""

          echo "======================================"

          echo "WAITING FOR RAILWAY WORKER"

          echo "======================================"


          READY=false


          for i in $(seq 1 300); do


            echo ""

            echo "CHECK $i / 300"


            RESPONSE="$(
              curl \
                -sS \
                --max-time 15 \
                "${API_URL}/gpu/session/${SESSION_ID}" \
                2>&1
            )"


            echo "$RESPONSE"


            if echo "$RESPONSE" | grep -q \
              '"status":"active"'; then


              echo ""

              echo "======================================"

              echo "GPU WORKER IS READY"

              echo "======================================"


              READY=true

              break

            fi


            if echo "$RESPONSE" | grep -q \
              '"status":"error"'; then


              echo ""

              echo "Railway reported worker error."

              break

            fi


            sleep 5

          done


          if [ "$READY" != true ]; then

            echo ""

            echo "Worker did not become ready."

            exit 1

          fi


      # ====================================================
      # KEEP GITHUB JOB ALIVE
      # ====================================================

      - name: Keep worker alive
        run: |

          set +e


          echo ""

          echo "======================================"

          echo "WORKER ACTIVE"

          echo "======================================"


          for i in $(seq 1 600); do


            RESPONSE="$(
              curl \
                -sS \
                --max-time 15 \
                "${API_URL}/gpu/session/${SESSION_ID}" \
                2>&1
            )


            echo "[$i] $RESPONSE"


            if echo "$RESPONSE" | grep -q \
              '"status":"expired"'; then

              echo "Session expired."

              break

            fi


            if echo "$RESPONSE" | grep -q \
              '"status":"stopped"'; then

              echo "Session stopped."

              break

            fi


            sleep 2

          done


      # ====================================================
      # ARTIFACT
      # ====================================================

      - name: Upload worker source
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: gpu-session-${{ inputs.session_id }}

          path: kaggle_session/

          if-no-files-found: warn
