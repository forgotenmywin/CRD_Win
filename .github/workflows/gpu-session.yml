name: Kaggle Permission Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version

      - name: Check Secrets
        run: |
          echo "========================================"
          echo "CHECK SECRETS"
          echo "========================================"

          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME EMPTY"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN EMPTY"
            exit 1
          fi

          echo ""
          echo "Secrets OK."

      - name: Test Kaggle API
        run: |
          echo "========================================"
          echo "TEST 1 - KAGGLE API"
          echo "========================================"

          set +e

          kaggle kernels list \
            --mine \
            --page-size 5

          CODE=$?

          set -e

          echo ""
          echo "Return code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "Kaggle API test FAILED."
            exit "$CODE"
          fi

          echo ""
          echo "Kaggle API test SUCCESS."

      - name: Create Test Kernel
        run: |
          echo "========================================"
          echo "TEST 2 - CREATE KERNEL"
          echo "========================================"

          rm -rf test-kernel

          mkdir test-kernel

          SLUG="permission-test-${GITHUB_RUN_ID}"

          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

          cat > test-kernel/test.py <<'PY'
          print("=" * 60)
          print("KAGGLE API TEST KERNEL")
          print("=" * 60)
          print("Kernel creation worked.")
          PY

          cat > test-kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${SLUG}",
            "title": "${SLUG}",
            "code_file": "test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": false,
            "enable_gpu": false
          }
          EOF

          echo ""
          echo "Files:"
          find test-kernel -type f -maxdepth 1 -print

          echo ""
          echo "Metadata:"
          cat test-kernel/kernel-metadata.json

      - name: Push Test Kernel
        run: |
          echo "========================================"
          echo "TEST 3 - SAVE KERNEL"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${SLUG}"

          echo ""

          set +e

          kaggle kernels push \
            -p test-kernel

          CODE=$?

          set -e

          echo ""
          echo "SaveKernel return code: $CODE"

          if [ "$CODE" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "SAVE KERNEL FAILED"
            echo "========================================"

            exit "$CODE"
          fi

          echo ""
          echo "========================================"
          echo "SAVE KERNEL SUCCESS"
          echo "========================================"

      - name: Finished
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "TEST FINISHED"
          echo "========================================"

          echo ""
          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${SLUG:-not-created}"
