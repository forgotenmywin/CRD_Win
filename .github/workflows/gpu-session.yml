name: Kaggle GPU Session
run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Public GPU API URL"
        required: true
        type: string
      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip kaggle requests
          python --version
          kaggle --version

      - name: Validate inputs
        run: |
          [ -z "$KAGGLE_USERNAME"  ] && { echo "KAGGLE_USERNAME missing";  exit 1; }
          [ -z "$KAGGLE_API_TOKEN" ] && { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          [ -z "$SESSION_ID"       ] && { echo "SESSION_ID missing";       exit 1; }
          [ -z "$API_URL"          ] && { echo "API_URL missing";          exit 1; }
          [ -z "$WORKER_TOKEN"     ] && { echo "WORKER_TOKEN missing";     exit 1; }
          echo "OK -- SESSION=$SESSION_ID  API=$API_URL"

      - name: Build Kaggle kernel
        run: |
          mkdir -p kaggle_session

          cp worker.py kaggle_session/script.py
          sed -i "s|%%API_URL%%|${API_URL}|g"           kaggle_session/script.py
          sed -i "s|%%SESSION_ID%%|${SESSION_ID}|g"     kaggle_session/script.py
          sed -i "s|%%WORKER_TOKEN%%|${WORKER_TOKEN}|g" kaggle_session/script.py

          jq -n \
            --arg u "$KAGGLE_USERNAME" \
            --arg s "$SESSION_ID" \
            '{
              id:              ($u + "/gpu-session-" + $s),
              title:           ("GPU Session " + $s),
              code_file:       "script.py",
              language:        "python",
              kernel_type:     "script",
              is_private:      true,
              enable_gpu:      true,
              enable_tpu:      false,
              enable_internet: true
            }' > kaggle_session/kernel-metadata.json

          echo "--- kernel-metadata.json ---"
          cat kaggle_session/kernel-metadata.json
          echo "--- script.py (first 5 lines) ---"
          head -5 kaggle_session/script.py

      - name: Push Kaggle kernel
        run: |
          kaggle kernels push -p kaggle_session
          echo "Submitted to Kaggle."

      - name: Wait for Kaggle kernel
        run: |
          set +e
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"
          echo "Kernel: $KERNEL"

          # ── BUG FIX: after push, Kaggle may still show OLD "complete" status.
          # Wait 30s for Kaggle to register the new run as "queued" or "running".
          echo "Waiting 30s for Kaggle to register new kernel run..."
          sleep 30

          # ── We require seeing queued/running BEFORE accepting complete.
          # This prevents false-positive "complete" from a previous kernel version.
          SEEN_ACTIVE=false
          FINAL="UNKNOWN"

          for i in $(seq 1 300); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "[$i/300] $STATUS"

            if echo "$STATUS" | grep -qiE "queued|running"; then
              SEEN_ACTIVE=true
            fi

            if $SEEN_ACTIVE && echo "$STATUS" | grep -qi "complete"; then
              FINAL="COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -qiE "error|fail"; then
              FINAL="ERROR"
              break
            fi

            if echo "$STATUS" | grep -qi "cancel"; then
              FINAL="CANCELLED"
              break
            fi

            sleep 5
          done

          if [ "$FINAL" = "UNKNOWN" ]; then
            echo "Timed out waiting for Kaggle kernel."
            FINAL="TIMEOUT"
          fi

          echo "FINAL: $FINAL"

          mkdir -p final_output
          kaggle kernels output "$KERNEL" -p final_output -o || echo "output download failed"

          if [ -f final_output/session_result.json ]; then
            echo "--- session_result.json ---"
            cat final_output/session_result.json
          else
            echo "session_result.json not found"
          fi

          LOG="final_output/worker.log"
          kaggle kernels logs "$KERNEL" > "$LOG" 2>&1 || true
          echo "--- last 200 log lines ---"
          tail -n 200 "$LOG" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn
