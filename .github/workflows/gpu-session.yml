name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands
        run: |

          echo "========================================"
          echo "CHECKING commands.txt"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found!"
            echo ""
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "commands.txt found."
          echo ""
          echo "Commands:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # 4. Check Authentication
      # =========================================================

      - name: Check Kaggle Authentication
        run: |

          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials OK."


      # =========================================================
      # 5. Test API
      # =========================================================

      - name: Test Kaggle API
        run: |

          kaggle kernels list \
            --mine \
            --page-size 1

          echo ""
          echo "Kaggle API connection OK."


      # =========================================================
      # 6. Create Worker
      # =========================================================

      - name: Create GPU Worker
        run: |

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test


          # -----------------------------------------------------
          # Read commands.txt
          # -----------------------------------------------------

          python3 <<'PY'

          from pathlib import Path

          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )


          # -----------------------------------------------------
          # Python Worker
          # -----------------------------------------------------

          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # Result writer
          # =====================================================

          result_file = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          def output(text=""):

              print(text, flush=True)

              result_file.write(
                  str(text) + "\n"
              )

              result_file.flush()


          # =====================================================
          # Header
          # =====================================================

          output("=" * 80)
          output("KAGGLE GPU COMMAND RUNNER")
          output("=" * 80)

          output()

          output("Python:")
          output(sys.version)

          output()

          output("Current directory:")
          output(os.getcwd())

          output()


          # =====================================================
          # Embedded commands
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""


          # =====================================================
          # Parse commands
          # =====================================================

          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          output("=" * 80)
          output("COMMANDS LOADED")
          output("=" * 80)

          output(
              "Number of commands: "
              + str(len(commands))
          )


          # =====================================================
          # Execute command
          # =====================================================

          def run_command(command):

              output()
              output("=" * 80)
              output("$ " + command)
              output("=" * 80)

              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  # ---------------------------------------------
                  # Stream output
                  # ---------------------------------------------

                  for line in process.stdout:

                      output(
                          line.rstrip()
                      )


                  return_code = process.wait()


                  output()

                  output(
                      "Return code: "
                      + str(return_code)
                  )


              except Exception:

                  output(
                      "COMMAND ERROR"
                  )

                  output(
                      traceback.format_exc()
                  )


          # =====================================================
          # Run all commands
          # =====================================================

          if not commands:

              output()
              output("No commands found.")


          else:

              for index, command in enumerate(
                  commands,
                  1
              ):

                  output()
                  output("#" * 80)

                  output(
                      "# COMMAND "
                      + str(index)
                      + " / "
                      + str(len(commands))
                  )

                  output("#" * 80)

                  run_command(command)


          # =====================================================
          # Finish
          # =====================================================

          output()
          output("=" * 80)
          output("ALL COMMANDS FINISHED")
          output("=" * 80)

          result_file.close()

          '''

          # -----------------------------------------------------
          # Insert commands
          # -----------------------------------------------------

          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )

          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )


          # -----------------------------------------------------
          # Write worker
          # -----------------------------------------------------

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )


          print(
              "gpu_worker.py created."
          )

          PY


          echo ""
          echo "========================================"
          echo "WORKER CREATED"
          echo "========================================"

          ls -lh kaggle-gpu-test/

          echo ""
          echo "Worker size:"

          wc -c \
            kaggle-gpu-test/gpu_worker.py


      # =========================================================
      # 7. Kaggle Metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-command-runner",
            "title": "GPU Command Runner",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo ""
          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 8. Push Kernel
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo ""
          echo "========================================"
          echo "PUSHING TO KAGGLE"
          echo "========================================"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 9. Wait
      # =========================================================

      - name: Wait for Kaggle
        run: |

          echo ""
          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          COMPLETED=false

          for i in {1..30}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 30"
            echo "========================================"

            STATUS="$(
              kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-command-runner" \
              2>&1 || true
            )"

            echo "$STATUS"


            if echo "$STATUS" | grep -qi "COMPLETE"
            then

              echo ""
              echo "Kaggle Kernel completed."

              COMPLETED=true

              break

            fi


            if echo "$STATUS" | grep -qi "ERROR"
            then

              echo ""
              echo "Kaggle Kernel reported ERROR."

              break

            fi


            if echo "$STATUS" | grep -qi "CANCEL"
            then

              echo ""
              echo "Kaggle Kernel cancelled."

              break

            fi


            sleep 10

          done


      # =========================================================
      # 10. Download Output
      # =========================================================

      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output

          mkdir -p kaggle-output

          echo ""
          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-command-runner" \
            -p kaggle-output || true


          echo ""
          echo "Downloaded files:"

          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # 11. Display Result
      # =========================================================

      - name: Display Command Results
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"


          echo ""
          echo "Files returned from Kaggle:"
          echo "------------------------------------------------------------"

          find kaggle-output \
            -type f \
            -print


          echo ""
          echo "============================================================"
          echo "RESULT.TXT"
          echo "============================================================"


          RESULT="kaggle-output/result.txt"


          if [ -f "$RESULT" ]; then

            cat "$RESULT"

          else

            echo "result.txt was not found."

            echo ""
            echo "Full Kaggle output:"
            echo "------------------------------------------------------------"

            find kaggle-output \
              -type f \
              -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"
