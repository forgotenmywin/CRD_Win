name: Kaggle GPU Session
run-name: GPU-SESSION-${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string
      api_url:
        description: "Public GPU API URL"
        required: true
        type: string
      worker_token:
        description: "Worker authentication token"
        required: true
        type: string
jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle requests
          echo ""
          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"
          python --version
          kaggle --version
          echo ""
          echo "======================================"
          echo "CHECK KAGGLE VARIABLES"
          echo "======================================"
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is missing"
            exit 1
          fi
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is missing"
            exit 1
          fi
          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is missing"
            exit 1
          fi
          echo "KAGGLE USERNAME: $KAGGLE_USERNAME"
          echo "SESSION: $SESSION_ID"
      - name: Create Kaggle GPU worker
        shell: bash
        run: |
          set -e
          rm -rf kaggle_session
          mkdir -p kaggle_session

          cp worker.py kaggle_session/script.py

          cat > kaggle_session/config.json <<EOF
          {"api_url":"${API_URL}","session_id":"${SESSION_ID}","worker_token":"${WORKER_TOKEN}"}
          EOF

          echo ""
          echo "======================================"
          echo "CONFIG.JSON"
          echo "======================================"
          cat kaggle_session/config.json

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          echo "======================================"
          echo "KAGGLE WORKER CREATED"
          echo "======================================"
          cat kaggle_session/kernel-metadata.json
      - name: Push Kaggle GPU worker
        shell: bash
        run: |
          set -e
          echo ""
          echo "======================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "======================================"
          kaggle kernels push -p kaggle_session
          echo ""
          echo "Kaggle worker submitted."
      - name: Wait for Kaggle to start
        shell: bash
        run: |
          set +e
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "WAITING FOR KAGGLE TO START"
          echo "======================================"
          echo "Kernel: $KERNEL"

          for i in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "[$i/60] $STATUS"

            if echo "$STATUS" | grep -qi "running"; then
              echo ""
              echo "KAGGLE KERNEL IS RUNNING!"
              echo "Worker is alive on Kaggle and connecting to API..."
              exit 0
            fi

            if echo "$STATUS" | grep -qi "error"; then
              echo "KAGGLE KERNEL ERROR"
              exit 1
            fi

            if echo "$STATUS" | grep -qi "cancel"; then
              echo "KAGGLE KERNEL CANCELLED"
              exit 1
            fi

            sleep 5
          done

          echo "Timeout waiting for kernel to start, but it may still be starting..."
          exit 0
      - name: Final
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "GPU SESSION STARTED"
          echo "======================================"
          echo ""
          echo "SESSION_ID: $SESSION_ID"
          echo "API_URL: $API_URL"
          echo ""
          echo "The Kaggle worker is now running independently."
          echo "It will connect to the API and stay alive until the session expires."
