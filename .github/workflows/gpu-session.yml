name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests \
            numpy \
            numba

          echo "======================================"
          echo "        ENVIRONMENT CHECK"
          echo "======================================"

          python --version
          kaggle --version

          echo ""
          echo "KAGGLE_USERNAME:"
          if [ -n "$KAGGLE_USERNAME" ]; then
            echo "OK"
          else
            echo "MISSING"
            exit 1
          fi

          echo ""
          echo "KAGGLE_API_TOKEN:"
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "OK"
          else
            echo "MISSING"
            exit 1
          fi

          echo ""
          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo ""
          echo "API_URL:"
          echo "$API_URL"

          echo ""
          echo "======================================"
          echo "        ENVIRONMENT READY"
          echo "======================================"


      # =====================================================
      # CREATE KAGGLE WORKER
      # =====================================================

      - name: Create Kaggle GPU worker
        shell: bash
        run: |

          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'

          import os
          import sys
          import json
          import time
          import traceback
          import subprocess

          import numpy as np

          from numba import cuda


          # =================================================
          # ENVIRONMENT
          # =================================================

          SESSION_ID = os.environ.get(
              "SESSION_ID",
              "unknown"
          )

          API_URL = os.environ.get(
              "API_URL",
              ""
          ).rstrip("/")

          WORKER_TOKEN = os.environ.get(
              "WORKER_TOKEN",
              ""
          )


          print("=" * 70)
          print("                 GPU SESSION WORKER")
          print("=" * 70)

          print("SESSION_ID:", SESSION_ID)
          print("API_URL:", API_URL)

          sys.stdout.flush()


          # =================================================
          # RESULT
          # =================================================

          result = {
              "session_id": SESSION_ID,
              "status": "ERROR",
              "gpu": None,
              "compute_capability": None,
              "cuda_available": False,
              "test": None,
              "error": None
          }


          try:

              # =============================================
              # NVIDIA SMI
              # =============================================

              print("")
              print("=" * 70)
              print("                    NVIDIA SMI")
              print("=" * 70)

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True,
                  timeout=30
              )

              print(
                  "Return code:",
                  nvidia.returncode
              )

              print(
                  "GPU:",
                  nvidia.stdout
              )

              if nvidia.stderr:
                  print(
                      "stderr:",
                      nvidia.stderr
                  )

              if nvidia.returncode != 0:
                  raise RuntimeError(
                      "nvidia-smi failed"
                  )


              # =============================================
              # CUDA
              # =============================================

              print("")
              print("=" * 70)
              print("                    CUDA CHECK")
              print("=" * 70)

              available = cuda.is_available()

              print(
                  "CUDA available:",
                  available
              )

              if not available:

                  raise RuntimeError(
                      "CUDA is not available"
                  )

              result[
                  "cuda_available"
              ] = True


              # =============================================
              # GPU DEVICE
              # =============================================

              device = cuda.get_current_device()

              gpu_name = str(
                  device.name
              )

              capability = (
                  device.compute_capability
              )

              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )

              result[
                  "gpu"
              ] = gpu_name

              result[
                  "compute_capability"
              ] = [
                  int(capability[0]),
                  int(capability[1])
              ]


              # =============================================
              # GPU TEST
              # =============================================

              print("")
              print("=" * 70)
              print("                    GPU TEST")
              print("=" * 70)

              N = 1024 * 1024

              print(
                  "Array size:",
                  N
              )

              print(
                  "Creating arrays..."
              )

              a = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  N,
                  dtype=np.float32
              )


              # =============================================
              # KERNEL
              # =============================================

              @cuda.jit
              def add_kernel(
                  a,
                  b,
                  c
              ):

                  i = cuda.grid(1)

                  if i < a.size:
                      c[i] = (
                          a[i]
                          + b[i]
                      )


              print(
                  "Copying arrays to GPU..."
              )

              d_a = cuda.to_device(
                  a
              )

              d_b = cuda.to_device(
                  b
              )

              d_c = cuda.to_device(
                  c
              )


              threads = 256

              blocks = (
                  N
                  + threads
                  - 1
              ) // threads


              print(
                  "Blocks:",
                  blocks
              )

              print(
                  "Threads:",
                  threads
              )


              # =============================================
              # WARMUP
              # =============================================

              print(
                  "GPU kernel warmup..."
              )

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()


              # =============================================
              # BENCHMARK
              # =============================================

              print(
                  "Running benchmark..."
              )

              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )


              # =============================================
              # RESULT
              # =============================================

              output = (
                  d_c.copy_to_host()
              )

              checksum = float(
                  np.sum(output)
              )


              print("")
              print(
                  "GPU computation successful"
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              print(
                  "Checksum:",
                  checksum
              )


              result[
                  "status"
              ] = "READY"

              result[
                  "test"
              ] = {

                  "size":
                      N,

                  "time_seconds":
                      elapsed,

                  "checksum":
                      checksum
              }


              # =============================================
              # FINAL RESULT
              # =============================================

              print("")
              print("=" * 70)
              print("                 GPU SESSION READY")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              sys.stdout.flush()


              # =============================================
              # KEEP WORKER ALIVE
              # =============================================

              print("")
              print("=" * 70)
              print("                 WORKER ALIVE")
              print("=" * 70)

              sys.stdout.flush()


              # Keep Kaggle kernel alive.
              # 600 seconds = 10 minutes.

              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1,
                      "/ 600"
                  )

                  sys.stdout.flush()

                  time.sleep(1)


              print("")
              print(
                  "Worker lifetime completed."
              )

              sys.stdout.flush()


          except Exception as e:

              result[
                  "status"
              ] = "ERROR"

              result[
                  "error"
              ] = str(e)

              result[
                  "exception"
              ] = type(e).__name__

              result[
                  "traceback"
              ] = traceback.format_exc()


              print("")
              print("=" * 70)
              print("                    GPU ERROR")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              traceback.print_exc()

              sys.stdout.flush()

              raise


          PYEOF


          # =================================================
          # KERNEL METADATA
          # =================================================

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "======================================"
          echo "       KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # =====================================================
      # SUBMIT KAGGLE
      # =====================================================

      - name: Submit Kaggle GPU
        shell: bash
        run: |

          set -e

          echo ""
          echo "======================================"
          echo "       SUBMITTING KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      # =====================================================
      # WAIT FOR KAGGLE
      # =====================================================

      - name: Wait for Kaggle worker
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE WORKER"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "KAGGLE SESSION COMPLETE"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "KAGGLE SESSION ERROR"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.CANCEL"
            then

              FINAL_STATUS="CANCELLED"

              echo ""
              echo "KAGGLE WORKER WAS CANCELLED"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.CANCEL_ACKNOWLEDGED"
            then

              FINAL_STATUS="CANCELLED"

              echo ""
              echo "KAGGLE WORKER CANCELLATION ACKNOWLEDGED"

              break

            fi


            sleep 5

          done


          # =================================================
          # FINAL STATUS
          # =================================================

          echo ""
          echo "======================================"
          echo "             FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          if [ "$FINAL_STATUS" = "COMPLETE" ]; then

              echo ""
              echo "Kaggle worker completed successfully."

              exit 0

          fi


          if [ "$FINAL_STATUS" = "CANCELLED" ]; then

              echo ""
              echo "Kaggle worker was cancelled."

              exit 1

          fi


          if [ "$FINAL_STATUS" = "ERROR" ]; then

              echo ""
              echo "Kaggle worker failed."

              exit 1

          fi


          echo ""
          echo "Kaggle worker did not complete normally."

          exit 1


      # =====================================================
      # DOWNLOAD RESULTS
      # =====================================================

      - name: Download Kaggle results
        if: success()
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       DOWNLOADING RESULTS"
          echo "======================================"

          rm -rf final_output
          mkdir -p final_output


          kaggle kernels output \
            "$KERNEL" \
            -p final_output


          echo ""
          echo "======================================"
          echo "          FINAL KAGGLE FILES"
          echo "======================================"

          find final_output \
            -type f \
            -maxdepth 2 \
            -print


      # =====================================================
      # FINAL
      # =====================================================

      - name: Final
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "        GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"

          echo ""
          echo "GitHub workflow finished."
