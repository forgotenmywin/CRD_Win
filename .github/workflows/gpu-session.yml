name: Kaggle API Kernel Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Install Kaggle CLI
      # =========================================================

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version


      # =========================================================
      # 2. Check credentials
      # =========================================================

      - name: Check Credentials
        run: |
          echo "========================================"
          echo "CREDENTIAL CHECK"
          echo "========================================"

          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo ""
          echo "Credentials are present."


      # =========================================================
      # 3. Test API read access
      # =========================================================

      - name: Test Kaggle API
        run: |
          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          set +e

          kaggle kernels list \
            --mine \
            --page-size 5

          RESULT=$?

          set -e

          echo ""
          echo "API return code: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "Kaggle API READ test failed."
            exit "$RESULT"
          fi

          echo ""
          echo "Kaggle API READ test passed."


      # =========================================================
      # 4. Create unique test slug
      # =========================================================

      - name: Create Test Kernel ID
        run: |
          echo "========================================"
          echo "CREATING TEST KERNEL ID"
          echo "========================================"

          KERNEL_SLUG="api-test-${GITHUB_RUN_ID}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo ""
          echo "Kernel slug:"
          echo "$KERNEL_SLUG"

          echo ""
          echo "Full kernel ID:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # 5. Create minimal kernel
      # =========================================================

      - name: Create Minimal Kernel
        run: |
          echo "========================================"
          echo "CREATING MINIMAL KERNEL"
          echo "========================================"

          rm -rf test-kernel

          mkdir -p test-kernel

          cat > test-kernel/test.py <<'PY'
          import subprocess
          import sys

          print("========================================")
          print("KAGGLE TEST KERNEL")
          print("========================================")

          print()
          print("Python:")
          print(sys.version)

          print()
          print("GPU:")
          subprocess.run(
              "nvidia-smi -L",
              shell=True
          )

          print()
          print("Full GPU:")
          subprocess.run(
              "nvidia-smi",
              shell=True
          )

          print()
          print("TEST FINISHED")
          PY


      # =========================================================
      # 6. Create metadata
      # =========================================================

      - name: Create Kernel Metadata
        run: |
          echo "========================================"
          echo "CREATING METADATA"
          echo "========================================"

          cat > test-kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaP100"
          }
          EOF

          echo ""
          echo "Metadata:"
          cat test-kernel/kernel-metadata.json


      # =========================================================
      # 7. Push test kernel
      # =========================================================

      - name: Push Test Kernel
        run: |
          echo "========================================"
          echo "PUSHING TEST KERNEL"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Files:"
          find test-kernel -maxdepth 2 -type f -print

          echo ""
          echo "Metadata:"
          cat test-kernel/kernel-metadata.json

          echo ""

          set +e

          kaggle kernels push \
            -p test-kernel

          RESULT=$?

          set -e

          echo ""
          echo "SaveKernel return code: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "SAVEKERNEL FAILED"
            echo "========================================"

            echo "This failure happened BEFORE the GPU kernel ran."

            exit "$RESULT"
          fi


      # =========================================================
      # 8. Wait
      # =========================================================

      - name: Wait For Kernel
        if: success()
        run: |
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          for i in {1..30}
          do
            echo ""
            echo "STATUS CHECK $i / 30"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1 || true
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo ""
              echo "KERNEL COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo ""
              echo "KERNEL ERROR"
              break
            fi

            sleep 10
          done


      # =========================================================
      # 9. Download output
      # =========================================================

      - name: Download Output
        if: always()
        run: |
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          mkdir -p output

          echo "========================================"
          echo "DOWNLOADING OUTPUT"
          echo "========================================"

          set +e

          kaggle kernels output \
            "$KERNEL" \
            -p output

          RESULT=$?

          set -e

          echo ""
          echo "Download return code: $RESULT"

          echo ""
          echo "Output files:"
          find output -type f -print


      # =========================================================
      # 10. Show output
      # =========================================================

      - name: Show Output
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "FINAL OUTPUT"
          echo "========================================"

          find output \
            -type f \
            -exec sh -c '
              echo ""
              echo "===== $1 ====="
              cat "$1" 2>/dev/null || true
            ' _ {} \;


      # =========================================================
      # 11. Cleanup
      # =========================================================

      - name: Delete Test Kernel
        if: always()
        run: |
          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo "========================================"
          echo "CLEANUP"
          echo "========================================"

          kaggle kernels delete \
            "$KERNEL" \
            --yes \
            || true

          echo "Cleanup finished."
