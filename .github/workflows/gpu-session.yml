name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string

      api_url:
        required: true
        type: string

      worker_token:
        required: true
        type: string

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      - name: Validate
        run: |
          set -e

          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
          echo "TOKEN_LENGTH=${#WORKER_TOKEN}"

      - name: Prepare Worker
        run: |
          set -e

          mkdir -p kaggle_submit

          python - <<'PY'
          import os
          from pathlib import Path

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          src = Path("kaggle_worker.py")

          if not src.exists():
              raise SystemExit(
                  "kaggle_worker.py not found"
              )

          code = src.read_text(
              encoding="utf-8"
          )

          code = code.replace(
              "__SESSION_ID__",
              session_id
          )

          code = code.replace(
              "__API_URL__",
              api_url
          )

          code = code.replace(
              "__WORKER_TOKEN__",
              worker_token
          )

          # Safety check
          if "__SESSION_ID__" in code:
              raise SystemExit(
                  "SESSION_ID injection failed"
              )

          if "__API_URL__" in code:
              raise SystemExit(
                  "API_URL injection failed"
              )

          if "__WORKER_TOKEN__" in code:
              raise SystemExit(
                  "WORKER_TOKEN injection failed"
              )

          if "${SESSION_ID}" in code:
              raise SystemExit(
                  "Found ${SESSION_ID}"
              )

          if "${API_URL}" in code:
              raise SystemExit(
                  "Found ${API_URL}"
              )

          Path(
              "kaggle_submit/kaggle_worker.py"
          ).write_text(
              code,
              encoding="utf-8"
          )

          print(
              "Worker successfully prepared."
          )
          PY

      - name: Create Kaggle metadata
        run: |
          cat > kaggle_submit/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "kaggle_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          cat kaggle_submit/kernel-metadata.json

      - name: Start Kaggle GPU
        run: |
          set -e

          cd kaggle_submit

          kaggle kernels push -p .

      - name: Monitor
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "========================================"
          echo "MONITORING KAGGLE"
          echo "========================================"

          for i in $(seq 1 180); do

            echo
            echo "CHECK $i / 180"

            kaggle kernels status "$KERNEL"

            sleep 5

          done
