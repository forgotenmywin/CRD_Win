name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests

      # ==========================================================
      # CREATE KAGGLE PACKAGE
      # ==========================================================

      - name: Prepare Kaggle worker
        run: |
          set -e

          echo "========================================"
          echo "PREPARING KAGGLE GPU WORKER"
          echo "========================================"

          rm -rf kaggle_upload
          mkdir -p kaggle_upload

          cp kaggle_worker.py kaggle_upload/script.py

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          echo
          echo "Metadata:"
          cat kaggle_upload/kernel-metadata.json

          echo
          echo "Worker source:"
          ls -lh kaggle_upload/

      # ==========================================================
      # INJECT RUNTIME CONFIG
      # ==========================================================

      - name: Inject session configuration
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path

          p = Path("kaggle_upload/script.py")
          s = p.read_text()

          s = s.replace(
              "__SESSION_ID__",
              "${SESSION_ID}"
          )

          s = s.replace(
              "__API_URL__",
              "${API_URL}"
          )

          s = s.replace(
              "__WORKER_TOKEN__",
              "${WORKER_TOKEN}"
          )

          p.write_text(s)
          PY

          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"

          head -35 kaggle_upload/script.py

          if grep -q "__SESSION_ID__" kaggle_upload/script.py; then
            echo "ERROR: SESSION_ID placeholder remains"
            exit 1
          fi

          if grep -q "__API_URL__" kaggle_upload/script.py; then
            echo "ERROR: API_URL placeholder remains"
            exit 1
          fi

          if grep -q "__WORKER_TOKEN__" kaggle_upload/script.py; then
            echo "ERROR: WORKER_TOKEN placeholder remains"
            exit 1
          fi

          echo "Injection successful."

      # ==========================================================
      # PUSH TO KAGGLE
      # ==========================================================

      - name: Push Kaggle GPU worker
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          test -f kaggle_upload/kernel-metadata.json
          test -f kaggle_upload/script.py

          kaggle kernels push -p kaggle_upload

          echo "Kaggle kernel submitted."

      # ==========================================================
      # WAIT FOR WORKER
      # ==========================================================

      - name: Wait for worker
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          for i in $(seq 1 180); do

            echo "CHECK $i / 180"

            RESPONSE=$(curl -s \
              "https://${API_URL#https://}/gpu/session/${SESSION_ID}")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "active" ]; then
              echo "WORKER IS ACTIVE"
              exit 0
            fi

            if [ "$STATUS" = "error" ] || [ "$STATUS" = "expired" ] || [ "$STATUS" = "stopped" ]; then
              echo "Worker failed: $STATUS"
              exit 1
            fi

            sleep 5
          done

          echo "Worker did not become active."
          exit 1

      # ==========================================================
      # MONITOR
      # ==========================================================

      - name: Monitor GPU worker
        run: |
          set +e

          echo "========================================"
          echo "MONITORING WORKER"
          echo "========================================"

          while true; do

            RESPONSE=$(curl -s \
              "https://${API_URL#https://}/gpu/session/${SESSION_ID}")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=$STATUS"

            if [ "$STATUS" = "expired" ]; then
              echo "SESSION EXPIRED"
              exit 0
            fi

            if [ "$STATUS" = "stopped" ]; then
              echo "SESSION STOPPED"
              exit 0
            fi

            if [ "$STATUS" = "error" ]; then
              echo "SESSION ERROR"
              exit 1
            fi

            sleep 10

          done
