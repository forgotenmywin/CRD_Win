name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Check commands.txt
      # =========================================================

      - name: Check Commands
        run: |

          echo "========================================"
          echo "CHECKING commands.txt"
          echo "========================================"

          if [ ! -f commands.txt ]; then
            echo "ERROR: commands.txt not found!"
            echo ""
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo ""
          echo "Commands:"
          echo "----------------------------------------"

          cat commands.txt

          echo "----------------------------------------"


      # =========================================================
      # 3. Install Kaggle
      # =========================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo ""
          kaggle --version


      # =========================================================
      # 4. Authentication Check
      # =========================================================

      - name: Check Kaggle Authentication
        run: |

          echo "Kaggle username length: ${#KAGGLE_USERNAME}"
          echo "Kaggle token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo ""
          echo "Kaggle credentials detected."


      # =========================================================
      # 5. Test Kaggle API
      # =========================================================

      - name: Test Kaggle API
        run: |

          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          kaggle kernels list \
            --mine \
            --page-size 1

          echo ""
          echo "Kaggle API OK."


      # =========================================================
      # 6. Create unique Kernel ID
      # =========================================================

      - name: Create Unique Kernel ID
        run: |

          KERNEL_SLUG="gpu-command-runner-${GITHUB_RUN_ID}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"

          echo "========================================"
          echo "KAGGLE KERNEL"
          echo "========================================"

          echo "Kernel slug:"
          echo "$KERNEL_SLUG"

          echo ""
          echo "Full kernel ID:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"


      # =========================================================
      # 7. Create GPU Worker
      # =========================================================

      - name: Create GPU Worker
        run: |

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test

          python3 <<'PY'

          from pathlib import Path

          commands = Path(
              "commands.txt"
          ).read_text(
              encoding="utf-8"
          )


          # =====================================================
          # Worker
          # =====================================================

          worker = r'''
          import subprocess
          import sys
          import os
          import traceback


          RESULT_FILE = "result.txt"


          # =====================================================
          # Open result file
          # =====================================================

          result_file = open(
              RESULT_FILE,
              "w",
              encoding="utf-8",
              buffering=1
          )


          # =====================================================
          # Output function
          # =====================================================

          def output(text=""):

              print(text, flush=True)

              result_file.write(
                  str(text) + "\n"
              )

              result_file.flush()


          # =====================================================
          # Header
          # =====================================================

          output("=" * 80)
          output("KAGGLE GPU COMMAND RUNNER")
          output("=" * 80)

          output()

          output("Python:")
          output(sys.version)

          output()

          output("Current directory:")
          output(os.getcwd())

          output()


          # =====================================================
          # Commands from GitHub
          # =====================================================

          COMMANDS_TEXT = """COMMANDS_PLACEHOLDER"""


          # =====================================================
          # Parse commands
          # =====================================================

          commands = []

          for line in COMMANDS_TEXT.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              commands.append(line)


          output("=" * 80)
          output("COMMANDS LOADED")
          output("=" * 80)

          output(
              "Number of commands: "
              + str(len(commands))
          )


          # =====================================================
          # Run command
          # =====================================================

          def run_command(command):

              output()
              output("=" * 80)
              output("$ " + command)
              output("=" * 80)

              try:

                  process = subprocess.Popen(
                      command,
                      shell=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )


                  for line in process.stdout:

                      output(
                          line.rstrip()
                      )


                  return_code = process.wait()


                  output()

                  output(
                      "Return code: "
                      + str(return_code)
                  )


              except Exception:

                  output()
                  output("COMMAND ERROR")

                  output(
                      traceback.format_exc()
                  )


          # =====================================================
          # Execute all commands
          # =====================================================

          if not commands:

              output()
              output("No commands found.")


          else:

              for index, command in enumerate(
                  commands,
                  1
              ):

                  output()
                  output("#" * 80)

                  output(
                      "# COMMAND "
                      + str(index)
                      + " / "
                      + str(len(commands))
                  )

                  output("#" * 80)

                  run_command(command)


          # =====================================================
          # Finish
          # =====================================================

          output()
          output("=" * 80)
          output("ALL COMMANDS FINISHED")
          output("=" * 80)

          result_file.close()

          '''


          # =====================================================
          # Insert commands
          # =====================================================

          commands = commands.replace(
              "\\",
              "\\\\"
          )

          commands = commands.replace(
              '"""',
              '\\"\\"\\"'
          )

          worker = worker.replace(
              "COMMANDS_PLACEHOLDER",
              commands
          )


          # =====================================================
          # Save worker
          # =====================================================

          Path(
              "kaggle-gpu-test/gpu_worker.py"
          ).write_text(
              worker,
              encoding="utf-8"
          )


          print(
              "gpu_worker.py created."
          )

          PY


          echo ""
          echo "========================================"
          echo "WORKER CREATED"
          echo "========================================"

          ls -lh kaggle-gpu-test/


      # =========================================================
      # 8. Create Kaggle Metadata
      # =========================================================

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "GPU Command Runner ${GITHUB_RUN_ID}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF

          echo "========================================"
          echo "KAGGLE METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 9. Push Kernel
      # =========================================================

      - name: Push GPU Kernel
        run: |

          echo ""
          echo "========================================"
          echo "PUSHING GPU KERNEL"
          echo "========================================"

          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          kaggle kernels push \
            -p kaggle-gpu-test


      # =========================================================
      # 10. Wait for Kernel
      # =========================================================

      - name: Wait for Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "========================================"
          echo "WAITING FOR KAGGLE"
          echo "========================================"

          echo "Kernel:"
          echo "$KERNEL"


          for i in {1..30}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 30"
            echo "========================================"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1 || true
            )"

            echo "$STATUS"


            # ---------------------------------------------------
            # Complete
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "COMPLETE"
            then

              echo ""
              echo "========================================"
              echo "KAGGLE KERNEL COMPLETE"
              echo "========================================"

              break

            fi


            # ---------------------------------------------------
            # Error
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "ERROR"
            then

              echo ""
              echo "Kaggle kernel reported ERROR."

              break

            fi


            # ---------------------------------------------------
            # Cancelled
            # ---------------------------------------------------

            if echo "$STATUS" | grep -qi "CANCEL"
            then

              echo ""
              echo "Kaggle kernel was cancelled."

              break

            fi


            sleep 10

          done


      # =========================================================
      # 11. Download Output
      # =========================================================

      - name: Download Kaggle Output
        run: |

          KERNEL="${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          rm -rf kaggle-output

          mkdir -p kaggle-output

          echo ""
          echo "========================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "========================================"

          echo "Kernel:"
          echo "$KERNEL"


          kaggle kernels output \
            "$KERNEL" \
            -p kaggle-output || true


          echo ""
          echo "========================================"
          echo "DOWNLOADED FILES"
          echo "========================================"

          find kaggle-output \
            -type f \
            -print


      # =========================================================
      # 12. Display Result
      # =========================================================

      - name: Display Command Results
        run: |

          echo ""
          echo "############################################################"
          echo "#                  KAGGLE GPU RESULT                       #"
          echo "############################################################"


          RESULT="kaggle-output/result.txt"


          if [ -f "$RESULT" ]; then

            echo ""
            echo "========================================"
            echo "RESULT.TXT"
            echo "========================================"

            cat "$RESULT"


          else

            echo ""
            echo "WARNING: result.txt was not found."

            echo ""
            echo "All downloaded files:"
            echo "----------------------------------------"

            find kaggle-output \
              -type f \
              -print


            echo ""
            echo "Trying to display all output files:"
            echo "----------------------------------------"


            find kaggle-output \
              -type f \
              -exec sh -c '
                echo ""
                echo "===== $1 ====="
                cat "$1" 2>/dev/null || true
              ' _ {} \;

          fi


          echo ""
          echo "############################################################"
          echo "#                       FINISHED                            #"
          echo "############################################################"


      # =========================================================
      # 13. Upload result as GitHub artifact
      # =========================================================

      - name: Upload Kaggle Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result-${{ github.run_id }}
          path: kaggle-output/
          if-no-files-found: warn
