name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests


      - name: Validate
        shell: bash
        run: |
          set -e

          test -n "${SESSION_ID}"
          test -n "${API_URL}"
          test -n "${WORKER_TOKEN}"

          test -n "${KAGGLE_USERNAME}"
          test -n "${KAGGLE_API_TOKEN}"

          test -f kaggle_worker/script.py

          echo "Validation OK."


      - name: Build final Kaggle script
        shell: bash
        run: |
          set -e

          rm -rf kaggle_upload

          mkdir -p kaggle_upload

          python - <<'PY'
          from pathlib import Path
          import os

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          source = Path(
              "kaggle_worker/script.py"
          ).read_text(
              encoding="utf-8"
          )

          header = (
              "# GENERATED RUNTIME CONFIG\n"
              f"SESSION_ID = {session_id!r}\n"
              f"API_URL = {api_url!r}\n"
              f"WORKER_TOKEN = {worker_token!r}\n\n"
          )

          final_script = header + source

          Path(
              "kaggle_upload/script.py"
          ).write_text(
              final_script,
              encoding="utf-8"
          )

          print("Final script generated.")
          print(
              "SESSION_ID:",
              session_id
          )
          print(
              "API_URL:",
              api_url
          )
          print(
              "WORKER_TOKEN: injected"
          )
          PY


          python -m py_compile \
            kaggle_upload/script.py

          echo "Worker syntax OK."


      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          cat kaggle_upload/kernel-metadata.json


      - name: Push Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE WORKER"
          echo "========================================"

          export KAGGLE_API_TOKEN="${KAGGLE_API_TOKEN}"

          cd kaggle_upload

          # IMPORTANT:
          # Explicitly give Kaggle a 1200-second runtime.
          kaggle kernels push \
            -p . \
            --timeout 1200

          echo "Kaggle worker submitted."


      - name: Wait for worker
        shell: bash
        run: |
          set +e

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          for i in $(seq 1 300); do

            echo
            echo "CHECK ${i} / 300"

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            if [ $? -ne 0 ]; then
              echo "Railway request failed."
              sleep 5
              continue
            fi

            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')

            echo "Current status: ${STATUS}"

            if [ "${STATUS}" = "active" ]; then
              echo
              echo "========================================"
              echo "GPU WORKER READY"
              echo "========================================"
              exit 0
            fi

            if [ "${STATUS}" = "error" ]; then
              echo "Session error."
              exit 1
            fi

            if [ "${STATUS}" = "expired" ]; then
              echo "Session expired."
              exit 1
            fi

            sleep 5

          done

          echo "Worker timeout."
          exit 1


      - name: Monitor worker
        if: success()
        shell: bash
        run: |
          set +e

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "========================================"
          echo "MONITORING WORKER"
          echo "========================================"

          while true; do

            RESPONSE=$(curl \
              -sS \
              --max-time 20 \
              "${STATUS_URL}")

            echo
            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')

            echo "STATUS=${STATUS}"

            case "${STATUS}" in

              active)
                sleep 30
                ;;

              starting)
                sleep 15
                ;;

              stopped)
                echo "Session stopped."
                exit 0
                ;;

              expired)
                echo "Session expired."
                exit 0
                ;;

              error)
                echo "Session entered error state."
                exit 1
                ;;

              *)
                sleep 15
                ;;

            esac

          done


      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}

          path: |
            kaggle_upload/script.py
            kaggle_upload/kernel-metadata.json

          if-no-files-found: warn
