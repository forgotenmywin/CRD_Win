name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |

          set -e

          python -m pip install --upgrade pip

          python -m pip install --upgrade kaggle requests


          echo ""
          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          python --version

          kaggle --version


          echo ""
          echo "======================================"
          echo "CHECK KAGGLE VARIABLES"
          echo "======================================"


          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is missing"
            exit 1
          fi


          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is missing"
            exit 1
          fi


          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID is missing"
            exit 1
          fi


          echo "KAGGLE USERNAME:"
          echo "$KAGGLE_USERNAME"

          echo ""

          echo "SESSION:"
          echo "$SESSION_ID"


      # ======================================================
      # CREATE KAGGLE WORKER
      # ======================================================

      - name: Create Kaggle GPU worker
        shell: bash
        run: |

          set -e


          rm -rf kaggle_session

          mkdir -p kaggle_session


          # ==================================================
          # PYTHON GPU SCRIPT
          # ==================================================

          cat > kaggle_session/script.py <<'PYEOF'

          import os
          import json
          import time
          import traceback
          import subprocess


          SESSION_ID = os.environ.get(
              "SESSION_ID",
              "unknown"
          )


          print("=" * 60)
          print("KAGGLE GPU WORKER")
          print("=" * 60)


          result = {

              "session_id": SESSION_ID,

              "status": "starting",

              "gpu": None,

              "compute_capability": None,

              "cuda_available": False,

              "test": None,

              "error": None

          }


          try:

              # ==============================================
              # NVIDIA SMI
              # ==============================================

              print("")
              print("=" * 60)
              print("NVIDIA-SMI")
              print("=" * 60)


              smi = subprocess.run(

                  [
                      "nvidia-smi"
                  ],

                  capture_output=True,

                  text=True,

                  timeout=30
              )


              print(
                  smi.stdout
              )


              if smi.returncode != 0:

                  print(
                      smi.stderr
                  )

                  raise RuntimeError(
                      "nvidia-smi failed"
                  )


              # ==============================================
              # GPU NAME
              # ==============================================

              gpu_info = subprocess.run(

                  [
                      "nvidia-smi",

                      "--query-gpu=name,memory.total,driver_version",

                      "--format=csv,noheader"
                  ],

                  capture_output=True,

                  text=True,

                  timeout=30
              )


              print("")
              print("GPU INFO:")
              print(
                  gpu_info.stdout
              )


              gpu_line = (
                  gpu_info.stdout
                  .strip()
                  .splitlines()
              )


              if gpu_line:

                  result["gpu"] = (
                      gpu_line[0]
                  )


              # ==============================================
              # NUMBA
              # ==============================================

              print("")
              print("=" * 60)
              print("NUMBA CUDA TEST")
              print("=" * 60)


              import numpy as np

              from numba import cuda


              cuda_available = (
                  cuda.is_available()
              )


              print(
                  "CUDA available:",
                  cuda_available
              )


              result[
                  "cuda_available"
              ] = bool(
                  cuda_available
              )


              if not cuda_available:

                  raise RuntimeError(
                      "CUDA is not available"
                  )


              # ==============================================
              # DEVICE
              # ==============================================

              device = (
                  cuda.get_current_device()
              )


              capability = (
                  device.compute_capability
              )


              print(
                  "Compute capability:",
                  capability
              )


              result[
                  "compute_capability"
              ] = [

                  int(capability[0]),

                  int(capability[1])

              ]


              # ==============================================
              # SIMPLE GPU KERNEL
              # ==============================================

              N = 1024 * 1024


              @cuda.jit
              def add_kernel(
                  a,
                  b,
                  c
              ):

                  i = cuda.grid(1)

                  if i < a.size:

                      c[i] = (
                          a[i] + b[i]
                      )


              print("")
              print(
                  "Creating arrays..."
              )


              a = np.ones(
                  N,
                  dtype=np.float32
              )


              b = np.ones(
                  N,
                  dtype=np.float32
              )


              c = np.zeros(
                  N,
                  dtype=np.float32
              )


              print(
                  "Copying data to GPU..."
              )


              d_a = cuda.to_device(
                  a
              )


              d_b = cuda.to_device(
                  b
              )


              d_c = cuda.to_device(
                  c
              )


              threads = 256


              blocks = (
                  N + threads - 1
              ) // threads


              print(
                  "Launching GPU kernel..."
              )


              start = time.perf_counter()


              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )


              cuda.synchronize()


              elapsed = (
                  time.perf_counter()
                  - start
              )


              output = (
                  d_c.copy_to_host()
              )


              checksum = float(
                  np.sum(output)
              )


              print("")
              print(
                  "GPU computation successful"
              )


              print(
                  "Elements:",
                  N
              )


              print(
                  "Kernel time:",
                  elapsed
              )


              print(
                  "Checksum:",
                  checksum
              )


              # ==============================================
              # VERIFY
              # ==============================================

              expected = float(
                  N * 2
              )


              if abs(
                  checksum - expected
              ) > 0.01:

                  raise RuntimeError(
                      "GPU result verification failed"
                  )


              # ==============================================
              # SUCCESS
              # ==============================================

              result[
                  "status"
              ] = "READY"


              result[
                  "test"
              ] = {

                  "elements": N,

                  "time_seconds":
                      elapsed,

                  "checksum":
                      checksum,

                  "expected":
                      expected

              }


              print("")
              print("=" * 60)
              print("GPU WORKER READY")
              print("=" * 60)


              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


              # ==============================================
              # SAVE RESULT
              # ==============================================

              with open(
                  "/kaggle/working/session_result.json",
                  "w"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )


              # ==============================================
              # KEEP ALIVE
              # ==============================================

              print("")
              print(
                  "Keeping GPU worker alive..."
              )


              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1
                  )

                  time.sleep(1)


          except Exception as e:

              result[
                  "status"
              ] = "ERROR"


              result[
                  "error"
              ] = str(e)


              result[
                  "exception"
              ] = type(e).__name__


              result[
                  "traceback"
              ] = traceback.format_exc()


              print("")
              print("=" * 60)
              print("GPU WORKER ERROR")
              print("=" * 60)


              traceback.print_exc()


              try:

                  with open(
                      "/kaggle/working/session_result.json",
                      "w"
                  ) as f:

                      json.dump(
                          result,
                          f,
                          indent=2
                      )

              except Exception:

                  pass


              raise

          PYEOF


          # ==================================================
          # METADATA
          # ==================================================

          cat > kaggle_session/kernel-metadata.json <<EOF

          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }

          EOF


          echo ""
          echo "======================================"
          echo "KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # ======================================================
      # PUSH
      # ======================================================

      - name: Push Kaggle GPU worker
        shell: bash
        run: |

          set -e


          echo ""
          echo "======================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "======================================"


          kaggle kernels push \
            -p kaggle_session \
            --acc NvidiaTeslaP100


          echo ""
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for Kaggle
        shell: bash
        run: |

          set +e


          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"


          echo ""
          echo "======================================"
          echo "WAITING FOR KAGGLE"
          echo "======================================"


          echo "Kernel:"
          echo "$KERNEL"


          FINAL_STATUS="UNKNOWN"


          for i in $(seq 1 240)
          do

              echo ""
              echo "======================================"
              echo "CHECK $i/240"
              echo "======================================"


              STATUS="$(
                  kaggle kernels status \
                  "$KERNEL" \
                  2>&1
              )"


              echo "$STATUS"


              if echo "$STATUS" | grep -q \
                  "KernelWorkerStatus.COMPLETE"
              then

                  FINAL_STATUS="COMPLETE"

                  echo ""
                  echo "KAGGLE WORKER COMPLETE"

                  break

              fi


              if echo "$STATUS" | grep -q \
                  "KernelWorkerStatus.ERROR"
              then

                  FINAL_STATUS="ERROR"

                  echo ""
                  echo "KAGGLE WORKER ERROR"

                  break

              fi


              if echo "$STATUS" | grep -q \
                  "KernelWorkerStatus.CANCEL"
              then

                  FINAL_STATUS="CANCELLED"

                  echo ""
                  echo "KAGGLE WORKER CANCELLED"

                  break

              fi


              sleep 5

          done


          echo ""
          echo "======================================"
          echo "FINAL STATUS"
          echo "======================================"


          echo "$FINAL_STATUS"


          # ==================================================
          # DOWNLOAD OUTPUT
          # ==================================================

          rm -rf final_output

          mkdir -p final_output


          echo ""
          echo "======================================"
          echo "DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"


          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            -o


          echo ""
          echo "======================================"
          echo "FILES"
          echo "======================================"


          find final_output \
            -type f \
            -print


          # ==================================================
          # PRINT RESULT JSON
          # ==================================================

          echo ""
          echo "======================================"
          echo "SESSION RESULT"
          echo "======================================"


          if [ -f "final_output/session_result.json" ]
          then

              cat final_output/session_result.json

          else

              echo "session_result.json not found"

          fi


          # ==================================================
          # DOWNLOAD LOG
          # ==================================================

          echo ""
          echo "======================================"
          echo "KAGGLE LOG"
          echo "======================================"


          LOG_FILE="final_output/gpu-session-${SESSION_ID}.log"


          kaggle kernels logs \
            "$KERNEL" \
            > "$LOG_FILE" 2>&1 || true


          echo ""
          echo "Log saved to:"
          echo "$LOG_FILE"


          echo ""
          echo "======================================"
          echo "LAST 200 LOG LINES"
          echo "======================================"


          tail -n 200 "$LOG_FILE" || true


          # ==================================================
          # FAIL WORKFLOW ONLY IF WORKER FAILED
          # ==================================================

          if [ "$FINAL_STATUS" != "COMPLETE" ]
          then

              echo ""
              echo "Kaggle worker did not complete normally."

              exit 1

          fi


          echo ""
          echo "Kaggle worker completed successfully."


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload GPU results
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: gpu-session-${{ inputs.session_id }}

          path: final_output/

          if-no-files-found: warn


      # ======================================================
      # FINAL
      # ======================================================

      - name: Final
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"

          echo ""
          echo "SESSION_ID:"
          echo "$SESSION_ID"

          echo ""
          echo "API_URL:"
          echo "$API_URL"

          echo ""
          echo "WORKER:"
          echo "Kaggle GPU worker"
