name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: GPU Session ID
        required: true
        type: string

      api_url:
        description: Public GPU API URL
        required: true
        type: string

      worker_token:
        description: Worker authentication token
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL KAGGLE + NUMBA
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            numba \
            numpy

          echo ""
          echo "======================================"
          echo "ENVIRONMENT"
          echo "======================================"

          python --version
          kaggle --version

          python -c "import numba; print('Numba:', numba.__version__)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"

          echo ""
          echo "======================================"
          echo "CREDENTIAL CHECK"
          echo "======================================"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID missing"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API_URL missing"
            exit 1
          fi

          if [ -z "$WORKER_TOKEN" ]; then
            echo "ERROR: WORKER_TOKEN missing"
            exit 1
          fi

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"


      # ======================================================
      # CREATE KAGGLE WORKER
      # ======================================================

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'
          import os
          import time
          import json
          import traceback
          import subprocess

          import numpy as np
          from numba import cuda


          # ==================================================
          # CONFIG
          # ==================================================

          SESSION_ID = os.environ.get(
              "SESSION_ID",
              "unknown"
          )

          API_URL = os.environ.get(
              "API_URL",
              ""
          ).rstrip("/")

          WORKER_TOKEN = os.environ.get(
              "WORKER_TOKEN",
              ""
          )


          print("=" * 70)
          print("                  GPU SESSION WORKER")
          print("=" * 70)

          print("SESSION_ID:", SESSION_ID)
          print("API_URL:", API_URL)

          result = {
              "session_id": SESSION_ID,
              "status": "ERROR",
              "gpu": None,
              "compute_capability": None,
              "cuda_available": False
          }


          try:

              # ==================================================
              # NVIDIA SMI
              # ==================================================

              print("")
              print("=" * 70)
              print("                    NVIDIA GPU")
              print("=" * 70)

              try:

                  smi = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,driver_version",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )

                  print(
                      "nvidia-smi return code:",
                      smi.returncode
                  )

                  print(
                      smi.stdout
                  )

                  if smi.stderr:
                      print(
                          "nvidia-smi stderr:"
                      )
                      print(
                          smi.stderr
                      )

              except Exception as e:

                  print(
                      "nvidia-smi failed:",
                      repr(e)
                  )


              # ==================================================
              # CUDA
              # ==================================================

              print("")
              print("=" * 70)
              print("                    NUMBA CUDA")
              print("=" * 70)

              cuda_available = (
                  cuda.is_available()
              )

              print(
                  "CUDA available:",
                  cuda_available
              )

              result[
                  "cuda_available"
              ] = bool(
                  cuda_available
              )

              if not cuda_available:

                  raise RuntimeError(
                      "Numba reports CUDA unavailable"
                  )


              # ==================================================
              # GPU INFORMATION
              # ==================================================

              device = (
                  cuda.get_current_device()
              )

              gpu_name = str(
                  device.name
              )

              capability = (
                  device.compute_capability
              )

              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )

              result[
                  "gpu"
              ] = gpu_name

              result[
                  "compute_capability"
              ] = [
                  int(capability[0]),
                  int(capability[1])
              ]


              # ==================================================
              # P100 CHECK
              # ==================================================

              if tuple(capability) == (6, 0):

                  print(
                      "Tesla P100 / sm_60 detected."
                  )

              else:

                  print(
                      "Warning: GPU is not sm_60"
                  )


              # ==================================================
              # GPU KERNEL
              # ==================================================

              print("")
              print("=" * 70)
              print("                 GPU COMPUTATION")
              print("=" * 70)


              N = 1024 * 1024


              @cuda.jit
              def add_kernel(
                  a,
                  b,
                  c
              ):

                  i = cuda.grid(1)

                  if i < c.size:

                      c[i] = (
                          a[i]
                          + b[i]
                      )


              # ==================================================
              # HOST DATA
              # ==================================================

              print(
                  "Creating arrays:",
                  N
              )

              a = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  N,
                  dtype=np.float32
              )


              # ==================================================
              # COPY TO GPU
              # ==================================================

              print(
                  "Copying data to GPU..."
              )

              d_a = cuda.to_device(
                  a
              )

              d_b = cuda.to_device(
                  b
              )

              d_c = cuda.to_device(
                  c
              )


              threads = 256

              blocks = (
                  N + threads - 1
              ) // threads


              print(
                  "Threads:",
                  threads
              )

              print(
                  "Blocks:",
                  blocks
              )


              # ==================================================
              # WARMUP
              # ==================================================

              print(
                  "CUDA warm-up..."
              )

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()


              # ==================================================
              # BENCHMARK
              # ==================================================

              print(
                  "Running benchmark..."
              )

              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )


              # ==================================================
              # COPY BACK
              # ==================================================

              output = (
                  d_c.copy_to_host()
              )


              checksum = float(
                  np.sum(
                      output[:1000]
                  )
              )


              print("")
              print(
                  "GPU computation successful."
              )

              print(
                  "Elements:",
                  N
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              print(
                  "Checksum:",
                  checksum
              )


              # ==================================================
              # RESULT
              # ==================================================

              result[
                  "status"
              ] = "READY"

              result[
                  "test"
              ] = {
                  "operation":
                      "vector_add",

                  "elements":
                      N,

                  "blocks":
                      blocks,

                  "threads":
                      threads,

                  "time_seconds":
                      elapsed,

                  "checksum":
                      checksum
              }


              # ==================================================
              # SAVE RESULT
              # ==================================================

              with open(
                  "/kaggle/working/session_result.json",
                  "w"
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )


              print("")
              print("=" * 70)
              print("                  GPU SESSION READY")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


              # ==================================================
              # KEEP ALIVE
              # ==================================================

              print("")
              print(
                  "GPU worker is now alive."
              )

              print(
                  "Session duration: 600 seconds"
              )


              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1,
                      "/600"
                  )

                  time.sleep(1)


              print("")
              print(
                  "GPU SESSION TIME EXPIRED"
              )


          except Exception as e:

              result[
                  "status"
              ] = "ERROR"

              result[
                  "error"
              ] = str(e)

              result[
                  "exception"
              ] = type(e).__name__

              result[
                  "traceback"
              ] = traceback.format_exc()


              print("")
              print("=" * 70)
              print("                    GPU ERROR")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              traceback.print_exc()


              # Save error
              try:

                  with open(
                      "/kaggle/working/session_result.json",
                      "w"
                  ) as f:

                      json.dump(
                          result,
                          f,
                          indent=2
                      )

              except Exception:
                  pass


              raise


          PYEOF


          # ==================================================
          # KAGGLE METADATA
          # ==================================================

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "======================================"
          echo "          KAGGLE WORKER"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # ======================================================
      # SUBMIT KAGGLE
      # ======================================================

      - name: Submit Kaggle GPU
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT
      # ======================================================

      - name: Wait for Kaggle
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p kaggle_output

          FINAL_STATUS="UNKNOWN"

          echo ""
          echo "======================================"
          echo "          WAITING FOR KAGGLE"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"


            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"


            echo "$STATUS"


            # ------------------------------------------------
            # COMPLETE
            # ------------------------------------------------

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "KAGGLE SESSION COMPLETE"

              break

            fi


            # ------------------------------------------------
            # ERROR
            # ------------------------------------------------

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "======================================"
              echo "          KAGGLE SESSION ERROR"
              echo "======================================"


              echo ""
              echo "Downloading Kaggle output..."


              rm -rf kaggle_output

              mkdir -p kaggle_output


              kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force \
                2>&1 || true


              echo ""
              echo "======================================"
              echo "             OUTPUT FILES"
              echo "======================================"


              find kaggle_output \
                -type f \
                -print \
                2>/dev/null || true


              echo ""
              echo "======================================"
              echo "            OUTPUT CONTENT"
              echo "======================================"


              while IFS= read -r file
              do

                echo ""
                echo "===== $file ====="

                cat "$file" \
                  2>/dev/null || true

              done < <(
                find kaggle_output \
                  -type f \
                  2>/dev/null
              )


              break

            fi


            sleep 5

          done


          echo ""
          echo "======================================"
          echo "             FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          if [
            "$FINAL_STATUS"
            != "COMPLETE"
          ]
          then

            echo ""
            echo "Kaggle worker failed."

            exit 1

          fi


      # ======================================================
      # DOWNLOAD RESULT
      # ======================================================

      - name: Download final Kaggle output
        if: always()
        shell: bash
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p final_output

          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force \
            2>&1 || true

          echo ""
          echo "======================================"
          echo "          FINAL KAGGLE FILES"
          echo "======================================"

          find final_output \
            -type f \
            -print \
            2>/dev/null || true


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload session result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: |
            final_output/
          if-no-files-found: warn


      # ======================================================
      # FINAL
      # ======================================================

      - name: Final
        if: always()
        run: |

          echo ""
          echo "======================================"
          echo "       GPU SESSION FINISHED"
          echo "======================================"

          echo "Session:"
          echo "$SESSION_ID"

          echo "API:"
          echo "$API_URL"
