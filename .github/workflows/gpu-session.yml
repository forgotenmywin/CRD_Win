name: Kaggle GPU Session

on:
  workflow_dispatch:

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL KAGGLE
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle requests


      # =====================================================
      # CHECK CONFIG
      # =====================================================

      - name: Check configuration
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURATION"
          echo "========================================"

          echo "SESSION_ID:"
          echo "${SESSION_ID}"

          echo "API_URL:"
          echo "${API_URL}"

          echo "WORKER_TOKEN:"
          if [ -n "${WORKER_TOKEN}" ]; then
            echo "SET"
          else
            echo "MISSING"
            exit 1
          fi

          echo ""
          echo "KAGGLE USER:"
          echo "${KAGGLE_USERNAME}"


      # =====================================================
      # BUILD KAGGLE WORKER
      # =====================================================

      - name: Build Kaggle worker
        run: |

          set -e

          echo "========================================"
          echo "BUILDING KAGGLE WORKER"
          echo "========================================"

          rm -rf kaggle_upload

          mkdir -p kaggle_upload

          cp kaggle_upload_template/worker.py \
             kaggle_upload/worker.py


      # =====================================================
      # INJECT SESSION CONFIG
      # =====================================================

      - name: Inject session configuration
        run: |

          set -e

          echo "========================================"
          echo "INJECTING SESSION"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(
              "kaggle_upload/worker.py"
          )

          text = path.read_text()

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"]
          worker_token = os.environ["WORKER_TOKEN"]

          text = text.replace(
              "__SESSION_ID__",
              session_id
          )

          text = text.replace(
              "__API_URL__",
              api_url
          )

          text = text.replace(
              "__WORKER_TOKEN__",
              worker_token
          )

          path.write_text(text)

          print("Session injected:", session_id)
          print("API injected:", api_url)
          print("Token injected: YES")
          PY

          echo ""
          echo "Checking placeholders..."

          if grep -q "__SESSION_ID__" \
             kaggle_upload/worker.py; then
            echo "ERROR: SESSION_ID placeholder remains"
            exit 1
          fi

          if grep -q "__API_URL__" \
             kaggle_upload/worker.py; then
            echo "ERROR: API_URL placeholder remains"
            exit 1
          fi

          if grep -q "__WORKER_TOKEN__" \
             kaggle_upload/worker.py; then
            echo "ERROR: WORKER_TOKEN placeholder remains"
            exit 1
          fi

          echo "All placeholders replaced."


      # =====================================================
      # INSTALL NUMBA DEPENDENCY
      # =====================================================

      - name: Prepare Kaggle metadata
        run: |

          set -e

          echo "========================================"
          echo "CREATING KAGGLE METADATA"
          echo "========================================"

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-worker",
            "title": "GPU Session Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

          echo ""
          cat kaggle_upload/kernel-metadata.json


      # =====================================================
      # PUSH KAGGLE KERNEL
      # =====================================================

      - name: Push Kaggle GPU worker
        run: |

          set -e

          echo "========================================"
          echo "PUSHING KAGGLE GPU WORKER"
          echo "========================================"

          cd kaggle_upload

          kaggle kernels push -p .

          echo ""
          echo "Kaggle worker submitted."


      # =====================================================
      # WAIT FOR WORKER
      # =====================================================

      - name: Wait for worker
        run: |

          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          echo "Status URL:"
          echo "${STATUS_URL}"

          for i in $(seq 1 120); do

            echo "----------------------------------------"
            echo "CHECK ${i} / 120"

            RESPONSE=$(curl -s \
              --max-time 10 \
              "${STATUS_URL}")

            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | \
              python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=${STATUS}"

            if [ "${STATUS}" = "active" ]; then

              echo ""
              echo "========================================"
              echo "WORKER IS ACTIVE"
              echo "========================================"

              break

            fi

            if [ "${STATUS}" = "failed" ] || \
               [ "${STATUS}" = "error" ] || \
               [ "${STATUS}" = "stopped" ]; then

              echo "Worker failed."

              break

            fi

            sleep 5

          done


      # =====================================================
      # MONITOR SESSION
      # =====================================================

      - name: Monitor worker
        run: |

          set +e

          echo "========================================"
          echo "MONITORING WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          for i in $(seq 1 150); do

            RESPONSE=$(curl -s \
              --max-time 10 \
              "${STATUS_URL}")

            ELAPSED=$((i * 10))

            echo "[${ELAPSED}s]"
            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | \
              python -c '
          import sys,json
          try:
              print(json.load(sys.stdin).get("status","unknown"))
          except:
              print("unknown")
          ')

            echo "STATUS=${STATUS}"

            if [ "${STATUS}" = "expired" ] || \
               [ "${STATUS}" = "stopped" ] || \
               [ "${STATUS}" = "failed" ] || \
               [ "${STATUS}" = "error" ]; then

              echo ""
              echo "========================================"
              echo "SESSION FINISHED"
              echo "========================================"

              break

            fi

            sleep 10

          done
