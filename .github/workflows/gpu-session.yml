name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Railway API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string


jobs:

  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests

          kaggle --version


      # ======================================================
      # VALIDATE
      # ======================================================

      - name: Validate
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDATION"
          echo "========================================"

          test -n "${SESSION_ID}"
          test -n "${API_URL}"
          test -n "${WORKER_TOKEN}"

          test -n "${KAGGLE_USERNAME}"
          test -n "${KAGGLE_API_TOKEN}"

          test -f "kaggle_worker/script.py"

          echo "SESSION_ID: ${SESSION_ID}"
          echo "API_URL: ${API_URL}"
          echo "WORKER_TOKEN: PRESENT"
          echo "KAGGLE_USERNAME: ${KAGGLE_USERNAME}"

          echo "Validation OK."


      # ======================================================
      # BUILD FINAL SCRIPT
      # ======================================================

      - name: Build Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING KAGGLE WORKER"
          echo "========================================"

          rm -rf kaggle_upload

          mkdir -p kaggle_upload


          python - <<'PY'
          from pathlib import Path
          import os

          session_id = os.environ["SESSION_ID"]
          api_url = os.environ["API_URL"].rstrip("/")
          worker_token = os.environ["WORKER_TOKEN"]

          worker = Path(
              "kaggle_worker/script.py"
          ).read_text(
              encoding="utf-8"
          )

          header = (
              "# GENERATED RUNTIME CONFIG\n"
              f"SESSION_ID = {session_id!r}\n"
              f"API_URL = {api_url!r}\n"
              f"WORKER_TOKEN = {worker_token!r}\n\n"
          )

          final_script = (
              header
              + worker
          )

          Path(
              "kaggle_upload/script.py"
          ).write_text(
              final_script,
              encoding="utf-8"
          )

          print(
              "Final Kaggle script created."
          )

          print(
              "Session injected: YES"
          )

          print(
              "API injected: YES"
          )

          print(
              "Token injected: YES"
          )
          PY


          python -m py_compile \
            kaggle_upload/script.py

          echo "Python syntax OK."


      # ======================================================
      # KAGGLE METADATA
      # ======================================================

      - name: Create Kaggle metadata
        shell: bash
        run: |
          set -e

          cat > kaggle_upload/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "Metadata:"
          cat kaggle_upload/kernel-metadata.json


      # ======================================================
      # PUSH KAGGLE
      # ======================================================

      - name: Push Kaggle worker
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUSHING KAGGLE WORKER"
          echo "========================================"

          export KAGGLE_API_TOKEN="${KAGGLE_API_TOKEN}"

          cd kaggle_upload

          # Kaggle-side maximum runtime for this test.
          kaggle kernels push \
            -p . \
            --timeout 180

          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT FOR WORKER READY
      # ======================================================

      - name: Wait for worker ready
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "WAITING FOR WORKER"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          for i in $(seq 1 120); do

            echo
            echo "CHECK ${i} / 120"

            RESPONSE=$(curl \
              -sS \
              --max-time 15 \
              "${STATUS_URL}")

            if [ $? -ne 0 ]; then

              echo "Railway status request failed."

              sleep 5

              continue

            fi

            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')

            echo "STATUS=${STATUS}"


            if [ "${STATUS}" = "active" ]; then

              echo
              echo "========================================"
              echo "GPU WORKER READY"
              echo "========================================"

              exit 0

            fi


            if [ "${STATUS}" = "error" ]; then

              echo "Railway reported error."

              exit 1

            fi


            if [ "${STATUS}" = "expired" ]; then

              echo "Session expired."

              exit 1

            fi


            sleep 5

          done


          echo "Worker ready timeout."

          exit 1


      # ======================================================
      # MONITOR 120 SECOND TEST
      # ======================================================

      - name: Monitor 120 second worker test
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "MONITORING 120 SECOND TEST"
          echo "========================================"

          STATUS_URL="${API_URL}/gpu/session/${SESSION_ID}"

          started=$(date +%s)

          while true; do

            now=$(date +%s)

            elapsed=$((now - started))

            RESPONSE=$(curl \
              -sS \
              --max-time 15 \
              "${STATUS_URL}")

            echo
            echo "[${elapsed}s]"
            echo "${RESPONSE}"

            STATUS=$(echo "${RESPONSE}" | python -c '
          import json
          import sys

          try:
              print(
                  json.load(sys.stdin).get(
                      "status",
                      ""
                  )
              )
          except Exception:
              print("")
          ')

            echo "STATUS=${STATUS}"


            if [ "${STATUS}" = "error" ]; then

              echo "Session entered error."

              exit 1

            fi


            if [ "${STATUS}" = "expired" ]; then

              echo "Session expired."

              exit 0

            fi


            if [ "${STATUS}" = "stopped" ]; then

              echo "Session stopped."

              exit 0

            fi


            if [ "${elapsed}" -ge 150 ]; then

              echo
              echo "120-second worker test window completed."

              exit 0

            fi


            sleep 10

          done


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload worker artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: gpu-worker-${{ inputs.session_id }}

          path: |
            kaggle_upload/script.py
            kaggle_upload/kernel-metadata.json

          if-no-files-found: warn
