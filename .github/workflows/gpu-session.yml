name: Kaggle GPU Auto Test

on:
  workflow_dispatch:

jobs:
  gpu-test:
    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # =========================================================
      # 1. Install Kaggle CLI
      # =========================================================
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "Kaggle CLI version:"
          kaggle --version


      # =========================================================
      # 2. Check credentials
      # =========================================================
      - name: Check Kaggle Credentials
        run: |
          echo "Username length: ${#KAGGLE_USERNAME}"
          echo "Token length: ${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials loaded successfully."


      # =========================================================
      # 3. Test Kaggle API
      # =========================================================
      - name: Test Kaggle API
        run: |
          echo "Testing Kaggle API..."

          kaggle kernels list \
            --mine \
            --page-size 1

          echo "Kaggle API authentication OK."


      # =========================================================
      # 4. Create Kaggle GPU Kernel
      # =========================================================
      - name: Create GPU Kernel
        run: |

          rm -rf kaggle-gpu-test
          mkdir -p kaggle-gpu-test

          # -----------------------------------------------------
          # Python program that will run INSIDE Kaggle GPU
          # -----------------------------------------------------

          cat > kaggle-gpu-test/gpu_test.py <<'PY'

          import subprocess
          import sys

          print("=" * 70)
          print("KAGGLE GPU TEST")
          print("=" * 70)

          print()
          print("Python:")
          print(sys.version)

          commands = [
              "nvidia-smi -L",
              "nvidia-smi",
              "lspci | grep -i nvidia"
          ]

          for command in commands:

              print()
              print("=" * 70)
              print("$", command)
              print("=" * 70)

              try:

                  result = subprocess.run(
                      command,
                      shell=True,
                      capture_output=True,
                      text=True,
                      timeout=60
                  )

                  print(result.stdout)

                  if result.stderr:
                      print("STDERR:")
                      print(result.stderr)

                  print("Return code:", result.returncode)

              except Exception as e:

                  print("ERROR:", e)

          print()
          print("=" * 70)
          print("GPU TEST FINISHED")
          print("=" * 70)

          PY


          # -----------------------------------------------------
          # Kaggle Kernel metadata
          # -----------------------------------------------------

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-auto-test",
            "title": "GPU Auto Test",
            "code_file": "gpu_test.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true
          }
          EOF


          echo "========================================"
          echo "KERNEL METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json


      # =========================================================
      # 5. Create / Update Kaggle Kernel
      # =========================================================
      - name: Push GPU Kernel to Kaggle
        run: |

          echo "Uploading GPU Kernel to Kaggle..."

          kaggle kernels push \
            -p kaggle-gpu-test

          echo "Kernel submitted."


      # =========================================================
      # 6. Wait for Kaggle GPU
      # =========================================================
      - name: Wait for Kaggle GPU
        run: |

          echo "Waiting for Kaggle Kernel..."

          for i in {1..20}
          do

            echo ""
            echo "========================================"
            echo "STATUS CHECK $i / 20"
            echo "========================================"

            kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-auto-test" || true

            sleep 15

          done


      # =========================================================
      # 7. Download Kaggle Output
      # =========================================================
      - name: Download Kaggle Output
        run: |

          rm -rf kaggle-output
          mkdir -p kaggle-output

          echo "Downloading Kaggle output..."

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-auto-test" \
            -p kaggle-output || true


      # =========================================================
      # 8. Show GPU Information
      # =========================================================
      - name: Show GPU Information
        run: |

          echo ""
          echo "########################################################"
          echo "#              KAGGLE GPU RESULT                      #"
          echo "########################################################"

          echo ""
          echo "Output files:"
          find kaggle-output -type f -print

          echo ""
          echo "========================================================"
          echo "GPU OUTPUT"
          echo "========================================================"

          if find kaggle-output -type f | grep -q .
          then

            cat kaggle-output/*

          else

            echo "No output file was downloaded."

          fi

          echo ""
          echo "########################################################"
          echo "#                  TEST FINISHED                      #"
          echo "########################################################"
