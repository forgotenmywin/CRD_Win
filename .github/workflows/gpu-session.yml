name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "GPU Session ID"
        required: true
        type: string

      api_url:
        description: "Public GPU API URL"
        required: true
        type: string

      worker_token:
        description: "Worker authentication token"
        required: true
        type: string

jobs:
  gpu-session:

    runs-on: ubuntu-latest

    timeout-minutes: 18

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |

          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            kaggle \
            requests \
            numpy \
            numba

          echo ""
          echo "======================================"
          echo "       ENVIRONMENT CHECK"
          echo "======================================"

          python --version

          echo ""
          kaggle --version

          echo ""
          echo "KAGGLE USER:"
          echo "${KAGGLE_USERNAME:0:3}***"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME missing"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN missing"
            exit 1
          fi

          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID missing"
            exit 1
          fi

          echo ""
          echo "SESSION:"
          echo "$SESSION_ID"


      # ======================================================
      # CREATE KAGGLE WORKER
      # ======================================================

      - name: Create Kaggle GPU worker
        shell: bash
        run: |

          set -e

          rm -rf kaggle_session

          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'

import os
import json
import time
import traceback
import subprocess

import numpy as np

from numba import cuda


# ============================================================
# CONFIG
# ============================================================

SESSION_ID = os.environ.get(
    "SESSION_ID",
    "unknown"
)

API_URL = os.environ.get(
    "API_URL",
    ""
)

WORKER_TOKEN = os.environ.get(
    "WORKER_TOKEN",
    ""
)


print("=" * 70)
print("              KAGGLE GPU WORKER")
print("=" * 70)

print("SESSION_ID:", SESSION_ID)

print("API_URL:", API_URL)

print("")


# ============================================================
# RESULT
# ============================================================

result = {
    "session_id": SESSION_ID,
    "status": "ERROR",
    "gpu": None,
    "compute_capability": None,
    "cuda_available": False,
    "test": {}
}


try:

    # ========================================================
    # NVIDIA-SMI
    # ========================================================

    print("=" * 70)
    print("                    NVIDIA-SMI")
    print("=" * 70)

    nvidia = subprocess.run(
        [
            "nvidia-smi"
        ],
        capture_output=True,
        text=True
    )

    print(
        nvidia.stdout
    )

    if nvidia.stderr:
        print(
            nvidia.stderr
        )


    # ========================================================
    # CUDA CHECK
    # ========================================================

    print("")
    print("=" * 70)
    print("                    CUDA CHECK")
    print("=" * 70)

    available = cuda.is_available()

    print(
        "CUDA available:",
        available
    )

    result[
        "cuda_available"
    ] = bool(available)

    if not available:

        raise RuntimeError(
            "CUDA is not available"
        )


    # ========================================================
    # DEVICE
    # ========================================================

    print("")
    print("=" * 70)
    print("                    GPU DEVICE")
    print("=" * 70)

    device = cuda.get_current_device()

    gpu_name = str(
        device.name
    )

    capability = (
        device.compute_capability
    )

    print(
        "GPU:",
        gpu_name
    )

    print(
        "Compute capability:",
        capability
    )

    result[
        "gpu"
    ] = gpu_name

    result[
        "compute_capability"
    ] = [
        int(capability[0]),
        int(capability[1])
    ]


    # ========================================================
    # SIMPLE GPU TEST
    # ========================================================

    print("")
    print("=" * 70)
    print("                 SIMPLE GPU TEST")
    print("=" * 70)

    N = 1024 * 1024

    print(
        "Array size:",
        N
    )


    @cuda.jit
    def add_kernel(
        a,
        b,
        c
    ):

        i = cuda.grid(1)

        if i < c.size:

            c[i] = (
                a[i]
                + b[i]
            )


    # --------------------------------------------------------
    # CPU DATA
    # --------------------------------------------------------

    a = np.ones(
        N,
        dtype=np.float32
    )

    b = np.ones(
        N,
        dtype=np.float32
    )

    c = np.zeros(
        N,
        dtype=np.float32
    )


    # --------------------------------------------------------
    # COPY TO GPU
    # --------------------------------------------------------

    print(
        "Copying data to GPU..."
    )

    d_a = cuda.to_device(
        a
    )

    d_b = cuda.to_device(
        b
    )

    d_c = cuda.to_device(
        c
    )


    # --------------------------------------------------------
    # LAUNCH
    # --------------------------------------------------------

    threads = 256

    blocks = (
        N
        + threads
        - 1
    ) // threads


    print(
        "Launching CUDA kernel..."
    )

    start = time.perf_counter()


    add_kernel[
        blocks,
        threads
    ](
        d_a,
        d_b,
        d_c
    )


    cuda.synchronize()


    elapsed = (
        time.perf_counter()
        - start
    )


    # --------------------------------------------------------
    # COPY RESULT
    # --------------------------------------------------------

    output = (
        d_c.copy_to_host()
    )


    checksum = float(
        np.sum(output)
    )


    print("")
    print(
        "GPU computation successful"
    )

    print(
        "Kernel time:",
        elapsed,
        "seconds"
    )

    print(
        "Checksum:",
        checksum
    )


    # ========================================================
    # VERIFY
    # ========================================================

    expected = float(
        N * 2
    )

    if abs(
        checksum - expected
    ) > 0.01:

        raise RuntimeError(
            "GPU result verification failed"
        )


    # ========================================================
    # READY
    # ========================================================

    result[
        "status"
    ] = "READY"

    result[
        "test"
    ] = {
        "array_size": N,
        "kernel_time_seconds": elapsed,
        "checksum": checksum,
        "expected": expected
    }


    print("")
    print("=" * 70)
    print("                 GPU SESSION READY")
    print("=" * 70)

    print(
        json.dumps(
            result,
            indent=2
        )
    )


    # ========================================================
    # KEEP ALIVE
    # ========================================================

    print("")
    print("=" * 70)
    print("                 GPU WORKER ALIVE")
    print("=" * 70)

    for i in range(600):

        print(
            "GPU SESSION ALIVE:",
            i + 1
        )

        time.sleep(1)


except Exception as e:

    result[
        "status"
    ] = "ERROR"

    result[
        "error"
    ] = str(e)

    result[
        "exception"
    ] = type(e).__name__

    result[
        "traceback"
    ] = traceback.format_exc()


    print("")
    print("=" * 70)
    print("                    GPU ERROR")
    print("=" * 70)

    traceback.print_exc()

    print("")
    print("=" * 70)
    print("                    RESULT")
    print("=" * 70)

    print(
        json.dumps(
            result,
            indent=2
        )
    )

    raise

PYEOF


          # ====================================================
          # KAGGLE METADATA
          # ====================================================

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF


          echo ""
          echo "======================================"
          echo "       KAGGLE WORKER CREATED"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json


      # ======================================================
      # SUBMIT
      # ======================================================

      - name: Submit Kaggle GPU
        shell: bash
        run: |

          set -e

          echo ""
          echo "======================================"
          echo "       SUBMITTING KAGGLE GPU"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_session

          echo ""
          echo "Kaggle worker submitted."


      # ======================================================
      # WAIT FOR KAGGLE
      # ======================================================

      - name: Wait for Kaggle worker
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE WORKER"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          FINAL_STATUS="UNKNOWN"


          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"


            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"


            echo "$STATUS"


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              echo ""
              echo "KAGGLE SESSION COMPLETE"

              FINAL_STATUS="COMPLETE"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              echo ""
              echo "KAGGLE SESSION ERROR"

              FINAL_STATUS="ERROR"

              break

            fi


            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.CANCEL_ACKNOWLEDGED"
            then

              echo ""
              echo "KAGGLE SESSION CANCELLED"

              FINAL_STATUS="CANCELLED"

              break

            fi


            sleep 5

          done


          echo ""
          echo "======================================"
          echo "             FINAL STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          if [ "$FINAL_STATUS" = "COMPLETE" ]; then

            echo ""
            echo "Kaggle worker completed successfully."

            exit 0

          fi


          echo ""
          echo "Kaggle worker did not complete normally."

          exit 1


      # ======================================================
      # DOWNLOAD KAGGLE OUTPUT
      # ======================================================

      - name: Download Kaggle output and logs
        if: always()
        shell: bash
        run: |

          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p final_output


          echo ""
          echo "======================================"
          echo "       DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"


          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force


          echo ""
          echo "======================================"
          echo "       FINAL KAGGLE FILES"
          echo "======================================"


          find final_output \
            -type f \
            -print


          echo ""
          echo "======================================"
          echo "       KAGGLE OUTPUT CONTENT"
          echo "======================================"


          for file in final_output/*; do

            if [ -f "$file" ]; then

              echo ""
              echo "======================================"
              echo "FILE: $file"
              echo "======================================"

              cat "$file"

            fi

          done


      # ======================================================
      # UPLOAD ARTIFACTS
      # ======================================================

      - name: Upload Kaggle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: ignore


      # ======================================================
      # FINAL
      # ======================================================

      - name: Final
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "        GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION:"
          echo "$SESSION_ID"

          echo ""
          echo "API:"
          echo "$API_URL"

          echo ""
          echo "GitHub workflow finished."
