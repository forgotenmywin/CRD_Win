name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: GPU Session ID
        required: true
        type: string

      api_url:
        description: Public GPU API URL
        required: true
        type: string

      worker_token:
        description: Worker authentication token
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install kaggle numba numpy requests

          python --version
          kaggle --version

          python -c "import numba; print('Numba:', numba.__version__)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<PYEOF
          import time
          import json
          import traceback
          import subprocess
          import requests

          import numpy as np
          from numba import cuda

          SESSION_ID = "${{ inputs.session_id }}"
          API_URL = "${{ inputs.api_url }}".rstrip("/")
          WORKER_TOKEN = "${{ inputs.worker_token }}"

          print("=" * 70)
          print("                    GPU SESSION WORKER")
          print("=" * 70)

          print("SESSION_ID:", SESSION_ID)
          print("API_URL:", API_URL)

          result = {
              "session_id": SESSION_ID,
              "status": "ERROR",
              "gpu": None,
              "compute_capability": None,
              "cuda_available": False,
          }

          try:

              print("")
              print("=" * 70)
              print("                     NVIDIA GPU")
              print("=" * 70)

              try:
                  smi = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,driver_version",
                          "--format=csv,noheader",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  print("nvidia-smi return code:", smi.returncode)
                  print(smi.stdout)

                  if smi.stderr:
                      print("nvidia-smi stderr:")
                      print(smi.stderr)

              except Exception as e:
                  print("nvidia-smi error:", repr(e))

              print("")
              print("=" * 70)
              print("                     NUMBA CUDA")
              print("=" * 70)

              cuda_available = cuda.is_available()

              print(
                  "CUDA available:",
                  cuda_available
              )

              result["cuda_available"] = bool(
                  cuda_available
              )

              if not cuda_available:
                  raise RuntimeError(
                      "Numba CUDA is not available"
                  )

              device = cuda.get_current_device()

              gpu_name = str(device.name)
              capability = device.compute_capability

              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Compute capability:",
                  capability
              )

              result["gpu"] = gpu_name

              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1]),
              ]

              print("")
              print("=" * 70)
              print("                    GPU TEST")
              print("=" * 70)

              N = 1024 * 1024

              @cuda.jit
              def add_kernel(a, b, c):
                  i = cuda.grid(1)

                  if i < c.size:
                      c[i] = a[i] + b[i]

              a = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  N
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  N,
                  dtype=np.float32
              )

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = 256
              blocks = (
                  N + threads - 1
              ) // threads

              print(
                  "Threads:",
                  threads
              )

              print(
                  "Blocks:",
                  blocks
              )

              # Warmup
              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              # Benchmark
              start = time.perf_counter()

              add_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )

              output = d_c.copy_to_host()

              checksum = float(
                  np.sum(
                      output[:1000]
                  )
              )

              print(
                  "GPU computation successful"
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              print(
                  "Checksum:",
                  checksum
              )

              result["status"] = "READY"

              result["test"] = {
                  "operation": "vector_add",
                  "elements": N,
                  "blocks": blocks,
                  "threads": threads,
                  "time_seconds": elapsed,
                  "checksum": checksum,
              }

              # ------------------------------------------------
              # NOTIFY RAILWAY
              # ------------------------------------------------

              print("")
              print("=" * 70)
              print("                 NOTIFY RAILWAY")
              print("=" * 70)

              ready_payload = {
                  "worker_token": WORKER_TOKEN,
                  "gpu": gpu_name,
                  "compute_capability": [
                      int(capability[0]),
                      int(capability[1]),
                  ],
              }

              ready_url = (
                  API_URL
                  + "/gpu/session/"
                  + SESSION_ID
                  + "/worker-ready"
              )

              ready_response = requests.post(
                  ready_url,
                  json=ready_payload,
                  timeout=30,
              )

              print(
                  "Railway HTTP:",
                  ready_response.status_code
              )

              print(
                  "Railway response:",
                  ready_response.text
              )

              if ready_response.status_code != 200:
                  raise RuntimeError(
                      "Railway worker-ready request failed: "
                      + ready_response.text
                  )

              print("")
              print("=" * 70)
              print("                  GPU SESSION READY")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              # ------------------------------------------------
              # KEEP GPU ALIVE
              # ------------------------------------------------

              print("")
              print(
                  "Keeping GPU worker alive..."
              )

              for i in range(600):

                  print(
                      "GPU SESSION ALIVE:",
                      i + 1,
                      "/600"
                  )

                  time.sleep(1)

              print(
                  "GPU worker session finished."
              )

              with open(
                  "/kaggle/working/session_result.json",
                  "w",
              ) as f:

                  json.dump(
                      result,
                      f,
                      indent=2
                  )

          except Exception as e:

              result["status"] = "ERROR"
              result["error"] = str(e)
              result["exception"] = type(e).__name__
              result["traceback"] = traceback.format_exc()

              print("")
              print("=" * 70)
              print("                     GPU ERROR")
              print("=" * 70)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              traceback.print_exc()

              try:
                  with open(
                      "/kaggle/working/session_result.json",
                      "w",
                  ) as f:

                      json.dump(
                          result,
                          f,
                          indent=2
                      )
              except Exception:
                  pass

              raise

          PYEOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json

      - name: Submit Kaggle GPU
        shell: bash
        run: |
          set -e

          kaggle kernels push -p kaggle_session

          echo "Kaggle worker submitted."

      - name: Wait for Kaggle
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p kaggle_output

          FINAL_STATUS="UNKNOWN"

          echo "======================================"
          echo "WAITING FOR KAGGLE"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          for i in $(seq 1 180); do

            echo ""
            echo "CHECK $i/180"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then
              FINAL_STATUS="COMPLETE"
              echo "Kaggle session complete."
              break
            fi

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "======================================"
              echo "KAGGLE SESSION ERROR"
              echo "======================================"

              rm -rf kaggle_output
              mkdir -p kaggle_output

              kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force \
                2>&1 || true

              echo ""
              echo "OUTPUT FILES:"

              find kaggle_output \
                -type f \
                -print \
                2>/dev/null || true

              echo ""
              echo "OUTPUT CONTENT:"

              while IFS= read -r file; do
                echo ""
                echo "===== $file ====="
                cat "$file" 2>/dev/null || true
              done < <(
                find kaggle_output \
                  -type f \
                  2>/dev/null
              )

              break
            fi

            sleep 5

          done

          echo ""
          echo "FINAL_STATUS=$FINAL_STATUS"

          if [ "$FINAL_STATUS" != "COMPLETE" ]; then
            echo "Kaggle worker failed."
            exit 1
          fi

      - name: Download final output
        if: always()
        shell: bash
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          rm -rf final_output
          mkdir -p final_output

          kaggle kernels output \
            "$KERNEL" \
            -p final_output \
            --force \
            2>&1 || true

          echo "======================================"
          echo "FINAL KAGGLE FILES"
          echo "======================================"

          find final_output \
            -type f \
            -print \
            2>/dev/null || true

      - name: Upload session artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: final_output/
          if-no-files-found: warn

      - name: Final
        if: always()
        run: |
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"
          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
