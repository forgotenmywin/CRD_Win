name: Kaggle GPU Session

run-name: GPU-SESSION-${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: GPU Session ID
        required: true
        type: string

      api_url:
        description: Public GPU API URL
        required: true
        type: string

      worker_token:
        description: Worker authentication token
        required: true
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      API_URL: ${{ inputs.api_url }}
      WORKER_TOKEN: ${{ inputs.worker_token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "Python:"
          python --version

          echo "Kaggle:"
          kaggle --version

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$SESSION_ID"
          test -n "$API_URL"
          test -n "$WORKER_TOKEN"

          echo "Session: $SESSION_ID"
          echo "API: $API_URL"

      - name: Create Kaggle worker
        run: |
          set -e

          rm -rf kaggle_session
          mkdir -p kaggle_session

          cat > kaggle_session/script.py <<'PYEOF'
          import os
          import time
          import json
          import traceback
          import subprocess

          SESSION_ID = os.environ.get("SESSION_ID", "unknown")
          API_URL = os.environ.get("API_URL", "")
          WORKER_TOKEN = os.environ.get("WORKER_TOKEN", "")

          print("=" * 60)
          print("GPU SESSION WORKER")
          print("=" * 60)

          print("SESSION_ID:", SESSION_ID)
          print("API_URL:", API_URL)

          result = {
              "session_id": SESSION_ID,
              "status": "ERROR"
          }

          try:
              print("=" * 60)
              print("NVIDIA GPU")
              print("=" * 60)

              smi = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(smi.stdout)

              print("=" * 60)
              print("PYTORCH")
              print("=" * 60)

              import torch

              print("PyTorch:", torch.__version__)
              print("Torch CUDA:", torch.version.cuda)

              if not torch.cuda.is_available():
                  raise RuntimeError(
                      "CUDA is not available"
                  )

              gpu_name = torch.cuda.get_device_name(0)
              capability = torch.cuda.get_device_capability(0)
              props = torch.cuda.get_device_properties(0)

              print("GPU:", gpu_name)
              print("Compute capability:", capability)
              print(
                  "VRAM MB:",
                  round(
                      props.total_memory / 1024 / 1024,
                      2
                  )
              )

              result["gpu"] = gpu_name
              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1])
              ]
              result["cuda_available"] = True

              print("=" * 60)
              print("GPU TEST")
              print("=" * 60)

              device = torch.device("cuda:0")

              n = 1024 * 1024

              a = torch.randn(
                  n,
                  device=device,
                  dtype=torch.float32
              )

              b = torch.randn(
                  n,
                  device=device,
                  dtype=torch.float32
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a + b

              torch.cuda.synchronize()

              elapsed = time.perf_counter() - start

              checksum = float(
                  c[:1000].sum().item()
              )

              print(
                  "GPU computation successful"
              )

              print(
                  "Time:",
                  elapsed
              )

              print(
                  "Checksum:",
                  checksum
              )

              result["status"] = "READY"

              result["test"] = {
                  "elements": n,
                  "time_seconds": elapsed,
                  "checksum": checksum
              }

              del a
              del b
              del c

              torch.cuda.empty_cache()

              print("=" * 60)
              print("GPU SESSION READY")
              print("=" * 60)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              print("Worker alive.")

              for i in range(600):
                  print(
                      "GPU SESSION ALIVE:",
                      i + 1
                  )
                  time.sleep(1)

          except Exception as e:
              result["status"] = "ERROR"
              result["error"] = str(e)
              result["exception"] = type(e).__name__
              result["traceback"] = traceback.format_exc()

              print("=" * 60)
              print("GPU ERROR")
              print("=" * 60)

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )

              traceback.print_exc()
              raise

          PYEOF

          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_session/kernel-metadata.json

          echo "======================================"
          echo "SCRIPT HEAD"
          echo "======================================"

          sed -n '1,30p' kaggle_session/script.py

      - name: Submit Kaggle GPU
        run: |
          set -e

          echo "Submitting Kaggle worker..."

          kaggle kernels push -p kaggle_session

          echo "Kaggle worker submitted."

      - name: Wait for Kaggle
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          mkdir -p kaggle_output

          FINAL_STATUS="UNKNOWN"

          echo "======================================"
          echo "WAITING FOR KAGGLE"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          for i in $(seq 1 180); do
            echo ""
            echo "CHECK $i/180"

            STATUS="$(kaggle kernels status "$KERNEL" 2>&1)"

            echo "$STATUS"

            if echo "$STATUS" | grep -q "KernelWorkerStatus.COMPLETE"; then
              FINAL_STATUS="COMPLETE"
              echo "Kaggle session complete."
              break
            fi

            if echo "$STATUS" | grep -q "KernelWorkerStatus.ERROR"; then
              FINAL_STATUS="ERROR"

              echo ""
              echo "======================================"
              echo "KAGGLE SESSION ERROR"
              echo "======================================"

              echo ""
              echo "DOWNLOADING KAGGLE OUTPUT..."

              kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force 2>&1 || true

              echo ""
              echo "FILES:"
              find kaggle_output -type f -print 2>/dev/null || true

              echo ""
              echo "CONTENTS:"

              while IFS= read -r file; do
                echo ""
                echo "===== $file ====="
                cat "$file" 2>/dev/null || true
              done < <(
                find kaggle_output -type f 2>/dev/null
              )

              break
            fi

            sleep 5
          done

          echo ""
          echo "FINAL_STATUS=$FINAL_STATUS"

          if [ "$FINAL_STATUS" != "COMPLETE" ]; then
            echo "Kaggle worker failed."
            exit 1
          fi

      - name: Final
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "GPU SESSION FINISHED"
          echo "======================================"

          echo "SESSION_ID=$SESSION_ID"
          echo "API_URL=$API_URL"
