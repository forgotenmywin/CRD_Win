name: Kaggle GPU Command Runner

on:
  workflow_dispatch:

jobs:
  gpu-test:

    runs-on: ubuntu-latest

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL KAGGLE
      # ============================================================

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle

          echo "========================================"
          echo "KAGGLE CLI"
          echo "========================================"

          kaggle --version


      # ============================================================
      # CHECK SECRETS
      # ============================================================

      - name: Check Kaggle Credentials
        run: |
          echo "========================================"
          echo "KAGGLE CREDENTIAL CHECK"
          echo "========================================"

          echo ""
          echo "Username:"
          echo "$KAGGLE_USERNAME"

          echo ""
          echo "Username length:"
          echo "${#KAGGLE_USERNAME}"

          echo ""
          echo "Token length:"
          echo "${#KAGGLE_API_TOKEN}"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo ""
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo ""
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo ""
          echo "Credentials detected."


      # ============================================================
      # TEST KAGGLE API
      # ============================================================

      - name: Test Kaggle API
        run: |
          echo "========================================"
          echo "TESTING KAGGLE API"
          echo "========================================"

          kaggle kernels list \
            --mine \
            --page-size 5


      # ============================================================
      # CHECK COMMANDS FILE
      # ============================================================

      - name: Check commands.txt
        run: |
          echo "========================================"
          echo "CHECKING COMMANDS FILE"
          echo "========================================"

          if [ ! -f "commands.txt" ]; then
            echo ""
            echo "ERROR: commands.txt NOT FOUND"
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            echo ""
            echo "Create commands.txt in the ROOT of the repository."
            exit 1
          fi

          echo ""
          echo "commands.txt found."

          echo ""
          echo "Commands:"
          nl -ba commands.txt


      # ============================================================
      # CREATE GPU KERNEL
      # ============================================================

      - name: Create Kaggle GPU Kernel
        run: |

          echo "========================================"
          echo "CREATING KAGGLE GPU KERNEL"
          echo "========================================"

          rm -rf kaggle-gpu-test

          mkdir -p kaggle-gpu-test


          # --------------------------------------------------------
          # Copy commands.txt
          # --------------------------------------------------------

          cp commands.txt kaggle-gpu-test/commands.txt


          # --------------------------------------------------------
          # Create GPU worker
          # --------------------------------------------------------

          cat > kaggle-gpu-test/gpu_worker.py <<'PY'
          import os
          import sys
          import subprocess
          import platform
          import shutil
          from datetime import datetime


          RESULT_FILE = "/kaggle/working/result.txt"
          COMMANDS_FILE = "/kaggle/working/commands.txt"


          def write(text=""):
              print(text, flush=True)

              with open(
                  RESULT_FILE,
                  "a",
                  encoding="utf-8",
                  errors="replace"
              ) as f:
                  f.write(text + "\n")


          def run_command(command, number):

              write("")
              write("#" * 80)
              write(f"# COMMAND {number}")
              write("#" * 80)
              write("")
              write(f"$ {command}")
              write("")

              try:

                  process = subprocess.run(
                      command,
                      shell=True,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      executable="/bin/bash"
                  )

                  if process.stdout:
                      write(process.stdout.rstrip())

                  if process.stderr:
                      write("")
                      write("STDERR:")
                      write(process.stderr.rstrip())

                  write("")
                  write(f"Return code: {process.returncode}")

                  return process.returncode

              except Exception as e:

                  write("")
                  write("EXCEPTION:")
                  write(str(e))

                  return 1


          # ========================================================
          # START
          # ========================================================

          if os.path.exists(RESULT_FILE):
              os.remove(RESULT_FILE)


          write("=" * 80)
          write("KAGGLE GPU COMMAND RUNNER")
          write("=" * 80)

          write("")
          write("Start time:")
          write(datetime.utcnow().isoformat())

          write("")
          write("Python:")
          write(sys.version)

          write("")
          write("Platform:")
          write(platform.platform())

          write("")
          write("Current directory:")
          write(os.getcwd())

          write("")
          write("Commands file:")
          write(COMMANDS_FILE)


          # ========================================================
          # CHECK COMMANDS
          # ========================================================

          if not os.path.exists(COMMANDS_FILE):

              write("")
              write("ERROR: commands.txt NOT FOUND")

              write("")
              write("Available files:")

              for root, dirs, files in os.walk("/kaggle/working"):

                  for file in files:

                      write(
                          os.path.join(root, file)
                      )

              sys.exit(1)


          # ========================================================
          # SHOW OS
          # ========================================================

          write("")
          write("=" * 80)
          write("OPERATING SYSTEM")
          write("=" * 80)

          if os.path.exists("/etc/os-release"):

              try:

                  with open(
                      "/etc/os-release",
                      "r",
                      encoding="utf-8"
                  ) as f:

                      write(f.read().rstrip())

              except Exception as e:

                  write(str(e))

          else:

              write("/etc/os-release not found")


          # ========================================================
          # INSTALL PCIUTILS
          # ========================================================

          write("")
          write("=" * 80)
          write("CHECKING PCIUTILS")
          write("=" * 80)

          lspci_path = shutil.which("lspci")

          if lspci_path:

              write(f"lspci found: {lspci_path}")

          else:

              write("lspci not found.")

              apt_path = shutil.which("apt-get")

              if apt_path:

                  write("apt-get detected.")
                  write("Trying to install pciutils...")

                  try:

                      process = subprocess.run(
                          [
                              "bash",
                              "-c",
                              "apt-get update -qq && apt-get install -y pciutils"
                          ],
                          text=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE
                      )

                      if process.stdout:
                          write(process.stdout.rstrip())

                      if process.stderr:
                          write("")
                          write("APT STDERR:")
                          write(process.stderr.rstrip())

                      write("")
                      write(
                          f"pciutils install return code: "
                          f"{process.returncode}"
                      )

                  except Exception as e:

                      write(
                          f"pciutils installation error: {e}"
                      )

              else:

                  write("apt-get not available.")


          # ========================================================
          # GPU BASIC TEST
          # ========================================================

          write("")
          write("=" * 80)
          write("GPU BASIC TEST")
          write("=" * 80)

          run_command("nvidia-smi -L", 0)

          run_command("nvidia-smi", 0)

          run_command(
              "lspci | grep -i nvidia",
              0
          )

          run_command(
              "lspci | grep -i vga",
              0
          )


          # ========================================================
          # READ COMMANDS
          # ========================================================

          write("")
          write("=" * 80)
          write("READING commands.txt")
          write("=" * 80)

          with open(
              COMMANDS_FILE,
              "r",
              encoding="utf-8",
              errors="replace"
          ) as f:

              lines = f.readlines()


          commands = []

          for line in lines:

              line = line.strip()

              # Empty line
              if not line:
                  continue

              # Comment
              if line.startswith("#"):
                  continue

              commands.append(line)


          write("")
          write(f"Commands found: {len(commands)}")


          # ========================================================
          # RUN COMMANDS
          # ========================================================

          for index, command in enumerate(
              commands,
              start=1
          ):

              write("")
              write(
                  f"COMMAND {index} / {len(commands)}"
              )

              run_command(
                  command,
                  index
              )


          # ========================================================
          # FINISH
          # ========================================================

          write("")
          write("=" * 80)
          write("ALL COMMANDS FINISHED")
          write("=" * 80)

          write("")
          write("Finish time:")
          write(datetime.utcnow().isoformat())

          write("")
          write(f"Result file: {RESULT_FILE}")

          write("")
          write("=" * 80)
          write("GPU COMMAND RUNNER FINISHED")
          write("=" * 80)
          PY


          # ========================================================
          # CREATE KERNEL SLUG
          # ========================================================

          KERNEL_SLUG="gpu-command-runner-${GITHUB_RUN_ID}"

          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"


          # ========================================================
          # METADATA
          # ========================================================

          cat > kaggle-gpu-test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "gpu_worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": false,
            "enable_gpu": true,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaP100"
          }
          EOF


          # ========================================================
          # SHOW FILES
          # ========================================================

          echo ""
          echo "========================================"
          echo "KAGGLE FILES"
          echo "========================================"

          find kaggle-gpu-test \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "========================================"
          echo "METADATA"
          echo "========================================"

          cat kaggle-gpu-test/kernel-metadata.json

          echo ""
          echo "========================================"
          echo "COMMANDS"
          echo "========================================"

          cat kaggle-gpu-test/commands.txt


      # ============================================================
      # PUSH KERNEL
      # ============================================================

      - name: Push GPU Kernel
        run: |

          echo "========================================"
          echo "PUSHING GPU KERNEL"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""

          kaggle kernels push \
            -p kaggle-gpu-test

          echo ""
          echo "========================================"
          echo "KAGGLE KERNEL PUSHED"
          echo "========================================"

          echo ""
          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG}"

          echo ""
          echo "Open this kernel in Kaggle to see its output."


      # ============================================================
      # FINISH
      # ============================================================

      - name: Finish
        if: always()
        run: |

          echo ""
          echo "############################################################"
          echo "#                     FINISHED                             #"
          echo "############################################################"

          echo ""
          echo "KERNEL:"
          echo "${KAGGLE_USERNAME}/${KERNEL_SLUG:-unknown}"

          echo ""
          echo "The GitHub Action does NOT call:"
          echo "  kaggle kernels output"
          echo "  kaggle kernels delete"

          echo ""
          echo "This avoids the kernels.get permission error."
