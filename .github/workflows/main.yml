name: Kaggle GPU Worker

on:
  workflow_dispatch:
    inputs:
      job_code:
        description: "Python GPU job"
        required: true
        type: string

jobs:
  gpu-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_CODE: ${{ inputs.job_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dynamic job
        run: |
          python - <<'PY'
          import os

          code = os.environ["JOB_CODE"]

          with open("job.py", "w", encoding="utf-8") as f:
              f.write(code)

          print("Dynamic job created")
          print("Job size:", len(code), "bytes")
          PY

      - name: Show job information
        run: |
          echo "Job file:"
          ls -lh job.py
          echo "Lines:"
          wc -l job.py

      - name: Run Kaggle GPU Worker
        run: |
          python worker.py

      - name: Show Kaggle output
        if: always()
        run: |
          echo "======================================"
          echo "KAGGLE OUTPUT FILES"
          echo "======================================"

          if [ -d "kaggle_output" ]; then
            find kaggle_output -type f -print
          else
            echo "No kaggle_output directory"
          fi

      - name: Create result information
        if: always()
        run: |
          mkdir -p kaggle_output

          printf '%s\n' \
            '======================================' \
            '       KAGGLE GPU WORKER RESULT' \
            '======================================' \
            "Repository: ${GITHUB_REPOSITORY}" \
            "Run ID: ${GITHUB_RUN_ID}" \
            "Workflow: ${GITHUB_WORKFLOW}" \
            '======================================' \
            > kaggle_output/github_result.txt

      - name: Final output check
        if: always()
        run: |
          echo "======================================"
          echo "FINAL OUTPUT"
          echo "======================================"

          if [ -d "kaggle_output" ]; then
            find kaggle_output -type f -exec ls -lh {} \;
          fi

      - name: Upload Kaggle result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result
          path: kaggle_output/
          if-no-files-found: ignore

      - name: Final status
        if: success()
        run: |
          echo "======================================"
          echo "GPU WORKER COMPLETED"
          echo "======================================"
          echo "Kaggle GPU job completed successfully."
          echo "Artifact: kaggle-gpu-result"
