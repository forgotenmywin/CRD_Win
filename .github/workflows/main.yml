name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Session action"
        required: true
        type: choice
        options:
          - start
          - stop

      session_id:
        description: "GPU session ID"
        required: true
        type: string

      duration:
        description: "Session duration in minutes"
        required: false
        default: "20"
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      SESSION_ID: ${{ inputs.session_id }}
      MAX_SESSION_MINUTES: ${{ inputs.duration }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Check Kaggle credentials
        run: |
          python -m kaggle --version
          python -m kaggle kernels list --user "$KAGGLE_USERNAME" --max-size 1

      - name: Prepare session notebook
        if: inputs.action == 'start'
        run: |
          mkdir -p kaggle_session

          python - <<'PY'
          import json
          import os

          session_id = os.environ["SESSION_ID"]
          duration = os.environ["MAX_SESSION_MINUTES"]

          with open("session_server.py", "r", encoding="utf-8") as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": [
                          code
                      ]
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python",
                      "version": "3.12"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_session/gpu_session.ipynb",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(notebook, f, indent=2)

          metadata = {
              "id": f"{os.environ['KAGGLE_USERNAME']}/gpu-session-{session_id}",
              "title": f"GPU Session {session_id}",
              "code_file": "gpu_session.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True
          }

          with open(
              "kaggle_session/kernel-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(metadata, f, indent=2)
          PY

      - name: Start Kaggle GPU session
        if: inputs.action == 'start'
        run: |
          cd kaggle_session

          python -m kaggle kernels push

          echo "======================================"
          echo "KAGGLE GPU SESSION REQUESTED"
          echo "======================================"

          echo "Waiting for Kaggle..."

          for i in $(seq 1 60); do

            STATUS=$(python -m kaggle kernels status \
              "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "RUNNING"; then
              echo ""
              echo "======================================"
              echo "GPU SESSION IS RUNNING"
              echo "======================================"
              exit 0
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo ""
              echo "GPU SESSION FAILED"
              echo "Reason: Kaggle returned ERROR"
              exit 1
            fi

            if echo "$STATUS" | grep -q "CANCEL"; then
              echo ""
              echo "GPU SESSION CANCELLED"
              exit 1
            fi

            sleep 5
          done

          echo "GPU did not become available in time."
          echo "Reason: Kaggle queue or availability limit."
          exit 1

      - name: Stop Kaggle GPU session
        if: inputs.action == 'stop'
        run: |
          echo "Stopping GPU session..."

          python -m kaggle kernels cancel \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" || true

          echo "======================================"
          echo "GPU SESSION STOPPED"
          echo "======================================"

      - name: Download session output
        if: always() && inputs.action == 'start'
        run: |
          mkdir -p kaggle_output

          python -m kaggle kernels output \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
            -p kaggle_output || true

          find kaggle_output -type f -print || true

      - name: Upload result
        if: always() && inputs.action == 'start'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: kaggle_output/
          if-no-files-found: ignore
