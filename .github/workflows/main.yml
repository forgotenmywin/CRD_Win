name: Run Repo File on Kaggle GPU

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Kaggle Auth
        run: |
          mkdir -p ~/.kaggle
          # روش جدید: access_token
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          # روش پشتیبان: kaggle.json
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_API_TOKEN }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          # متغیر محیطی
          echo "KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }}" >> $GITHUB_ENV

      - name: Test Kaggle Auth
        run: |
          export KAGGLE_API_TOKEN="${{ secrets.KAGGLE_API_TOKEN }}"
          kaggle kernels list --user "${{ secrets.KAGGLE_USERNAME }}" --page-size 1

      - name: Prepare Kaggle Kernel
        run: |
          mkdir -p kaggle_push
          cp kaggle_gpu.py kaggle_push/script.py
          cat > kaggle_push/kernel-metadata.json <<EOF
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/repo-gpu-run",
            "title": "Repo GPU Run",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF

      - name: Push to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          cd kaggle_push
          kaggle kernels push -p .

      - name: Wait for Run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/repo-gpu-run"
          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$SLUG" 2>/dev/null | tail -1 | awk '{print $NF}')
            echo "[$i/120] Status: ${STATUS:-waiting}"
            [ "$STATUS" = "complete" ] && echo "Done!" && break
            [ "$STATUS" = "error" ] && echo "Error!" && break
            sleep 10
          done

      - name: Download Output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/repo-gpu-run"
          mkdir -p output
          kaggle kernels output "$SLUG" -p output --force || true

      - name: Show Logs
        run: |
          echo "========== LOG =========="
          cat output/log* 2>/dev/null || true
          echo ""
          echo "========== FILES =========="
          find output -type f

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-output
          path: output/**
