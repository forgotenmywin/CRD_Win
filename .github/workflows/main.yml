name: Kaggle GPU Worker

on:
  workflow_dispatch:
    inputs:
      job_code:
        description: "Python GPU job"
        required: true
        type: string

jobs:
  gpu-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_CODE: ${{ inputs.job_code }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dynamic job
        run: |
          python - <<'PY'
          import os

          with open("job.py", "w", encoding="utf-8") as f:
              f.write(os.environ["JOB_CODE"])

          print("Dynamic job created.")
          PY

      - name: Run Kaggle GPU Worker
        run: |
          python worker.py

      - name: Show output
        if: always()
        run: |
          echo "======================================"
          echo "        KAGGLE OUTPUT FILES"
          echo "======================================"

          find kaggle_output -type f -maxdepth 3 -print || true

          echo ""
          echo "======================================"
          echo "        OUTPUT CONTENT"
          echo "======================================"

          for file in kaggle_output/*; do
            if [ -f "$file" ]; then
              echo ""
              echo "===== $file ====="
              cat "$file" || true
            fi
          done

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-result
          path: kaggle_output/
          if-no-files-found: ignore
