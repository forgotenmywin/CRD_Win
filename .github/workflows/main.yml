name: Run Kaggle GPU (Cloudflare)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Kaggle
        run: |
          pip install kaggle
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      
      - name: Push to Kaggle
        env:
          TAILSCALE_AUT: ${{ secrets.TAILSCALE_AUT }}   # ← TAILSCALE_AUT
        run: |
          cat > kernel-metadata.json << 'EOF'
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/kaggle-gpu-tunnel",
            "title": "GPU Tunnel CF",
            "code_file": "kaggle.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
          
          kaggle kernels push -p ./
          sleep 60
          kaggle kernels status ${{ secrets.KAGGLE_USERNAME }}/kaggle-gpu-tunnel
