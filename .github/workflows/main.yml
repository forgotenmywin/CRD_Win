name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      action:
        description: "GPU session action"
        required: true
        type: choice
        options:
          - start
          - stop

      session_id:
        description: "GPU session ID"
        required: true
        type: string

      duration:
        description: "Session duration in minutes"
        required: false
        default: "20"
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      MAX_SESSION_MINUTES: ${{ inputs.duration }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Check Kaggle CLI
        run: |
          python -m kaggle --version
          echo "Kaggle credentials configured"

      # ==========================================
      # START SESSION
      # ==========================================

      - name: Prepare GPU session
        if: inputs.action == 'start'
        run: |
          mkdir -p kaggle_session

          python - <<'PY'
          import json
          import os

          username = os.environ["KAGGLE_USERNAME"]
          session_id = os.environ["SESSION_ID"]

          with open("session_server.py", "r", encoding="utf-8") as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python",
                      "version": "3.12"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_session/gpu_session.ipynb",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(notebook, f, indent=2)

          metadata = {
              "id": f"{username}/gpu-session-{session_id}",
              "title": f"GPU Session {session_id}",
              "code_file": "gpu_session.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True
          }

          with open(
              "kaggle_session/kernel-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(metadata, f, indent=2)

          print("GPU session prepared")
          print("Session ID:", session_id)
          print("Kaggle kernel:", f"{username}/gpu-session-{session_id}")
          PY

      - name: Push GPU session to Kaggle
        if: inputs.action == 'start'
        run: |
          cd kaggle_session

          python -m kaggle kernels push

          echo "======================================"
          echo "KAGGLE GPU SESSION REQUESTED"
          echo "======================================"

      - name: Wait for GPU
        if: inputs.action == 'start'
        run: |
          echo "Waiting for Kaggle GPU..."

          for i in $(seq 1 60); do

            echo ""
            echo "========== STATUS $i/60 =========="

            STATUS=$(python -m kaggle kernels status \
              "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "RUNNING"; then
              echo ""
              echo "======================================"
              echo "       GPU SESSION IS RUNNING"
              echo "======================================"
              echo "GPU session started successfully."
              exit 0
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo ""
              echo "======================================"
              echo "       GPU SESSION ERROR"
              echo "======================================"
              echo "Kaggle returned an ERROR."
              echo "Possible reasons:"
              echo "- GPU quota reached"
              echo "- GPU unavailable"
              echo "- Kaggle rejected the notebook"
              exit 1
            fi

            if echo "$STATUS" | grep -q "CANCEL"; then
              echo ""
              echo "GPU session was cancelled."
              exit 1
            fi

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "       GPU UNAVAILABLE"
          echo "======================================"
          echo "Kaggle did not start the GPU within the waiting period."
          echo "Possible reason: GPU queue or quota."
          exit 1

      # ==========================================
      # STOP SESSION
      # ==========================================

      - name: Stop GPU session
        if: inputs.action == 'stop'
        run: |
          echo "======================================"
          echo "       STOPPING GPU SESSION"
          echo "======================================"

          python -m kaggle kernels cancel \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" || true

          echo ""
          echo "GPU session stop requested."

      # ==========================================
      # OUTPUT
      # ==========================================

      - name: Download session output
        if: always() && inputs.action == 'start'
        run: |
          mkdir -p kaggle_output

          python -m kaggle kernels output \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
            -p kaggle_output || true

          echo ""
          echo "======================================"
          echo "       KAGGLE OUTPUT"
          echo "======================================"

          if [ -d "kaggle_output" ]; then
            find kaggle_output -type f -print
          else
            echo "No output directory."
          fi

      - name: Create session result
        if: always() && inputs.action == 'start'
        run: |
          mkdir -p kaggle_output

          cat > kaggle_output/session_result.txt <<EOF
          
======================================
       KAGGLE GPU SESSION
======================================

Session ID: $SESSION_ID
Action: ${{ inputs.action }}
Duration: $MAX_SESSION_MINUTES minutes

GitHub Run ID: $GITHUB_RUN_ID
Repository: $GITHUB_REPOSITORY

======================================
EOF

      - name: Upload session result
        if: always() && inputs.action == 'start'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: kaggle_output/
          if-no-files-found: ignore

      - name: Final status
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "       GPU SESSION COMPLETE"
          echo "======================================"

          if [ "${{ inputs.action }}" = "start" ]; then
            echo "GPU session started successfully."
          else
            echo "GPU session stopped successfully."
          fi
