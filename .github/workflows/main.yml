name: Run Repo File on Kaggle GPU

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Kaggle Auth
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }}" >> $GITHUB_ENV

      - name: Prepare & Push Kaggle Kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # هر بار اسم جدید → force new run
          ID="run-$(date +%s)"
          echo "RUN_ID=$ID" >> $GITHUB_ENV
          
          mkdir -p kaggle_push
          cp kaggle_gpu.py kaggle_push/script.py
          
          cat > kaggle_push/kernel-metadata.json <<EOF
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/repo-gpu-${ID}",
            "title": "GPU Run ${ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
          
          cd kaggle_push
          kaggle kernels push -p .

      - name: Wait for Run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/repo-gpu-${{ env.RUN_ID }}"
          echo "Waiting for: $SLUG"
          
          for i in $(seq 1 180); do
            RAW=$(kaggle kernels status "$SLUG" 2>/dev/null | tail -1)
            STATUS=$(echo "$RAW" | grep -oP 'status\s+\K\w+' || echo "$RAW" | awk '{print $NF}')
            echo "[$i/180] $STATUS"
            
            if echo "$STATUS" | grep -qi "complete"; then
              echo "Done!"
              break
            elif echo "$STATUS" | grep -qi "error"; then
              echo "Error!"
              break
            fi
            
            sleep 10
          done

      - name: Download Output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/repo-gpu-${{ env.RUN_ID }}"
          mkdir -p output
          kaggle kernels output "$SLUG" -p output --force || true
          
          echo "=== FILES ==="
          find output -type f -ls || true

      - name: Show Logs
        run: |
          echo "========== DEBUG LOG =========="
          cat output/debug_log.txt 2>/dev/null || echo "No debug_log.txt"
          
          echo ""
          echo "========== ALL FILES =========="
          find output -type f -exec echo "--- {}" \; -exec head -100 {} \;

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-${{ env.RUN_ID }}
          path: output/**
