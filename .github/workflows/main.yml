name: Kaggle GPU Worker

on:
  workflow_dispatch:

jobs:
  kaggle-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle
          python -m kaggle --help

      - name: Check Kaggle authentication
        run: |
          python -m kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Pull Kaggle Notebook
        run: |
          mkdir -p kaggle_kernel
          python -m kaggle kernels pull \
            darytredf/notebookd9d7092a0a \
            -p kaggle_kernel \
            -m

      - name: Show metadata
        run: |
          cat kaggle_kernel/kernel-metadata.json

      - name: Submit Kaggle GPU Job
        run: |
          python -m kaggle kernels push \
            -p kaggle_kernel

      - name: Check status
        run: |
          python -m kaggle kernels status \
            darytredf/notebookd9d7092a0a
