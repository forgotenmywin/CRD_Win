name: GPU Relay

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}

    steps:
      - name: Install Python deps
        run: |
          pip install websockets aiohttp

      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start Relay + Tunnels
        shell: bash
        run: |
          set -e

          # 1. Relay server
          cat > relay.py <<'PY'
          import asyncio
          import json
          import os
          import time
          import uuid
          from datetime import datetime, timezone

          import websockets
          from aiohttp import web

          AUTH = os.environ["TOKEN"]
          jobs = asyncio.Queue()
          results = {}
          state = {"connected": False, "jobs_done": 0}

          def log(m):
              t = datetime.now(timezone.utc).strftime("%H:%M:%S")
              print(f"[{t}] {m}", flush=True)

          async def ws_handler(ws, path):
              state["connected"] = True
              log("GPU Worker connected!")
              try:
                  while True:
                      j = await jobs.get()
                      j["_sent"] = time.perf_counter()
                      await ws.send(json.dumps(j))
                      r = json.loads(await asyncio.wait_for(ws.recv(), timeout=300))
                      r["_relay_ms"] = (time.perf_counter() - j["_sent"]) * 1000
                      results[j["id"]] = r
                      state["jobs_done"] += 1
                      log(f"Job {j['id']} done in {r['_relay_ms']:.1f}ms")
              except Exception as e:
                  log(f"Worker error: {e}")
                  state["connected"] = False

          async def add_job(request):
              try:
                  d = await request.json()
              except:
                  d = {}
              i = str(uuid.uuid4())[:8]
              await jobs.put({"id": i, **d})
              log(f"Queued job {i}")
              return web.json_response({"job_id": i, "status": "queued"})

          async def get_result(request):
              i = request.match_info["id"]
              if i in results:
                  return web.json_response({"status": "done", "result": results[i]})
              return web.json_response({"status": "pending"})

          async def status(request):
              return web.json_response(state)

          async def main():
              asyncio.create_task(
                  websockets.serve(ws_handler, "127.0.0.1", 8765, ping_interval=20, ping_timeout=60)
              )
              app = web.Application()
              app.router.add_post("/job", add_job)
              app.router.add_get("/result/{id}", get_result)
              app.router.add_get("/status", status)
              await web.AppRunner(app).setup()
              await web.TCPSite(app, "127.0.0.1", 8080).start()
              log("Relay ready! WS:8765 API:8080")
              await asyncio.Future()

          asyncio.run(main())
          PY

          nohup python3 relay.py > relay.log 2>&1 &
          echo "Relay PID: $!"
          sleep 3

          # 2. Cloudflare tunnel for WebSocket (Kaggle Worker)
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --no-autoupdate > ws.log 2>&1 &
          echo "WS tunnel PID: $!"
          
          # 3. Cloudflare tunnel for HTTP API (VPS Client)
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > api.log 2>&1 &
          echo "API tunnel PID: $!"

          # 4. Wait for tunnels
          echo "Waiting for Cloudflare tunnels..."
          sleep 20

          # Extract URLs
          WS_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' ws.log | head -1)
          API_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' api.log | head -1)

          echo ""
          echo "=== DEBUG ==="
          echo "--- WS log ---"
          head -10 ws.log || true
          echo "--- API log ---"
          head -10 api.log || true
          echo ""

          if [ -z "$WS_URL" ]; then
            echo "ERROR: WS tunnel URL not found!"
            cat ws.log
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "ERROR: API tunnel URL not found!"
            cat api.log
            exit 1
          fi

          WSS_URL=$(echo "$WS_URL" | sed 's/^https:/wss:/')/

          echo ""
          echo "================================"
          echo "WORKER WSS: $WSS_URL"
          echo "CLIENT API: $API_URL"
          echo "================================"
          echo ""
          echo "Copy WSS_URL to Kaggle notebook"
          echo "Copy API_URL to VPS Windows"
          echo ""

          echo "$WSS_URL" > wss_url.txt
          echo "$API_URL" > api_url.txt

          # Keep alive
          echo "Running for 6 hours..."
          for i in $(seq 1 4320); do
            sleep 5
            if [ $((i % 120)) -eq 0 ]; then
              MINS=$((i / 12))
              echo "... ${MINS}min elapsed"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-session
          path: |
            relay.log
            ws.log
            api.log
            wss_url.txt
            api_url.txt
