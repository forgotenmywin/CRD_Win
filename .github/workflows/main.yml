name: Run Repo File on Kaggle GPU

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - run: pip install kaggle

      - run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Push to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          ID="test-$(date +%s)"
          echo "ID=$ID" >> $GITHUB_ENV
          
          mkdir -p push
          cp kaggle_gpu.py push/script.py
          
          cat > push/kernel-metadata.json <<EOF
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/gpu-${ID}",
            "title": "gpu-${ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
          
          cd push
          kaggle kernels push -p .

      - name: Wait
        run: |
          echo "Waiting 12 minutes..."
          sleep 720

      - name: Download
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/gpu-${{ env.ID }}"
          mkdir -p out
          kaggle kernels output "$SLUG" -p out --force || true
          
          echo "=== FILES ==="
          ls -la out/ || true
          
          echo "=== OUTPUT ==="
          cat out/output.txt 2>/dev/null || echo "No output.txt"
          
          echo "=== OTHER ==="
          find out -type f -exec echo "--- {}" \; -exec cat {} \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-result
          path: out/**
