name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      action:
        description: "GPU session action"
        required: true
        type: choice
        options:
          - start
          - stop

      session_id:
        description: "GPU session ID"
        required: true
        type: string

      duration:
        description: "Session duration in minutes"
        required: false
        default: "20"
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      DURATION: ${{ inputs.duration }}

    steps:

      # ==========================================
      # SETUP
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "======================================"
          echo "KAGGLE CLI"
          echo "======================================"

          python -m kaggle --version

      # ==========================================
      # PREPARE KAGGLE NOTEBOOK
      # ==========================================

      - name: Prepare GPU notebook
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_session

          cat > kaggle_session/gpu_session.py <<'PYTHON'
          import os
          import time
          import torch

          print("======================================")
          print("       GPU SESSION STARTING")
          print("======================================")

          session_id = os.environ.get("SESSION_ID", "unknown")
          duration = int(os.environ.get("DURATION", "20"))

          print("Session ID:", session_id)
          print("Requested duration:", duration, "minutes")
          print()

          print("Checking CUDA...")

          if not torch.cuda.is_available():
              print()
              print("======================================")
              print("       GPU UNAVAILABLE")
              print("======================================")
              print("CUDA is not available.")
              raise RuntimeError("CUDA unavailable")

          gpu = torch.cuda.get_device_name(0)

          print("CUDA: True")
          print("GPU:", gpu)
          print("CUDA version:", torch.version.cuda)

          print()
          print("======================================")
          print("       GPU SESSION ACTIVE")
          print("======================================")

          end_time = time.time() + duration * 60

          while True:

              remaining = int(end_time - time.time())

              if remaining <= 0:
                  break

              print(
                  "GPU ACTIVE | "
                  "GPU:", gpu,
                  "| Remaining:", remaining, "seconds",
                  flush=True
              )

              time.sleep(10)

          print()
          print("======================================")
          print("       GPU SESSION FINISHED")
          print("======================================")

          print("Session:", session_id)
          print("GPU:", gpu)
          print("Status: SUCCESS")
          PYTHON

          python - <<'PY'
          import json

          with open(
              "kaggle_session/gpu_session.py",
              "r",
              encoding="utf-8"
          ) as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_session/gpu_session.ipynb",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(notebook, f, indent=2)

          print("Notebook created.")

      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle metadata
        if: ${{ inputs.action == 'start' }}
        run: |
          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "gpu_session.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "Metadata:"
          cat kaggle_session/kernel-metadata.json

      # ==========================================
      # PUSH TO KAGGLE
      # ==========================================

      - name: Push GPU session
        if: ${{ inputs.action == 'start' }}
        run: |
          cd kaggle_session

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "       GPU JOB SUBMITTED"
          echo "======================================"

          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for GPU
        if: ${{ inputs.action == 'start' }}
        run: |
          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          for i in $(seq 1 60)
          do

            echo ""
            echo "========== STATUS ${i}/60 =========="

            STATUS_OUTPUT=$(python -m kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS_OUTPUT"

            if echo "$STATUS_OUTPUT" | grep -Fq 'status "KernelWorkerStatus.RUNNING"'
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION IS RUNNING"
              echo "======================================"

              echo "Kaggle successfully allocated the GPU."

              break
            fi

            if echo "$STATUS_OUTPUT" | grep -Fq 'status "KernelWorkerStatus.COMPLETE"'
            then
              echo ""
              echo "Kaggle completed the notebook."

              break
            fi

            if echo "$STATUS_OUTPUT" | grep -Fq 'status "KernelWorkerStatus.ERROR"'
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION ERROR"
              echo "======================================"

              echo "$STATUS_OUTPUT"

              exit 1
            fi

            echo "Still waiting..."
            sleep 5

          done

      # ==========================================
      # DOWNLOAD RESULT
      # ==========================================

      - name: Download GPU output
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "======================================"
          echo "       DOWNLOADING OUTPUT"
          echo "======================================"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true

          echo ""
          echo "Files:"

          find kaggle_output -type f -print || true

      # ==========================================
      # CREATE RESULT
      # ==========================================

      - name: Create result
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_output

          cat > kaggle_output/session_result.txt <<EOF
          ======================================
                  KAGGLE GPU SESSION
          ======================================

          Session ID: ${SESSION_ID}

          Duration: ${DURATION} minutes

          GitHub Run ID: ${GITHUB_RUN_ID}

          Status: SUCCESS

          ======================================
          EOF

          cat kaggle_output/session_result.txt

      # ==========================================
      # UPLOAD RESULT
      # ==========================================

      - name: Upload result
        if: ${{ inputs.action == 'start' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: kaggle_output/
          if-no-files-found: ignore

      # ==========================================
      # STOP SESSION
      # ==========================================

      - name: Stop GPU session
        if: ${{ inputs.action == 'stop' }}
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "======================================"
          echo "       STOPPING GPU SESSION"
          echo "======================================"

          python -m kaggle kernels cancel "$KERNEL" || true

          echo ""
          echo "GPU stop request sent."

      # ==========================================
      # FINAL
      # ==========================================

      - name: Final message
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "Action: ${{ inputs.action }}"
          echo "Session: ${SESSION_ID}"
