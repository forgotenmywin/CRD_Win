name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      action:
        description: "start or stop"
        required: true
        type: choice
        options:
          - start
          - stop

      session_id:
        description: "GPU session ID"
        required: true
        type: string

      duration:
        description: "Session duration in minutes"
        required: false
        default: "20"
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      DURATION: ${{ inputs.duration }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Check Kaggle
        run: |
          python -m kaggle --version
          echo "Kaggle CLI ready"

      - name: Prepare notebook
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_session

          python - <<'PY'
          import json
          import os

          username = os.environ["KAGGLE_USERNAME"]
          session_id = os.environ["SESSION_ID"]

          code = '''
          import os
          import time
          import torch

          print("======================================")
          print("       GPU SESSION STARTED")
          print("======================================")

          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              print("GPU unavailable")
              raise SystemExit(2)

          gpu = torch.cuda.get_device_name(0)

          print("GPU:", gpu)
          print("CUDA:", torch.version.cuda)
          print("Session:", os.environ.get("SESSION_ID", "unknown"))

          print()
          print("GPU SESSION IS RUNNING")

          duration = int(os.environ.get("DURATION", "20"))
          end_time = time.time() + duration * 60

          while time.time() < end_time:
              remaining = int(end_time - time.time())

              print(
                  "GPU SESSION ACTIVE - remaining:",
                  remaining,
                  "seconds"
              )

              time.sleep(10)

          print()
          print("======================================")
          print("       GPU SESSION FINISHED")
          print("======================================")
          '''

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_session/gpu_session.ipynb",
              "w"
          ) as f:
              json.dump(notebook, f, indent=2)

          metadata = {
              "id": f"{username}/gpu-session-{session_id}",
              "title": f"GPU Session {session_id}",
              "code_file": "gpu_session.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True
          }

          with open(
              "kaggle_session/kernel-metadata.json",
              "w"
          ) as f:
              json.dump(metadata, f, indent=2)

          print("Notebook created successfully")

      - name: Push to Kaggle
        if: ${{ inputs.action == 'start' }}
        run: |
          cd kaggle_session

          python -m kaggle kernels push

          echo "Kaggle GPU job submitted"

      - name: Wait for GPU
        if: ${{ inputs.action == 'start' }}
        run: |
          echo "Waiting for Kaggle GPU..."

          for i in $(seq 1 60)
          do
            echo ""
            echo "========== STATUS $i/60 =========="

            python -m kaggle kernels status \
              "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
              || true

            STATUS=$(python -m kaggle kernels status \
              "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
              2>&1 || true)

            if echo "$STATUS" | grep -q "RUNNING"
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION IS RUNNING"
              echo "======================================"
              exit 0
            fi

            if echo "$STATUS" | grep -q "ERROR"
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION ERROR"
              echo "======================================"
              echo "$STATUS"
              exit 1
            fi

            sleep 5
          done

          echo ""
          echo "======================================"
          echo "       GPU NOT AVAILABLE"
          echo "======================================"
          echo "Kaggle did not start the GPU."
          echo "Possible quota or queue limitation."

          exit 1

      - name: Stop GPU session
        if: ${{ inputs.action == 'stop' }}
        run: |
          echo "Stopping GPU session..."

          python -m kaggle kernels cancel \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
            || true

          echo "GPU session stopped"

      - name: Download output
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_output

          python -m kaggle kernels output \
            "$KAGGLE_USERNAME/gpu-session-$SESSION_ID" \
            -p kaggle_output \
            || true

          echo "Output files:"

          find kaggle_output -type f \
            -print \
            || true

      - name: Upload result
        if: ${{ inputs.action == 'start' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-result
          path: kaggle_output/
          if-no-files-found: ignore
