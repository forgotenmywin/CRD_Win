name: GPU Relay

on: workflow_dispatch

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}
    steps:
      - run: pip install websockets aiohttp
      - run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o c
          chmod +x c && sudo mv c /usr/local/bin/
      - run: |
          cat > r.py <<'PY'
          import asyncio, json, os, time, uuid
          from datetime import datetime, timezone
          import websockets
          from aiohttp import web

          AUTH = os.environ["TOKEN"]
          jobs = asyncio.Queue()
          results = {}

          async def ws(ws, path):
              while True:
                  j = await jobs.get()
                  await ws.send(json.dumps(j))
                  r = json.loads(await asyncio.wait_for(ws.recv(), timeout=300))
                  results[j["id"]] = r

          async def job(req):
              d = await req.json()
              i = str(uuid.uuid4())[:8]
              await jobs.put({"id": i, **d})
              return web.json_response({"id": i})

          async def res(req):
              return web.json_response(results.get(req.match_info["id"], {"wait": True}))

          async def main():
              asyncio.create_task(websockets.serve(ws, "127.0.0.1", 8765))
              a = web.Application()
              a.router.add_post("/job", job)
              a.router.add_get("/result/{id}", res)
              await web.AppRunner(a).setup()
              await web.TCPSite(a, "127.0.0.1", 8080).start()
              print("READY", flush=True)
              await asyncio.Future()

          asyncio.run(main())
          PY
          nohup python3 r.py > r.log 2>&1 &
          sleep 2
          cloudflared tunnel --url http://127.0.0.1:8765 --no-autoupdate > w.log 2>&1 &
          cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > a.log 2>&1 &
          sleep 10
          W=$(grep -oE 'https://[^ ]+\.trycloudflare\.com' w.log | head -1 | sed 's/^https:/wss:/')/
          A=$(grep -oE 'https://[^ ]+\.trycloudflare\.com' a.log | head -1)
          echo ""
          echo "=== WORKER WSS ==="
          echo "$W"
          echo ""
          echo "=== CLIENT API ==="
          echo "$A"
          echo ""
          for i in $(seq 1 4320); do sleep 5; done
