name: Kaggle GPU Real-Time Test v5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_WORKER_TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip netcat-openbsd bc
          python3 -m pip install --upgrade pip
          python3 -m pip install kaggle websockets aiohttp

      - name: Check secrets
        shell: bash
        run: |
          set -u
          test -n "${KAGGLE_USERNAME:-}" || { echo "ERROR: KAGGLE_USERNAME is missing"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "ERROR: KAGGLE_API_TOKEN is missing"; exit 1; }
          test -n "${GPU_WORKER_TOKEN:-}" || { echo "ERROR: GPU_WORKER_TOKEN is missing"; exit 1; }
          echo "Secrets OK. Username: ${KAGGLE_USERNAME}"

      - name: Configure Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"
          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {"username": "${KAGGLE_USERNAME}", "key": "${KAGGLE_API_TOKEN}"}
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"
          echo "Kaggle config created"

      - name: Test Kaggle API
        shell: bash
        run: |
          echo "Testing Kaggle API..."
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1 || true
          echo "API test done"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      # ========== RELAY ==========
      - name: Create relay
        shell: bash
        run: |
          cat > relay.py <<'PY'
          import asyncio, json, os, time, uuid
          from datetime import datetime, timezone
          import websockets

          AUTH_TOKEN = os.environ["GPU_WORKER_TOKEN"]

          state = {
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "connections": [],
              "worker_connected": False,
              "job_sent_at": None,
              "result_received_at": None,
              "total_seconds": None,
              "gpu_info": None,
              "error": None
          }

          def log(msg):
              ts = datetime.now(timezone.utc).strftime('%H:%M:%S')
              line = f"[RELAY {ts}] {msg}"
              print(line, flush=True)
              with open("relay_debug.log", "a") as f:
                  f.write(line + "\n")

          async def handler(ws, path):
              remote = str(ws.remote_address)
              log(f"🔌 NEW CONNECTION from {remote}")
              state["connections"].append({"time": time.time(), "remote": remote})
              
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
                  log(f"📨 Auth: type={msg.get('type')} worker={msg.get('worker_id', 'unknown')}")
                  
                  if msg.get("type") != "auth" or msg.get("token") != AUTH_TOKEN:
                      log("❌ Auth failed")
                      await ws.send(json.dumps({"type": "auth_failed"}))
                      return
                      
                  worker_id = msg.get("worker_id", str(uuid.uuid4()))
                  await ws.send(json.dumps({"type": "auth_ok", "worker_id": worker_id}))
                  log(f"✅ Auth OK: {worker_id}")
                  state["worker_connected"] = True
              except Exception as e:
                  log(f"❌ Auth error: {e}")
                  return

              # Send job
              job = {"job_id": 1, "type": "gpu_job", "operation": "gpu_info"}
              state["job_sent_at"] = time.perf_counter()
              await ws.send(json.dumps(job))
              log(f"📤 Job sent")

              # Wait result
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=300)
                  state["result_received_at"] = time.perf_counter()
                  msg = json.loads(raw)
                  log(f"📥 Result: {msg.get('type')}")
                  
                  if msg.get("type") == "gpu_result":
                      state["total_seconds"] = state["result_received_at"] - state["job_sent_at"]
                      state["gpu_info"] = msg
                      log(f"✅ SUCCESS: {state['total_seconds']:.2f}s")
                  else:
                      state["error"] = f"Unexpected: {msg}"
                      log(f"❌ Unexpected: {msg}")
              except asyncio.TimeoutError:
                  state["error"] = "Timeout"
                  log("❌ TIMEOUT")

              with open("test_result.json", "w") as f:
                  json.dump(state, f, indent=2)
              log("💾 Result saved")
              await ws.close()

          async def main():
              log("🚀 Starting relay on ws://127.0.0.1:8765")
              async with websockets.serve(handler, "127.0.0.1", 8765, ping_interval=20, ping_timeout=60):
                  await asyncio.sleep(600)

          asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          nohup python3 relay.py > relay.log 2>&1 &
          sleep 2
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -u
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --protocol http2 --no-autoupdate > cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              WSS_URL=$(echo "$URL" | sed 's#^https://#wss://#')/
              echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"
              echo "✅ Tunnel: $WSS_URL"
              break
            fi
            sleep 2
          done
          test -n "$WSS_URL" || { echo "Tunnel failed"; cat cloudflared.log; exit 1; }

      # ========== CREATE WORKER ==========
      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_test && mkdir -p kaggle_test/worker
          
          # IMPORTANT: Use simple slug without special chars
          KERNEL_SLUG="gpuw-test-$(date +%s)"
          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"
          
          cat > kaggle_test/worker/worker.py <<PYWORKER
          import asyncio
          import json
          import os
          import subprocess
          import sys
          import time
          import traceback
          import uuid
          from datetime import datetime, timezone

          # Install websockets first thing
          print("[WORKER] Installing websockets...")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "websockets"])
          import websockets

          WSS_URL = "${WSS_URL}"
          AUTH_TOKEN = "${GPU_WORKER_TOKEN}"
          WORKER_ID = "kgpu-" + str(uuid.uuid4())[:8]

          def log(msg):
              ts = datetime.now(timezone.utc).strftime('%H:%M:%S')
              line = f"[WORKER {ts}] {msg}"
              print(line, flush=True)
              with open("/kaggle/working/debug.log", "a") as f:
                  f.write(line + "\n")

          def gpu_info():
              try:
                  p = subprocess.run(["nvidia-smi", "-L"], capture_output=True, text=True, timeout=10)
                  return p.stdout.strip()
              except Exception as e:
                  return f"Error: {e}"

          async def main():
              log(f"🚀 START {WORKER_ID}")
              log(f"WSS_URL={WSS_URL}")
              log(f"GPU={gpu_info()}")
              
              ws = None
              try:
                  for attempt in range(1, 31):
                      try:
                          log(f"🔌 Connect attempt {attempt}/30...")
                          ws = await websockets.connect(WSS_URL, open_timeout=30, close_timeout=10)
                          log("✅ CONNECTED")
                          break
                      except Exception as e:
                          log(f"❌ Connect error: {str(e)[:200]}")
                          await asyncio.sleep(min(attempt * 2, 15))
                  
                  if not ws:
                      raise RuntimeError("Failed to connect after 30 attempts")

                  await ws.send(json.dumps({
                      "type": "auth",
                      "token": AUTH_TOKEN,
                      "worker_id": WORKER_ID
                  }))
                  log("📨 Auth sent")

                  raw = await ws.recv()
                  msg = json.loads(raw)
                  log(f"📥 Got: {msg}")

                  if msg.get("type") == "gpu_job":
                      result = {
                          "type": "gpu_result",
                          "job_id": msg["job_id"],
                          "worker_id": WORKER_ID,
                          "gpu": gpu_info(),
                          "timestamp": datetime.now(timezone.utc).isoformat()
                      }
                      await ws.send(json.dumps(result))
                      log("✅ Result sent")
                  else:
                      log(f"Unexpected type: {msg.get('type')}")

              except Exception as e:
                  log(f"❌ ERROR: {e}")
                  traceback.print_exc()
              finally:
                  log("🏁 END")
                  if ws:
                      await ws.close()

          asyncio.run(main())
          PYWORKER

          cat > kaggle_test/worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "${KERNEL_SLUG}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          echo "=== kernel-metadata.json ==="
          cat kaggle_test/worker/kernel-metadata.json

      # ========== PUSH & RUN ==========
      - name: Push Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          echo "Pushing kernel: ${KERNEL_SLUG}"
          kaggle kernels push -p kaggle_test/worker
          echo "✅ Push done"
          
          # Wait a bit for Kaggle to process
          sleep 5

      # ========== CHECK STATUS WITH RETRY ==========
      - name: Check Kaggle status
        shell: bash
        run: |
          set +e
          echo "Checking Kaggle kernel status..."
          
          for i in $(seq 1 40); do
            echo ""
            echo "=== Check $i/40 ==="
            
            # Try to get status - note the correct format
            STATUS_OUTPUT=$(kaggle kernels status "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1)
            echo "Raw output: $STATUS_OUTPUT"
            
            # Check if it's running
            if echo "$STATUS_OUTPUT" | grep -q "running"; then
              echo "🟢 Kernel is RUNNING!"
              break
            fi
            
            # Check if complete
            if echo "$STATUS_OUTPUT" | grep -q "complete"; then
              echo "🟡 Kernel is COMPLETE (might have finished fast)"
              break
            fi
            
            # Check if error
            if echo "$STATUS_OUTPUT" | grep -q "error"; then
              echo "🔴 Kernel has ERROR"
              break
            fi
            
            sleep 10
          done

      # ========== WAIT FOR RESULT ==========
      - name: Wait for result
        shell: bash
        run: |
          set -u
          for i in $(seq 1 60); do
            echo ""
            echo "=== Attempt $i/60 ==="
            
            if [ -f test_result.json ]; then
              echo "✅ RESULT FOUND!"
              cat test_result.json
              TOTAL=$(jq -r '.total_seconds // "null"' test_result.json)
              if [ "$TOTAL" != "null" ] && [ "$TOTAL" != "0" ]; then
                echo ""
                if (( $(echo "$TOTAL < 5" | bc -l) )); then
                  echo "🚀 REAL-TIME: YES (< 5s)"
                elif (( $(echo "$TOTAL < 30" | bc -l) )); then
                  echo "⚠️ REAL-TIME: MAYBE (5-30s)"
                else
                  echo "❌ REAL-TIME: NO (> 30s)"
                fi
              fi
              exit 0
            fi
            
            if [ -f relay_debug.log ]; then
              echo "--- Relay connections ---"
              tail -5 relay_debug.log
            fi
            
            sleep 5
          done
          
          echo "❌ TIMEOUT - No result from worker"
          exit 1

      # ========== DOWNLOAD & REPORT ==========
      - name: Download and report
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test_output
          
          echo "Downloading worker output..."
          kaggle kernels output "${KAGGLE_USERNAME}/${KERNEL_SLUG}" -p test_output --force || true
          
          echo ""
          echo "=========================================="
          echo "WORKER FILES:"
          find test_output -type f 2>/dev/null | while read f; do
            echo ""
            echo "=== $f ==="
            cat "$f" 2>/dev/null
          done
          
          echo ""
          echo "=========================================="
          echo "RELAY DEBUG:"
          cat relay_debug.log 2>/dev/null || echo "No relay debug"
          
          echo ""
          echo "=========================================="
          echo "TEST RESULT:"
          cat test_result.json 2>/dev/null || echo "No result"
          
          echo ""
          echo "=========================================="
          echo "CLOUDFLARE LOG:"
          tail -20 cloudflared.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-v5
          path: |
            test_result.json
            relay.log
            relay_debug.log
            cloudflared.log
            test_output/**
          retention-days: 3
