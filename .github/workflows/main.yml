name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: choice
        options:
          - matrix
          - gpu_info

      size:
        description: "Matrix size"
        required: false
        default: "4096"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          python -m kaggle --version

      # =========================================
      # CREATE GPU NOTEBOOK
      # =========================================

      - name: Create GPU notebook
        run: |
          mkdir -p kaggle_job

          cat > kaggle_job/job.py <<'PY'
          import os
          import json
          import time
          import torch

          job_id = os.environ.get("JOB_ID", "unknown")
          operation = os.environ.get("OPERATION", "gpu_info")
          size = int(os.environ.get("MATRIX_SIZE", "4096"))

          result = {
              "job_id": job_id,
              "operation": operation,
              "status": "STARTING"
          }

          print("======================================")
          print("           GPU JOB")
          print("======================================")

          print("Job ID:", job_id)
          print("Operation:", operation)

          # ---------------------------------------
          # CHECK GPU
          # ---------------------------------------

          if not torch.cuda.is_available():
              result["status"] = "ERROR"
              result["error"] = "CUDA is not available"

              with open("/kaggle/working/result.json", "w") as f:
                  json.dump(result, f, indent=2)

              raise RuntimeError("CUDA unavailable")

          gpu = torch.cuda.get_device_name(0)

          result["cuda"] = True
          result["gpu"] = gpu
          result["cuda_version"] = torch.version.cuda

          print("CUDA:", True)
          print("GPU:", gpu)
          print("CUDA:", torch.version.cuda)

          # ---------------------------------------
          # GPU INFO
          # ---------------------------------------

          if operation == "gpu_info":

              result["status"] = "SUCCESS"

              print()
              print("GPU information obtained.")

          # ---------------------------------------
          # MATRIX TEST
          # ---------------------------------------

          elif operation == "matrix":

              print()
              print("======================================")
              print("        MATRIX GPU COMPUTATION")
              print("======================================")

              print("Matrix size:", size)

              device = torch.device("cuda")

              print("Creating tensors...")

              a = torch.randn(
                  size,
                  size,
                  device=device,
                  dtype=torch.float32
              )

              b = torch.randn(
                  size,
                  size,
                  device=device,
                  dtype=torch.float32
              )

              print("Synchronizing GPU...")

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = torch.matmul(a, b)

              torch.cuda.synchronize()

              elapsed = time.perf_counter() - start

              result["status"] = "SUCCESS"
              result["result_shape"] = list(c.shape)
              result["time_seconds"] = elapsed

              print()
              print("======================================")
              print("        GPU COMPUTATION DONE")
              print("======================================")

              print("GPU:", gpu)
              print("Result:", c.shape)
              print("Time:", elapsed, "seconds")

              del a
              del b
              del c

              torch.cuda.empty_cache()

          else:

              result["status"] = "ERROR"
              result["error"] = "Unknown operation"

          # ---------------------------------------
          # SAVE RESULT
          # ---------------------------------------

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:
              json.dump(result, f, indent=2)

          print()
          print("======================================")
          print("             JOB RESULT")
          print("======================================")

          print(json.dumps(result, indent=2))

          print()
          print("GPU JOB FINISHED")
          PY

          python - <<'PY'
          import json

          with open("kaggle_job/job.py", "r") as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:
              json.dump(notebook, f, indent=2)

          print("Notebook created.")
          PY

      # =========================================
      # KAGGLE METADATA
      # =========================================

      - name: Create Kaggle metadata
        run: |
          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_job/kernel-metadata.json

      # =========================================
      # PUSH TO KAGGLE
      # =========================================

      - name: Submit GPU job
        run: |
          cd kaggle_job

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "       GPU JOB SUBMITTED"
          echo "======================================"

      # =========================================
      # WAIT FOR START
      # =========================================

      - name: Wait for GPU
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR GPU"
          echo "======================================"

          STARTED=false

          for i in $(seq 1 60)
          do
            echo ""
            echo "========== STATUS $i/60 =========="

            STATUS=$(python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.RUNNING"'
            then
              echo ""
              echo "======================================"
              echo "       GPU IS RUNNING"
              echo "======================================"

              STARTED=true
              break
            fi

            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.ERROR"'
            then
              echo "GPU job failed."
              exit 1
            fi

            sleep 5
          done

          if [ "$STARTED" != "true" ]; then
            echo "GPU did not start."
            exit 1
          fi

      # =========================================
      # WAIT FOR COMPLETE
      # =========================================

      - name: Wait for job completion
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR JOB"
          echo "======================================"

          for i in $(seq 1 120)
          do

            STATUS=$(python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "========== CHECK $i/120 =========="
            echo "$STATUS"

            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.COMPLETE"'
            then
              echo ""
              echo "======================================"
              echo "       GPU JOB COMPLETE"
              echo "======================================"

              exit 0
            fi

            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.ERROR"'
            then
              echo ""
              echo "GPU JOB ERROR"
              exit 1
            fi

            sleep 5

          done

          echo "GPU job timeout."
          exit 1

      # =========================================
      # DOWNLOAD RESULT
      # =========================================

      - name: Download GPU result
        run: |
          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true

          echo ""
          echo "======================================"
          echo "       GPU RESULT"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print || true

      # =========================================
      # CREATE RESULT TXT
      # =========================================

      - name: Prepare result
        run: |
          if [ -f kaggle_output/result.json ]; then
            cp kaggle_output/result.json \
              kaggle_output/gpu_result.json
          fi

          echo "Job ID: $JOB_ID" \
            > kaggle_output/github_result.txt

          echo "Operation: $OPERATION" \
            >> kaggle_output/github_result.txt

          echo "Status: SUCCESS" \
            >> kaggle_output/github_result.txt

          cat kaggle_output/github_result.txt

      # =========================================
      # UPLOAD ARTIFACT
      # =========================================

      - name: Upload GPU result
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: kaggle_output/
          if-no-files-found: error

      # =========================================
      # FINAL
      # =========================================

      - name: Final
        run: |
          echo ""
          echo "======================================"
          echo "       GPU JOB FINISHED"
          echo "======================================"

          echo "Job: $JOB_ID"
          echo "Operation: $OPERATION"
