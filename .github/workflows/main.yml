name: Run Repo File on Kaggle GPU

on:
  workflow_dispatch:

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Kaggle Auth
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_API_TOKEN }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: Push to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          ID="run-$(date +%s)"
          echo "RUN_ID=$ID" >> $GITHUB_ENV
          
          mkdir -p kaggle_push
          cp kaggle_gpu.py kaggle_push/script.py
          
          cat > kaggle_push/kernel-metadata.json <<EOF
          {
            "id": "${{ secrets.KAGGLE_USERNAME }}/repo-gpu-${ID}",
            "title": "GPU ${ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
          
          cd kaggle_push
          kaggle kernels push -p .
          echo "Pushed: repo-gpu-${ID}"

      - name: Wait for Kaggle (Queue + Run)
        run: |
          echo "Sleeping 12 minutes for Queue + GPU run..."
          sleep 720  # 12 دقیقه صبر

      - name: Download Output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="${{ secrets.KAGGLE_USERNAME }}/repo-gpu-${{ env.RUN_ID }}"
          mkdir -p output
          kaggle kernels output "$SLUG" -p output --force || true

      - name: Show Logs
        run: |
          echo "========== LOG =========="
          cat output/debug_log.txt 2>/dev/null || echo "No debug_log.txt"
          echo ""
          echo "========== FILES =========="
          find output -type f

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-${{ env.RUN_ID }}
          path: output/**
