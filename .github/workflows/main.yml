name: Kaggle GPU Real-Time Test v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_WORKER_TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip netcat-openbsd bc
          python3 -m pip install --upgrade pip
          python3 -m pip install kaggle websockets aiohttp

      - name: Check secrets
        shell: bash
        run: |
          set -u
          test -n "${KAGGLE_USERNAME:-}" || { echo "ERROR: KAGGLE_USERNAME is missing"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "ERROR: KAGGLE_API_TOKEN is missing"; exit 1; }
          test -n "${GPU_WORKER_TOKEN:-}" || { echo "ERROR: GPU_WORKER_TOKEN is missing"; exit 1; }
          echo "Secrets OK."

      - name: Configure Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"
          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {"username": "${KAGGLE_USERNAME}", "key": "${KAGGLE_API_TOKEN}"}
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      # ========== RELAY با لاگ بیشتر ==========
      - name: Create relay
        shell: bash
        run: |
          cat > relay.py <<'PY'
          import asyncio, json, os, time, uuid
          from datetime import datetime, timezone
          import websockets

          AUTH_TOKEN = os.environ["GPU_WORKER_TOKEN"]

          state = {
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "connections": [],
              "worker_connected": False,
              "job_sent_at": None,
              "result_received_at": None,
              "total_seconds": None,
              "gpu_info": None,
              "error": None
          }

          def log(msg):
              print(f"[RELAY {datetime.now(timezone.utc).strftime('%H:%M:%S')}] {msg}")
              with open("relay_debug.log", "a") as f:
                  f.write(f"{msg}\n")

          async def handler(ws, path):
              remote = str(ws.remote_address)
              log(f"🔌 NEW CONNECTION from {remote}")
              state["connections"].append({"time": time.time(), "remote": remote})
              
              # Auth
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
                  log(f"📨 Auth message: {msg.get('type')} from {msg.get('worker_id', 'unknown')}")
                  
                  if msg.get("type") != "auth":
                      log("❌ Auth failed: wrong type")
                      await ws.send(json.dumps({"type": "auth_failed"}))
                      return
                  if msg.get("token") != AUTH_TOKEN:
                      log("❌ Auth failed: wrong token")
                      await ws.send(json.dumps({"type": "auth_failed"}))
                      return
                      
                  worker_id = msg.get("worker_id", str(uuid.uuid4()))
                  await ws.send(json.dumps({"type": "auth_ok", "worker_id": worker_id}))
                  log(f"✅ Worker authenticated: {worker_id}")
                  state["worker_connected"] = True
              except Exception as e:
                  log(f"❌ Auth exception: {e}")
                  state["error"] = f"Auth failed: {e}"
                  return

              # Send test job
              job = {
                  "job_id": 1,
                  "type": "gpu_job", 
                  "operation": "gpu_info"
              }
              state["job_sent_at"] = time.perf_counter()
              await ws.send(json.dumps(job))
              log(f"📤 Job sent at {state['job_sent_at']}")

              # Wait for result
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=120)
                  state["result_received_at"] = time.perf_counter()
                  msg = json.loads(raw)
                  log(f"📥 Result received: {msg.get('type')}")
                  
                  if msg.get("type") == "gpu_result":
                      state["total_seconds"] = state["result_received_at"] - state["job_sent_at"]
                      state["gpu_info"] = msg.get("output", {})
                      log(f"✅ SUCCESS in {state['total_seconds']:.2f}s")
                  else:
                      state["error"] = f"Unexpected: {msg}"
                      log(f"❌ Unexpected response: {msg}")
                      
              except asyncio.TimeoutError:
                  state["error"] = "Timeout"
                  log("❌ TIMEOUT waiting for result")

              # Save result
              with open("test_result.json", "w") as f:
                  json.dump(state, f, indent=2)
              
              log("🔒 Closing connection")
              await ws.close()

          async def main():
              log("🚀 Starting relay on ws://127.0.0.1:8765")
              async with websockets.serve(handler, "127.0.0.1", 8765, ping_interval=20, ping_timeout=60):
                  await asyncio.sleep(300)

          asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          nohup python3 relay.py > relay.log 2>&1 &
          sleep 2
          echo "=== Relay started ==="
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -u
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --protocol http2 --no-autoupdate > cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              WSS_URL=$(echo "$URL" | sed 's#^https://#wss://#')/
              echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"
              echo "✅ Tunnel: $WSS_URL"
              break
            fi
            sleep 2
          done
          test -n "$WSS_URL" || { echo "Tunnel failed"; cat cloudflared.log; exit 1; }

      # ========== WORKER با لاگ بیشتر ==========
      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_test && mkdir -p kaggle_test/worker
          
          cat > kaggle_test/worker/worker.py <<PYWORKER
          import asyncio, json, os, subprocess, sys, time, traceback, uuid
          from datetime import datetime, timezone

          # Install websockets if missing
          try:
              import websockets
          except ImportError:
              print("[WORKER] Installing websockets...")
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "websockets"])
              import websockets

          try:
              import torch
              TORCH_OK = True
          except ImportError:
              TORCH_OK = False
              print("[WORKER] WARNING: PyTorch not available")

          WSS_URL = "${WSS_URL}"
          AUTH_TOKEN = "${GPU_WORKER_TOKEN}"
          WORKER_ID = "test-worker-" + str(uuid.uuid4())[:8]

          def now():
              return datetime.now(timezone.utc).isoformat()

          def get_gpu_info():
              try:
                  p = subprocess.run(["nvidia-smi", "--query-gpu=name,memory.total,temperature.gpu", "--format=csv,noheader"],
                                    capture_output=True, text=True, timeout=10)
                  return p.stdout.strip()
              except Exception as e:
                  return str(e)

          async def main():
              log_file = "/kaggle/working/worker_debug.log"
              def log(msg):
                  line = f"[{now()}] {msg}"
                  print(line)
                  with open(log_file, "a") as f:
                      f.write(line + "\n")

              log(f"🚀 {WORKER_ID} starting...")
              log(f"WSS_URL: {WSS_URL}")
              log(f"GPU: {get_gpu_info()}")
              log(f"PyTorch: {TORCH_OK}")
              
              if TORCH_OK:
                  log(f"CUDA available: {torch.cuda.is_available()}")
              
              ws = None
              try:
                  # Connect with retry
                  for attempt in range(1, 31):
                      try:
                          log(f"🔌 Connecting attempt {attempt}/30...")
                          ws = await websockets.connect(
                              WSS_URL, 
                              open_timeout=30, 
                              close_timeout=10,
                              ping_interval=20,
                              ping_timeout=60
                          )
                          log("✅ Connected!")
                          break
                      except Exception as e:
                          log(f"❌ Connect error: {e}")
                          await asyncio.sleep(min(attempt * 2, 15))
                  
                  if not ws:
                      raise RuntimeError("Could not connect after 30 attempts")

                  # Auth
                  await ws.send(json.dumps({
                      "type": "auth",
                      "token": AUTH_TOKEN,
                      "worker_id": WORKER_ID
                  }))
                  log("📨 Auth sent")
                  
                  # Wait for job
                  raw = await ws.recv()
                  msg = json.loads(raw)
                  log(f"📥 Received: {msg}")

                  if msg.get("type") == "gpu_job":
                      # Do GPU work
                      if TORCH_OK and torch.cuda.is_available():
                          device = torch.device("cuda")
                          a = torch.randn(1000, 1000, device=device)
                          b = torch.randn(1000, 1000, device=device)
                          c = torch.matmul(a, b)
                          torch.cuda.synchronize()
                          gpu_name = torch.cuda.get_device_name(0)
                      else:
                          gpu_name = "CPU_FALLBACK"
                      
                      result = {
                          "type": "gpu_result",
                          "job_id": msg["job_id"],
                          "worker_id": WORKER_ID,
                          "gpu_name": gpu_name,
                          "nvidia_smi": get_gpu_info(),
                          "torch_ok": TORCH_OK
                      }
                      await ws.send(json.dumps(result))
                      log("✅ Result sent")
                  else:
                      log(f"Unexpected message type: {msg.get('type')}")
                  
              except Exception as e:
                  log(f"❌ ERROR: {e}")
                  traceback.print_exc()
              finally:
                  log("🏁 Worker finished")
                  if ws:
                      await ws.close()

          asyncio.run(main())
          PYWORKER

          cat > kaggle_test/worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-test-worker",
            "title": "gpu-test-worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          kaggle kernels push -p kaggle_test/worker
          echo "✅ Worker pushed"

      # ========== CHECK KAGGLE STATUS ==========
      - name: Check Kaggle worker status
        shell: bash
        run: |
          echo "Checking Kaggle worker status..."
          for i in $(seq 1 20); do
            echo "--- Attempt $i ---"
            kaggle kernels status "${KAGGLE_USERNAME}/gpu-test-worker" 2>/dev/null || true
            sleep 3
          done

      # ========== WAIT FOR RESULT ==========
      - name: Wait for test result
        shell: bash
        run: |
          set -u
          echo "Waiting for worker to connect..."
          
          for i in $(seq 1 60); do
            echo ""
            echo "=== Attempt $i/60 ==="
            
            # Check relay connections
            if [ -f relay_debug.log ]; then
              echo "--- Relay connections ---"
              cat relay_debug.log | tail -20
            fi
            
            # Check result
            if [ -f test_result.json ]; then
              echo ""
              echo "=========================================="
              echo "✅ TEST COMPLETED"
              echo "=========================================="
              cat test_result.json
              
              TOTAL=$(jq -r '.total_seconds // "null"' test_result.json)
              if [ "$TOTAL" != "null" ] && [ "$TOTAL" != "0" ]; then
                echo ""
                if (( $(echo "$TOTAL < 5" | bc -l) )); then
                  echo "🚀 REAL-TIME: YES (< 5 seconds)"
                elif (( $(echo "$TOTAL < 30" | bc -l) )); then
                  echo "⚠️  REAL-TIME: MAYBE (5-30 seconds)"
                else
                  echo "❌ REAL-TIME: NO (> 30 seconds)"
                fi
              fi
              exit 0
            fi
            
            # Check if any connection happened
            if [ -f relay_debug.log ]; then
              CONNS=$(grep -c "NEW CONNECTION" relay_debug.log 2>/dev/null || echo 0)
              if [ "$CONNS" -gt 0 ]; then
                echo "Connections so far: $CONNS"
              fi
            fi
            
            sleep 5
          done
          
          echo ""
          echo "❌ TIMEOUT"
          exit 1

      - name: Download worker output
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test_output
          echo "Downloading worker output..."
          kaggle kernels output "${KAGGLE_USERNAME}/gpu-test-worker" -p test_output --force || true
          echo "--- Files ---"
          find test_output -type f -print || true
          echo "--- Logs ---"
          cat test_output/*.log 2>/dev/null || true
          echo "--- JSON ---"
          cat test_output/*.json 2>/dev/null || true

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL REPORT"
          echo "=========================================="
          echo ""
          echo "Tunnel:"
          grep trycloudflare cloudflared.log | head -1 || true
          echo ""
          echo "Relay debug:"
          cat relay_debug.log 2>/dev/null || echo "No relay debug"
          echo ""
          echo "Test result:"
          cat test_result.json 2>/dev/null || echo "No result"
          echo ""
          echo "Relay log:"
          cat relay.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-realtime-test-v2
          path: |
            test_result.json
            relay.log
            relay_debug.log
            cloudflared.log
            test_output/**
          retention-days: 3
