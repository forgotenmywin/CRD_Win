name: Kaggle GPU Session

on:
  workflow_dispatch:
    inputs:
      action:
        description: "GPU session action"
        required: true
        type: choice
        options:
          - start
          - stop

      session_id:
        description: "GPU session ID"
        required: true
        type: string

      duration:
        description: "Session duration in minutes"
        required: false
        default: "20"
        type: string

jobs:
  gpu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SESSION_ID: ${{ inputs.session_id }}
      DURATION: ${{ inputs.duration }}

    steps:

      # ==========================================
      # SETUP
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "======================================"
          echo "KAGGLE CLI"
          echo "======================================"

          python -m kaggle --version

      # ==========================================
      # PREPARE NOTEBOOK
      # ==========================================

      - name: Prepare GPU notebook
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_session

          cat > kaggle_session/gpu_session.py <<'PYTHON'
          import time
          import torch

          print("======================================")
          print("       GPU SESSION STARTING")
          print("======================================")

          duration = 20

          print("Requested duration:", duration, "minutes")
          print("Checking CUDA...")

          if not torch.cuda.is_available():
              print("CUDA is not available")
              raise RuntimeError("CUDA unavailable")

          gpu = torch.cuda.get_device_name(0)

          print("CUDA available: True")
          print("GPU:", gpu)
          print("CUDA version:", torch.version.cuda)

          print()
          print("======================================")
          print("       GPU SESSION ACTIVE")
          print("======================================")

          end_time = time.time() + (duration * 60)

          while True:
              remaining = int(end_time - time.time())

              if remaining <= 0:
                  break

              print(
                  f"GPU ACTIVE | "
                  f"GPU: {gpu} | "
                  f"Remaining: {remaining} seconds",
                  flush=True
              )

              time.sleep(10)

          print()
          print("======================================")
          print("       GPU SESSION FINISHED")
          print("======================================")

          print("GPU:", gpu)
          print("Status: SUCCESS")
          PYTHON

          python - <<'PY'
          import json

          with open(
              "kaggle_session/gpu_session.py",
              "r",
              encoding="utf-8"
          ) as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_session/gpu_session.ipynb",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(notebook, f, indent=2)

          print("Notebook created successfully")
          PY

      # ==========================================
      # METADATA
      # ==========================================

      - name: Create Kaggle metadata
        if: ${{ inputs.action == 'start' }}
        run: |
          cat > kaggle_session/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}",
            "title": "GPU Session ${SESSION_ID}",
            "code_file": "gpu_session.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "Metadata:"
          cat kaggle_session/kernel-metadata.json

      # ==========================================
      # PUSH
      # ==========================================

      - name: Push GPU session to Kaggle
        if: ${{ inputs.action == 'start' }}
        run: |
          cd kaggle_session

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "       GPU SESSION SUBMITTED"
          echo "======================================"

          echo "Kernel:"
          echo "${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

      # ==========================================
      # WAIT FOR START
      # ==========================================

      - name: Wait for GPU to start
        if: ${{ inputs.action == 'start' }}
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          STARTED=false

          for i in $(seq 1 60)
          do
            echo ""
            echo "========== START CHECK $i/60 =========="

            STATUS=$(python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.RUNNING"'
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION IS RUNNING"
              echo "======================================"

              STARTED=true
              break
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.ERROR"'
            then
              echo ""
              echo "GPU SESSION ERROR"
              exit 1
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.COMPLETE"'
            then
              echo ""
              echo "Kaggle completed before RUNNING could be observed."
              break
            fi

            echo "Still waiting..."
            sleep 5
          done

          if [ "$STARTED" != "true" ]
          then
            echo ""
            echo "======================================"
            echo "       GPU DID NOT START"
            echo "======================================"

            echo "Possible reasons:"
            echo "- Kaggle GPU quota"
            echo "- Kaggle GPU queue"
            echo "- Notebook startup error"

            exit 1
          fi

      # ==========================================
      # KEEP MONITORING UNTIL COMPLETE
      # ==========================================

      - name: Monitor GPU session
        if: ${{ inputs.action == 'start' }}
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       MONITORING GPU SESSION"
          echo "======================================"

          for i in $(seq 1 180)
          do
            echo ""
            echo "========== SESSION CHECK $i/180 =========="

            STATUS=$(python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.COMPLETE"'
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION COMPLETED"
              echo "======================================"

              exit 0
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.ERROR"'
            then
              echo ""
              echo "======================================"
              echo "       GPU SESSION FAILED"
              echo "======================================"

              exit 1
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.CANCELLED"'
            then
              echo ""
              echo "GPU session was cancelled."
              exit 1
            fi

            echo "Session still running..."
            sleep 10
          done

          echo ""
          echo "======================================"
          echo "       SESSION TIMEOUT"
          echo "======================================"

          exit 1

      # ==========================================
      # STOP
      # ==========================================

      - name: Stop GPU session
        if: ${{ inputs.action == 'stop' }}
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo "======================================"
          echo "       STOPPING GPU SESSION"
          echo "======================================"

          python -m kaggle kernels cancel \
            "$KERNEL" || true

          echo "GPU stop request sent."

      # ==========================================
      # DOWNLOAD OUTPUT
      # ==========================================

      - name: Download session output
        if: ${{ inputs.action == 'start' }}
        run: |
          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-session-${SESSION_ID}"

          echo ""
          echo "======================================"
          echo "       DOWNLOADING OUTPUT"
          echo "======================================"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true

          echo ""
          echo "Output files:"

          find kaggle_output \
            -type f \
            -print || true

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload session result
        if: ${{ inputs.action == 'start' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-${{ inputs.session_id }}
          path: kaggle_output/
          if-no-files-found: ignore

      # ==========================================
      # FINAL
      # ==========================================

      - name: Final status
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "Action: ${{ inputs.action }}"
          echo "Session: ${SESSION_ID}"
