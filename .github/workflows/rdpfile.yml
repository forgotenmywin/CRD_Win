name: Kaggle GPU Worker - Multi Job Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle websocket-client numpy numba

      - name: Configure Kaggle auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_USERNAME:-}"
          test -n "${KAGGLE_API_TOKEN:-}"

          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

          echo "Kaggle auth ready."

      - name: Verify Kaggle auth
        run: |
          set -euo pipefail
          kaggle competitions list --page-size 1 >/dev/null
          echo "Kaggle API OK."

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          echo "Downloading cloudflared..."
          curl -fL --retry 5 --retry-delay 2 \
            -o cloudflared.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.tgz

          echo "Checking downloaded file..."
          ls -lh cloudflared.tgz
          file cloudflared.tgz

          echo "Extracting..."
          tar -xzf cloudflared.tgz

          echo "Installing..."
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

          echo "Testing..."
          cloudflared --version

      - name: Create relay server
        run: |
          cat > relay_server.py <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone

          import websockets

          HOST = "127.0.0.1"
          PORT = 8765

          events = []
          results = []
          jobs = [
              {
                  "type": "gpu_job",
                  "job_id": 1,
                  "benchmark": "numba_vector_add",
                  "n": 16777216,
                  "repeats": 50
              },
              {
                  "type": "gpu_job",
                  "job_id": 2,
                  "benchmark": "numba_vector_add",
                  "n": 33554432,
                  "repeats": 50
              },
              {
                  "type": "gpu_job",
                  "job_id": 3,
                  "benchmark": "numba_vector_add",
                  "n": 16777216,
                  "repeats": 100
              }
          ]

          def now():
              return datetime.now(timezone.utc).isoformat()

          def log_event(kind, data):
              events.append({
                  "kind": kind,
                  "at_utc": now(),
                  **data
              })

          async def handler(ws):
              log_event(
                  "connect",
                  {
                      "remote": str(ws.remote_address),
                      "url": getattr(ws, "path", "/ws")
                  }
              )

              try:
                  async for raw in ws:
                      try:
                          msg = json.loads(raw)
                      except Exception:
                          msg = {"raw": raw}

                      log_event("message", {"message": msg})

                      if msg.get("type") == "ready":
                          for job in jobs:
                              await ws.send(json.dumps(job))
                              log_event("job_sent", {"job": job})

                              while True:
                                  try:
                                      raw_result = await asyncio.wait_for(
                                          ws.recv(),
                                          timeout=180
                                      )
                                  except asyncio.TimeoutError:
                                      log_event("timeout", {"job_id": job["job_id"]})
                                      break

                                  try:
                                      result = json.loads(raw_result)
                                  except Exception:
                                      result = {"raw": raw_result}

                                  log_event("message", {"message": result})

                                  if (
                                      result.get("type") == "gpu_result"
                                      and result.get("job_id") == job["job_id"]
                                  ):
                                      results.append(result)
                                      log_event("job_result", {"result": result})
                                      break

                          await ws.close()
                          break

              except Exception as e:
                  log_event("handler_error", {"error": repr(e)})

          async def main():
              started = now()

              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=30
              ):
                  print(f"Relay listening on {HOST}:{PORT}")

                  for _ in range(180):
                      await asyncio.sleep(1)
                      if results and len(results) == len(jobs):
                          break

              output = {
                  "started_utc": started,
                  "finished_utc": now(),
                  "jobs_expected": len(jobs),
                  "jobs_completed": len(results),
                  "connections": 1 if events else 0,
                  "job_results": results,
                  "events": events
              }

              with open("relay_result.json", "w") as f:
                  json.dump(output, f, indent=2)

              print(json.dumps(output, indent=2))

          asyncio.run(main())
          PY

      - name: Start relay
        run: |
          nohup python relay_server.py > relay.log 2>&1 &
          echo $! > relay.pid
          sleep 2
          cat relay.log

      - name: Start Cloudflare tunnel
        run: |
          set -euo pipefail

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          echo "Waiting for tunnel URL..."
          for i in $(seq 1 60); do
            if grep -q "trycloudflare.com" cloudflared.log; then
              break
            fi
            sleep 1
          done

          cat cloudflared.log

          TUNNEL_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -1)

          if [ -z "$TUNNEL_URL" ]; then
            echo "Tunnel URL not found"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "Tunnel:"
          echo "$TUNNEL_URL"

      - name: Create Kaggle worker
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p kaggle_worker

          cat > kaggle_worker/worker.py <<PY
          import json
          import os
          import time
          import traceback
          from datetime import datetime, timezone

          import websocket

          try:
              from numba import cuda
              import numpy as np
          except Exception:
              cuda = None
              np = None

          RAW_URL = "${TUNNEL_URL}".strip()

          if not RAW_URL:
              raise RuntimeError("TUNNEL_URL is missing")

          if RAW_URL.startswith("https://"):
              WSS_URL = "wss://" + RAW_URL[len("https://"):] + "/ws"
          elif RAW_URL.startswith("http://"):
              WSS_URL = "ws://" + RAW_URL[len("http://"):] + "/ws"
          else:
              raise RuntimeError(f"Invalid TUNNEL_URL: {RAW_URL}")

          result = {
              "worker": "kaggle_gpu_multi_job_worker",
              "hostname": os.uname().nodename,
              "raw_tunnel_url": RAW_URL,
              "wss_url": WSS_URL,
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "status": "STARTING",
              "jobs": []
          }

          print("=" * 60)
          print("KAGGLE GPU MULTI JOB WORKER")
          print("=" * 60)
          print("WSS:", WSS_URL)

          try:
              import subprocess
              smi = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )
              result["nvidia_smi"] = smi.stdout.strip()
              result["nvidia_smi_rc"] = smi.returncode
              print("\n=== NVIDIA-SMI ===")
              print(smi.stdout.strip())
          except Exception as e:
              result["nvidia_smi_error"] = repr(e)

          def run_benchmark(job):
              if cuda is None or np is None:
                  raise RuntimeError("Numba CUDA / NumPy unavailable")

              n = int(job["n"])
              repeats = int(job["repeats"])

              @cuda.jit
              def vector_add(a, b, c):
                  i = cuda.grid(1)
                  if i < a.size:
                      c[i] = a[i] + b[i]

              a = cuda.device_array(n, dtype=np.float32)
              b = cuda.device_array(n, dtype=np.float32)
              c = cuda.device_array(n, dtype=np.float32)

              threads = 256
              blocks = (n + threads - 1) // threads

              vector_add[blocks, threads](a, b, c)
              cuda.synchronize()

              start = time.perf_counter()
              for _ in range(repeats):
                  vector_add[blocks, threads](a, b, c)
              cuda.synchronize()
              wall_ms = (time.perf_counter() - start) * 1000

              start_evt = cuda.event()
              end_evt = cuda.event()
              start_evt.record()
              for _ in range(repeats):
                  vector_add[blocks, threads](a, b, c)
              end_evt.record()
              end_evt.synchronize()

              kernel_ms_total = cuda.event_elapsed_time(start_evt, end_evt)
              kernel_ms_per_launch = kernel_ms_total / repeats

              bytes_per_element = 12
              bandwidth_gbps = (
                  n
                  * bytes_per_element
                  * repeats
                  / (wall_ms / 1000)
                  / 1e9
              )

              return {
                  "backend": "numba_cuda",
                  "gpu_name": cuda.get_current_device().name.decode(),
                  "elements": n,
                  "repeats": repeats,
                  "kernel_ms_per_launch": float(kernel_ms_per_launch),
                  "wall_ms": float(wall_ms),
                  "effective_bandwidth_gbps": float(bandwidth_gbps)
              }

          ws = None

          try:
              ws = websocket.create_connection(
                  WSS_URL,
                  timeout=30
              )

              result["status"] = "CONNECTED"

              ws.send(json.dumps({
                  "type": "ready",
                  "worker_utc": datetime.now(timezone.utc).isoformat()
              }))

              print("READY sent.")

              while True:
                  raw = ws.recv()

                  if not raw:
                      break

                  msg = json.loads(raw)
                  print("\nJOB RECEIVED:")
                  print(json.dumps(msg, indent=2))

                  if msg.get("type") != "gpu_job":
                      continue

                  job_id = msg.get("job_id")
                  job_started = time.perf_counter()

                  try:
                      benchmark = run_benchmark(msg)

                      compute_wall_ms = (time.perf_counter() - job_started) * 1000

                      gpu_result = {
                          "type": "gpu_result",
                          "job_id": job_id,
                          "worker_utc": datetime.now(timezone.utc).isoformat(),
                          "compute_wall_ms": float(compute_wall_ms),
                          "benchmark": benchmark
                      }

                      result["jobs"].append(gpu_result)

                      ws.send(json.dumps(gpu_result))

                      print("\nRESULT:")
                      print(json.dumps(gpu_result, indent=2))

                  except Exception as e:
                      error_result = {
                          "type": "gpu_result",
                          "job_id": job_id,
                          "worker_utc": datetime.now(timezone.utc).isoformat(),
                          "error": repr(e),
                          "traceback": traceback.format_exc()
                      }

                      result["jobs"].append(error_result)
                      ws.send(json.dumps(error_result))

              result["status"] = "DONE"

          except Exception as e:
              print("\nWORKER ERROR:")
              print(repr(e))
              result["status"] = "ERROR"
              result["error"] = repr(e)
              result["traceback"] = traceback.format_exc()

          finally:
              result["end_utc"] = datetime.now(timezone.utc).isoformat()

              with open("/kaggle/working/worker_result.json", "w") as f:
                  json.dump(result, f, indent=2)

              try:
                  if ws:
                      ws.close()
              except Exception:
                  pass

              print("\nFINAL RESULT:")
              print(json.dumps(result, indent=2))
          PY

          cat > kaggle_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-multi-job-worker",
            "title": "GPU Multi Job Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle worker
        run: |
          set -euo pipefail
          cd kaggle_worker
          kaggle kernels push -p .

      - name: Wait for Kaggle worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          for i in $(seq 1 120); do
            echo "Check $i/120"
            STATUS=$(kaggle kernels status "${KAGGLE_USERNAME}/gpu-multi-job-worker" 2>/dev/null || true)
            echo "$STATUS"

            if echo "$STATUS" | grep -q "COMPLETE"; then
              echo "Kaggle worker completed."
              break
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo "Kaggle worker failed."
              break
            fi

            sleep 5
          done

      - name: Download Kaggle output
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle_output
          kaggle kernels output "${KAGGLE_USERNAME}/gpu-multi-job-worker" -p kaggle_output || true
          find kaggle_output -maxdepth 3 -type f -print || true

      - name: Show results
        if: always()
        run: |
          echo "=============================="
          echo "RELAY LOG"
          echo "=============================="
          cat relay.log || true

          echo
          echo "=============================="
          echo "CLOUDFLARED LOG"
          echo "=============================="
          cat cloudflared.log || true

          echo
          echo "=============================="
          echo "RELAY RESULT"
          echo "=============================="
          cat relay_result.json || true

          echo
          echo "=============================="
          echo "KAGGLE OUTPUT FILES"
          echo "=============================="
          find kaggle_output -type f -maxdepth 3 -print -exec sh -c 'echo "--- $1"; head -c 10000 "$1"; echo' _ {} \; || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-multi-job-results
          path: |
            relay_result.json
            relay.log
            cloudflared.log
            kaggle_output/**
          if-no-files-found: warn
