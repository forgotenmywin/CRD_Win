                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                cloudflared.log |
              head -n 1 ||
              true
            )"

            if [ -n "$URL" ]; then

              printf '%s\n' "$URL" \
                > tunnel_url.txt

              break

            fi

            sleep 2

          done

          test -s tunnel_url.txt

          TUNNEL_URL="$(
            cat tunnel_url.txt
