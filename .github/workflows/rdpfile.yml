name: Kaggle GPU Worker - Multi Job Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_USERNAME }}/gpu-ws-worker

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip \
            unzip

          python3 -m pip install --upgrade --user kaggle

      # ---------------------------------------------------------
      # 3. Install cloudflared
      #
      # IMPORTANT:
      # New Cloudflare releases use:
      # cloudflared-linux-amd64
      #
      # NOT:
      # cloudflared-linux-amd64.tgz
      # ---------------------------------------------------------
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading cloudflared..."

          curl -fL --retry 5 --retry-delay 2 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          ./cloudflared --version

          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      # ---------------------------------------------------------
      # 4. Create local WebSocket relay
      # ---------------------------------------------------------
      - name: Create relay server
        shell: bash
        run: |
          set -euo pipefail

          cat > relay_server.py <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone

          import websockets


          HOST = "127.0.0.1"
          PORT = 8765

          events = []
          worker = None

          job = {
              "type": "gpu_job",
              "job_id": 1,
              "benchmark": "numba_vector_add",
              "n": 16777216,
              "repeats": 50
          }


          def now():
              return datetime.now(timezone.utc).isoformat()


          async def handler(ws):
              global worker

              print("Worker connected")

              worker = ws

              events.append({
                  "kind": "connect",
                  "at_utc": now()
              })

              try:
                  async for raw in ws:

                      try:
                          message = json.loads(raw)
                      except Exception:
                          message = {
                              "raw": raw
                          }

                      print("RECV:", message)

                      events.append({
                          "kind": "message",
                          "at_utc": now(),
                          "message": message
                      })

                      # Worker announces readiness
                      if message.get("type") == "ready":

                          print("Worker READY")

                          await ws.send(
                              json.dumps(job)
                          )

                          print("JOB SENT:", job)

                          events.append({
                              "kind": "job_sent",
                              "at_utc": now(),
                              "job": job
                          })

              except Exception as e:
                  print("WebSocket error:", repr(e))

              finally:
                  events.append({
                      "kind": "close",
                      "at_utc": now()
                  })

                  worker = None


          async def main():
              print("Starting relay...")
              print(f"Listening on {HOST}:{PORT}")

              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=60
              ):
                  print("Relay READY")

                  while True:
                      await asyncio.sleep(1)


          if __name__ == "__main__":
              asyncio.run(main())
          PY

          python3 -m pip install --user websockets

      # ---------------------------------------------------------
      # 5. Start relay
      # ---------------------------------------------------------
      - name: Start relay
        shell: bash
        run: |
          set -euo pipefail

          nohup python3 relay_server.py > relay.log 2>&1 &

          sleep 3

          cat relay.log

      # ---------------------------------------------------------
      # 6. Start TryCloudflare tunnel
      # ---------------------------------------------------------
      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          rm -f cloudflared.log

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo "Waiting for TryCloudflare URL..."

          for i in $(seq 1 60); do

            URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "=========================================="
              echo "TRY CLOUDFLARE URL:"
              echo "$URL"
              echo "=========================================="

              echo "$URL" > tunnel_url.txt

              exit 0
            fi

            sleep 2
          done

          echo "Cloudflare tunnel failed."
          echo "----- cloudflared.log -----"
          cat cloudflared.log || true

          exit 1

      # ---------------------------------------------------------
      # 7. Prepare Kaggle Worker
      # ---------------------------------------------------------
      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euo pipefail

          RAW_URL="$(cat tunnel_url.txt)"

          WSS_URL="${RAW_URL/https:\/\//wss:\/\/}/ws"

          echo "Tunnel:"
          echo "$RAW_URL"

          echo "WebSocket:"
          echo "$WSS_URL"

          mkdir -p kaggle_worker

          cat > kaggle_worker/worker.py <<PY
          import os
          import json
          import time
          import traceback
          from datetime import datetime, timezone

          import websocket


          WSS_URL = "${WSS_URL}"

          RESULT_FILE = "/kaggle/working/gpu_worker_result.json"


          result = {
              "worker": "kaggle_gpu_ws_worker",
              "wss_url": WSS_URL,
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "status": "STARTING",
              "jobs": [],
              "pings": []
          }


          def save():
              try:
                  with open(RESULT_FILE, "w") as f:
                      json.dump(
                          result,
                          f,
                          indent=2
                      )
              except Exception:
                  pass


          def gpu_info():

              try:
                  import subprocess

                  p = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True
                  )

                  return {
                      "rc": p.returncode,
                      "output": p.stdout.strip(),
                      "stderr": p.stderr.strip()
                  }

              except Exception as e:
                  return {
                      "error": repr(e)
                  }


          def run_gpu_job(job):

              started = time.perf_counter()

              try:

                  import numpy as np
                  from numba import cuda


                  n = int(job.get("n", 16777216))
                  repeats = int(job.get("repeats", 50))


                  @cuda.jit
                  def add_kernel(a, b, c):

                      i = cuda.grid(1)

                      if i < a.size:
                          c[i] = a[i] + b[i]


                  a = cuda.device_array(
                      n,
                      dtype=np.float32
                  )

                  b = cuda.device_array(
                      n,
                      dtype=np.float32
                  )

                  c = cuda.device_array(
                      n,
                      dtype=np.float32
                  )


                  threads = 256

                  blocks = (
                      n + threads - 1
                  ) // threads


                  # Warm-up / compilation
                  add_kernel[blocks, threads](
                      a,
                      b,
                      c
                  )

                  cuda.synchronize()


                  start = time.perf_counter()

                  for _ in range(repeats):

                      add_kernel[blocks, threads](
                          a,
                          b,
                          c
                      )

                  cuda.synchronize()

                  elapsed = (
                      time.perf_counter() - start
                  )

                  total_ms = elapsed * 1000.0

                  kernel_ms = total_ms / repeats

                  # Two input reads + one output write
                  bytes_processed = (
                      n *
                      4 *
                      3 *
                      repeats
                  )

                  bandwidth_gbps = (
                      bytes_processed /
                      elapsed /
                      1e9
                  )


                  gpu_name = (
                      cuda.get_current_device()
                      .name
                  )

                  if isinstance(gpu_name, bytes):
                      gpu_name = gpu_name.decode()


                  compute_wall_ms = (
                      time.perf_counter() - started
                  ) * 1000.0


                  return {
                      "backend": "numba_cuda",
                      "gpu_name": gpu_name,
                      "elements": n,
                      "repeats": repeats,
                      "kernel_ms": kernel_ms,
                      "wall_ms": total_ms,
                      "effective_bandwidth_gbps": bandwidth_gbps,
                      "compute_wall_ms": compute_wall_ms
                  }

              except Exception as e:

                  return {
                      "error": repr(e),
                      "traceback": traceback.format_exc()
                  }


          print("==========================================")
          print("      KAGGLE GPU WORKER")
          print("==========================================")
          print("WSS:", WSS_URL)


          result["gpu"] = gpu_info()

          print("GPU:")
          print(json.dumps(
              result["gpu"],
              indent=2
          ))


          ws = None


          try:

              print("Connecting to relay...")

              ws = websocket.create_connection(
                  WSS_URL,
                  timeout=30
              )

              print("CONNECTED")

              result["status"] = "CONNECTED"

              ws.send(
                  json.dumps({
                      "type": "ready",
                      "worker_utc":
                          datetime.now(
                              timezone.utc
                          ).isoformat()
                  })
              )


              print("READY sent")

              # Receive jobs
              while True:

                  raw = ws.recv()

                  if raw is None:
                      break

                  message = json.loads(raw)

                  print(
                      "MESSAGE:",
                      json.dumps(
                          message,
                          indent=2
                      )
                  )


                  if message.get("type") != "gpu_job":
                      continue


                  job_id = message.get(
                      "job_id"
                  )


                  print(
                      "Running GPU job:",
                      job_id
                  )


                  benchmark = run_gpu_job(
                      message
                  )


                  response = {
                      "type": "gpu_result",
                      "job_id": job_id,
                      "worker_utc":
                          datetime.now(
                              timezone.utc
                          ).isoformat(),
                      "benchmark": benchmark
                  }


                  result["jobs"].append(
                      response
                  )

                  ws.send(
                      json.dumps(response)
                  )


                  print(
                      "RESULT SENT:",
                      json.dumps(
                          response,
                          indent=2
                      )
                  )


                  # This test only runs one job.
                  break


              result["status"] = "DONE"


          except Exception as e:

              print(
                  "WORKER ERROR:",
                  repr(e)
              )

              result["status"] = "ERROR"

              result["error"] = repr(e)

              result["traceback"] = (
                  traceback.format_exc()
              )


          finally:

              result["end_utc"] = (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )

              save()

              try:

                  if ws is not None:
                      ws.close()

              except Exception:
                  pass

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )
          PY


          cat > kaggle_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-ws-worker",
            "title": "GPU WS Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      # ---------------------------------------------------------
      # 8. Push Kaggle kernel
      # ---------------------------------------------------------
      - name: Push Kaggle worker
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ~/.kaggle

          mkdir -p ~/.kaggle

          cat > ~/.kaggle/kaggle.json <<EOF
          {
            "username": "${KAGGLE_USERNAME}",
            "key": "${KAGGLE_API_TOKEN}"
          }
          EOF

          chmod 600 ~/.kaggle/kaggle.json

          kaggle kernels push \
            -p kaggle_worker

      # ---------------------------------------------------------
      # 9. Wait for Kaggle
      # ---------------------------------------------------------
      - name: Wait for Kaggle worker
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Kaggle worker..."

          FINAL_STATUS=""

          for i in $(seq 1 120); do

            STATUS="$(
              kaggle kernels status "$KAGGLE_KERNEL" 2>/dev/null \
              | tail -n 1 \
              | tr -d '\r' \
              || true
            )"

            echo "Check $i/120: $STATUS"

            case "$STATUS" in

              *COMPLETE*)
                FINAL_STATUS="COMPLETE"
                break
                ;;

              *ERROR*)
                FINAL_STATUS="ERROR"
                break
                ;;

              *CANCEL*)
                FINAL_STATUS="CANCELLED"
                break
                ;;

            esac

            sleep 5

          done

          echo "Final Kaggle status: $FINAL_STATUS"

          if [ "$FINAL_STATUS" = "ERROR" ]; then
            echo "Kaggle worker failed."
          fi

      # ---------------------------------------------------------
      # 10. Collect relay logs
      # ---------------------------------------------------------
      - name: Collect results
        if: always()
        shell: bash
        run: |
          set +e

          echo "=============================="
          echo "TUNNEL"
          echo "=============================="

          cat tunnel_url.txt 2>/dev/null || true

          echo
          echo "=============================="
          echo "CLOUDFLARED LOG"
          echo "=============================="

          cat cloudflared.log 2>/dev/null || true

          echo
          echo "=============================="
          echo "RELAY LOG"
          echo "=============================="

          cat relay.log 2>/dev/null || true

          echo
          echo "=============================="
          echo "RELAY EVENTS"
          echo "=============================="

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          data = {
              "started_utc":
                  datetime.now(timezone.utc).isoformat(),
              "connections": 0,
              "messages": 0,
              "job_sent": 0,
              "job_results": 0,
              "events": []
          }

          # Parse relay output approximately
          try:
              with open("relay.log", "r") as f:
                  lines = f.readlines()

              for line in lines:

                  if "Worker connected" in line:
                      data["connections"] += 1

                  if "RECV:" in line:
                      data["messages"] += 1

                  if "JOB SENT:" in line:
                      data["job_sent"] += 1

                  if "RESULT SENT:" in line:
                      data["job_results"] += 1

          except Exception:
              pass

          with open(
              "relay_events.json",
              "w"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2
              )

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )
          PY

          echo
          echo "=============================="
          echo "FILES"
          echo "=============================="

          find . -maxdepth 3 -type f \
            \( -name "*.json" -o -name "*.log" -o -name "*.txt" \) \
            -print

      # ---------------------------------------------------------
      # 11. Upload diagnostics
      # ---------------------------------------------------------
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-multi-job-results
          path: |
            tunnel_url.txt
            cloudflared.log
            relay.log
            relay_events.json
          if-no-files-found: warn
