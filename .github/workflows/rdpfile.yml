name: Kaggle GPU Worker Test

on:
  workflow_dispatch:

jobs:
  start-worker:
    runs-on: ubuntu-latest

    steps:

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      - name: Configure Kaggle authentication
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" \
            > "$HOME/.kaggle/access_token"

          chmod 600 "$HOME/.kaggle/access_token"

          echo "Kaggle authentication configured."

      - name: Verify Kaggle
        run: |
          kaggle competitions list --page-size 1
          echo "Kaggle authentication OK."

      - name: Create GPU Worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p kaggle_worker

          cat > kaggle_worker/worker.py <<'PY'
          import json
          import os
          import socket
          import subprocess
          import time
          from datetime import datetime, timezone

          print("========================================")
          print("       KAGGLE GPU WORKER TEST")
          print("========================================")

          print("Hostname:", socket.gethostname())
          print("PID:", os.getpid())

          # -----------------------------
          # Check NVIDIA GPU
          # -----------------------------

          print("\n=== GPU CHECK ===")

          smi = subprocess.run(
              [
                  "nvidia-smi",
                  "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu",
                  "--format=csv,noheader"
              ],
              capture_output=True,
              text=True
          )

          print(smi.stdout)

          if smi.returncode != 0:
              print("NVIDIA-SMI FAILED")
              print(smi.stderr)
              raise SystemExit(1)

          # -----------------------------
          # CUDA
          # -----------------------------

          print("=== CUDA CHECK ===")

          from numba import cuda
          import numpy as np

          if not cuda.is_available():
              print("CUDA NOT AVAILABLE")
              raise SystemExit(1)

          device = cuda.get_current_device()

          gpu_name = device.name

          if isinstance(gpu_name, bytes):
              gpu_name = gpu_name.decode()

          print("CUDA GPU:", gpu_name)

          # -----------------------------
          # CUDA worker function
          # -----------------------------

          @cuda.jit
          def vector_add(a, b, c):

              i = cuda.grid(1)

              if i < c.size:
                  c[i] = a[i] + b[i]

          # -----------------------------
          # Prepare GPU memory
          # -----------------------------

          N = 1 << 24

          a = np.ones(N, dtype=np.float32)
          b = np.ones(N, dtype=np.float32)

          d_a = cuda.to_device(a)
          d_b = cuda.to_device(b)
          d_c = cuda.device_array_like(a)

          threads = 256
          blocks = (N + threads - 1) // threads

          print("\nGPU memory initialized.")

          # -----------------------------
          # Worker loop
          # -----------------------------

          START = time.time()

          MAX_RUNTIME = 600

          iteration = 0

          print("\n========================================")
          print("GPU WORKER STARTED")
          print("Runtime:", MAX_RUNTIME, "seconds")
          print("========================================")

          while True:

              elapsed = time.time() - START

              if elapsed >= MAX_RUNTIME:
                  break

              iteration += 1

              # GPU work

              start = time.perf_counter()

              vector_add[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              gpu_time = (
                  time.perf_counter() -
                  start
              ) * 1000

              # Check GPU status

              smi = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=utilization.gpu,memory.used,temperature.gpu",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              gpu_status = smi.stdout.strip()

              print(
                  f"[Worker {iteration}] "
                  f"elapsed={elapsed:.1f}s "
                  f"GPU_compute={gpu_time:.3f}ms "
                  f"status={gpu_status}"
              )

              time.sleep(5)

          # -----------------------------
          # Finished
          # -----------------------------

          total_runtime = time.time() - START

          result = {
              "worker": "kaggle_gpu_worker",
              "hostname": socket.gethostname(),
              "gpu": gpu_name,
              "iterations": iteration,
              "runtime_seconds": total_runtime,
              "status": "WORKER_COMPLETED",
              "finished_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          print("\n========================================")
          print("WORKER FINISHED")
          print("========================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          with open(
              "/kaggle/working/worker_result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("\nResult saved.")

          PY

          cat > kaggle_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-worker-test",
            "title": "GPU Worker Test",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Start GPU Worker on Kaggle
        run: |
          set -euo pipefail

          echo "Starting Kaggle GPU Worker..."

          kaggle kernels push \
            -p kaggle_worker \
            --accelerator NvidiaTeslaP100 \
            --timeout 900

      - name: Monitor Worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME}/gpu-worker-test"

          echo "Monitoring:"
          echo "$KERNEL"

          for i in $(seq 1 100); do

            STATUS=$(kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "=============================="
            echo "Check $i"
            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then

              echo ""
              echo "WORKER COMPLETED."
              exit 0

            fi

            if echo "$STATUS" | grep -qi "ERROR"; then

              echo ""
              echo "WORKER FAILED."
              exit 1

            fi

            sleep 10

          done

          echo "Monitor timeout."
          exit 1

      - name: Download Worker Result
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p worker_output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-worker-test" \
            -p worker_output \
            -o

          echo ""
          echo "========================================"
          echo "WORKER RESULT"
          echo "========================================"

          cat worker_output/worker_result.json

      - name: Upload Worker Result
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-worker-result
          path: worker_output/
