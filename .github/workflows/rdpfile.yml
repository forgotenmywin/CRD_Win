name: Kaggle GPU Real-Time Test v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # FIX 4: Ø§ÙØ²Ø§ÛŒØ´ Ø§Ø² 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_WORKER_TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}
      PYTHONUNBUFFERED: "1"      # FIX 1: relay.log Ø¯ÛŒÚ¯Ø± Ø®Ø§Ù„ÛŒ Ù†Ù…ÛŒâ€ŒÙ…Ø§Ù†Ø¯

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip netcat-openbsd
          python3 -m pip install --upgrade pip
          python3 -m pip install kaggle "websockets>=12.0" aiohttp  # FIX 2: Ù¾ÛŒÙ† Ù†Ø³Ø®Ù‡

      - name: Check secrets
        shell: bash
        run: |
          set -u
          test -n "${KAGGLE_USERNAME:-}" || { echo "ERROR: KAGGLE_USERNAME is missing"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "ERROR: KAGGLE_API_TOKEN is missing"; exit 1; }
          test -n "${GPU_WORKER_TOKEN:-}" || { echo "ERROR: GPU_WORKER_TOKEN is missing"; exit 1; }
          echo "Secrets OK."

      - name: Configure Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"
          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {"username": "${KAGGLE_USERNAME}", "key": "${KAGGLE_API_TOKEN}"}
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      # ========== RELAY ==========
      - name: Create relay
        shell: bash
        run: |
          cat > relay.py << 'PY'
          import asyncio, json, os, time, uuid
          from datetime import datetime, timezone
          import websockets

          AUTH_TOKEN = os.environ["GPU_WORKER_TOKEN"]

          state = {
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "worker_connected": False,
              "job_sent_at": None,
              "result_received_at": None,
              "total_seconds": None,
              "gpu_info": None,
              "error": None
          }

          # FIX 2: Ø­Ø°Ù Ù¾Ø§Ø±Ø§Ù…ØªØ± path â€” Ø¯Ø± websockets>=12 Ø­Ø°Ù Ø´Ø¯Ù‡
          async def handler(ws):
              print(f"[RELAY] Connection from {ws.remote_address}", flush=True)

              # Auth
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
                  if msg.get("type") != "auth" or msg.get("token") != AUTH_TOKEN:
                      await ws.send(json.dumps({"type": "auth_failed"}))
                      return
                  worker_id = msg.get("worker_id", str(uuid.uuid4()))
                  await ws.send(json.dumps({"type": "auth_ok", "worker_id": worker_id}))
                  print(f"[RELAY] Worker authenticated: {worker_id}", flush=True)
                  state["worker_connected"] = True
              except Exception as e:
                  state["error"] = f"Auth failed: {e}"
                  print(f"[RELAY] Auth error: {e}", flush=True)
                  return

              # Send test job
              job = {"job_id": 1, "type": "gpu_job", "operation": "gpu_info"}
              state["job_sent_at"] = time.perf_counter()
              await ws.send(json.dumps(job))
              print("[RELAY] Job sent", flush=True)

              # Wait for result
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=120)
                  state["result_received_at"] = time.perf_counter()
                  msg = json.loads(raw)

                  if msg.get("type") == "gpu_result":
                      state["total_seconds"] = state["result_received_at"] - state["job_sent_at"]
                      state["gpu_info"] = {k: v for k, v in msg.items() if k != "type"}
                      print(f"[RELAY] SUCCESS in {state['total_seconds']:.2f}s", flush=True)
                      print(f"[RELAY] GPU info: {state['gpu_info']}", flush=True)
                  else:
                      state["error"] = f"Unexpected response: {msg}"
                      print(f"[RELAY] Unexpected: {msg}", flush=True)

              except asyncio.TimeoutError:
                  state["error"] = "Timeout waiting for result"
                  print("[RELAY] TIMEOUT waiting for GPU result", flush=True)

              with open("test_result.json", "w") as f:
                  json.dump(state, f, indent=2)

              await ws.close()

          async def main():
              print("[RELAY] Starting on ws://127.0.0.1:8765", flush=True)
              async with websockets.serve(handler, "127.0.0.1", 8765):
                  await asyncio.sleep(700)   # Ú©Ù…ÛŒ Ú©Ù…ØªØ± Ø§Ø² timeout Ú©Ù„ workflow

          asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          nohup python3 -u relay.py > relay.log 2>&1 &   # FIX 1: -u Ø¨Ø±Ø§ÛŒ unbuffered
          sleep 3
          echo "--- relay.log ---"
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -u
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --protocol http2 --no-autoupdate > cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              WSS_URL=$(echo "$URL" | sed 's#^https://#wss://#')/
              echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"
              echo "Tunnel: $WSS_URL"
              break
            fi
            sleep 2
          done
          test -n "$WSS_URL" || { echo "Tunnel failed"; cat cloudflared.log; exit 1; }

      # ========== WORKER ==========
      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_test && mkdir -p kaggle_test/worker

          cat > kaggle_test/worker/worker.py << PYWORKER
          import asyncio, json, os, subprocess, sys, time, traceback, uuid
          from datetime import datetime, timezone

          # Ù‡Ù…ÛŒØ´Ù‡ Ù†Ø³Ø®Ù‡ Ø³Ø§Ø²Ú¯Ø§Ø± Ø±Ø§ Ù†ØµØ¨ Ù…ÛŒâ€ŒÚ©Ù†ÛŒÙ…
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "websockets>=12.0"])
          import websockets
          import torch

          WSS_URL = "${WSS_URL}"
          AUTH_TOKEN = "${GPU_WORKER_TOKEN}"
          WORKER_ID = "test-worker-" + str(uuid.uuid4())[:8]

          def get_gpu_info():
              try:
                  p = subprocess.run(
                      ["nvidia-smi", "--query-gpu=name,memory.total,temperature.gpu",
                       "--format=csv,noheader"],
                      capture_output=True, text=True, timeout=10)
                  return p.stdout.strip()
              except Exception as e:
                  return str(e)

          async def main():
              print(f"[WORKER] {WORKER_ID} starting...", flush=True)
              print(f"[WORKER] GPU: {get_gpu_info()}", flush=True)
              print(f"[WORKER] CUDA: {torch.cuda.is_available()}", flush=True)

              ws = None
              try:
                  print(f"[WORKER] Connecting to {WSS_URL}", flush=True)
                  t0 = time.perf_counter()
                  ws = await asyncio.wait_for(websockets.connect(WSS_URL), timeout=30)
                  print(f"[WORKER] Connected in {time.perf_counter()-t0:.2f}s", flush=True)

                  # Send auth
                  await ws.send(json.dumps({
                      "type": "auth",
                      "token": AUTH_TOKEN,
                      "worker_id": WORKER_ID
                  }))

                  # FIX 3: Ø®ÙˆØ§Ù†Ø¯Ù† auth_ok â€” Ù‚Ø¨Ù„Ø§Ù‹ Ø§ÛŒÙ† Ù…Ø±Ø­Ù„Ù‡ ÙˆØ¬ÙˆØ¯ Ù†Ø¯Ø§Ø´Øª
                  # Relay Ø§ÙˆÙ„ auth_ok Ù…ÛŒâ€ŒÙØ±Ø³ØªØ¯ØŒ Ø¨Ø¹Ø¯ job
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  auth_msg = json.loads(raw)
                  if auth_msg.get("type") != "auth_ok":
                      print(f"[WORKER] Auth failed: {auth_msg}", flush=True)
                      return
                  print(f"[WORKER] Auth OK", flush=True)

                  # Now read the actual job
                  raw = await asyncio.wait_for(ws.recv(), timeout=60)
                  msg = json.loads(raw)
                  print(f"[WORKER] Job received: {msg}", flush=True)

                  if msg.get("type") == "gpu_job" and msg.get("operation") == "gpu_info":
                      device = torch.device("cuda")
                      a = torch.randn(1000, 1000, device=device)
                      b = torch.randn(1000, 1000, device=device)
                      _ = torch.matmul(a, b)
                      torch.cuda.synchronize()

                      result = {
                          "type": "gpu_result",
                          "job_id": msg["job_id"],
                          "worker_id": WORKER_ID,
                          "gpu_name": torch.cuda.get_device_name(0),
                          "gpu_memory": f"{torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB",
                          "nvidia_smi": get_gpu_info(),
                          "compute_done": True
                      }
                      await ws.send(json.dumps(result))
                      print("[WORKER] Result sent", flush=True)

              except Exception as e:
                  print(f"[WORKER] ERROR: {e}", flush=True)
                  traceback.print_exc()
              finally:
                  if ws:
                      await ws.close()

          asyncio.run(main())
          PYWORKER

          cat > kaggle_test/worker/kernel-metadata.json << EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-test-worker",
            "title": "gpu-test-worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          kaggle kernels push -p kaggle_test/worker
          echo "Worker pushed. Kaggle GPU kernels typically take 5-15 minutes to start."

      # ========== WAIT FOR RESULT ==========
      - name: Wait for test result
        shell: bash
        run: |
          set -u
          echo "Waiting for worker to connect and complete..."

          # FIX 4: Ø§ÙØ²Ø§ÛŒØ´ Ø§Ø² 60 Ø¨Ù‡ 120 ØªÚ©Ø±Ø§Ø± = 10 Ø¯Ù‚ÛŒÙ‚Ù‡
          for i in $(seq 1 120); do
            if [ -f test_result.json ]; then
              echo "=========================================="
              echo "TEST COMPLETED"
              echo "=========================================="
              cat test_result.json

              TOTAL=$(jq -r '.total_seconds // "null"' test_result.json)
              if [ "$TOTAL" != "null" ]; then
                if (( $(echo "$TOTAL < 5" | bc -l) )); then
                  echo "REAL-TIME: YES (< 5 seconds)"
                elif (( $(echo "$TOTAL < 30" | bc -l) )); then
                  echo "REAL-TIME: MAYBE (5-30 seconds)"
                else
                  echo "REAL-TIME: NO (> 30 seconds)"
                fi
              fi
              exit 0
            fi

            echo "Attempt $i/120 ($(( i * 5 ))s elapsed)..."
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Relay log (last 20) ---"
              tail -20 relay.log || true
              echo "--- Cloudflare log (last 5) ---"
              tail -5 cloudflared.log || true
            fi

            sleep 5
          done

          echo "TIMEOUT: No result after 10 minutes"
          cat relay.log || true
          tail -20 cloudflared.log || true
          exit 1

      - name: Download worker output
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test_output
          kaggle kernels output "${KAGGLE_USERNAME}/gpu-test-worker" -p test_output --force || true
          find test_output -type f -print || true
          cat test_output/*.json 2>/dev/null || true

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL TEST REPORT"
          echo "=========================================="
          grep trycloudflare cloudflared.log | head -1 || true
          echo ""
          cat test_result.json 2>/dev/null || echo "No result file"
          echo ""
          cat relay.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-realtime-test-v1
          path: |
            test_result.json
            relay.log
            cloudflared.log
            test_output/**
          retention-days: 3
