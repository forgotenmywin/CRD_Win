name: Kaggle API Latency Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Kaggle API
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Testing connection to Kaggle API..."

          START=$(date +%s%3N)

          HTTP_CODE=$(curl -sS \
            -o /tmp/kaggle_response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $KAGGLE_API_TOKEN" \
            https://www.kaggle.com/api/v1/datasets/list?pageSize=1)

          END=$(date +%s%3N)

          LATENCY=$((END - START))

          echo "HTTP status: $HTTP_CODE"
          echo "API latency: ${LATENCY} ms"

          echo "Response:"
          head -c 500 /tmp/kaggle_response.json
          echo
