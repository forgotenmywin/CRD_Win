          echo "WSS_URL=$WSS_URL" \
            >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "PUBLIC GPU API"
          echo "=============================================="
          echo "$WSS_URL"
          echo "=============================================="


      # ============================================================
      # CREATE KAGGLE WORKERS
      # ============================================================

      - name: Create Kaggle GPU workers
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kaggle_workers

          mkdir -p kaggle_workers

          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            WORKER_ID="gpu-worker-${WORKER_INDEX}"

            DIR="kaggle_workers/${WORKER_ID}"

            mkdir -p "$DIR"

            cat > "${DIR}/worker.py" <<PYWORKER

          import asyncio
          import base64
          import json
          import os
          import subprocess
          import time
          import traceback
          import uuid

          from datetime import datetime, timezone

          import numpy as np

          import websocket


          WSS_URL = "${WSS_URL}"

          WORKER_TOKEN = "${GPU_WORKER_TOKEN}"

          WORKER_ID = "${WORKER_ID}"


          RESULT_FILE = (
              "/kaggle/working/"
              "worker_result.json"
          )


          def now():

              return datetime.now(
                  timezone.utc
              ).isoformat()


          def gpu_info():

              try:

                  p = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )

                  return p.stdout.strip()

              except Exception as e:

                  return repr(e)


          def save(data):

              with open(
                  RESULT_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          # ==========================================================
          # GPU OPERATIONS
          # ==========================================================

          def run_vector_add(
              data
          ):

              from numba import cuda

              n = int(
                  data.get(
                      "n",
                      1024 * 1024
                  )
              )

              repeats = int(
                  data.get(
                      "repeats",
                      10
                  )
              )

              input_a = data.get(
                  "input_a"
              )

              input_b = data.get(
                  "input_b"
              )

              if input_a:

                  raw_a = base64.b64decode(
                      input_a
                  )

                  a = np.frombuffer(
                      raw_a,
                      dtype=np.float32
                  ).copy()

              else:

                  a = np.ones(
                      n,
                      dtype=np.float32
                  )

              if input_b:

                  raw_b = base64.b64decode(
                      input_b
                  )

                  b = np.frombuffer(
                      raw_b,
                      dtype=np.float32
                  ).copy()

              else:

                  b = np.ones(
                      n,
                      dtype=np.float32
                  )

              n = min(
                  len(a),
                  len(b)
              )

              a = a[:n]
              b = b[:n]

              da = cuda.to_device(
                  a
              )

              db = cuda.to_device(
                  b
              )

              dc = cuda.device_array(
                  n,
                  dtype=np.float32
              )


              @cuda.jit
              def kernel(
                  x,
                  y,
                  z
              ):

                  i = cuda.grid(1)

                  if i < z.size:

                      z[i] = (
                          x[i]
                          +
                          y[i]
                      )


              threads = 256

              blocks = (
                  n + threads - 1
              ) // threads


              kernel[
                  blocks,
                  threads
              ](
                  da,
                  db,
                  dc
              )

              cuda.synchronize()


              start = time.perf_counter()

              for _ in range(
                  repeats
              ):

                  kernel[
                      blocks,
                      threads
                  ](
                      da,
                      db,
                      dc
                  )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  -
                  start
              )

              output = dc.copy_to_host()

              output_b64 = base64.b64encode(
                  output.tobytes()
              ).decode()

              return {

                  "operation":
                      "vector_add",

                  "elements":
                      n,

                  "repeats":
                      repeats,

                  "gpu_compute_ms":
                      elapsed * 1000,

                  "output_bytes":
                      output.nbytes,

                  "output_base64":
                      output_b64
              }


          def run_matmul(
              data
          ):

              from numba import cuda

              size = int(
                  data.get(
                      "size",
                      1024
                  )
              )


              a = np.random.random(
                  (
                      size,
                      size
                  )
              ).astype(
                  np.float32
              )

              b = np.random.random(
                  (
                      size,
                      size
                  )
              ).astype(
                  np.float32
              )


              da = cuda.to_device(
                  a
              )

              db = cuda.to_device(
                  b
              )

              dc = cuda.device_array(
                  (
                      size,
                      size
                  ),
                  dtype=np.float32
              )


              @cuda.jit
              def matmul(
                  A,
                  B,
                  C
              ):

                  row = (
                      cuda.blockIdx.x
                      *
                      cuda.blockDim.x
                      +
                      cuda.threadIdx.x
                  )

                  col = (
                      cuda.blockIdx.y
                      *
                      cuda.blockDim.y
                      +
                      cuda.threadIdx.y
                  )

                  if (
                      row < C.shape[0]
                      and
                      col < C.shape[1]
                  ):

                      tmp = 0.0

                      for k in range(
                          A.shape[1]
                      ):

                          tmp += (
                              A[row, k]
                              *
                              B[k, col]
                          )

                      C[row, col] = tmp


              threads = (
                  16,
                  16
              )

              blocks = (
                  (
                      size + 15
                  ) // 16,

                  (
                      size + 15
                  ) // 16
              )


              matmul[
                  blocks,
                  threads
              ](
                  da,
                  db,
                  dc
              )

              cuda.synchronize()


              start = time.perf_counter()

              matmul[
                  blocks,
                  threads
              ](
                  da,
                  db,
                  dc
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  -
                  start
              )

              output = dc.copy_to_host()

              output_b64 = base64.b64encode(
                  output.tobytes()
              ).decode()

              return {

                  "operation":
                      "matmul",

                  "size":
                      size,

                  "gpu_compute_ms":
                      elapsed * 1000,

                  "output_bytes":
                      output.nbytes,

                  "output_base64":
                      output_b64
              }


          def run_job(
              job
          ):

              operation = job.get(
                  "operation",
                  "vector_add"
              )

              if operation == "vector_add":

                  return run_vector_add(
                      job
                  )

              if operation == "matmul":

                  return run_matmul(
                      job
                  )

              raise ValueError(
                  "Unknown operation: "
                  + str(operation)
              )


          # ==========================================================
          # WORKER LOOP
          # ==========================================================

          async def main():

              print(
                  "=============================================="
              )

              print(
                  "KAGGLE REAL-TIME GPU WORKER"
              )

              print(
                  "WORKER:",
                  WORKER_ID
              )

              print(
                  "GPU:"
              )

              print(
                  gpu_info()
              )

              print(
                  "=============================================="
              )


              while True:

                  ws = None

                  try:

                      print(
                          "Connecting..."
                      )

                      ws = websocket.create_connection(
                          WSS_URL,
                          timeout=120,
                          max_size=
                              100 * 1024 * 1024
                      )


                      ws.send(
                          json.dumps({
                              "type":
                                  "auth",

                              "role":
                                  "worker",

                              "token":
                                  WORKER_TOKEN
                          })
                      )


                      ws.send(
                          json.dumps({
                              "type":
                                  "worker_info",

                              "worker_id":
                                  WORKER_ID,

                              "gpu_name":
                                  gpu_info(),

                              "worker_utc":
                                  now()
                          })
                      )


                      print(
                          "Connected."
                      )


                      while True:

                          # ------------------------------
                          # Heartbeat
                          # ------------------------------

                          try:

                              ws.settimeout(
                                  5
                              )

                              raw = ws.recv()

                          except Exception:

                              ws.send(
                                  json.dumps({
                                      "type":
                                          "heartbeat",

                                      "worker_id":
                                          WORKER_ID,

                                      "worker_mono":
                                          time.monotonic(),

                                      "worker_utc":
                                          now()
                                  })
                              )

                              continue


                          if raw is None:

                              raise RuntimeError(
                                  "connection_closed"
                              )


                          msg = json.loads(
                              raw
                          )


                          if msg.get(
                              "type"
                          ) == "heartbeat_ack":

                              continue


                          if msg.get(
                              "type"
                          ) != "gpu_job":

                              continue


                          job_id = msg.get(
                              "job_id"
                          )

                          attempt = msg.get(
                              "attempt",
                              1
                          )


                          print(
                              "JOB:",
                              job_id
                          )

                          started = (
                              time.perf_counter()
                          )


                          try:

                              result = run_job(
                                  msg
                              )

                              compute_ms = (
                                  (
                                      time.perf_counter()
                                      -
                                      started
                                  )
                                  * 1000
                              )

                              response = {

                                  "type":
                                      "gpu_result",

                                  "job_id":
                                      job_id,

                                  "attempt":
                                      attempt,

                                  "worker_id":
                                      WORKER_ID,

                                  "worker_utc":
                                      now(),

                                  "worker_send_mono":
                                      time.monotonic(),

                                  "compute_wall_ms":
                                      compute_ms,

                                  **result

                              }


                          except Exception as e:

                              response = {

                                  "type":
                                      "gpu_result",

                                  "job_id":
                                      job_id,

                                  "attempt":
                                      attempt,

                                  "worker_id":
                                      WORKER_ID,

                                  "worker_utc":
                                      now(),

                                  "worker_send_mono":
                                      time.monotonic(),

                                  "error":
                                      repr(e),

                                  "traceback":
                                      traceback.format_exc()

                              }


                          ws.send(
                              json.dumps(
                                  response
                              )
                          )


                          print(
                              "RESULT SENT:",
                              job_id
                          )


                  except Exception as e:

                      print(
                          "WORKER CONNECTION ERROR:",
                          repr(e)
                      )

                      await asyncio.sleep(
                          3
                      )

                  finally:

                      if ws:

                          try:

                              ws.close()

                          except Exception:
                              pass


          if __name__ == "__main__":

              asyncio.run(
                  main()
              )

          PYWORKER


            cat > "${DIR}/kernel-metadata.json" <<EOF
