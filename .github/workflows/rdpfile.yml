name: Kaggle GPU Real-Time Test v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GPU_WORKER_TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip netcat-openbsd
          python3 -m pip install --upgrade pip
          python3 -m pip install kaggle websockets aiohttp

      - name: Check secrets
        shell: bash
        run: |
          set -u
          test -n "${KAGGLE_USERNAME:-}" || { echo "ERROR: KAGGLE_USERNAME is missing"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "ERROR: KAGGLE_API_TOKEN is missing"; exit 1; }
          test -n "${GPU_WORKER_TOKEN:-}" || { echo "ERROR: GPU_WORKER_TOKEN is missing"; exit 1; }
          echo "Secrets OK."

      - name: Configure Kaggle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"
          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {"username": "${KAGGLE_USERNAME}", "key": "${KAGGLE_API_TOKEN}"}
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      # ========== RELAY ساده ==========
      - name: Create relay
        shell: bash
        run: |
          cat > relay.py <<'PY'
          import asyncio, json, os, time, uuid
          from datetime import datetime, timezone
          import websockets

          AUTH_TOKEN = os.environ["GPU_WORKER_TOKEN"]

          state = {
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "worker_connected": False,
              "job_sent_at": None,
              "result_received_at": None,
              "total_seconds": None,
              "gpu_info": None,
              "error": None
          }

          async def handler(ws, path):
              print(f"[RELAY] Connection from {ws.remote_address}")
              
              # Auth
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
                  if msg.get("type") != "auth" or msg.get("token") != AUTH_TOKEN:
                      await ws.send(json.dumps({"type": "auth_failed"}))
                      return
                  worker_id = msg.get("worker_id", str(uuid.uuid4()))
                  await ws.send(json.dumps({"type": "auth_ok", "worker_id": worker_id}))
                  print(f"[RELAY] Worker authenticated: {worker_id}")
                  state["worker_connected"] = True
              except Exception as e:
                  state["error"] = f"Auth failed: {e}"
                  return

              # Send test job
              job = {
                  "job_id": 1,
                  "type": "gpu_job", 
                  "operation": "gpu_info"
              }
              state["job_sent_at"] = time.perf_counter()
              await ws.send(json.dumps(job))
              print(f"[RELAY] Job sent at {state['job_sent_at']}")

              # Wait for result
              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=120)
                  state["result_received_at"] = time.perf_counter()
                  msg = json.loads(raw)
                  
                  if msg.get("type") == "gpu_result":
                      state["total_seconds"] = state["result_received_at"] - state["job_sent_at"]
                      state["gpu_info"] = msg.get("output", {})
                      print(f"[RELAY] ✅ RESULT in {state['total_seconds']:.2f}s")
                      print(f"[RELAY] GPU: {state['gpu_info']}")
                  else:
                      state["error"] = f"Unexpected response: {msg}"
                      
              except asyncio.TimeoutError:
                  state["error"] = "Timeout waiting for result"
                  print("[RELAY] ❌ TIMEOUT")

              # Save result
              with open("test_result.json", "w") as f:
                  json.dump(state, f, indent=2)
              
              await ws.close()

          async def main():
              print("[RELAY] Starting on ws://127.0.0.1:8765")
              async with websockets.serve(handler, "127.0.0.1", 8765):
                  await asyncio.sleep(300)  # 5 min max

          asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          nohup python3 relay.py > relay.log 2>&1 &
          sleep 2
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -u
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --protocol http2 --no-autoupdate > cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              WSS_URL=$(echo "$URL" | sed 's#^https://#wss://#')/
              echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"
              echo "✅ Tunnel: $WSS_URL"
              break
            fi
            sleep 2
          done
          test -n "$WSS_URL" || { echo "Tunnel failed"; cat cloudflared.log; exit 1; }

      # ========== WORKER ==========
      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_test && mkdir -p kaggle_test/worker
          
          cat > kaggle_test/worker/worker.py <<PYWORKER
          import asyncio, json, os, subprocess, sys, time, traceback, uuid
          from datetime import datetime, timezone

          # Install websockets if missing
          try:
              import websockets
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "websockets"])
              import websockets

          import torch

          WSS_URL = "${WSS_URL}"
          AUTH_TOKEN = "${GPU_WORKER_TOKEN}"
          WORKER_ID = "test-worker-" + str(uuid.uuid4())[:8]

          def now():
              return datetime.now(timezone.utc).isoformat()

          def get_gpu_info():
              try:
                  p = subprocess.run(["nvidia-smi", "--query-gpu=name,memory.total,temperature.gpu", "--format=csv,noheader"],
                                    capture_output=True, text=True, timeout=10)
                  return p.stdout.strip()
              except Exception as e:
                  return str(e)

          async def main():
              print(f"[WORKER] {WORKER_ID} starting...")
              print(f"[WORKER] GPU: {get_gpu_info()}")
              print(f"[WORKER] PyTorch CUDA: {torch.cuda.is_available()}")
              
              ws = None
              try:
                  # Connect
                  print(f"[WORKER] Connecting to {WSS_URL}")
                  start_connect = time.perf_counter()
                  ws = await websockets.connect(WSS_URL, open_timeout=30, close_timeout=10)
                  connect_time = time.perf_counter() - start_connect
                  print(f"[WORKER] ✅ Connected in {connect_time:.2f}s")
                  
                  # Auth
                  await ws.send(json.dumps({
                      "type": "auth",
                      "token": AUTH_TOKEN,
                      "worker_id": WORKER_ID
                  }))
                  
                  # Wait for job
                  raw = await ws.recv()
                  msg = json.loads(raw)
                  print(f"[WORKER] Received: {msg}")
                  
                  if msg.get("type") == "gpu_job" and msg.get("operation") == "gpu_info":
                      # Do GPU work
                      device = torch.device("cuda")
                      a = torch.randn(1000, 1000, device=device)
                      b = torch.randn(1000, 1000, device=device)
                      c = torch.matmul(a, b)
                      torch.cuda.synchronize()
                      
                      result = {
                          "type": "gpu_result",
                          "job_id": msg["job_id"],
                          "worker_id": WORKER_ID,
                          "gpu_name": torch.cuda.get_device_name(0),
                          "gpu_memory": f"{torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB",
                          "nvidia_smi": get_gpu_info(),
                          "compute_done": True
                      }
                      await ws.send(json.dumps(result))
                      print(f"[WORKER] ✅ Result sent")
                  
              except Exception as e:
                  print(f"[WORKER] ❌ ERROR: {e}")
                  traceback.print_exc()
              finally:
                  if ws:
                      await ws.close()

          asyncio.run(main())
          PYWORKER

          cat > kaggle_test/worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-test-worker",
            "title": "gpu-test-worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          kaggle kernels push -p kaggle_test/worker
          echo "✅ Worker pushed. Waiting for Kaggle to start..."

      # ========== WAIT FOR RESULT ==========
      - name: Wait for test result
        shell: bash
        run: |
          set -u
          echo "Waiting for worker to connect and complete..."
          
          for i in $(seq 1 60); do
            if [ -f test_result.json ]; then
              echo ""
              echo "=========================================="
              echo "✅ TEST COMPLETED"
              echo "=========================================="
              cat test_result.json
              
              TOTAL=$(jq -r '.total_seconds // "null"' test_result.json)
              if [ "$TOTAL" != "null" ] && [ "$TOTAL" != "0" ]; then
                echo ""
                if (( $(echo "$TOTAL < 5" | bc -l) )); then
                  echo "🚀 REAL-TIME: YES (< 5 seconds)"
                elif (( $(echo "$TOTAL < 30" | bc -l) )); then
                  echo "⚠️  REAL-TIME: MAYBE (5-30 seconds)"
                else
                  echo "❌ REAL-TIME: NO (> 30 seconds)"
                fi
              fi
              exit 0
            fi
            
            echo "Attempt $i/60..."
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Relay log ---"
              tail -20 relay.log || true
              echo "--- Cloudflare log ---"
              tail -20 cloudflared.log || true
            fi
            
            sleep 5
          done
          
          echo "❌ TIMEOUT: No result received"
          echo "--- Relay log ---"
          cat relay.log || true
          echo "--- Cloudflare log ---"
          cat cloudflared.log || true
          exit 1

      - name: Download worker output
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p test_output
          kaggle kernels output "${KAGGLE_USERNAME}/gpu-test-worker" -p test_output --force || true
          echo "--- Worker files ---"
          find test_output -type f -print || true
          echo "--- Worker result ---"
          cat test_output/*.json 2>/dev/null || true

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL TEST REPORT"
          echo "=========================================="
          echo ""
          echo "Tunnel:"
          cat cloudflared.log | grep trycloudflare | head -1 || true
          echo ""
          echo "Test result:"
          cat test_result.json 2>/dev/null || echo "No result file"
          echo ""
          echo "Relay log:"
          cat relay.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-realtime-test-v1
          path: |
            test_result.json
            relay.log
            cloudflared.log
            test_output/**
          retention-days: 3
