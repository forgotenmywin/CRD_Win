name: Kaggle GPU Worker - WebSocket GPU Job

"on":
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_USERNAME }}/gpu-ws-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle websocket-client numpy numba websockets

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "${KAGGLE_USERNAME}",
            "key": "${KAGGLE_API_TOKEN}"
          }
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"

          echo "Kaggle auth configured."

      - name: Verify Kaggle auth
        shell: bash
        run: |
          set -euxo pipefail
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          CLOUDFLARED_TAG="$(
            python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/cloudflare/cloudflared/releases/latest"
          with urllib.request.urlopen(url) as r:
              data = json.load(r)
          print(data["tag_name"])
          PY
          )"

          echo "Latest cloudflared tag: $CLOUDFLARED_TAG"

          curl -fL --retry 5 --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Create relay server
        shell: bash
        run: |
          set -euxo pipefail

          cat > relay.py <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone

          import websockets

          HOST = "127.0.0.1"
          PORT = 8765

          STATE_FILE = "relay_result.json"

          state = {
              "started_utc": datetime.now(timezone.utc).isoformat(),
              "connections": 0,
              "messages": 0,
              "job_sent": 0,
              "job_results": 0,
              "events": [],
              "job_results_data": []
          }

          finished = asyncio.Event()


          def now():
              return datetime.now(timezone.utc).isoformat()


          def save():
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, indent=2, ensure_ascii=False)


          def record(kind, **data):
              state["events"].append({
                  "kind": kind,
                  "at_utc": now(),
                  **data
              })
              if len(state["events"]) > 300:
                  state["events"] = state["events"][-300:]
              save()


          async def handler(ws):
              state["connections"] += 1
              record("connect", remote=str(ws.remote_address), url="/ws")

              try:
                  async for raw in ws:
                      state["messages"] += 1

                      try:
                          msg = json.loads(raw)
                      except Exception:
                          msg = {"type": "raw", "raw": raw}

                      record("message", message=msg)

                      if msg.get("type") == "ready":
                          job = {
                              "type": "gpu_job",
                              "job_id": 1,
                              "benchmark": "numba_vector_add",
                              "n": 16777216,
                              "repeats": 50
                          }

                          await ws.send(json.dumps(job))
                          state["job_sent"] += 1
                          record("job_sent", job=job)

                      elif msg.get("type") == "gpu_result":
                          state["job_results"] += 1
                          state["job_results_data"].append(msg)
                          record("job_result", result=msg)

                          await ws.send(json.dumps({
                              "type": "ack",
                              "ok": True,
                              "job_id": msg.get("job_id"),
                              "relay_utc": now()
                          }))

                          finished.set()

                      elif msg.get("type") == "ping":
                          await ws.send(json.dumps({
                              "type": "pong",
                              "id": msg.get("id"),
                              "relay_utc": now()
                          }))

              except Exception as e:
                  record("handler_error", error=repr(e))

              finally:
                  record("close")


          async def main():
              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=60,
                  max_size=10 * 1024 * 1024,
              ):
                  print(f"Relay listening on ws://{HOST}:{PORT}/ws")
                  save()

                  try:
                      await asyncio.wait_for(finished.wait(), timeout=900)
                  except asyncio.TimeoutError:
                      record("timeout")

                  save()
                  print(json.dumps(state, indent=2, ensure_ascii=False))


          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          set -euxo pipefail
          nohup python3 relay.py > relay.log 2>&1 &
          echo $! > relay.pid
          sleep 2
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euxo pipefail
          nohup cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          echo "Waiting for tunnel URL..."
          for i in $(seq 1 60); do
            if grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 > tunnel_url.txt; then
              break
            fi
            sleep 2
          done

          if [ ! -s tunnel_url.txt ]; then
            echo "Tunnel URL not found."
            cat cloudflared.log || true
            exit 1
          fi

          TUNNEL_URL="$(cat tunnel_url.txt)"
          WSS_URL="${TUNNEL_URL/https:/wss:}/ws"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"

          echo "Tunnel URL: $TUNNEL_URL"
          echo "WSS URL: $WSS_URL"

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_worker
          mkdir -p kaggle_worker

          cat > kaggle_worker/worker.py <<PY
          import json
          import subprocess
          import time
          import traceback
          from datetime import datetime, timezone

          import websocket

          WSS_URL = "${WSS_URL}"
          RESULT_FILE = "/kaggle/working/worker_result.json"


          def now():
              return datetime.now(timezone.utc).isoformat()


          def save(result):
              result["end_utc"] = now()
              with open(RESULT_FILE, "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, ensure_ascii=False)


          def nvidia_smi():
              try:
                  p = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )
                  return {
                      "rc": p.returncode,
                      "output": p.stdout.strip(),
                      "stderr": p.stderr.strip()
                  }
              except Exception as e:
                  return {
                      "error": repr(e)
                  }


          def run_benchmark(n, repeats):
              import numpy as np
              from numba import cuda

              if not cuda.is_available():
                  raise RuntimeError("CUDA is not available")

              @cuda.jit
              def add_kernel(a, b, c):
                  i = cuda.grid(1)
                  if i < c.size:
                      c[i] = a[i] + b[i]

              a = cuda.to_device(np.ones(n, dtype=np.float32))
              b = cuda.to_device(np.ones(n, dtype=np.float32))
              c = cuda.to_device(np.zeros(n, dtype=np.float32))

              threads = 256
              blocks = (n + threads - 1) // threads

              add_kernel[blocks, threads](a, b, c)
              cuda.synchronize()

              start = time.perf_counter()
              for _ in range(repeats):
                  add_kernel[blocks, threads](a, b, c)
              cuda.synchronize()
              elapsed = time.perf_counter() - start

              start_evt = cuda.event(timing=True)
              end_evt = cuda.event(timing=True)
              start_evt.record()
              for _ in range(repeats):
                  add_kernel[blocks, threads](a, b, c)
              end_evt.record()
              end_evt.synchronize()

              kernel_ms_total = cuda.event_elapsed_time(start_evt, end_evt)
              kernel_ms_per_launch = kernel_ms_total / repeats

              bytes_total = n * 12 * repeats
              bandwidth_gbps = bytes_total / elapsed / 1e9

              gpu_name = cuda.get_current_device().name
              if isinstance(gpu_name, bytes):
                  gpu_name = gpu_name.decode(errors="replace")

              return {
                  "backend": "numba_cuda",
                  "gpu_name": gpu_name,
                  "elements": n,
                  "repeats": repeats,
                  "kernel_ms_per_launch": float(kernel_ms_per_launch),
                  "wall_ms": float(elapsed * 1000),
                  "effective_bandwidth_gbps": float(bandwidth_gbps)
              }


          result = {
              "worker": "kaggle_gpu_ws_worker",
              "wss_url": WSS_URL,
              "start_utc": now(),
              "status": "STARTING",
              "jobs": []
          }

          print("=" * 50)
          print("KAGGLE GPU WS WORKER")
          print("=" * 50)
          print("WSS URL:", WSS_URL)
          print("=== NVIDIA-SMI ===")
          print(json.dumps(nvidia_smi(), indent=2, ensure_ascii=False))

          ws = None

          try:
              ws = websocket.create_connection(WSS_URL, timeout=30)
              result["status"] = "CONNECTED"

              ws.send(json.dumps({
                  "type": "ready",
                  "worker_utc": now()
              }))

              while True:
                  raw = ws.recv()
                  if raw is None:
                      break

                  msg = json.loads(raw)
                  print("RECV:", msg)

                  if msg.get("type") != "gpu_job":
                      continue

                  job_id = msg.get("job_id")
                  n = int(msg.get("n", 16777216))
                  repeats = int(msg.get("repeats", 50))

                  started = time.perf_counter()

                  try:
                      benchmark = run_benchmark(n, repeats)
                      response = {
                          "type": "gpu_result",
                          "job_id": job_id,
                          "worker_utc": now(),
                          "compute_wall_ms": float((time.perf_counter() - started) * 1000),
                          "benchmark": benchmark
                      }
                  except Exception as e:
                      response = {
                          "type": "gpu_result",
                          "job_id": job_id,
                          "worker_utc": now(),
                          "error": repr(e),
                          "traceback": traceback.format_exc()
                      }

                  result["jobs"].append(response)
                  ws.send(json.dumps(response))
                  print("SENT:", json.dumps(response, indent=2, ensure_ascii=False))
                  break

              result["status"] = "DONE"

          except Exception as e:
              result["status"] = "ERROR"
              result["error"] = repr(e)
              result["traceback"] = traceback.format_exc()
              print("WORKER ERROR:", repr(e))
              print(result["traceback"])

          finally:
              if ws is not None:
                  try:
                      ws.close()
                  except Exception:
                      pass

              save(result)
              print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

          cat > kaggle_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_KERNEL}",
            "title": "GPU WS Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle kernel
        shell: bash
        run: |
          set -euxo pipefail
          kaggle kernels push -p kaggle_worker

      - name: Wait for worker result
        shell: bash
        run: |
          set -euxo pipefail

          for i in $(seq 1 120); do
            if [ -f relay_result.json ] && grep -q '"job_results": 1' relay_result.json; then
              echo "GPU result received."
              break
            fi

            STATUS="$(
              kaggle kernels status "$KAGGLE_KERNEL" 2>/dev/null | tail -n 1 || true
            )"
            echo "Kaggle status: $STATUS"

            sleep 5
          done

      - name: Download Kaggle output
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p kaggle_output
          kaggle kernels output "$KAGGLE_KERNEL" -p kaggle_output --force || true
          find kaggle_output -maxdepth 3 -type f -print || true

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== RELAY LOG ==="
          cat relay.log || true
          echo
          echo "=== CLOUDFLARED LOG ==="
          cat cloudflared.log || true
          echo
          echo "=== RELAY RESULT ==="
          cat relay_result.json || true
          echo
          echo "=== KAGGLE OUTPUT FILES ==="
          find kaggle_output -type f -maxdepth 3 -print -exec sh -c 'echo "--- $1"; cat "$1"; echo' _ {} \; || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-worker-results
          path: |
            relay_result.json
            relay.log
            cloudflared.log
            tunnel_url.txt
            kaggle_output/**
          if-no-files-found: warn
          retention-days: 7
