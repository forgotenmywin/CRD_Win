name: Kaggle GPU Worker Network Test

on:
  workflow_dispatch:

jobs:
  network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ==========================================
      # 1. Install Kaggle CLI
      # ==========================================

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      # ==========================================
      # 2. Kaggle authentication
      # ==========================================

      - name: Configure Kaggle authentication
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" \
            > "$HOME/.kaggle/access_token"

          chmod 600 "$HOME/.kaggle/access_token"

          echo "Kaggle authentication configured."

      # ==========================================
      # 3. Verify Kaggle
      # ==========================================

      - name: Verify Kaggle API
        run: |
          set -euo pipefail

          kaggle competitions list --page-size 1

          echo "Kaggle API OK."

      # ==========================================
      # 4. Create Worker
      # ==========================================

      - name: Create Kaggle network worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p kaggle_network_worker

          cat > kaggle_network_worker/worker.py <<'PY'
          import json
          import socket
          import subprocess
          import time
          import urllib.request
          from datetime import datetime, timezone

          print("==========================================")
          print("      KAGGLE GPU NETWORK WORKER")
          print("==========================================")

          hostname = socket.gethostname()

          print("Hostname:", hostname)

          # ======================================
          # GPU CHECK
          # ======================================

          print("\n=== GPU ===")

          smi = subprocess.run(
              [
                  "nvidia-smi",
                  "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu",
                  "--format=csv,noheader"
              ],
              capture_output=True,
              text=True
          )

          print(smi.stdout)

          if smi.returncode != 0:
              print("NVIDIA-SMI FAILED")
              raise SystemExit(1)

          # ======================================
          # CUDA CHECK
          # ======================================

          print("=== CUDA ===")

          from numba import cuda

          if not cuda.is_available():
              print("CUDA NOT AVAILABLE")
              raise SystemExit(1)

          device = cuda.get_current_device()

          gpu_name = device.name

          if isinstance(gpu_name, bytes):
              gpu_name = gpu_name.decode()

          print("CUDA GPU:", gpu_name)

          # ======================================
          # INTERNET CHECK
          # ======================================

          print("\n=== INTERNET CHECK ===")

          urls = [
              "https://www.google.com",
              "https://api.github.com",
              "https://www.kaggle.com"
          ]

          internet_results = []

          for url in urls:

              try:

                  start = time.perf_counter()

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Kaggle-GPU-Worker-Test"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=10
                  ) as response:

                      status = response.status

                  latency = (
                      time.perf_counter() - start
                  ) * 1000

                  print(
                      f"{url} -> "
                      f"HTTP {status} "
                      f"{latency:.2f} ms"
                  )

                  internet_results.append({
                      "url": url,
                      "status": status,
                      "latency_ms": latency
                  })

              except Exception as e:

                  print(
                      f"{url} -> ERROR: {e}"
                  )

                  internet_results.append({
                      "url": url,
                      "error": str(e)
                  })

          # ======================================
          # PUBLIC IP
          # ======================================

          print("\n=== PUBLIC IP ===")

          public_ip = None

          try:

              start = time.perf_counter()

              with urllib.request.urlopen(
                  "https://api.ipify.org",
                  timeout=10
              ) as response:

                  public_ip = response.read().decode().strip()

              latency = (
                  time.perf_counter() - start
              ) * 1000

              print(
                  "Public IP:",
                  public_ip
              )

              print(
                  "IP request latency:",
                  round(latency, 2),
                  "ms"
              )

          except Exception as e:

              print(
                  "Public IP ERROR:",
                  e
              )

          # ======================================
          # PERSISTENT OUTBOUND CONNECTION TEST
          # ======================================

          print("\n==========================================")
          print("PERSISTENT CONNECTION TEST")
          print("==========================================")

          print(
              "Worker will stay alive for 5 minutes."
          )

          print(
              "Every 5 seconds an HTTPS request "
              "will be made."
          )

          start_time = time.time()

          max_runtime = 300

          ping_count = 0

          connection_results = []

          while True:

              elapsed = time.time() - start_time

              if elapsed >= max_runtime:
                  break

              ping_count += 1

              try:

                  start = time.perf_counter()

                  request = urllib.request.Request(
                      "https://api.github.com",
                      headers={
                          "User-Agent":
                          "Kaggle-GPU-Worker-Test"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=10
                  ) as response:

                      status = response.status

                  latency = (
                      time.perf_counter() - start
                  ) * 1000

                  print(
                      f"[PING {ping_count}] "
                      f"HTTP {status} "
                      f"latency={latency:.2f}ms "
                      f"elapsed={elapsed:.1f}s"
                  )

                  connection_results.append({
                      "ping": ping_count,
                      "status": status,
                      "latency_ms": latency,
                      "elapsed_seconds": elapsed
                  })

              except Exception as e:

                  print(
                      f"[PING {ping_count}] "
                      f"ERROR: {e}"
                  )

                  connection_results.append({
                      "ping": ping_count,
                      "error": str(e),
                      "elapsed_seconds": elapsed
                  })

              time.sleep(5)

          # ======================================
          # RESULT
          # ======================================

          result = {

              "worker":
                  "kaggle_gpu_network_worker",

              "hostname":
                  hostname,

              "gpu":
                  gpu_name,

              "public_ip":
                  public_ip,

              "internet_tests":
                  internet_results,

              "persistent_connection": {

                  "runtime_seconds":
                      time.time() - start_time,

                  "ping_count":
                      ping_count,

                  "results":
                      connection_results
              },

              "finished_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          print("\n==========================================")
          print("FINAL RESULT")
          print("==========================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          with open(
              "/kaggle/working/network_result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("\nResult saved.")

          PY

          # ======================================
          # Kaggle metadata
          # ======================================

          cat > kaggle_network_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-network-worker",
            "title": "GPU Network Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      # ==========================================
      # 5. Start Kaggle Worker
      # ==========================================

      - name: Start Kaggle GPU Worker
        run: |
          set -euo pipefail

          kaggle kernels push \
            -p kaggle_network_worker \
            --accelerator NvidiaTeslaP100 \
            --timeout 900

      # ==========================================
      # 6. Monitor Worker
      # ==========================================

      - name: Monitor Worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME}/gpu-network-worker"

          for i in $(seq 1 100); do

            STATUS=$(kaggle kernels status \
              "$KERNEL" 2>&1 || true)

            echo "=============================="
            echo "Check $i"
            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then

              echo "Worker completed."
              exit 0

            fi

            if echo "$STATUS" | grep -qi "ERROR"; then

              echo "Worker failed."
              exit 1

            fi

            sleep 10

          done

          echo "Monitor timeout."
          exit 1

      # ==========================================
      # 7. Download result
      # ==========================================

      - name: Download network result
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p network_output

          kaggle kernels output \
            "${KAGGLE_USERNAME}/gpu-network-worker" \
            -p network_output \
            -o

          echo ""
          echo "=========================================="
          echo "NETWORK RESULT"
          echo "=========================================="

          cat network_output/network_result.json

      # ==========================================
      # 8. Upload result
      # ==========================================

      - name: Upload network result
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-network-result
          path: network_output/
