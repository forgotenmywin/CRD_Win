name: Kaggle GPU Worker - Real-Time GPU Queue v4

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      WORKER_COUNT: "2"
      TOTAL_JOBS: "100"

      WORKER_TOKEN: "GPU-WORKER-SECRET-2026"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip

          python3 -m pip install --upgrade pip

          python3 -m pip install --upgrade \
            kaggle \
            websocket-client \
            websockets

          echo "Dependencies installed."


      # ============================================================
      # KAGGLE AUTH
      # ============================================================

      - name: Configure Kaggle
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.kaggle"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle --version

          kaggle kernels list \
            --user "$KAGGLE_USERNAME" \
            --page-size 1


      # ============================================================
      # CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest
          )"

          TAG="$(
            printf '%s' "$RELEASE_JSON" |
            jq -r '.tag_name'
          )"

          test -n "$TAG"
          test "$TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared

          sudo install \
            -m 0755 \
            cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      # ============================================================
      # CREATE RELAY
      # ============================================================

      - name: Create real-time relay
        shell: bash
        run: |
          set -euxo pipefail

          cat > relay.py <<'PY'
          import asyncio
          import base64
          import hashlib
          import json
          import os
          import secrets
          import time
          from datetime import datetime, timezone

          import websockets


          HOST = "127.0.0.1"
          PORT = 8765

          WORKER_TOKEN = os.environ["WORKER_TOKEN"]

          TOTAL_JOBS = int(
              os.environ.get(
                  "TOTAL_JOBS",
                  "100"
              )
          )

          STATE_FILE = "relay_result.json"


          # ==========================================================
          # JOB CREATION
          # ==========================================================

          JOB_QUEUE = asyncio.Queue()

          JOBS = {}


          def now():

              return datetime.now(
                  timezone.utc
              ).isoformat()


          def make_payload(job_id):

              # 1 MB deterministic payload.
              #
              # This is intentionally large enough to measure
              # WebSocket transport rather than only tiny JSON.

              raw = bytes(
                  ((job_id + i) % 256)
                  for i in range(
                      1024 * 1024
                  )
              )

              encoded = base64.b64encode(
                  raw
              ).decode()

              return encoded


          for job_id in range(
              1,
              TOTAL_JOBS + 1
          ):

              job = {

                  "job_id":
                      job_id,

                  "type":
                      "gpu_job",

                  "benchmark":
                      "cuda_vector_transform",

                  "n":
                      4194304,

                  "repeats":
                      20,

                  "payload":
                      make_payload(
                          job_id
                      ),

                  "created_ns":
                      time.perf_counter_ns()
              }

              JOBS[job_id] = job

              JOB_QUEUE.put_nowait(
                  job
              )


          # ==========================================================
          # STATE
          # ==========================================================

          state = {

              "started_utc":
                  now(),

              "workers_connected":
                  0,

              "workers_alive":
                  0,

              "connections":
                  0,

              "messages":
                  0,

              "jobs_total":
                  TOTAL_JOBS,

              "jobs_queued":
                  TOTAL_JOBS,

              "jobs_sent":
                  0,

              "jobs_completed":
                  0,

              "jobs_failed":
                  0,

              "jobs_retried":
                  0,

              "duplicate_results":
                  0,

              "heartbeat_misses":
                  0,

              "latencies_ms":
                  [],

              "job_results":
                  [],

              "events":
                  [],

              "done":
                  False
          }


          state_lock = asyncio.Lock()


          workers = {}

          completed_jobs = set()

          attempts = {}

          finished = asyncio.Event()


          # ==========================================================
          # SAVE
          # ==========================================================

          def save():

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          def record(
              kind,
              **data
          ):

              state["events"].append({

                  "kind":
                      kind,

                  "at_utc":
                      now(),

                  **data
              })

              if len(
                  state["events"]
              ) > 1000:

                  state["events"] = \
                      state["events"][-1000:]

              save()


          # ==========================================================
          # WORKER AUTH
          # ==========================================================

          def authenticate(
              message
          ):

              token = message.get(
                  "token"
              )

              return secrets.compare_digest(
                  str(token),
                  WORKER_TOKEN
              )


          # ==========================================================
          # GET JOB
          # ==========================================================

          async def get_job():

              try:

                  job = JOB_QUEUE.get_nowait()

                  return job

              except asyncio.QueueEmpty:

                  return None


          # ==========================================================
          # SEND JOB
          # ==========================================================

          async def send_job(
              worker_id,
              ws
          ):

              job = await get_job()

              if job is None:

                  return False


              job_id = job["job_id"]

              attempts[job_id] = \
                  attempts.get(
                      job_id,
                      0
                  ) + 1


              job_to_send = dict(
                  job
              )

              job_to_send[
                  "sent_ns"
              ] = time.perf_counter_ns()

              job_to_send[
                  "attempt"
              ] = attempts[job_id]


              workers[
                  worker_id
              ][
                  "current_job"
              ] = job_id


              workers[
                  worker_id
              ][
                  "sent_ns"
              ] = time.perf_counter_ns()


              await ws.send(
                  json.dumps(
                      job_to_send
                  )
              )


              state[
                  "jobs_sent"
              ] += 1


              if attempts[job_id] > 1:

                  state[
                      "jobs_retried"
                  ] += 1


              record(
                  "job_sent",
                  worker_id=worker_id,
                  job_id=job_id,
                  attempt=attempts[job_id]
              )


              return True


          # ==========================================================
          # WORKER HANDLER
          # ==========================================================

          async def worker_handler(
              ws
          ):

              state[
                  "connections"
              ] += 1

              worker_id = None

              authenticated = False

              try:

                  raw = await asyncio.wait_for(
                      ws.recv(),
                      timeout=30
                  )

                  message = json.loads(
                      raw
                  )


                  if message.get(
                      "type"
                  ) != "hello":

                      await ws.close()

                      return


                  if not authenticate(
                      message
                  ):

                      record(
                          "auth_failed"
                      )

                      await ws.close()

                      return


                  worker_id = message.get(
                      "worker_id"
                  )


                  if not worker_id:

                      await ws.close()

                      return


                  authenticated = True


                  workers[
                      worker_id
                  ] = {

                      "ws":
                          ws,

                      "connected":
                          True,

                      "last_ping":
                          time.perf_counter(),

                      "current_job":
                          None,

                      "sent_ns":
                          None
                  }


                  state[
                      "workers_connected"
                  ] += 1

                  state[
                      "workers_alive"
                  ] += 1


                  record(
                      "worker_connected",
                      worker_id=worker_id
                  )


                  await ws.send(
                      json.dumps({

                          "type":
                              "hello_ack",

                          "worker_id":
                              worker_id,

                          "relay_utc":
                              now()
                      })
                  )


                  # --------------------------------------------------
                  # WORKER LOOP
                  # --------------------------------------------------

                  async for raw in ws:

                      state[
                          "messages"
                      ] += 1


                      message = json.loads(
                          raw
                      )


                      msg_type = message.get(
                          "type"
                      )


                      # ==============================================
                      # HEARTBEAT
                      # ==============================================

                      if msg_type == "ping":

                          if worker_id in workers:

                              workers[
                                  worker_id
                              ][
                                  "last_ping"
                              ] = time.perf_counter()


                          await ws.send(
                              json.dumps({

                                  "type":
                                      "pong",

                                  "id":
                                      message.get(
                                          "id"
                                      ),

                                  "relay_ns":
                                      time.perf_counter_ns()
                              })
                          )

                          continue


                      # ==============================================
                      # READY
                      # ==============================================

                      if msg_type == "ready":

                          await send_job(
                              worker_id,
                              ws
                          )

                          continue


                      # ==============================================
                      # GPU RESULT
                      # ==============================================

                      if msg_type == "gpu_result":

                          job_id = int(
                              message[
                                  "job_id"
                              ]
                          )


                          if job_id in completed_jobs:

                              state[
                                  "duplicate_results"
                              ] += 1

                              continue


                          completed_jobs.add(
                              job_id
                          )


                          result_received_ns = \
                              time.perf_counter_ns()


                          sent_ns = \
                              message.get(
                                  "sent_ns"
                              )


                          if sent_ns:

                              latency_ms = (

                                  (
                                      result_received_ns
                                      -
                                      int(
                                          sent_ns
                                      )
                                  )
                                  /
                                  1_000_000
                              )

                              state[
                                  "latencies_ms"
                              ].append(
                                  latency_ms
                              )

                          else:

                              latency_ms = None


                          state[
                              "jobs_completed"
                          ] += 1


                          state[
                              "job_results"
                          ].append({

                              "job_id":
                                  job_id,

                              "worker_id":
                                  worker_id,

                              "latency_ms":
                                  latency_ms,

                              "gpu_result":
                                  message
                          })


                          if worker_id in workers:

                              workers[
                                  worker_id
                              ][
                                  "current_job"
                              ] = None


                          record(
                              "job_completed",
                              job_id=job_id,
                              worker_id=worker_id,
                              latency_ms=latency_ms,
                              completed=state[
                                  "jobs_completed"
                              ],
                              total=TOTAL_JOBS
                          )


                          await ws.send(
                              json.dumps({

                                  "type":
                                      "ack",

                                  "job_id":
                                      job_id,

                                  "relay_utc":
                                      now()
                              })
                          )


                          # ------------------------------------------------
                          # SEND NEXT JOB
                          # ------------------------------------------------

                          if (
                              state[
                                  "jobs_completed"
                              ]
                              <
                              TOTAL_JOBS
                          ):

                              await send_job(
                                  worker_id,
                                  ws
                              )

                          else:

                              state[
                                  "done"
                              ] = True

                              record(
                                  "all_jobs_completed",
                                  total=TOTAL_JOBS
                              )

                              try:

                                  await ws.send(
                                      json.dumps({

                                          "type":
                                              "all_jobs_done",

                                          "total_jobs":
                                              TOTAL_JOBS
                                      })
                                  )

                              except Exception:
                                  pass


                              finished.set()


              except Exception as e:

                  record(
                      "worker_error",
                      worker_id=worker_id,
                      error=repr(e)
                  )


              finally:

                  if worker_id in workers:

                      workers[
                          worker_id
                      ][
                          "connected"
                      ] = False


                      state[
                          "workers_alive"
                      ] = max(
                          0,
                          state[
                              "workers_alive"
                          ] - 1
                      )


                      # ----------------------------------------------
                      # RETRY CURRENT JOB
                      # ----------------------------------------------

                      current_job = workers[
                          worker_id
                      ].get(
                          "current_job"
                      )


                      if (
                          current_job is not None
                          and
                          current_job not in
                          completed_jobs
                      ):

                          job = JOBS.get(
                              current_job
                          )

                          if job:

                              await JOB_QUEUE.put(
                                  job
                              )

                              record(
                                  "job_requeued",
                                  worker_id=worker_id,
                                  job_id=current_job
                              )


                      record(
                          "worker_disconnected",
                          worker_id=worker_id
                      )


          # ==========================================================
          # DEAD WORKER MONITOR
          # ==========================================================

          async def worker_monitor():

              while not finished.is_set():

                  await asyncio.sleep(
                      5
                  )


                  now_perf = \
                      time.perf_counter()


                  for worker_id, info in list(
                      workers.items()
                  ):

                      if not info.get(
                          "connected"
                      ):

                          continue


                      age = (
                          now_perf
                          -
                          info.get(
                              "last_ping",
                              now_perf
                          )
                      )


                      if age > 45:

                          state[
                              "heartbeat_misses"
                          ] += 1


                          record(
                              "worker_dead",
                              worker_id=worker_id,
                              heartbeat_age=age
                          )


                          try:

                              await info[
                                  "ws"
                              ].close()

                          except Exception:
                              pass


          # ==========================================================
          # MAIN
          # ==========================================================

          async def main():

              save()

              monitor = asyncio.create_task(
                  worker_monitor()
              )


              async with websockets.serve(

                  worker_handler,

                  HOST,

                  PORT,

                  ping_interval=20,

                  ping_timeout=60,

                  max_size=
                      25 * 1024 * 1024
              ):

                  print()
                  print("=" * 70)
                  print(
                      "REAL-TIME GPU RELAY"
                  )
                  print("=" * 70)

                  print(
                      "PORT:",
                      PORT
                  )

                  print(
                      "TOTAL JOBS:",
                      TOTAL_JOBS
                  )

                  print(
                      "MAX PAYLOAD:",
                      "25 MB"
                  )

                  print("=" * 70)


                  try:

                      await asyncio.wait_for(

                          finished.wait(),

                          timeout=1200

                      )

                  except asyncio.TimeoutError:

                      record(
                          "global_timeout",
                          completed=state[
                              "jobs_completed"
                          ],
                          total=TOTAL_JOBS
                      )


                  monitor.cancel()


                  state[
                      "done"
                  ] = (
                      state[
                          "jobs_completed"
                      ]
                      >=
                      TOTAL_JOBS
                  )


                  save()


                  print()

                  print(
                      json.dumps(
                          state,
                          indent=2,
                          ensure_ascii=False
                      )
                  )


          asyncio.run(
              main()
          )
          PY


      # ============================================================
      # START RELAY
      # ============================================================

      - name: Start relay
        shell: bash
        run: |
          set -euxo pipefail

          nohup \
            python3 relay.py \
            > relay.log 2>&1 &

          echo $! > relay.pid

          sleep 3

          cat relay.log


      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euxo pipefail

          rm -f \
            cloudflared.log \
            tunnel_url.txt

          nohup \
            cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid


          echo "Waiting for tunnel..."


          for i in $(seq 1 90); do

            URL="$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                cloudflared.log |
              head -n 1 ||
              true
            )"


            if [ -n "$URL" ]; then

              printf '%s\n' "$URL" \
                > tunnel_url.txt

              break

            fi


            sleep 2

          done


          if [ ! -s tunnel_url.txt ]; then

            echo "ERROR: tunnel URL not found."

            cat cloudflared.log

            exit 1

          fi


          TUNNEL_URL="$(
            cat tunnel_url.txt
          )"


          WSS_URL="$(
            printf '%s' "$TUNNEL_URL" |
            sed 's#^https:#wss:#'
          )"


          printf '%s\n' "$WSS_URL" \
            > wss_url.txt


          echo
          echo "=========================================="
          echo "TUNNEL READY"
          echo "=========================================="
          echo "HTTP:"
          cat tunnel_url.txt
          echo
          echo "WSS:"
          cat wss_url.txt
          echo "=========================================="
          echo


      # ============================================================
      # CREATE 2 UNIQUE KAGGLE WORKERS
      # ============================================================

      - name: Create Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf kaggle_workers

          mkdir -p kaggle_workers


          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            mkdir -p "$DIR"


            echo "Creating worker $WORKER_INDEX"


            cat > "$DIR/worker.py" <<PY
          import asyncio
          import base64
          import hashlib
          import json
          import os
          import time
          import traceback

          import numpy as np
          from numba import cuda
          import websockets


          WSS_URL = os.environ["WSS_URL"]

          WORKER_TOKEN = os.environ["WORKER_TOKEN"]

          WORKER_ID = os.environ["WORKER_ID"]


          @cuda.jit
          def transform_kernel(
              a,
              b,
              c
          ):

              i = cuda.grid(1)

              if i < c.size:

                  c[i] = (
                      a[i]
                      *
                      b[i]
                      +
                      1.0
                  )


          def gpu_job(
              n,
              repeats
          ):

              if not cuda.is_available():

                  raise RuntimeError(
                      "CUDA unavailable"
                  )


              a = cuda.to_device(
                  np.ones(
                      n,
                      dtype=np.float32
                  )
              )


              b = cuda.to_device(
                  np.full(
                      n,
                      2.0,
                      dtype=np.float32
                  )
              )


              c = cuda.device_array(
                  n,
                  dtype=np.float32
              )


              threads = 256


              blocks = (
                  n
                  +
                  threads
                  -
                  1
              ) // threads


              # JIT warm-up

              transform_kernel[
                  blocks,
                  threads
              ](
                  a,
                  b,
                  c
              )


              cuda.synchronize()


              start = time.perf_counter_ns()


              for _ in range(
                  repeats
              ):

                  transform_kernel[
                      blocks,
                      threads
                  ](
                      a,
                      b,
                      c
                  )


              cuda.synchronize()


              elapsed_ns = (
                  time.perf_counter_ns()
                  -
                  start
              )


              # Verify result

              sample = c.copy_to_host(
                  slice(0, 10)
              )


              checksum = float(
                  np.sum(
                      sample
                  )
              )


              gpu = cuda.get_current_device()


              gpu_name = gpu.name


              if isinstance(
                  gpu_name,
                  bytes
              ):

                  gpu_name = gpu_name.decode(
                      errors="replace"
                  )


              return {

                  "gpu":
                      gpu_name,

                  "n":
                      n,

                  "repeats":
                      repeats,

                  "gpu_compute_ms":
                      elapsed_ns / 1e6,

                  "sample_checksum":
                      checksum
              }


          async def worker():

              while True:

                  try:

                      print(
                          "CONNECTING:",
                          WSS_URL
                      )


                      async with websockets.connect(

                          WSS_URL,

                          max_size=
                              25 * 1024 * 1024,

                          ping_interval=20,

                          ping_timeout=60
                      ) as ws:


                          await ws.send(
                              json.dumps({

                                  "type":
                                      "hello",

                                  "worker_id":
                                      WORKER_ID,

                                  "token":
                                      WORKER_TOKEN
                              })
                          )


                          print(
                              "AUTHENTICATED:",
                              WORKER_ID
                          )


                          await ws.send(
                              json.dumps({

                                  "type":
                                      "ready"
                              })
                          )


                          async def heartbeat():

                              counter = 0

                              while True:

                                  await asyncio.sleep(
                                      10
                                  )

                                  counter += 1

                                  await ws.send(
                                      json.dumps({

                                          "type":
                                              "ping",

                                          "id":
                                              counter
                                      })
                                  )


                          heartbeat_task = \
                              asyncio.create_task(
                                  heartbeat()
                              )


                          try:

                              async for raw in ws:

                                  msg = json.loads(
                                      raw
                                  )


                                  msg_type = \
                                      msg.get(
                                          "type"
                                      )


                                  if msg_type == \
                                      "all_jobs_done":

                                      print(
                                          "ALL JOBS DONE"
                                      )

                                      return


                                  if msg_type != \
                                      "gpu_job":

                                      continue


                                  job_id = int(
                                      msg[
                                          "job_id"
                                      ]
                                  )


                                  n = int(
                                      msg.get(
                                          "n",
                                          4194304
                                      )
                                  )


                                  repeats = int(
                                      msg.get(
                                          "repeats",
                                          20
                                      )
                                  )


                                  payload = msg.get(
                                      "payload",
                                      ""
                                  )


                                  received_ns = \
                                      time.perf_counter_ns()


                                  # Verify large payload.

                                  raw_payload = \
                                      base64.b64decode(
                                          payload
                                      )


                                  payload_sha256 = \
                                      hashlib.sha256(
                                          raw_payload
                                      ).hexdigest()


                                  print(
                                      "JOB:",
                                      job_id,
                                      "PAYLOAD:",
                                      len(
                                          raw_payload
                                      ),
                                      "bytes"
                                  )


                                  try:

                                      gpu_result = \
                                          gpu_job(
                                              n,
                                              repeats
                                          )


                                      response = {

                                          "type":
                                              "gpu_result",

                                          "job_id":
                                              job_id,

                                          "worker_id":
                                              WORKER_ID,

                                          "sent_ns":
                                              msg.get(
                                                  "sent_ns"
                                              ),

                                          "received_ns":
                                              received_ns,

                                          "completed_ns":
                                              time.perf_counter_ns(),

                                          "payload_bytes":
                                              len(
                                                  raw_payload
                                              ),

                                          "payload_sha256":
                                              payload_sha256,

                                          "gpu":
                                              gpu_result

                                      }


                                  except Exception as e:

                                      response = {

                                          "type":
                                              "gpu_result",

                                          "job_id":
                                              job_id,

                                          "worker_id":
                                              WORKER_ID,

                                          "sent_ns":
                                              msg.get(
                                                  "sent_ns"
                                              ),

                                          "error":
                                              repr(e),

                                          "traceback":
                                              traceback.format_exc()
                                      }


                                  await ws.send(
                                      json.dumps(
                                          response
                                      )
                                  )


                          finally:

                              heartbeat_task.cancel()


                  except Exception as e:

                      print(
                          "WORKER CONNECTION ERROR:",
                          repr(e)
                      )


                      print(
                          "RECONNECTING IN 3 SECONDS..."
                      )


                      await asyncio.sleep(
                          3
                      )


          asyncio.run(
              worker()
          )
          PY


            cat > "$DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}",
            "title": "GPU WS Worker ${WORKER_INDEX}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          done


      # ============================================================
      # PUSH KAGGLE WORKERS
      # ============================================================

      - name: Push Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail

          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            echo
            echo "=========================================="
            echo "PUSHING WORKER $WORKER_INDEX"
            echo "=========================================="

            kaggle kernels push \
              -p "$DIR"

          done


      # ============================================================
      # RUN STRESS TEST
      # ============================================================

      - name: Create stress client
        shell: bash
        run: |
          set -euxo pipefail

          cat > stress_client.py <<'PY'
          import asyncio
          import json
          import os
          import statistics
          import time

          import websockets


          TOTAL = int(
              os.environ.get(
                  "TOTAL_JOBS",
                  "100"
              )
          )


          def get_wss_url():

              path = "wss_url.txt"


              if not os.path.exists(
                  path
              ):

                  raise RuntimeError(
                      "wss_url.txt does not exist"
                  )


              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  url = f.read().strip()


              if not url:

                  raise RuntimeError(
                      "wss_url.txt is empty"
                  )


              if not url.startswith(
                  "wss://"
              ):

                  raise RuntimeError(
                      f"Invalid WSS URL: {url}"
                  )


              return url


          async def main():

              url = get_wss_url()


              print()
              print("=" * 70)
              print("GPU API STRESS TEST")
              print("=" * 70)

              print(
                  "WSS:",
                  url
              )

              print(
                  "JOBS:",
                  TOTAL
              )

              print("=" * 70)


              # ------------------------------------------------------
              # IMPORTANT:
              #
              # The stress client does NOT use an ENV hostname.
              # It reads the exact tunnel generated in this run.
              # ------------------------------------------------------

              async with websockets.connect(

                  url,

                  max_size=
                      25 * 1024 * 1024,

                  ping_interval=20,

                  ping_timeout=60
              ) as ws:

                  start = time.perf_counter()


                  # --------------------------------------------------
                  # API TEST
                  # --------------------------------------------------

                  await ws.send(
                      json.dumps({

                          "type":
                              "hello",

                          "worker_id":
                              "stress-client",

                          "token":
                              os.environ[
                                  "WORKER_TOKEN"
                              ]
                      })
                  )


                  # This connection is intentionally rejected because
                  # the relay only accepts authenticated workers.
                  #
                  # Real API traffic should use a separate API token.
                  #
                  # Therefore this client only validates that the
                  # public endpoint exists.
                  #
                  # Worker traffic itself is measured by relay state.

                  try:

                      async for raw in ws:

                          print(
                              "PUBLIC ENDPOINT RESPONSE:",
                              raw
                          )

                          break

                  except Exception as e:

                      print(
                          "Endpoint check:",
                          repr(e)
                      )


              elapsed = (
                  time.perf_counter()
                  -
                  start
              )


              print()
              print(
                  "PUBLIC WSS ENDPOINT REACHABLE"
              )

              print(
                  "CONNECT TIME:",
                  round(
                      elapsed * 1000,
                      2
                  ),
                  "ms"
              )


          asyncio.run(
              main()
          )
          PY


      # ============================================================
      # RUN STRESS CLIENT
      # ============================================================

      - name: Run stress test
        shell: bash
        env:
          WORKER_TOKEN: ${{ env.WORKER_TOKEN }}
          TOTAL_JOBS: ${{ env.TOTAL_JOBS }}
        run: |
          set -euxo pipefail

          echo "Using generated WSS URL:"

          cat wss_url.txt

          echo

          python3 stress_client.py


      # ============================================================
      # WAIT FOR 100 JOBS
      # ============================================================

      - name: Wait for all jobs
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "Waiting for GPU workers..."
          echo "Expected jobs: $TOTAL_JOBS"
          echo


          for i in $(seq 1 240); do

            if [ -f relay_result.json ]; then

              COMPLETED="$(
                jq -r \
                  '.jobs_completed' \
                  relay_result.json
              )"


              SENT="$(
                jq -r \
                  '.jobs_sent' \
                  relay_result.json
              )"


              WORKERS="$(
                jq -r \
                  '.workers_alive' \
                  relay_result.json
              )"


              RETRIES="$(
                jq -r \
                  '.jobs_retried' \
                  relay_result.json
              )"


              echo \
                "[$i] workers=$WORKERS sent=$SENT completed=$COMPLETED/$TOTAL_JOBS retries=$RETRIES"


              if [ "$COMPLETED" = "$TOTAL_JOBS" ]; then

                echo
                echo "=========================================="
                echo "ALL GPU JOBS COMPLETED"
                echo "=========================================="

                break

              fi

            fi


            sleep 5

          done


          if [ ! -f relay_result.json ]; then

            echo "relay_result.json missing"

            cat relay.log || true

            exit 1

          fi


          FINAL="$(
            jq -r \
              '.jobs_completed' \
              relay_result.json
          )"


          if [ "$FINAL" != "$TOTAL_JOBS" ]; then

            echo
            echo "ERROR: Not all jobs completed."

            cat relay_result.json

            exit 1

          fi


      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Final report
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "FINAL GPU REAL-TIME REPORT"
          echo "============================================================"

          if [ -f relay_result.json ]; then

            jq '
              {
                jobs_total,
                jobs_sent,
                jobs_completed,
                jobs_failed,
                jobs_retried,
                workers_connected,
                workers_alive,
                heartbeat_misses,
                duplicate_results,
                min_latency_ms:
                  (
                    if (.latencies_ms | length) > 0
                    then (.latencies_ms | min)
                    else null
                    end
                  ),
                avg_latency_ms:
                  (
                    if (.latencies_ms | length) > 0
                    then (
                      (.latencies_ms | add)
                      /
                      (.latencies_ms | length)
                    )
                    else null
                    end
                  ),
                max_latency_ms:
                  (
                    if (.latencies_ms | length) > 0
                    then (.latencies_ms | max)
                    else null
                    end
                  )
              }
            ' relay_result.json

          fi


          echo
          echo "============================================================"
          echo "RELAY LOG"
          echo "============================================================"

          cat relay.log || true


          echo
          echo "============================================================"
          echo "CLOUDFLARED LOG"
          echo "============================================================"

          cat cloudflared.log || true


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name:
            kaggle-gpu-realtime-v4

          path: |

            relay_result.json

            relay.log

            cloudflared.log

            tunnel_url.txt

            wss_url.txt

            kaggle_workers/**

          if-no-files-found:
            warn

          retention-days:
            7
