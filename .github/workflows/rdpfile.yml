name: GitHub to Kaggle GPU Benchmark

on:
  workflow_dispatch:

jobs:
  kaggle-gpu-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      - name: Create Kaggle benchmark files
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -e

          mkdir -p kaggle_test

          cat > kaggle_test/gpu_benchmark.py <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone

          OUTPUT = "/kaggle/working/gpu_result.json"

          def run_cmd(cmd):
              return subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True
              )

          result = {
              "hostname": socket.gethostname(),
              "start_time": datetime.now(timezone.utc).isoformat()
          }

          print("================================")
          print("KAGGLE GPU BENCHMARK")
          print("================================")

          # -------------------------
          # NVIDIA GPU information
          # -------------------------

          print("\n=== NVIDIA-SMI ===")

          smi = run_cmd([
              "nvidia-smi",
              "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
              "--format=csv,noheader"
          ])

          print(smi.stdout)

          if smi.stderr:
              print(smi.stderr)

          result["nvidia_smi"] = smi.stdout.strip()
          result["nvidia_smi_exit_code"] = smi.returncode

          # -------------------------
          # CUDA benchmark with Numba
          # -------------------------

          benchmark = {}

          try:
              print("\n=== CUDA / NUMBA TEST ===")

              from numba import cuda
              import numpy as np

              benchmark["numba_available"] = True
              benchmark["cuda_available"] = bool(cuda.is_available())

              if not cuda.is_available():
                  raise RuntimeError(
                      "Numba cannot access CUDA GPU"
                  )

              device = cuda.get_current_device()

              gpu_name = device.name

              if isinstance(gpu_name, bytes):
                  gpu_name = gpu_name.decode()

              print("GPU:", gpu_name)

              @cuda.jit
              def vector_add(a, b, c):
                  i = cuda.grid(1)

                  if i < c.size:
                      c[i] = a[i] + b[i]

              # 16 million float32 values
              n = 1 << 24

              # Number of repetitions
              repeats = 50

              print("Elements:", n)
              print("Repeats:", repeats)

              a = np.random.rand(n).astype(np.float32)
              b = np.random.rand(n).astype(np.float32)

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.device_array_like(a)

              threads = 256
              blocks = (n + threads - 1) // threads

              # Warmup
              vector_add[blocks, threads](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              start_event = cuda.event(timing=True)
              end_event = cuda.event(timing=True)

              wall_start = time.perf_counter()

              start_event.record()

              for _ in range(repeats):
                  vector_add[blocks, threads](
                      d_a,
                      d_b,
                      d_c
                  )

              end_event.record()

              end_event.synchronize()

              wall_end = time.perf_counter()

              kernel_ms = cuda.event_elapsed_time(
                  start_event,
                  end_event
              )

              wall_ms = (
                  wall_end - wall_start
              ) * 1000

              # 2 reads + 1 write
              bytes_per_iteration = n * 4 * 3

              total_bytes = (
                  bytes_per_iteration * repeats
              )

              bandwidth_gbps = (
                  total_bytes /
                  (kernel_ms / 1000) /
                  1e9
              )

              benchmark.update({
                  "backend": "numba_cuda",
                  "gpu_name": gpu_name,
                  "elements": n,
                  "repeats": repeats,
                  "kernel_ms": float(kernel_ms),
                  "wall_ms": float(wall_ms),
                  "effective_bandwidth_gbps": float(
                      bandwidth_gbps
                  )
              })

              print("\n=== BENCHMARK RESULT ===")
              print(
                  "GPU:",
                  gpu_name
              )

              print(
                  "Kernel time:",
                  round(kernel_ms, 3),
                  "ms"
              )

              print(
                  "Wall time:",
                  round(wall_ms, 3),
                  "ms"
              )

              print(
                  "Effective bandwidth:",
                  round(bandwidth_gbps, 2),
                  "GB/s"
              )

          except Exception as e:
              print("\nCUDA benchmark failed:")
              print(repr(e))

              benchmark["backend"] = "failed"
              benchmark["error"] = repr(e)

          result["benchmark"] = benchmark

          result["end_time"] = (
              datetime.now(timezone.utc).isoformat()
          )

          print("\n=== FINAL RESULT ===")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          with open(
              OUTPUT,
              "w"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2
              )

          print(
              "\nSaved:",
              OUTPUT
          )
          PY

          cat > kaggle_test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/github-gpu-benchmark",
            "title": "GitHub GPU Benchmark",
            "code_file": "gpu_benchmark.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          echo "Kaggle files created."

      - name: Push benchmark to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e

          echo "Testing Kaggle authentication..."

          kaggle kernels list \
            --search "github-gpu-benchmark" \
            --page-size 1

          echo "Authentication OK."

          START=$(date +%s%3N)

          kaggle kernels push \
            -p kaggle_test

          END=$(date +%s%3N)

          echo "Push request time: $((END - START)) ms"

      - name: Wait for Kaggle GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -e

          KERNEL="${KAGGLE_USERNAME}/github-gpu-benchmark"

          echo "Waiting for:"
          echo "$KERNEL"

          for i in $(seq 1 90); do

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "Check $i/90"
            echo "$STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "Kaggle GPU job completed."
              exit 0
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "Kaggle GPU job failed."
              exit 1
            fi

            sleep 10

          done

          echo "Timeout waiting for Kaggle."
          exit 1

      - name: Download GPU result
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -e

          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/github-gpu-benchmark"

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            -o

          echo "================================"
          echo "KAGGLE OUTPUT"
          echo "================================"

          find kaggle_output \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "================================"
          echo "GPU RESULT"
          echo "================================"

          if [ -f kaggle_output/gpu_result.json ]; then
            cat kaggle_output/gpu_result.json
          else
            echo "gpu_result.json not found!"
            exit 1
          fi

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-benchmark-result
          path: kaggle_output/
