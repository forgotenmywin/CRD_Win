name: Kaggle GPU Worker - Multi Job Relay

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KERNEL: ${{ secrets.KAGGLE_KERNEL }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "ERROR: KAGGLE_API_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "${KAGGLE_USERNAME:-}" ]; then
            echo "ERROR: KAGGLE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "${KAGGLE_KERNEL:-}" ]; then
            echo "ERROR: KAGGLE_KERNEL secret is missing"
            exit 1
          fi

          echo "Kaggle credentials detected."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle websocket-client

          kaggle --version

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

          echo "Kaggle authentication configured."

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail

          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing cloudflared..."

          CLOUDFLARED_VERSION="$(
            curl -fsSL \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
              python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print(d["tag_name"])
          '
          )"

          echo "Latest cloudflared version: $CLOUDFLARED_VERSION"

          curl -fL --retry 5 --retry-delay 2 \
            -o cloudflared.tgz \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.tgz"

          tar -xzf cloudflared.tgz

          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Create relay server
        shell: bash
        run: |
          set -euo pipefail

          cat > relay.py <<'PY'
          import asyncio
          import json
          import os
          import time
          from datetime import datetime, timezone

          import websockets

          PORT = 8765

          events = []
          clients = set()

          stats = {
              "started_utc": datetime.now(timezone.utc).isoformat(),
              "connections": 0,
              "messages": 0,
              "job_sent": 0,
              "job_results": 0,
              "events": []
          }

          def now():
              return datetime.now(timezone.utc).isoformat()

          def record(event):
              stats["events"].append(event)

              # Prevent the result file becoming huge.
              if len(stats["events"]) > 500:
                  stats["events"] = stats["events"][-500:]

          async def handler(ws):
              clients.add(ws)
              stats["connections"] += 1

              record({
                  "kind": "connect",
                  "at_utc": now()
              })

              try:
                  async for raw in ws:
                      stats["messages"] += 1

                      try:
                          msg = json.loads(raw)
                      except Exception:
                          msg = {
                              "type": "raw",
                              "data": raw
                          }

                      record({
                          "kind": "message",
                          "at_utc": now(),
                          "message": msg
                      })

                      # Worker announces that it is ready.
                      if isinstance(msg, dict) and msg.get("type") == "ready":

                          job = {
                              "type": "gpu_job",
                              "job_id": 1,
                              "benchmark": "numba_vector_add",
                              "n": 16777216,
                              "repeats": 50
                          }

                          await ws.send(json.dumps(job))

                          stats["job_sent"] += 1

                          record({
                              "kind": "job_sent",
                              "at_utc": now(),
                              "job": job
                          })

                      # Worker returns GPU result.
                      elif isinstance(msg, dict) and msg.get("type") == "gpu_result":

                          stats["job_results"] += 1

                          record({
                              "kind": "job_result",
                              "at_utc": now(),
                              "result": msg
                          })

              except Exception as e:
                  record({
                      "kind": "handler_error",
                      "at_utc": now(),
                      "error": repr(e)
                  })

              finally:
                  clients.discard(ws)

                  record({
                      "kind": "close",
                      "at_utc": now()
                  })

          async def main():
              async with websockets.serve(
                  handler,
                  "127.0.0.1",
                  PORT,
                  ping_interval=20,
                  ping_timeout=20,
                  max_size=10 * 1024 * 1024
              ):
                  print(f"Relay listening on 127.0.0.1:{PORT}")

                  while True:
                      await asyncio.sleep(5)

          if __name__ == "__main__":
              asyncio.run(main())
          PY

          python3 relay.py > relay.log 2>&1 &
          echo $! > relay.pid

          sleep 2

          cat relay.log

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo "Waiting for Cloudflare tunnel..."

          for i in $(seq 1 30); do
            if grep -q "trycloudflare.com" cloudflared.log; then
              break
            fi

            sleep 2
          done

          cat cloudflared.log

          TUNNEL_URL="$(
            grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflared.log |
              head -n 1
          )"

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: Cloudflare tunnel URL was not found."
            exit 1
          fi

          WSS_URL="${TUNNEL_URL/https:/wss:}/ws"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"

          echo "Tunnel:"
          echo "$TUNNEL_URL"

          echo "WebSocket:"
          echo "$WSS_URL"

      - name: Create Kaggle GPU worker
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kaggle_worker
          mkdir -p kaggle_worker

          cat > kaggle_worker/worker.py <<'PY'
          import json
          import os
          import subprocess
          import time
          import traceback
          from datetime import datetime, timezone

          import websocket

          WSS_URL = os.environ.get("WSS_URL", "").strip()

          if not WSS_URL:
              raise RuntimeError("WSS_URL is missing")

          if not WSS_URL.startswith("wss://"):
              raise RuntimeError(
                  f"Invalid WSS_URL: {WSS_URL!r}"
              )

          result = {
              "worker": "kaggle_gpu_ws_worker",
              "hostname": os.uname().nodename,
              "wss_url": WSS_URL,
              "start_utc": datetime.now(timezone.utc).isoformat(),
              "status": "STARTING",
              "pings": []
          }

          def nvidia_smi():
              try:
                  p = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=10
                  )

                  return p.stdout.strip(), p.returncode

              except Exception as e:
                  return repr(e), 1

          smi, smi_rc = nvidia_smi()

          result["nvidia_smi"] = smi
          result["nvidia_smi_rc"] = smi_rc

          print("=" * 50)
          print("KAGGLE GPU WS WORKER")
          print("=" * 50)
          print("WSS URL:", WSS_URL)
          print()
          print("=== NVIDIA-SMI ===")
          print(smi)

          def save():
              result["end_utc"] = datetime.now(timezone.utc).isoformat()

              with open(
                  "/kaggle/working/worker_result.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def cuda_benchmark(n, repeats):
              try:
                  import numpy as np
                  from numba import cuda

                  if not cuda.is_available():
                      raise RuntimeError(
                          "CUDA is not available"
                      )

                  @cuda.jit
                  def add_kernel(a, b, c):
                      i = cuda.grid(1)

                      if i < c.size:
                          c[i] = a[i] + b[i]

                  a = cuda.device_array(n, dtype=np.float32)
                  b = cuda.device_array(n, dtype=np.float32)
                  c = cuda.device_array(n, dtype=np.float32)

                  threads = 256
                  blocks = (n + threads - 1) // threads

                  # Warmup / compilation.
                  add_kernel[blocks, threads](a, b, c)
                  cuda.synchronize()

                  start = time.perf_counter()

                  for _ in range(repeats):
                      add_kernel[blocks, threads](a, b, c)

                  cuda.synchronize()

                  wall_ms = (
                      time.perf_counter() - start
                  ) * 1000

                  # Two reads + one write = 12 bytes/element.
                  bandwidth_gbps = (
                      (n * 12 * repeats)
                      / (wall_ms / 1000)
                      / 1e9
                  )

                  return {
                      "backend": "numba_cuda",
                      "gpu_name": (
                          cuda.get_current_device().name
                      ),
                      "elements": n,
                      "repeats": repeats,
                      "wall_ms": wall_ms,
                      "effective_bandwidth_gbps":
                          bandwidth_gbps
                  }

              except Exception:
                  return {
                      "backend": "error",
                      "error": traceback.format_exc()
                  }

          ws = None

          try:
              print("Connecting to relay...")

              ws = websocket.create_connection(
                  WSS_URL,
                  timeout=30
              )

              result["status"] = "CONNECTED"

              ready = {
                  "type": "ready",
                  "worker_utc":
                      datetime.now(
                          timezone.utc
                      ).isoformat()
              }

              ws.send(json.dumps(ready))

              print("READY sent.")

              while True:
                  raw = ws.recv()

                  if raw is None:
                      break

                  msg = json.loads(raw)

                  print("Received:", msg)

                  if msg.get("type") == "gpu_job":

                      job_id = msg.get("job_id")
                      benchmark = msg.get("benchmark")

                      n = int(
                          msg.get(
                              "n",
                              16777216
                          )
                      )

                      repeats = int(
                          msg.get(
                              "repeats",
                              50
                          )
                      )

                      started = time.perf_counter()

                      if benchmark == "numba_vector_add":
                          benchmark_result = cuda_benchmark(
                              n,
                              repeats
                          )
                      else:
                          benchmark_result = {
                              "backend": "unknown",
                              "error":
                                  f"Unknown benchmark: {benchmark}"
                          }

                      compute_wall_ms = (
                          time.perf_counter() - started
                      ) * 1000

                      response = {
                          "type": "gpu_result",
                          "job_id": job_id,
                          "worker_utc":
                              datetime.now(
                                  timezone.utc
                              ).isoformat(),
                          "compute_wall_ms":
                              compute_wall_ms,
                          "benchmark":
                              benchmark_result
                      }

                      ws.send(
                          json.dumps(response)
                      )

                      print(
                          "GPU result sent:",
                          response
                      )

                      # This test uses one job.
                      break

              result["status"] = "DONE"

          except Exception as e:
              print(
                  "WORKER ERROR:",
                  repr(e)
              )

              result["status"] = "ERROR"
              result["error"] = repr(e)
              result["traceback"] = traceback.format_exc()

          finally:
              try:
                  if ws is not None:
                      ws.close()
              except Exception:
                  pass

              save()

              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )
          PY

          cat > kaggle_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_KERNEL}",
            "title": "GPU WS Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "Kaggle kernel:"
          echo "$KAGGLE_KERNEL"

          echo "Worker WebSocket:"
          echo "$WSS_URL"

          # WSS_URL is injected into the Kaggle kernel
          # through the worker source itself.
          python3 - <<PY
          from pathlib import Path

          p = Path("kaggle_worker/worker.py")
          s = p.read_text()

          s = s.replace(
              'WSS_URL = os.environ.get("WSS_URL", "").strip()',
              'WSS_URL = "${WSS_URL}"'
          )

          p.write_text(s)
          PY

          kaggle kernels push -p kaggle_worker

      - name: Wait for Kaggle worker
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Kaggle kernel..."

          for i in $(seq 1 120); do

            STATUS="$(
              kaggle kernels status "$KAGGLE_KERNEL" 2>/dev/null |
              tail -n 1 |
              tr -d '\r'
            )"

            echo "Check $i/120: $STATUS"

            case "$STATUS" in
              *COMPLETE*|*"KernelWorkerStatus.COMPLETE"*)
                echo "Kaggle worker completed."
                break
                ;;

              *ERROR*|*"KernelWorkerStatus.ERROR"*)
                echo "Kaggle worker failed."

                kaggle kernels output \
                  "$KAGGLE_KERNEL" \
                  -p kaggle_output \
                  || true

                exit 1
                ;;

              *CANCEL*|*"KernelWorkerStatus.CANCELLED"*)
                echo "Kaggle worker cancelled."
                exit 1
                ;;
            esac

            sleep 5
          done

      - name: Download Kaggle output
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kaggle_output
          mkdir -p kaggle_output

          kaggle kernels output \
            "$KAGGLE_KERNEL" \
            -p kaggle_output \
            --force

          echo "=== Kaggle output ==="
          find kaggle_output -maxdepth 3 -type f -print

          echo "=== Worker result ==="

          if find kaggle_output \
              -type f \
              -name "worker_result.json" |
              grep -q .; then

            RESULT="$(
              find kaggle_output \
                -type f \
                -name "worker_result.json" |
                head -n 1
            )"

            cat "$RESULT"

            cp "$RESULT" worker_result.json
          else
            echo "worker_result.json was not found."
          fi

      - name: Save relay logs
        if: always()
        shell: bash
        run: |
          set +e

          echo "=== RELAY LOG ==="
          cat relay.log 2>/dev/null || true

          echo "=== CLOUDFLARED LOG ==="
          cat cloudflared.log 2>/dev/null || true

          echo "=== RELAY EVENTS ==="

          python3 - <<'PY'
          import asyncio
          import json
          import os

          async def main():
              # The relay process is intentionally kept simple.
              # This file records the final local diagnostic state.
              data = {
                  "tunnel_url":
                      os.environ.get("TUNNEL_URL"),
                  "wss_url":
                      os.environ.get("WSS_URL")
              }

              with open(
                  "relay_info.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      indent=2
                  )

          asyncio.run(main())
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-worker-results
          path: |
            worker_result.json
            relay.log
            cloudflared.log
            relay_info.json
            kaggle_output/**
          if-no-files-found: warn
          retention-days: 7
