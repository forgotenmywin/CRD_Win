name: Kaggle Worker GPU Job Relay Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version
          node --version
          npm --version

      - name: Configure Kaggle auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_USERNAME:-}"
          test -n "${KAGGLE_API_TOKEN:-}"
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "Kaggle auth ready."

      - name: Verify Kaggle auth
        run: |
          set -euo pipefail
          kaggle competitions list --page-size 1 >/dev/null
          echo "Kaggle API OK."

      - name: Create relay server
        run: |
          set -euo pipefail
          mkdir -p relay
          cd relay
          npm init -y >/dev/null 2>&1
          npm install ws >/dev/null 2>&1

          cat > server.js <<'JS'
          const http = require('http');
          const fs = require('fs');
          const { WebSocketServer } = require('ws');

          const PORT = 8080;
          const RESULT_FILE = 'relay_result.json';

          const state = {
            started_utc: new Date().toISOString(),
            connections: 0,
            messages: 0,
            job_sent: 0,
            job_results: 0,
            events: []
          };

          function trimEvents() {
            if (state.events.length > 500) state.events = state.events.slice(-500);
          }

          function save() {
            fs.writeFileSync(RESULT_FILE, JSON.stringify(state, null, 2));
          }

          function logEvent(kind, data) {
            state.events.push({
              kind,
              at_utc: new Date().toISOString(),
              ...data
            });
            trimEvents();
            save();
          }

          const server = http.createServer((req, res) => {
            if (req.url === '/health') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({
                ok: true,
                connections: state.connections,
                messages: state.messages,
                started_utc: state.started_utc
              }));
              return;
            }

            if (req.url === '/dump') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify(state, null, 2));
              return;
            }

            res.writeHead(200, { 'Content-Type': 'text/plain' });
            res.end('relay-ok');
          });

          const wss = new WebSocketServer({ server, path: '/ws' });

          wss.on('connection', (socket, req) => {
            state.connections += 1;

            const conn = {
              jobSent: false,
              jobDone: false
            };

            logEvent('connect', {
              remote: req.socket.remoteAddress,
              url: req.url
            });

            socket.send(JSON.stringify({
              type: 'welcome',
              server_time_ms: Date.now()
            }));

            socket.on('message', (buf) => {
              state.messages += 1;

              const raw = buf.toString();
              let msg = null;

              try {
                msg = JSON.parse(raw);
              } catch (e) {
                msg = { type: 'raw', raw };
              }

              logEvent('message', { message: msg });

              if (msg && msg.type === 'ready' && !conn.jobSent) {
                conn.jobSent = true;

                const job = {
                  type: 'gpu_job',
                  job_id: 1,
                  benchmark: 'numba_vector_add',
                  n: 16777216,
                  repeats: 50
                };

                state.job_sent += 1;
                logEvent('job_sent', { job });

                socket.send(JSON.stringify(job));
                return;
              }

              if (msg && msg.type === 'gpu_result') {
                conn.jobDone = true;
                state.job_results += 1;

                logEvent('job_result', { result: msg });

                socket.send(JSON.stringify({
                  type: 'ack',
                  job_id: msg.job_id,
                  ok: true,
                  server_time_ms: Date.now()
                }));

                setTimeout(() => {
                  try {
                    socket.close();
                  } catch (e) {}
                }, 300);

                return;
              }

              if (msg && msg.type === 'heartbeat') {
                socket.send(JSON.stringify({
                  type: 'heartbeat_ack',
                  server_time_ms: Date.now()
                }));
                return;
              }

              socket.send(JSON.stringify({
                type: 'echo',
                server_time_ms: Date.now(),
                received: msg
              }));
            });

            socket.on('close', () => logEvent('close', {}));
            socket.on('error', (err) => logEvent('error', { error: String(err) }));
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log(`relay listening on ${PORT}`);
            save();
          });

          process.on('SIGTERM', () => {
            save();
            process.exit(0);
          });

          process.on('SIGINT', () => {
            save();
            process.exit(0);
          });
          JS

          nohup node server.js > relay.log 2>&1 &
          echo $! > relay.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Relay is up."
              exit 0
            fi
            sleep 1
          done

          echo "Relay failed to start."
          cat relay.log
          exit 1

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Quick Tunnel
        run: |
          set -euo pipefail
          cd relay
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf.log 2>&1 &
          echo $! > cf.pid

          echo "Waiting for public tunnel URL..."
          for i in $(seq 1 60); do
            if grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cf.log | head -n1 > /tmp/tunnel_url.txt; then
              break
            fi
            sleep 2
          done

          if [ ! -s /tmp/tunnel_url.txt ]; then
            echo "Cloudflare tunnel failed to produce a URL."
            cat cf.log
            exit 1
          fi

          TUNNEL_URL=$(cat /tmp/tunnel_url.txt)
          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "Public tunnel: $TUNNEL_URL"

      - name: Create Kaggle worker
        env:
          TUNNEL_URL: ${{ env.TUNNEL_URL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p kaggle_ws_worker

          cat > kaggle_ws_worker/worker.py <<PY
          import json
          import socket
          import subprocess
          import sys
          import time
          import traceback
          from datetime import datetime, timezone

          RAW_TUNNEL_URL = "${TUNNEL_URL}".strip()
          WSS_BASE = RAW_TUNNEL_URL.replace("https://", "wss://").replace("http://", "ws://").rstrip("/")
          WSS_URL = f"{WSS_BASE}/ws"
          OUT_FILE = "/kaggle/working/worker_ws_result.json"
          ERR_FILE = "/kaggle/working/worker_ws_error.txt"

          def run(cmd):
              return subprocess.run(cmd, capture_output=True, text=True)

          def save(obj):
              with open(OUT_FILE, "w") as f:
                  json.dump(obj, f, indent=2)
              print(json.dumps(obj, indent=2))

          def save_error(text):
              with open(ERR_FILE, "w") as f:
                  f.write(text)

          result = {
              "worker": "kaggle_gpu_ws_worker",
              "hostname": socket.gethostname(),
              "raw_tunnel_url": RAW_TUNNEL_URL,
              "wss_url": WSS_URL,
              "start_utc": datetime.now(timezone.utc).isoformat(),
          }

          print("==========================================")
          print("      KAGGLE GPU GPU JOB WORKER")
          print("==========================================")
          print("RAW TUNNEL URL:", RAW_TUNNEL_URL)
          print("WSS URL:", WSS_URL)

          smi = run([
              "nvidia-smi",
              "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
              "--format=csv,noheader"
          ])

          print("\n=== NVIDIA-SMI ===")
          print(smi.stdout)
          if smi.stderr:
              print(smi.stderr)

          result["nvidia_smi"] = smi.stdout.strip()
          result["nvidia_smi_rc"] = smi.returncode

          def run_numba_job(job):
              from numba import cuda
              import numpy as np

              n = int(job.get("n", 1 << 24))
              repeats = int(job.get("repeats", 50))

              @cuda.jit
              def vector_add(a, b, c):
                  i = cuda.grid(1)
                  if i < c.size:
                      c[i] = a[i] + b[i]

              device = cuda.get_current_device()
              gpu_name = device.name
              if isinstance(gpu_name, bytes):
                  gpu_name = gpu_name.decode()

              a = np.random.rand(n).astype(np.float32)
              b = np.random.rand(n).astype(np.float32)

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.device_array_like(a)

              threads = 256
              blocks = (n + threads - 1) // threads

              vector_add[blocks, threads](d_a, d_b, d_c)
              cuda.synchronize()

              start_event = cuda.event(timing=True)
              end_event = cuda.event(timing=True)

              wall_start = time.perf_counter()
              start_event.record()

              for _ in range(repeats):
                  vector_add[blocks, threads](d_a, d_b, d_c)

              end_event.record()
              end_event.synchronize()
              wall_end = time.perf_counter()

              kernel_ms = cuda.event_elapsed_time(start_event, end_event)
              wall_ms = (wall_end - wall_start) * 1000
              bytes_moved = n * 4 * 3 * repeats
              bandwidth_gbps = bytes_moved / (kernel_ms / 1000) / 1e9

              return {
                  "backend": "numba_cuda",
                  "gpu_name": gpu_name,
                  "elements": n,
                  "repeats": repeats,
                  "kernel_ms": float(kernel_ms),
                  "wall_ms": float(wall_ms),
                  "effective_bandwidth_gbps": float(bandwidth_gbps)
              }

          try:
              try:
                  import websocket
              except Exception:
                  subprocess.check_call([
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "-q",
                      "websocket-client"
                  ])
                  import websocket

              ws = websocket.create_connection(WSS_URL, timeout=20)

              welcome = json.loads(ws.recv())
              print("WELCOME:", welcome)
              result["welcome"] = welcome

              ws.send(json.dumps({
                  "type": "ready",
                  "worker_utc": datetime.now(timezone.utc).isoformat()
              }))

              job = None
              gpu_result = None
              ack = None
              pings = []

              while True:
                  raw = ws.recv()
                  msg = json.loads(raw)
                  print("RECV:", msg)

                  if msg.get("type") == "gpu_job":
                      job = msg

                      t0 = time.perf_counter()
                      compute_start_utc = datetime.now(timezone.utc).isoformat()
                      gpu_result = run_numba_job(job)
                      compute_ms = (time.perf_counter() - t0) * 1000

                      payload = {
                          "type": "gpu_result",
                          "job_id": job.get("job_id"),
                          "worker_utc": datetime.now(timezone.utc).isoformat(),
                          "compute_wall_ms": float(compute_ms),
                          "benchmark": gpu_result
                      }

                      ws.send(json.dumps(payload))
                      print("SENT GPU RESULT:", payload)
                      result["job"] = job
                      result["compute_start_utc"] = compute_start_utc
                      result["gpu_result"] = gpu_result
                      result["compute_wall_ms"] = float(compute_ms)
                      continue

                  if msg.get("type") == "ack":
                      ack = msg
                      print("ACK:", ack)
                      result["ack"] = ack
                      break

                  if msg.get("type") == "heartbeat_ack":
                      pings.append(msg)
                      continue

              result["status"] = "DONE"
              result["pings"] = pings

          except Exception as e:
              tb = traceback.format_exc()
              print("WORKER ERROR:", repr(e))
              print(tb)
              result["status"] = "ERROR"
              result["error"] = repr(e)
              result["traceback"] = tb
              save_error(tb)
              result["pings"] = result.get("pings", [])

          finally:
              try:
                  if "ws" in locals() and ws is not None:
                      ws.close()
              except Exception:
                  pass

              result["end_utc"] = datetime.now(timezone.utc).isoformat()
              save(result)
          PY

          cat > kaggle_ws_worker/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-ws-worker",
            "title": "GPU WS Worker",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push Kaggle worker
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle_ws_worker --accelerator NvidiaTeslaP100 --timeout 900

      - name: Wait for Kaggle worker
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set +euo pipefail
          KERNEL="${KAGGLE_USERNAME}/gpu-ws-worker"

          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1)
            echo "Check $i/120: $STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "Kaggle worker complete."
              break
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "Kaggle worker reported ERROR."
              break
            fi

            sleep 5
          done

          mkdir -p kaggle_output
          echo "Downloading Kaggle output..."
          kaggle kernels output "$KERNEL" -p kaggle_output -o

          echo "=========================================="
          echo "KAGGLE OUTPUT FILES"
          echo "=========================================="
          find kaggle_output -maxdepth 2 -type f -print || true

          echo "=========================================="
          echo "WORKER RESULT"
          echo "=========================================="
          if [ -f kaggle_output/worker_ws_result.json ]; then
            cat kaggle_output/worker_ws_result.json
          else
            echo "worker_ws_result.json was NOT produced."
          fi

          echo "=========================================="
          echo "WORKER ERROR FILE"
          echo "=========================================="
          if [ -f kaggle_output/worker_ws_error.txt ]; then
            cat kaggle_output/worker_ws_error.txt
          else
            echo "worker_ws_error.txt was NOT produced."
          fi

          echo "=========================================="
          echo "RELAY LOG"
          echo "=========================================="
          cat relay/relay.log || true

          echo "=========================================="
          echo "CLOUDFLARE LOG"
          echo "=========================================="
          cat relay/cf.log || true

          echo "=========================================="
          echo "RELAY RESULT"
          echo "=========================================="
          if [ -f relay/relay_result.json ]; then
            cat relay/relay_result.json
          else
            echo "relay_result.json was NOT produced."
          fi

          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-ws-relay-results
          path: |
            kaggle_output/
            relay/relay_result.json
            relay/relay.log
            relay/cf.log
