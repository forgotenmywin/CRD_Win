name: GitHub to Kaggle GPU Benchmark

on:
  workflow_dispatch:

jobs:
  kaggle-gpu-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade kaggle
          kaggle --version

      - name: Configure Kaggle auth
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${KAGGLE_USERNAME:-}" ]; then
            echo "KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          mkdir -p "$HOME/.kaggle"

          # New auth flow
          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

          # Legacy auth file
          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "${KAGGLE_USERNAME}",
            "key": "${KAGGLE_API_TOKEN}"
          }
          EOF
          chmod 600 "$HOME/.kaggle/kaggle.json"

          echo "Auth files written."

      - name: Verify Kaggle auth
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Testing Kaggle CLI auth..."
          kaggle competitions list --page-size 1
          echo "Auth OK."

      - name: Create Kaggle benchmark notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p kaggle_test

          cat > kaggle_test/gpu_benchmark.py <<'PY'
          import json
          import socket
          import subprocess
          import time
          from datetime import datetime, timezone

          OUT = "/kaggle/working/gpu_result.json"

          def write_result(obj):
              with open(OUT, "w") as f:
                  json.dump(obj, f, indent=2)
              print(json.dumps(obj, indent=2))

          def run_cmd(cmd):
              return subprocess.run(cmd, capture_output=True, text=True)

          result = {
              "hostname": socket.gethostname(),
              "start_utc": datetime.now(timezone.utc).isoformat(),
          }

          print("=== NVIDIA-SMI ===")
          smi = run_cmd([
              "nvidia-smi",
              "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
              "--format=csv,noheader"
          ])
          print(smi.stdout)
          if smi.stderr:
              print(smi.stderr)

          result["nvidia_smi"] = smi.stdout.strip()
          result["nvidia_smi_rc"] = smi.returncode

          benchmark = {"backend": None}

          try:
              print("=== NUMBA CUDA BENCHMARK ===")
              from numba import cuda
              import numpy as np

              if not cuda.is_available():
                  raise RuntimeError("CUDA is not available in numba")

              dev = cuda.get_current_device()
              gpu_name = dev.name.decode() if isinstance(dev.name, bytes) else str(dev.name)
              print("GPU:", gpu_name)

              @cuda.jit
              def vector_add(a, b, c):
                  i = cuda.grid(1)
                  if i < c.size:
                      c[i] = a[i] + b[i]

              n = 1 << 24
              repeats = 50

              a = np.random.rand(n).astype(np.float32)
              b = np.random.rand(n).astype(np.float32)

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.device_array_like(a)

              threads = 256
              blocks = (n + threads - 1) // threads

              vector_add[blocks, threads](d_a, d_b, d_c)
              cuda.synchronize()

              start = cuda.event(timing=True)
              end = cuda.event(timing=True)

              wall_start = time.perf_counter()
              start.record()
              for _ in range(repeats):
                  vector_add[blocks, threads](d_a, d_b, d_c)
              end.record()
              end.synchronize()
              wall_ms = (time.perf_counter() - wall_start) * 1000

              kernel_ms = cuda.event_elapsed_time(start, end)

              bytes_moved = n * 4 * 3 * repeats
              bandwidth_gbps = bytes_moved / (kernel_ms / 1000) / 1e9

              benchmark.update({
                  "backend": "numba_cuda",
                  "gpu_name": gpu_name,
                  "elements": int(n),
                  "repeats": int(repeats),
                  "kernel_ms": float(kernel_ms),
                  "wall_ms": float(wall_ms),
                  "effective_bandwidth_gbps": float(bandwidth_gbps),
              })

              print("Kernel ms:", round(kernel_ms, 3))
              print("Wall ms:", round(wall_ms, 3))
              print("Bandwidth GB/s:", round(bandwidth_gbps, 2))

          except Exception as e_numba:
              benchmark["numba_error"] = repr(e_numba)
              print("Numba failed:", repr(e_numba))

              try:
                  print("=== CUPY FALLBACK ===")
                  try:
                      import cupy as cp
                  except Exception:
                      subprocess.check_call([__import__("sys").executable, "-m", "pip", "-q", "install", "cupy-cuda12x"])
                      import cupy as cp

                  cp.cuda.Device(0).use()

                  n = 2048
                  a = cp.random.random((n, n), dtype=cp.float32)
                  b = cp.random.random((n, n), dtype=cp.float32)

                  c = a @ b
                  cp.cuda.Stream.null.synchronize()

                  start = cp.cuda.Event()
                  end = cp.cuda.Event()

                  wall_start = time.perf_counter()
                  start.record()
                  c = a @ b
                  end.record()
                  end.synchronize()
                  wall_ms = (time.perf_counter() - wall_start) * 1000

                  kernel_ms = cp.cuda.get_elapsed_time(start, end)
                  tflops = (2.0 * (n ** 3)) / (kernel_ms / 1000) / 1e12

                  benchmark.update({
                      "backend": "cupy",
                      "matmul_n": int(n),
                      "kernel_ms": float(kernel_ms),
                      "wall_ms": float(wall_ms),
                      "effective_tflops": float(tflops),
                  })

                  print("Kernel ms:", round(kernel_ms, 3))
                  print("Wall ms:", round(wall_ms, 3))
                  print("TFLOPS:", round(tflops, 2))

              except Exception as e_cupy:
                  benchmark["cupy_error"] = repr(e_cupy)
                  benchmark["backend"] = "failed"
                  print("CuPy failed:", repr(e_cupy))

          result["benchmark"] = benchmark
          result["end_utc"] = datetime.now(timezone.utc).isoformat()

          write_result(result)
          PY

          cat > kaggle_test/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/github-gpu-benchmark",
            "title": "GitHub GPU Benchmark",
            "code_file": "gpu_benchmark.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      - name: Push to Kaggle with GPU
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle_test --accelerator NvidiaTeslaP100 --timeout 3600

      - name: Wait for Kaggle completion
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          KERNEL="${KAGGLE_USERNAME}/github-gpu-benchmark"

          for i in $(seq 1 90); do
            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)
            echo "Check $i/90: $STATUS"

            if echo "$STATUS" | grep -qi "COMPLETE"; then
              echo "Completed."
              exit 0
            fi

            if echo "$STATUS" | grep -qi "ERROR"; then
              echo "Failed."
              exit 1
            fi

            sleep 10
          done

          echo "Timeout waiting for Kaggle."
          exit 1

      - name: Download Kaggle output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p kaggle_output
          KERNEL="${KAGGLE_USERNAME}/github-gpu-benchmark"

          kaggle kernels output "$KERNEL" -p kaggle_output -o

          echo "=== Files ==="
          find kaggle_output -maxdepth 2 -type f -print

          echo "=== gpu_result.json ==="
          cat kaggle_output/gpu_result.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-benchmark-result
          path: kaggle_output/
