name: Kaggle GPU Worker - Real-Time GPU Queue Fixed v3

"on":
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      WORKER_COUNT: "2"
      STRESS_JOBS: "24"
      MAX_QUEUE: "500"
      WORKER_DEAD_SECONDS: "45"
      JOB_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle websocket-client websockets numpy numba

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle --version
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Generate runtime auth tokens
        shell: bash
        run: |
          set -euxo pipefail
          echo "GPU_WORKER_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "GPU_CLIENT_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              "https://api.github.com/repos/cloudflare/cloudflared/releases/latest"
          )"

          CLOUDFLARED_TAG="$(
            printf '%s' "$RELEASE_JSON" | jq -r '.tag_name'
          )"

          test -n "$CLOUDFLARED_TAG"
          test "$CLOUDFLARED_TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Create relay server
        shell: bash
        run: |
          set -euxo pipefail

          cat > relay.py <<'PY'
          import asyncio
          import json
          import os
          import secrets
          import time
          import uuid
          from collections import deque
          from datetime import datetime, timezone

          import websockets

          HOST = "127.0.0.1"
          PORT = 8765

          WORKER_TOKEN = os.environ["GPU_WORKER_TOKEN"]
          CLIENT_TOKEN = os.environ["GPU_CLIENT_TOKEN"]
          MAX_QUEUE = int(os.environ.get("MAX_QUEUE", "500"))
          WORKER_DEAD_SECONDS = float(os.environ.get("WORKER_DEAD_SECONDS", "45"))
          JOB_TIMEOUT_SECONDS = float(os.environ.get("JOB_TIMEOUT_SECONDS", "120"))

          STATE_FILE = "relay_result.json"

          workers = {}
          clients = {}
          jobs = {}
          queue = deque()

          state = {
              "started_utc": datetime.now(timezone.utc).isoformat(),
              "connections": 0,
              "workers_total": 0,
              "workers_alive": 0,
              "clients_total": 0,
              "jobs_submitted": 0,
              "jobs_completed": 0,
              "jobs_failed": 0,
              "jobs_retried": 0,
              "queue_size": 0,
              "events": []
          }

          def now():
              return datetime.now(timezone.utc).isoformat()

          def mono():
              return time.monotonic()

          def snapshot():
              return {
                  "workers_total": len(workers),
                  "workers_alive": sum(1 for w in workers.values() if w["alive"]),
                  "clients_total": len(clients),
                  "jobs_submitted": state["jobs_submitted"],
                  "jobs_completed": state["jobs_completed"],
                  "jobs_failed": state["jobs_failed"],
                  "jobs_retried": state["jobs_retried"],
                  "queue_size": len(queue)
              }

          def save():
              snap = dict(state)
              snap.update(snapshot())
              snap["workers"] = {
                  wid: {
                      "worker_id": wid,
                      "alive": info["alive"],
                      "busy": info["busy"],
                      "last_seen": info["last_seen"],
                      "jobs_completed": info["jobs_completed"],
                      "gpu_name": info.get("gpu_name")
                  } for wid, info in workers.items()
              }
              snap["jobs"] = {
                  jid: {
                      "job_id": jid,
                      "status": job["status"],
                      "worker_id": job.get("worker_id"),
                      "attempt": job["attempt"],
                      "created_utc": job["created_utc"],
                      "latency": job.get("latency"),
                      "request": job.get("request"),
                      "result": job.get("result")
                  } for jid, job in jobs.items()
              }
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(snap, f, indent=2, ensure_ascii=False)

          def record(kind, **data):
              state["events"].append({
                  "kind": kind,
                  "at_utc": now(),
                  **data
              })
              if len(state["events"]) > 1000:
                  state["events"] = state["events"][-1000:]
              save()
              print(json.dumps({"kind": kind, **data}, ensure_ascii=False), flush=True)

          async def send_json(ws, obj):
              await ws.send(json.dumps(obj, separators=(",", ":")))

          def check_token(supplied, expected):
              return bool(supplied) and bool(expected) and secrets.compare_digest(str(supplied), str(expected))

          def create_job(request):
              job_id = str(uuid.uuid4())
              job = {
                  "job_id": job_id,
                  "status": "queued",
                  "attempt": 0,
                  "max_retries": int(request.get("max_retries", 3)),
                  "created_utc": now(),
                  "created_mono": mono(),
                  "queued_mono": mono(),
                  "worker_id": None,
                  "request": request,
                  "client_id": request.get("client_id"),
                  "result": None
              }
              jobs[job_id] = job
              queue.append(job_id)
              state["jobs_submitted"] += 1
              record("job_queued", job_id=job_id, operation=request.get("operation"), source=request.get("source"))
              return job

          def get_free_worker():
              for worker_id, info in workers.items():
                  if info["alive"] and not info["busy"] and info["ws"] is not None:
                      return worker_id, info
              return None, None

          async def dispatch_jobs():
              while queue:
                  worker_id, worker = get_free_worker()
                  if worker is None:
                      return

                  job_id = queue.popleft()
                  job = jobs.get(job_id)
                  if not job or job["status"] != "queued":
                      continue

                  job["status"] = "running"
                  job["attempt"] += 1
                  job["worker_id"] = worker_id
                  job["assigned_mono"] = mono()

                  worker["busy"] = True
                  worker["current_job"] = job_id

                  payload = dict(job["request"])
                  payload["type"] = "gpu_job"
                  payload["job_id"] = job_id
                  payload["attempt"] = job["attempt"]
                  payload["relay_dispatch_utc"] = now()
                  payload["relay_dispatch_mono"] = mono()

                  try:
                      await send_json(worker["ws"], payload)
                      record("job_sent", job_id=job_id, worker_id=worker_id, attempt=job["attempt"])
                  except Exception as e:
                      worker["busy"] = False
                      worker["current_job"] = None
                      job["status"] = "queued"
                      job["worker_id"] = None
                      queue.appendleft(job_id)
                      record("dispatch_error", job_id=job_id, worker_id=worker_id, error=repr(e))
                      return

          async def retry_job(job_id, reason):
              job = jobs.get(job_id)
              if not job or job["status"] == "completed":
                  return

              if job["attempt"] < job["max_retries"]:
                  job["status"] = "queued"
                  job["worker_id"] = None
                  job["retry_reason"] = reason
                  queue.appendleft(job_id)
                  state["jobs_retried"] += 1
                  record("job_retry", job_id=job_id, reason=reason, next_attempt=job["attempt"] + 1)
              else:
                  job["status"] = "failed"
                  job["failed_utc"] = now()
                  job["failure_reason"] = reason
                  state["jobs_failed"] += 1
                  record("job_failed", job_id=job_id, reason=reason)

                  client_id = job.get("client_id")
                  client = clients.get(client_id)
                  if client:
                      try:
                          await send_json(client, {"type": "job_failed", "job_id": job_id, "reason": reason})
                      except Exception:
                          pass

          async def complete_job(worker_id, msg):
              job_id = msg.get("job_id")
              job = jobs.get(job_id)
              if not job or job["status"] in ("completed", "failed"):
                  return

              worker = workers.get(worker_id)
              received_mono = mono()

              job["status"] = "completed"
              job["result"] = msg
              job["completed_utc"] = now()
              job["completed_mono"] = received_mono

              worker_to_relay_ms = (received_mono - msg.get("worker_send_mono", received_mono)) * 1000.0
              total_ms = (received_mono - job["created_mono"]) * 1000.0
              queue_ms = (job["assigned_mono"] - job["created_mono"]) * 1000.0
              gpu_ms = float(msg.get("gpu_compute_ms", 0.0))

              job["latency"] = {
                  "queue_ms": queue_ms,
                  "gpu_compute_ms": gpu_ms,
                  "worker_to_relay_ms": worker_to_relay_ms,
                  "total_relay_ms": total_ms
              }

              state["jobs_completed"] += 1

              if worker:
                  worker["busy"] = False
                  worker["current_job"] = None
                  worker["jobs_completed"] += 1
                  worker["last_seen"] = mono()

              record("job_completed", job_id=job_id, worker_id=worker_id, latency=job["latency"])

              client_id = job.get("client_id")
              client = clients.get(client_id)
              if client:
                  try:
                      await send_json(client, {
                          "type": "job_result",
                          "job_id": job_id,
                          "result": msg,
                          "latency": job["latency"]
                      })
                  except Exception:
                      pass

              await dispatch_jobs()

          async def retryable_worker_cleanup(worker_id, reason):
              worker = workers.get(worker_id)
              if not worker:
                  return
              worker["alive"] = False
              worker["busy"] = False
              job_id = worker.get("current_job")
              worker["current_job"] = None
              record("worker_dead", worker_id=worker_id, reason=reason)
              if job_id:
                  await retry_job(job_id, reason)

          async def worker_watchdog():
              while True:
                  await asyncio.sleep(5)
                  current = mono()
                  for worker_id, worker in list(workers.items()):
                      if not worker["alive"]:
                          continue
                      age = current - worker["last_seen"]
                      if age > WORKER_DEAD_SECONDS:
                          await retryable_worker_cleanup(worker_id, "worker_dead")
                  await dispatch_jobs()

          async def job_watchdog():
              while True:
                  await asyncio.sleep(2)
                  current = mono()
                  for job_id, job in list(jobs.items()):
                      if job["status"] != "running":
                          continue
                      started = job.get("assigned_mono")
                      if not started:
                          continue
                      if current - started > JOB_TIMEOUT_SECONDS:
                          worker_id = job.get("worker_id")
                          worker = workers.get(worker_id)
                          if worker:
                              worker["busy"] = False
                              worker["current_job"] = None
                          await retry_job(job_id, "job_timeout")
                  await dispatch_jobs()

          async def worker_handler(ws, worker_id):
              workers[worker_id] = {
                  "ws": ws,
                  "worker_id": worker_id,
                  "alive": True,
                  "busy": False,
                  "current_job": None,
                  "last_seen": mono(),
                  "jobs_completed": 0,
                  "gpu_name": None
              }
              record("worker_connected", worker_id=worker_id)

              try:
                  await send_json(ws, {"type": "worker_accepted", "worker_id": worker_id})

                  async for raw in ws:
                      info = workers.get(worker_id)
                      if not info:
                          break
                      info["last_seen"] = mono()

                      try:
                          msg = json.loads(raw)
                      except Exception:
                          continue

                      msg_type = msg.get("type")

                      if msg_type == "worker_info":
                          info["gpu_name"] = msg.get("gpu_name")
                          record("worker_info", worker_id=worker_id, gpu_name=msg.get("gpu_name"))

                      elif msg_type == "heartbeat":
                          await send_json(ws, {
                              "type": "heartbeat_ack",
                              "server_mono": mono(),
                              "server_utc": now()
                          })

                      elif msg_type == "gpu_result":
                          await complete_job(worker_id, msg)

              except Exception as e:
                  record("worker_exception", worker_id=worker_id, error=repr(e))
              finally:
                  await retryable_worker_cleanup(worker_id, "worker_connection_lost")
                  record("worker_disconnected", worker_id=worker_id)
                  await dispatch_jobs()

          async def client_handler(ws, client_id):
              clients[client_id] = ws
              record("client_connected", client_id=client_id)

              try:
                  await send_json(ws, {"type": "client_accepted", "client_id": client_id})

                  async for raw in ws:
                      try:
                          msg = json.loads(raw)
                      except Exception:
                          await send_json(ws, {"type": "error", "error": "invalid_json"})
                          continue

                      msg_type = msg.get("type")

                      if msg_type == "submit":
                          if len(queue) >= MAX_QUEUE:
                              await send_json(ws, {"type": "error", "error": "queue_full"})
                              continue

                          msg["client_id"] = client_id
                          msg["source"] = "client_websocket"
                          job = create_job(msg)
                          await send_json(ws, {
                              "type": "accepted",
                              "job_id": job["job_id"],
                              "queue_position": len(queue)
                          })
                          await dispatch_jobs()

                      elif msg_type == "status":
                          await send_json(ws, {
                              "type": "status",
                              **snapshot()
                          })

                      elif msg_type == "job_status":
                          job_id = msg.get("job_id")
                          job = jobs.get(job_id)
                          if not job:
                              await send_json(ws, {"type": "error", "error": "job_not_found"})
                          else:
                              await send_json(ws, {
                                  "type": "job_status",
                                  "job_id": job_id,
                                  "status": job["status"],
                                  "attempt": job["attempt"],
                                  "worker_id": job.get("worker_id"),
                                  "result": job.get("result"),
                                  "latency": job.get("latency")
                              })

                      elif msg_type == "ping":
                          await send_json(ws, {
                              "type": "pong",
                              "client_mono": msg.get("client_mono"),
                              "relay_mono": mono(),
                              "relay_utc": now()
                          })

              except Exception as e:
                  record("client_exception", client_id=client_id, error=repr(e))
              finally:
                  clients.pop(client_id, None)
                  record("client_disconnected", client_id=client_id)

          async def handler(ws):
              state["connections"] += 1

              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
              except Exception:
                  await ws.close()
                  return

              if msg.get("type") != "auth":
                  await send_json(ws, {"type": "error", "error": "authentication_required"})
                  await ws.close()
                  return

              role = msg.get("role")
              token = msg.get("token")

              if role == "worker":
                  if not check_token(token, WORKER_TOKEN):
                      await send_json(ws, {"type": "error", "error": "invalid_worker_token"})
                      await ws.close()
                      return
                  worker_id = msg.get("worker_id")
                  if not worker_id:
                      await ws.close()
                      return
                  await worker_handler(ws, str(worker_id))
                  return

              if role == "client":
                  if not check_token(token, CLIENT_TOKEN):
                      await send_json(ws, {"type": "error", "error": "invalid_client_token"})
                      await ws.close()
                      return
                  client_id = str(uuid.uuid4())
                  await client_handler(ws, client_id)
                  return

              await ws.close()

          async def main():
              print("=" * 60)
              print("REAL-TIME GPU JOB RELAY")
              print("=" * 60)
              print("MAX QUEUE:", MAX_QUEUE)
              print("WORKER DEAD SECONDS:", WORKER_DEAD_SECONDS)
              print("JOB TIMEOUT SECONDS:", JOB_TIMEOUT_SECONDS)
              save()

              asyncio.create_task(worker_watchdog())
              asyncio.create_task(job_watchdog())

              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=60,
                  max_size=100 * 1024 * 1024
              ):
                  print(f"Listening on ws://{HOST}:{PORT}")
                  while True:
                      await asyncio.sleep(5)
                      save()

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          set -euxo pipefail
          nohup python3 relay.py > relay.log 2>&1 &
          echo $! > relay.pid
          sleep 2
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euxo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          rm -f tunnel_url.txt

          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              printf '%s\n' "$URL" > tunnel_url.txt
              break
            fi
            sleep 2
          done

          test -s tunnel_url.txt

          TUNNEL_URL="$(cat tunnel_url.txt)"
          WSS_URL="$(printf '%s' "$TUNNEL_URL" | sed 's/^https:/wss:/')/ws"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"

          echo "HTTP URL: $TUNNEL_URL"
          echo "WS URL: $WSS_URL"

      - name: Create Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_workers
          mkdir -p kaggle_workers

          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do
            WORKER_ID="gpu-worker-${WORKER_INDEX}"
            DIR="kaggle_workers/${WORKER_ID}"
            mkdir -p "$DIR"

            cat > "${DIR}/worker.py" <<PY
          import base64
          import json
          import subprocess
          import time
          import traceback
          from datetime import datetime, timezone

          import numpy as np
          import websocket


          WSS_URL = "${WSS_URL}"
          WORKER_TOKEN = "${GPU_WORKER_TOKEN}"
          WORKER_ID = "${WORKER_ID}"
          RESULT_FILE = "/kaggle/working/worker_result.json"


          def now():
              return datetime.now(timezone.utc).isoformat()


          def gpu_info():
              try:
                  p = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,memory.used,utilization.gpu,temperature.gpu,power.draw",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )
                  return p.stdout.strip()
              except Exception as e:
                  return repr(e)


          def save(data):
              with open(RESULT_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)


          def run_vector_add(job):
              from numba import cuda

              n = int(job.get("n", 262144))
              repeats = int(job.get("repeats", 5))

              input_a = job.get("input_a")
              input_b = job.get("input_b")

              if input_a:
                  a = np.frombuffer(base64.b64decode(input_a), dtype=np.float32).copy()
              else:
                  a = np.ones(n, dtype=np.float32)

              if input_b:
                  b = np.frombuffer(base64.b64decode(input_b), dtype=np.float32).copy()
              else:
                  b = np.ones(n, dtype=np.float32)

              n = min(len(a), len(b))
              a = a[:n]
              b = b[:n]

              da = cuda.to_device(a)
              db = cuda.to_device(b)
              dc = cuda.device_array(n, dtype=np.float32)

              @cuda.jit
              def kernel(x, y, z):
                  i = cuda.grid(1)
                  if i < z.size:
                      z[i] = x[i] + y[i]

              threads = 256
              blocks = (n + threads - 1) // threads

              kernel[blocks, threads](da, db, dc)
              cuda.synchronize()

              start = time.perf_counter()
              for _ in range(repeats):
                  kernel[blocks, threads](da, db, dc)
              cuda.synchronize()
              elapsed = (time.perf_counter() - start) * 1000.0

              out = dc.copy_to_host()
              out_b64 = base64.b64encode(out.tobytes()).decode()

              return {
                  "operation": "vector_add",
                  "elements": n,
                  "repeats": repeats,
                  "gpu_compute_ms": elapsed,
                  "output_bytes": out.nbytes,
                  "output_base64": out_b64
              }


          def run_matmul(job):
              from numba import cuda

              size = int(job.get("size", 128))

              a = np.random.random((size, size)).astype(np.float32)
              b = np.random.random((size, size)).astype(np.float32)

              da = cuda.to_device(a)
              db = cuda.to_device(b)
              dc = cuda.device_array((size, size), dtype=np.float32)

              @cuda.jit
              def matmul(A, B, C):
                  row = cuda.blockIdx.x * cuda.blockDim.x + cuda.threadIdx.x
                  col = cuda.blockIdx.y * cuda.blockDim.y + cuda.threadIdx.y
                  if row < C.shape[0] and col < C.shape[1]:
                      tmp = 0.0
                      for k in range(A.shape[1]):
                          tmp += A[row, k] * B[k, col]
                      C[row, col] = tmp

              threads = (16, 16)
              blocks = ((size + 15) // 16, (size + 15) // 16)

              matmul[blocks, threads](da, db, dc)
              cuda.synchronize()

              start = time.perf_counter()
              matmul[blocks, threads](da, db, dc)
              cuda.synchronize()
              elapsed = (time.perf_counter() - start) * 1000.0

              out = dc.copy_to_host()
              out_b64 = base64.b64encode(out.tobytes()).decode()

              return {
                  "operation": "matmul",
                  "size": size,
                  "gpu_compute_ms": elapsed,
                  "output_bytes": out.nbytes,
                  "output_base64": out_b64
              }


          def run_job(job):
              op = job.get("operation", "vector_add")
              if op == "vector_add":
                  return run_vector_add(job)
              if op == "matmul":
                  return run_matmul(job)
              raise ValueError("Unknown operation: " + str(op))


          def connect_once():
              ws = websocket.create_connection(
                  WSS_URL,
                  timeout=120,
                  max_size=100 * 1024 * 1024
              )

              ws.send(json.dumps({
                  "type": "auth",
                  "role": "worker",
                  "token": WORKER_TOKEN,
                  "worker_id": WORKER_ID
              }))

              ws.send(json.dumps({
                  "type": "worker_info",
                  "worker_id": WORKER_ID,
                  "gpu_name": gpu_info(),
                  "worker_utc": now()
              }))

              return ws


          def main():
              result = {
                  "worker": "kaggle_gpu_ws_worker",
                  "worker_id": WORKER_ID,
                  "wss_url": WSS_URL,
                  "start_utc": now(),
                  "status": "STARTING",
                  "jobs": [],
                  "nvidia_smi": gpu_info()
              }

              print("=" * 60)
              print("KAGGLE REAL-TIME GPU WORKER")
              print("WORKER:", WORKER_ID)
              print("GPU:", result["nvidia_smi"])
              print("=" * 60)

              ws = None

              try:
                  while True:
                      try:
                          ws = connect_once()
                          result["status"] = "CONNECTED"
                          print("Connected:", WORKER_ID)

                          while True:
                              try:
                                  ws.settimeout(5)
                                  raw = ws.recv()
                              except Exception:
                                  ws.send(json.dumps({
                                      "type": "heartbeat",
                                      "worker_id": WORKER_ID,
                                      "worker_mono": time.monotonic(),
                                      "worker_utc": now()
                                  }))
                                  continue

                              if raw is None:
                                  raise RuntimeError("connection_closed")

                              msg = json.loads(raw)

                              if msg.get("type") in ("worker_accepted", "heartbeat_ack"):
                                  continue

                              if msg.get("type") != "gpu_job":
                                  if msg.get("type") == "all_jobs_done":
                                      continue
                                  continue

                              job_id = msg.get("job_id")
                              attempt = int(msg.get("attempt", 1))
                              started = time.perf_counter()

                              try:
                                  benchmark = run_job(msg)
                                  response = {
                                      "type": "gpu_result",
                                      "job_id": job_id,
                                      "attempt": attempt,
                                      "worker_id": WORKER_ID,
                                      "worker_utc": now(),
                                      "worker_send_mono": time.monotonic(),
                                      "compute_wall_ms": float((time.perf_counter() - started) * 1000.0),
                                      **benchmark
                                  }
                              except Exception as e:
                                  response = {
                                      "type": "gpu_result",
                                      "job_id": job_id,
                                      "attempt": attempt,
                                      "worker_id": WORKER_ID,
                                      "worker_utc": now(),
                                      "worker_send_mono": time.monotonic(),
                                      "error": repr(e),
                                      "traceback": traceback.format_exc()
                                  }

                              result["jobs"].append(response)
                              ws.send(json.dumps(response))
                              save(result)
                              print("RESULT SENT:", job_id)

                      except Exception as e:
                          print("WORKER CONNECTION ERROR:", repr(e))
                          time.sleep(3)

                      finally:
                          if ws is not None:
                              try:
                                  ws.close()
                              except Exception:
                                  pass
                              ws = None

              finally:
                  result["status"] = "DONE"
                  result["end_utc"] = now()
                  save(result)
                  print(json.dumps(result, indent=2, ensure_ascii=False))


          if __name__ == "__main__":
              main()
          PY

            cat > "${DIR}/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-worker-${WORKER_INDEX}",
            "title": "gpu-worker-${WORKER_INDEX}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          done

      - name: Push Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail
          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do
            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"
            echo "Pushing ${DIR}"
            kaggle kernels push -p "$DIR"
          done

      - name: Create stress client
        shell: bash
        run: |
          set -euxo pipefail

          cat > stress_client.py <<'PY'
          import asyncio
          import base64
          import json
          import os
          import statistics
          import sys
          import time
          import uuid

          import numpy as np
          import websockets


          def resolve_wss_url():
              if len(sys.argv) > 1 and sys.argv[1].strip():
                  return sys.argv[1].strip()

              wss = os.environ.get("WSS_URL", "").strip()
              if wss:
                  return wss

              tunnel = os.environ.get("TUNNEL_URL", "").strip()
              if tunnel:
                  return tunnel.replace("https://", "wss://").rstrip("/") + "/ws"

              raise SystemExit("No WSS_URL or TUNNEL_URL provided")


          WSS_URL = resolve_wss_url()
          CLIENT_TOKEN = os.environ["GPU_CLIENT_TOKEN"]
          COUNT = int(os.environ.get("STRESS_JOBS", "24"))


          def big_payload(n=500_000):
              arr = np.ones(n, dtype=np.float32)
              return base64.b64encode(arr.tobytes()).decode()


          async def main():
              print("=" * 60)
              print("GPU API STRESS TEST")
              print("URL:", WSS_URL)
              print("JOBS:", COUNT)
              print("=" * 60)

              completed = 0
              accepted = 0
              latencies = []

              async with websockets.connect(
                  WSS_URL,
                  max_size=100 * 1024 * 1024,
                  open_timeout=60,
                  ping_interval=20,
                  ping_timeout=30
              ) as ws:
                  await ws.send(json.dumps({
                      "type": "auth",
                      "role": "client",
                      "token": CLIENT_TOKEN
                  }))

                  auth = json.loads(await ws.recv())
                  print("AUTH:", auth)

                  await ws.send(json.dumps({"type": "status"}))
                  status = json.loads(await ws.recv())
                  print("STATUS:", status)

                  for _ in range(60):
                      if status.get("workers_alive", 0) > 0:
                          break
                      await asyncio.sleep(2)
                      await ws.send(json.dumps({"type": "status"}))
                      status = json.loads(await ws.recv())
                      print("STATUS:", status)

                  for i in range(COUNT):
                      client_job_id = str(uuid.uuid4())

                      if i % 6 == 0:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "vector_add",
                              "n": 500_000,
                              "repeats": 5,
                              "input_a": big_payload(500_000),
                              "input_b": big_payload(500_000),
                              "max_retries": 3
                          }
                      elif i % 7 == 0:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "matmul",
                              "size": 128,
                              "max_retries": 3
                          }
                      else:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "vector_add",
                              "n": 262144,
                              "repeats": 5,
                              "max_retries": 3
                          }

                      await ws.send(json.dumps(request))

                  deadline = time.monotonic() + 900

                  while completed < COUNT and time.monotonic() < deadline:
                      timeout = max(1, deadline - time.monotonic())
                      try:
                          raw = await asyncio.wait_for(ws.recv(), timeout=timeout)
                      except asyncio.TimeoutError:
                          break

                      msg = json.loads(raw)

                      if msg.get("type") == "accepted":
                          accepted += 1
                          if accepted % 10 == 0:
                              print(f"Accepted {accepted}/{COUNT}")
                          continue

                      if msg.get("type") == "job_result":
                          completed += 1
                          latency = msg.get("latency", {})
                          total = latency.get("total_relay_ms")
                          if total is not None:
                              latencies.append(float(total))
                          if completed % 5 == 0:
                              print(f"Completed {completed}/{COUNT}")
                          continue

                      if msg.get("type") == "job_failed":
                          completed += 1
                          print("FAILED:", msg)

                  print()
                  print("=" * 60)
                  print("STRESS TEST RESULT")
                  print("=" * 60)
                  print("Submitted:", COUNT)
                  print("Completed:", completed)
                  print("Accepted:", accepted)
                  print("Failed:", COUNT - completed)

                  if latencies:
                      print("Latency min:", min(latencies), "ms")
                      print("Latency avg:", statistics.mean(latencies), "ms")
                      print("Latency max:", max(latencies), "ms")
                      if len(latencies) > 1:
                          print("Latency p50:", statistics.median(latencies), "ms")

                  with open("stress_results.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "submitted": COUNT,
                          "completed": completed,
                          "accepted": accepted,
                          "latencies_ms": latencies
                      }, f, indent=2)

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Run stress client
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$WSS_URL"
          python3 stress_client.py "$WSS_URL"

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== RELAY LOG ==="
          cat relay.log || true
          echo
          echo "=== CLOUDFLARED LOG ==="
          cat cloudflared.log || true
          echo
          echo "=== RELAY RESULT ==="
          cat relay_result.json || true
          echo
          echo "=== STRESS RESULTS ==="
          cat stress_results.json || true
          echo
          echo "=== TUNNEL URL ==="
          cat tunnel_url.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-time-gpu-queue-results
          path: |
            relay_result.json
            relay.log
            cloudflared.log
            tunnel_url.txt
            stress_results.json
            kaggle_workers/**
          if-no-files-found: warn
          retention-days: 7
