name: Kaggle GPU Worker - Real-Time GPU Queue v7

on:
  workflow_dispatch:
    inputs:
      worker_count:
        description: "Number of Kaggle GPU workers"
        required: false
        default: "2"
      job_count:
        description: "Number of GPU jobs"
        required: false
        default: "100"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      WORKER_COUNT: ${{ inputs.worker_count }}
      JOB_COUNT: ${{ inputs.job_count }}

      RELAY_HOST: "127.0.0.1"
      RELAY_PORT: "8765"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip \
            netcat-openbsd

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            --upgrade \
            kaggle \
            websockets \
            websocket-client


      # ============================================================
      # KAGGLE AUTH
      # ============================================================

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail

          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"

          mkdir -p "$HOME/.kaggle"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle --version


      # ============================================================
      # CREATE RELAY
      # ============================================================

      - name: Create Real-Time GPU Relay
        shell: bash
        run: |

          set -euxo pipefail

          cat > relay.py <<'PY'

          import asyncio
          import json
          import os
          import time
          import uuid
          from datetime import datetime, timezone

          import websockets


          HOST = os.getenv("RELAY_HOST", "127.0.0.1")
          PORT = int(os.getenv("RELAY_PORT", "8765"))

          JOB_COUNT = int(os.getenv("JOB_COUNT", "100"))

          HEARTBEAT_TIMEOUT = 45
          JOB_TIMEOUT = 120
          MAX_RETRIES = 3


          # ==========================================================
          # STATE
          # ==========================================================

          state = {
              "started_utc": datetime.now(timezone.utc).isoformat(),

              "connections_total": 0,

              "workers_alive": 0,

              "jobs_total": JOB_COUNT,

              "jobs_queued": JOB_COUNT,

              "jobs_sent": 0,

              "jobs_completed": 0,

              "jobs_failed": 0,

              "jobs_retried": 0,

              "messages": 0,

              "done": False,

              "events": [],

              "workers": {},

              "results": []
          }


          workers = {}

          jobs = {}

          queue = asyncio.Queue()

          finished = asyncio.Event()

          lock = asyncio.Lock()


          # ==========================================================
          # TIME
          # ==========================================================

          def now():
              return datetime.now(timezone.utc).isoformat()


          def timestamp():
              return time.time()


          # ==========================================================
          # SAVE
          # ==========================================================

          def save():

              tmp = "relay_result.json.tmp"

              with open(tmp, "w", encoding="utf-8") as f:

                  json.dump(
                      state,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

              os.replace(
                  tmp,
                  "relay_result.json"
              )


          # ==========================================================
          # EVENTS
          # ==========================================================

          def event(kind, **data):

              state["events"].append({
                  "kind": kind,
                  "at_utc": now(),
                  **data
              })

              if len(state["events"]) > 1000:

                  state["events"] = \
                      state["events"][-1000:]

              save()


          # ==========================================================
          # CREATE JOBS
          # ==========================================================

          def create_jobs():

              for i in range(1, JOB_COUNT + 1):

                  job = {
                      "job_id": i,

                      "type": "gpu_job",

                      "benchmark": "matrix_multiply",

                      "size": 2048,

                      "repeats": 5,

                      "created_utc": now(),

                      "attempt": 0,

                      "status": "queued"
                  }

                  jobs[i] = job

                  queue.put_nowait(i)


          # ==========================================================
          # SEND JOB
          # ==========================================================

          async def send_job(worker):

              if worker["busy"]:

                  return False


              try:

                  job_id = await asyncio.wait_for(
                      queue.get(),
                      timeout=1
                  )

              except asyncio.TimeoutError:

                  return False


              job = jobs.get(job_id)

              if not job:

                  return False


              job["attempt"] += 1

              job["status"] = "running"

              job["worker_id"] = worker["id"]

              job["sent_utc"] = now()

              job["sent_timestamp"] = timestamp()


              message = dict(job)

              message["type"] = "gpu_job"


              try:

                  await worker["ws"].send(
                      json.dumps(message)
                  )

              except Exception as e:

                  job["status"] = "queued"

                  await queue.put(job_id)

                  event(
                      "send_failed",
                      job_id=job_id,
                      worker_id=worker["id"],
                      error=repr(e)
                  )

                  return False


              worker["busy"] = True

              worker["job_id"] = job_id

              worker["last_seen"] = timestamp()


              state["jobs_sent"] += 1

              state["jobs_queued"] = queue.qsize()


              event(
                  "job_sent",
                  job_id=job_id,
                  worker_id=worker["id"],
                  attempt=job["attempt"]
              )

              return True


          # ==========================================================
          # FILL WORKER
          # ==========================================================

          async def fill_worker(worker):

              while not worker["busy"]:

                  if state["jobs_completed"] >= JOB_COUNT:

                      return

                  sent = await send_job(worker)

                  if not sent:

                      return


          # ==========================================================
          # HANDLE RESULT
          # ==========================================================

          async def handle_result(worker, msg):

              job_id = msg.get("job_id")

              if job_id is None:

                  return


              job = jobs.get(job_id)

              if job is None:

                  return


              if job["status"] == "completed":

                  return


              job["status"] = "completed"

              job["completed_utc"] = now()

              job["result"] = msg

              job["worker_id"] = worker["id"]


              worker["busy"] = False

              worker["job_id"] = None

              worker["last_seen"] = timestamp()


              state["jobs_completed"] += 1

              state["jobs_queued"] = queue.qsize()

              state["results"].append(msg)


              event(
                  "job_completed",
                  job_id=job_id,
                  worker_id=worker["id"],
                  completed=state["jobs_completed"],
                  total=JOB_COUNT
              )


              try:

                  await worker["ws"].send(
                      json.dumps({
                          "type": "ack",
                          "job_id": job_id,
                          "ok": True,
                          "relay_utc": now()
                      })
                  )

              except Exception:

                  pass


              if state["jobs_completed"] >= JOB_COUNT:

                  state["done"] = True

                  event(
                      "all_jobs_completed",
                      total=JOB_COUNT
                  )

                  finished.set()

                  return


              await fill_worker(worker)


          # ==========================================================
          # WORKER DISCONNECT
          # ==========================================================

          async def worker_disconnect(worker):

              if not worker:

                  return


              worker_id = worker["id"]

              if worker_id not in workers:

                  return


              job_id = worker.get("job_id")


              if job_id is not None:

                  job = jobs.get(job_id)

                  if job and job["status"] == "running":

                      attempt = job["attempt"]

                      if attempt < MAX_RETRIES:

                          job["status"] = "queued"

                          job["worker_id"] = None

                          state["jobs_retried"] += 1

                          await queue.put(job_id)

                          event(
                              "job_requeued",
                              job_id=job_id,
                              worker_id=worker_id,
                              attempt=attempt
                          )

                      else:

                          job["status"] = "failed"

                          state["jobs_failed"] += 1

                          event(
                              "job_failed",
                              job_id=job_id,
                              worker_id=worker_id,
                              attempts=attempt
                          )


              workers.pop(worker_id, None)

              state["workers_alive"] = len(workers)

              state["jobs_queued"] = queue.qsize()


              event(
                  "worker_disconnected",
                  worker_id=worker_id,
                  job_id=job_id
              )


          # ==========================================================
          # WORKER HANDLER
          # ==========================================================

          async def handler(ws):

              worker_id = None

              state["connections_total"] += 1

              event(
                  "connection",
                  remote=str(ws.remote_address)
              )


              try:

                  raw = await asyncio.wait_for(
                      ws.recv(),
                      timeout=30
                  )

                  msg = json.loads(raw)

                  state["messages"] += 1


                  if msg.get("type") != "ready":

                      await ws.close()

                      return


                  worker_id = msg.get(
                      "worker_id",
                      str(uuid.uuid4())
                  )


                  if worker_id in workers:

                      worker_id = (
                          worker_id
                          + "-"
                          + uuid.uuid4().hex[:6]
                      )


                  worker = {
                      "id": worker_id,

                      "ws": ws,

                      "busy": False,

                      "job_id": None,

                      "connected_utc": now(),

                      "last_seen": timestamp()
                  }


                  workers[worker_id] = worker

                  state["workers_alive"] = len(workers)

                  event(
                      "worker_connected",
                      worker_id=worker_id
                  )


                  await ws.send(
                      json.dumps({
                          "type": "worker_accepted",
                          "worker_id": worker_id,
                          "relay_utc": now()
                      })
                  )


                  await fill_worker(worker)


                  # ==================================================
                  # MAIN LOOP
                  # ==================================================

                  async for raw in ws:

                      state["messages"] += 1

                      worker["last_seen"] = timestamp()


                      try:

                          msg = json.loads(raw)

                      except Exception:

                          continue


                      msg_type = msg.get("type")


                      if msg_type == "gpu_result":

                          await handle_result(
                              worker,
                              msg
                          )


                      elif msg_type == "heartbeat":

                          await ws.send(
                              json.dumps({
                                  "type": "heartbeat_ack",
                                  "relay_utc": now()
                              })
                          )


                      elif msg_type == "ping":

                          await ws.send(
                              json.dumps({
                                  "type": "pong",
                                  "id": msg.get("id"),
                                  "relay_utc": now()
                              })
                          )


              except Exception as e:

                  event(
                      "worker_handler_error",
                      worker_id=worker_id,
                      error=repr(e)
                  )


              finally:

                  if worker_id:

                      await worker_disconnect(
                          workers.get(worker_id)
                      )


          # ==========================================================
          # MONITOR WORKERS
          # ==========================================================

          async def monitor():

              while not finished.is_set():

                  await asyncio.sleep(5)

                  current = list(
                      workers.values()
                  )

                  for worker in current:

                      age = (
                          timestamp()
                          - worker["last_seen"]
                      )

                      if age > HEARTBEAT_TIMEOUT:

                          event(
                              "worker_timeout",
                              worker_id=worker["id"],
                              age_seconds=age
                          )

                          try:

                              await worker["ws"].close()

                          except Exception:

                              pass


                  state["workers_alive"] = len(workers)

                  state["jobs_queued"] = queue.qsize()

                  save()


          # ==========================================================
          # HEARTBEAT
          # ==========================================================

          async def heartbeat():

              while not finished.is_set():

                  await asyncio.sleep(15)

                  for worker in list(
                      workers.values()
                  ):

                      try:

                          await worker["ws"].send(
                              json.dumps({
                                  "type": "heartbeat",
                                  "relay_utc": now()
                              })
                          )

                      except Exception:

                          pass


          # ==========================================================
          # MAIN
          # ==========================================================

          async def main():

              create_jobs()

              save()

              event(
                  "relay_start",
                  host=HOST,
                  port=PORT,
                  jobs=JOB_COUNT
              )


              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,

                  ping_interval=20,

                  ping_timeout=30,

                  max_size=64 * 1024 * 1024,

                  max_queue=256
              ):

                  print(
                      f"Relay listening on {HOST}:{PORT}"
                  )

                  print(
                      f"Jobs: {JOB_COUNT}"
                  )

                  print(
                      "Waiting for Kaggle workers..."
                  )


                  monitor_task = asyncio.create_task(
                      monitor()
                  )

                  heartbeat_task = asyncio.create_task(
                      heartbeat()
                  )


                  try:

                      await asyncio.wait_for(
                          finished.wait(),
                          timeout=1500
                      )

                  except asyncio.TimeoutError:

                      event(
                          "relay_timeout",
                          completed=state["jobs_completed"],
                          total=JOB_COUNT
                      )


                  monitor_task.cancel()

                  heartbeat_task.cancel()


                  state["workers_alive"] = len(
                      workers
                  )

                  state["jobs_queued"] = queue.qsize()

                  save()


                  print(
                      json.dumps(
                          state,
                          indent=2,
                          ensure_ascii=False
                      )
                  )


          if __name__ == "__main__":

              asyncio.run(main())

          PY


      # ============================================================
      # START RELAY
      # ============================================================

      - name: Start Relay
        shell: bash
        run: |
          set -euxo pipefail

          rm -f relay.log relay_result.json

          nohup python3 relay.py \
            > relay.log 2>&1 &

          RELAY_PID=$!

          echo "$RELAY_PID" > relay.pid

          sleep 3

          if ! kill -0 "$RELAY_PID" 2>/dev/null; then

            echo "Relay died."

            cat relay.log || true

            exit 1

          fi

          echo "Relay PID=$RELAY_PID"

          cat relay.log || true


      # ============================================================
      # INSTALL CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest
          )"

          TAG="$(
            printf '%s' "$RELEASE_JSON" |
            jq -r '.tag_name'
          )"

          test -n "$TAG"
          test "$TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared

          sudo install \
            -m 0755 \
            cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      # ============================================================
      # START CLOUDFLARE
      # ============================================================

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euxo pipefail

          rm -f cloudflared.log
          rm -f tunnel_url.txt
          rm -f wss_url.txt

          echo "Starting Cloudflare tunnel..."

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --protocol http2 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          PID=$!

          echo "$PID" > cloudflared.pid

          echo "Cloudflare PID: $PID"

          sleep 5

          URL=""

          for i in $(seq 1 120); do

            if ! kill -0 "$PID" 2>/dev/null; then

              echo "cloudflared exited early."

              echo "=============================="
              echo "CLOUDFLARED LOG"
              echo "=============================="

              cat cloudflared.log || true

              exit 1

            fi


            URL="$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                cloudflared.log |
              head -n 1 ||
              true
            )"


            if [ -n "$URL" ]; then

              break

            fi


            echo \
              "Waiting for Cloudflare... $i/120"

            sleep 2

          done


          if [ -z "$URL" ]; then

            echo "Tunnel URL was not found."

            cat cloudflared.log || true

            exit 1

          fi


          WSS_URL="$(
            printf '%s' "$URL" |
            sed 's#^https:#wss:#'
          )/ws"


          printf '%s\n' "$URL" \
            > tunnel_url.txt

          printf '%s\n' "$WSS_URL" \
            > wss_url.txt


          echo "TUNNEL_URL=$URL" \
            >> "$GITHUB_ENV"

          echo "WSS_URL=$WSS_URL" \
            >> "$GITHUB_ENV"


          echo
          echo "======================================"
          echo "CLOUDFLARE TUNNEL READY"
          echo "======================================"
          echo "HTTP : $URL"
          echo "WSS  : $WSS_URL"
          echo "======================================"


      # ============================================================
      # TEST RELAY BEFORE KAGGLE
      # ============================================================

      - name: Test Relay
        shell: bash
        run: |
          set -euxo pipefail

          echo "Testing local relay..."

          nc -zv \
            127.0.0.1 \
            8765

          echo "Local relay is reachable."


          echo
          echo "Testing Cloudflare endpoint..."

          curl \
            -I \
            --max-time 20 \
            "$TUNNEL_URL" \
            || true


      # ============================================================
      # CREATE KAGGLE WORKERS
      # ============================================================

      - name: Create Kaggle GPU workers
        shell: bash
        run: |

          set -euxo pipefail

          rm -rf kaggle_workers

          mkdir -p kaggle_workers


          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            mkdir -p "$DIR"


            cat > "$DIR/worker.py" <<PY

          import asyncio
          import json
          import os
          import time
          import traceback
          import uuid

          import websockets


          WSS_URL = os.environ["WSS_URL"]

          WORKER_ID = (
              "kaggle-worker-"
              + str(${WORKER_INDEX})
              + "-"
              + uuid.uuid4().hex[:8]
          )


          async def benchmark(size, repeats):

              import numpy as np

              from numba import cuda


              if not cuda.is_available():

                  raise RuntimeError(
                      "CUDA is not available"
                  )


              @cuda.jit
              def matmul_kernel(A, B, C):

                  row, col = cuda.grid(2)

                  if (
                      row < C.shape[0]
                      and col < C.shape[1]
                  ):

                      total = 0.0

                      for k in range(
                          A.shape[1]
                      ):

                          total += (
                              A[row, k]
                              * B[k, col]
                          )

                      C[row, col] = total


              A = cuda.to_device(
                  np.ones(
                      (size, size),
                      dtype=np.float32
                  )
              )


              B = cuda.to_device(
                  np.ones(
                      (size, size),
                      dtype=np.float32
                  )
              )


              C = cuda.device_array(
                  (size, size),
                  dtype=np.float32
              )


              threads = (
                  16,
                  16
              )


              blocks = (
                  (size + 15) // 16,
                  (size + 15) // 16
              )


              # JIT warmup

              matmul_kernel[
                  blocks,
                  threads
              ](
                  A,
                  B,
                  C
              )

              cuda.synchronize()


              start = time.perf_counter()


              for _ in range(repeats):

                  matmul_kernel[
                      blocks,
                      threads
                  ](
                      A,
                      B,
                      C
                  )


              cuda.synchronize()


              elapsed = (
                  time.perf_counter()
                  - start
              )


              return {
                  "gpu": str(
                      cuda.get_current_device().name
                  ),

                  "size": size,

                  "repeats": repeats,

                  "compute_ms":
                      elapsed * 1000,

                  "backend":
                      "numba_cuda"
              }


          async def run():

              print(
                  "================================"
              )

              print(
                  "GPU WORKER:",
                  WORKER_ID
              )

              print(
                  "WSS:",
                  WSS_URL
              )

              print(
                  "================================"
              )


              while True:

                  try:

                      async with websockets.connect(
                          WSS_URL,

                          ping_interval=20,

                          ping_timeout=60,

                          max_size=64 * 1024 * 1024
                      ) as ws:

                          print(
                              "CONNECTED"
                          )


                          await ws.send(
                              json.dumps({
                                  "type":
                                      "ready",

                                  "worker_id":
                                      WORKER_ID,

                                  "worker_utc":
                                      time.time()
                              })
                          )


                          async for raw in ws:

                              msg = json.loads(
                                  raw
                              )


                              msg_type = msg.get(
                                  "type"
                              )


                              if msg_type == "worker_accepted":

                                  print(
                                      "WORKER ACCEPTED"
                                  )

                                  continue


                              if msg_type == "heartbeat":

                                  await ws.send(
                                      json.dumps({
                                          "type":
                                              "heartbeat_ack"
                                      })
                                  )

                                  continue


                              if msg_type != "gpu_job":

                                  continue


                              job_id = msg[
                                  "job_id"
                              ]


                              size = int(
                                  msg.get(
                                      "size",
                                      1024
                                  )
                              )


                              repeats = int(
                                  msg.get(
                                      "repeats",
                                      1
                                  )
                              )


                              started = (
                                  time.perf_counter()
                              )


                              try:

                                  result = (
                                      await benchmark(
                                          size,
                                          repeats
                                      )
                                  )


                                  response = {

                                      "type":
                                          "gpu_result",

                                      "job_id":
                                          job_id,

                                      "worker_id":
                                          WORKER_ID,

                                      "ok":
                                          True,

                                      "compute_wall_ms":
                                          (
                                              time.perf_counter()
                                              - started
                                          ) * 1000,

                                      "benchmark":
                                          result
                                  }


                              except Exception as e:

                                  response = {

                                      "type":
                                          "gpu_result",

                                      "job_id":
                                          job_id,

                                      "worker_id":
                                          WORKER_ID,

                                      "ok":
                                          False,

                                      "error":
                                          repr(e),

                                      "traceback":
                                          traceback.format_exc()
                                  }


                              await ws.send(
                                  json.dumps(
                                      response
                                  )
                              )


                              print(
                                  "RESULT:",
                                  json.dumps(
                                      response
                                  )
                              )


                  except Exception as e:

                      print(
                          "CONNECTION ERROR:",
                          repr(e)
                      )


                      print(
                          "RECONNECTING..."
                      )


                      await asyncio.sleep(
                          5
                      )


          if __name__ == "__main__":

              asyncio.run(run())

          PY


            cat > "$DIR/kernel-metadata.json" <<EOF

          {
            "id": "${KAGGLE_USERNAME}/gpu-gpu-worker-${WORKER_INDEX}",
            "title": "gpu-gpu-worker-${WORKER_INDEX}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }

          EOF

          done


      # ============================================================
      # PUSH WORKERS
      # ============================================================

      - name: Push Kaggle GPU workers
        shell: bash
        run: |

          set -euxo pipefail

          echo "====================================="
          echo "PUSHING $WORKER_COUNT KAGGLE WORKERS"
          echo "====================================="


          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            echo
            echo "Pushing worker $WORKER_INDEX"
            echo "Directory: $DIR"


            # IMPORTANT:
            # metadata ID and title are identical slugs.
            #
            kaggle kernels push \
              -p "$DIR"

          done


          echo
          echo "All Kaggle workers submitted."


      # ============================================================
      # WAIT FOR WORKERS
      # ============================================================

      - name: Wait for GPU workers
        shell: bash
        run: |

          set -euxo pipefail

          echo "====================================="
          echo "WAITING FOR GPU WORKERS"
          echo "====================================="


          FOUND=0


          for i in $(seq 1 90); do

            if [ -f relay_result.json ]; then

              FOUND="$(
                jq -r '.workers_alive' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"

            fi


            echo \
              "Attempt=$i workers_alive=$FOUND/$WORKER_COUNT"


            if [ "$FOUND" -ge 1 ]; then

              echo
              echo "At least one GPU worker connected."

              break

            fi


            sleep 5

          done


          if [ "$FOUND" -lt 1 ]; then

            echo
            echo "ERROR:"
            echo "No Kaggle GPU worker connected."

            echo
            echo "===== RELAY ====="

            cat relay.log || true

            echo
            echo "===== CLOUDFLARED ====="

            cat cloudflared.log || true

            echo
            echo "===== STATE ====="

            cat relay_result.json || true

            exit 1

          fi


      # ============================================================
      # WAIT FOR ALL JOBS
      # ============================================================

      - name: Wait for all GPU jobs
        shell: bash
        run: |

          set -euxo pipefail

          echo "======================================"
          echo "REAL-TIME GPU QUEUE"
          echo "======================================"

          echo "Workers: $WORKER_COUNT"
          echo "Jobs:    $JOB_COUNT"


          COMPLETED=0


          for i in $(seq 1 240); do

            if [ -f relay_result.json ]; then

              COMPLETED="$(
                jq -r '.jobs_completed' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"


              SENT="$(
                jq -r '.jobs_sent' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"


              WORKERS="$(
                jq -r '.workers_alive' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"


              RETRIES="$(
                jq -r '.jobs_retried' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"


              FAILED="$(
                jq -r '.jobs_failed' \
                  relay_result.json \
                  2>/dev/null ||
                  echo 0
              )"


              echo \
                "[$i] workers=$WORKERS sent=$SENT completed=$COMPLETED/$JOB_COUNT retries=$RETRIES failed=$FAILED"


              if [ "$COMPLETED" -ge "$JOB_COUNT" ]; then

                echo
                echo "======================================"
                echo "ALL GPU JOBS COMPLETED"
                echo "======================================"

                break

              fi

            fi


            sleep 5

          done


          FINAL="$(
            jq -r '.jobs_completed' \
              relay_result.json \
              2>/dev/null ||
              echo 0
          )


          if [ "$FINAL" -lt "$JOB_COUNT" ]; then

            echo
            echo "GPU QUEUE DID NOT FINISH."

            echo
            echo "===== RELAY RESULT ====="

            cat relay_result.json || true

            exit 1

          fi


      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Final report
        if: always()
        shell: bash
        run: |

          set +e

          echo
          echo "======================================"
          echo "FINAL GPU API REPORT"
          echo "======================================"


          if [ -f relay_result.json ]; then

            jq '{
              jobs_total,
              jobs_sent,
              jobs_completed,
              jobs_failed,
              jobs_retried,
              workers_alive,
              connections_total,
              messages,
              done
            }' relay_result.json

          fi


          echo
          echo "======================================"
          echo "RELAY LOG"
          echo "======================================"

          cat relay.log || true


          echo
          echo "======================================"
          echo "CLOUDFLARED LOG"
          echo "======================================"

          cat cloudflared.log || true


          echo
          echo "======================================"
          echo "TUNNEL"
          echo "======================================"

          cat tunnel_url.txt || true

          cat wss_url.txt || true


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-realtime-v7
          path: |
            relay_result.json
            relay.log
            cloudflared.log
            tunnel_url.txt
            wss_url.txt
            relay.pid
            cloudflared.pid
          if-no-files-found: warn
          retention-days: 7
