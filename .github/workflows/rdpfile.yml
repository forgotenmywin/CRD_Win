name: Kaggle GPU Worker - Real-Time GPU Job Queue

"on":
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      # تعداد Workerهای همزمان
      # هر Worker = یک Kaggle Kernel/GPU
      WORKER_COUNT: "2"

      # احراز هویت
      GPU_WORKER_TOKEN: ${{ secrets.GPU_WORKER_TOKEN }}
      GPU_CLIENT_TOKEN: ${{ secrets.GPU_CLIENT_TOKEN }}

      # صف
      MAX_QUEUE: "500"

      # زمان‌ها
      WORKER_DEAD_SECONDS: "45"
      JOB_TIMEOUT_SECONDS: "120"

      # فشار تست
      STRESS_JOBS: "100"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip

          python3 -m pip install --upgrade pip

          python3 -m pip install --upgrade \
            kaggle \
            websocket-client \
            websockets

          echo "Dependencies installed."


      # ============================================================
      # KAGGLE AUTH
      # ============================================================

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.kaggle"

          printf '%s' "$KAGGLE_API_TOKEN" \
            > "$HOME/.kaggle/access_token"

          chmod 600 "$HOME/.kaggle/access_token"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle --version


      # ============================================================
      # VERIFY KAGGLE
      # ============================================================

      - name: Verify Kaggle
        shell: bash
        run: |
          set -euxo pipefail

          kaggle kernels list \
            --user "$KAGGLE_USERNAME" \
            --page-size 1


      # ============================================================
      # CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              "https://api.github.com/repos/cloudflare/cloudflared/releases/latest"
          )"

          CLOUDFLARED_TAG="$(
            printf '%s' "$RELEASE_JSON" |
            jq -r '.tag_name'
          )"

          test -n "$CLOUDFLARED_TAG"
          test "$CLOUDFLARED_TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared

          sudo install \
            -m 0755 \
            cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      # ============================================================
      # CREATE REAL-TIME RELAY
      # ============================================================

      - name: Create real-time GPU relay
        shell: bash
        run: |
          set -euxo pipefail

          cat > relay.py <<'PYRELAY'

          import asyncio
          import base64
          import json
          import os
          import secrets
          import time
          import uuid

          from collections import deque
          from datetime import datetime, timezone

          import websockets


          HOST = "127.0.0.1"
          PORT = 8765

          WORKER_TOKEN = os.environ["GPU_WORKER_TOKEN"]
          CLIENT_TOKEN = os.environ["GPU_CLIENT_TOKEN"]

          MAX_QUEUE = int(
              os.environ.get(
                  "MAX_QUEUE",
                  "500"
              )
          )

          WORKER_DEAD_SECONDS = float(
              os.environ.get(
                  "WORKER_DEAD_SECONDS",
                  "45"
              )
          )

          JOB_TIMEOUT_SECONDS = float(
              os.environ.get(
                  "JOB_TIMEOUT_SECONDS",
                  "120"
              )
          )


          # ==========================================================
          # GLOBAL STATE
          # ==========================================================

          workers = {}

          clients = {}

          jobs = {}

          queue = deque()

          state = {
              "started_utc":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "connections": 0,

              "workers_total": 0,

              "workers_alive": 0,

              "clients_total": 0,

              "jobs_submitted": 0,

              "jobs_completed": 0,

              "jobs_failed": 0,

              "jobs_retried": 0,

              "queue_size": 0,

              "events": []
          }


          STATE_FILE = "relay_result.json"


          # ==========================================================
          # TIME
          # ==========================================================

          def now():

              return datetime.now(
                  timezone.utc
              ).isoformat()


          def mono():

              return time.monotonic()


          # ==========================================================
          # SAVE
          # ==========================================================

          def save():

              snapshot = dict(state)

              snapshot["workers"] = {
                  worker_id: {
                      "worker_id":
                          worker_id,

                      "alive":
                          info["alive"],

                      "busy":
                          info["busy"],

                      "last_seen":
                          info["last_seen"],

                      "jobs_completed":
                          info["jobs_completed"],

                      "gpu_name":
                          info.get(
                              "gpu_name"
                          )
                  }

                  for worker_id, info
                  in workers.items()
              }

              snapshot["queue_size"] = len(queue)

              snapshot["jobs"] = {
                  job_id: {
                      "job_id":
                          job_id,

                      "status":
                          job["status"],

                      "worker_id":
                          job.get(
                              "worker_id"
                          ),

                      "attempt":
                          job["attempt"],

                      "created_utc":
                          job["created_utc"]
                  }

                  for job_id, job
                  in jobs.items()
              }

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      snapshot,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          # ==========================================================
          # EVENT
          # ==========================================================

          def record(
              kind,
              **data
          ):

              state["events"].append({

                  "kind":
                      kind,

                  "at_utc":
                      now(),

                  **data

              })

              if len(
                  state["events"]
              ) > 1000:

                  state["events"] = (
                      state["events"][-1000:]
                  )

              save()


          # ==========================================================
          # JSON SEND
          # ==========================================================

          async def send_json(
              ws,
              data
          ):

              await ws.send(
                  json.dumps(
                      data,
                      separators=(
                          ",",
                          ":"
                      )
                  )
              )


          # ==========================================================
          # AUTH
          # ==========================================================

          def check_token(
              supplied,
              expected
          ):

              if not supplied:
                  return False

              if not expected:
                  return False

              return secrets.compare_digest(
                  str(supplied),
                  str(expected)
              )


          # ==========================================================
          # CREATE JOB
          # ==========================================================

          def create_job(
              request
          ):

              job_id = str(
                  uuid.uuid4()
              )

              job = {

                  "job_id":
                      job_id,

                  "status":
                      "queued",

                  "attempt":
                      0,

                  "max_retries":
                      int(
                          request.get(
                              "max_retries",
                              3
                          )
                      ),

                  "created_utc":
                      now(),

                  "created_mono":
                      mono(),

                  "queued_mono":
                      mono(),

                  "worker_id":
                      None,

                  "request":
                      request,

                  "client_id":
                      request.get(
                          "client_id"
                      ),

                  "result":
                      None

              }

              jobs[job_id] = job

              queue.append(
                  job_id
              )

              state[
                  "jobs_submitted"
              ] += 1

              record(
                  "job_queued",
                  job_id=job_id
              )

              return job


          # ==========================================================
          # FIND FREE WORKER
          # ==========================================================

          def get_free_worker():

              for worker_id, info in workers.items():

                  if (
                      info["alive"]
                      and not info["busy"]
                      and info["ws"]
                  ):

                      return (
                          worker_id,
                          info
                      )

              return (
                  None,
                  None
              )


          # ==========================================================
          # DISPATCH
          # ==========================================================

          async def dispatch_jobs():

              while queue:

                  worker_id, worker = (
                      get_free_worker()
                  )

                  if worker is None:
                      return

                  job_id = queue.popleft()

                  if job_id not in jobs:
                      continue

                  job = jobs[job_id]

                  if (
                      job["status"]
                      != "queued"
                  ):
                      continue

                  job["status"] = "running"

                  job["attempt"] += 1

                  job["worker_id"] = worker_id

                  job["assigned_mono"] = mono()

                  worker["busy"] = True

                  worker[
                      "current_job"
                  ] = job_id

                  request = dict(
                      job["request"]
                  )

                  request["type"] = "gpu_job"

                  request[
                      "job_id"
                  ] = job_id

                  request[
                      "attempt"
                  ] = job["attempt"]

                  request[
                      "relay_dispatch_utc"
                  ] = now()

                  request[
                      "relay_dispatch_mono"
                  ] = mono()

                  try:

                      await send_json(
                          worker["ws"],
                          request
                      )

                      record(
                          "job_sent",
                          job_id=job_id,
                          worker_id=worker_id,
                          attempt=job["attempt"]
                      )

                  except Exception as e:

                      worker["busy"] = False

                      worker[
                          "current_job"
                      ] = None

                      job["status"] = "queued"

                      job["worker_id"] = None

                      queue.appendleft(
                          job_id
                      )

                      record(
                          "dispatch_error",
                          job_id=job_id,
                          worker_id=worker_id,
                          error=repr(e)
                      )

                      return


          # ==========================================================
          # COMPLETE JOB
          # ==========================================================

          async def complete_job(
              worker_id,
              msg
          ):

              job_id = msg.get(
                  "job_id"
              )

              if not job_id:
                  return

              job = jobs.get(
                  job_id
              )

              if not job:
                  return

              if (
                  job["status"]
                  == "completed"
              ):
                  return

              if (
                  job["status"]
                  == "failed"
              ):
                  return

              worker = workers.get(
                  worker_id
              )

              received_mono = mono()

              job["status"] = (
                  "completed"
              )

              job["result"] = msg

              job[
                  "completed_utc"
              ] = now()

              job[
                  "completed_mono"
              ] = received_mono

              network_worker_to_relay = (
                  (
                      received_mono
                      -
                      msg.get(
                          "worker_send_mono",
                          received_mono
                      )
                  )
                  * 1000
              )

              total_ms = (
                  (
                      received_mono
                      -
                      job["created_mono"]
                  )
                  * 1000
              )

              queue_ms = (
                  (
                      job["assigned_mono"]
                      -
                      job["created_mono"]
                  )
                  * 1000
              )

              gpu_ms = float(
                  msg.get(
                      "gpu_compute_ms",
                      0
                  )
              )

              job[
                  "latency"
              ] = {

                  "queue_ms":
                      queue_ms,

                  "gpu_compute_ms":
                      gpu_ms,

                  "worker_to_relay_ms":
                      network_worker_to_relay,

                  "total_relay_ms":
                      total_ms

              }

              state[
                  "jobs_completed"
              ] += 1

              if worker:

                  worker["busy"] = False

                  worker[
                      "current_job"
                  ] = None

                  worker[
                      "jobs_completed"
                  ] += 1

                  worker[
                      "last_seen"
                  ] = mono()

              record(
                  "job_completed",
                  job_id=job_id,
                  worker_id=worker_id,
                  latency=job["latency"]
              )

              client_id = job.get(
                  "client_id"
              )

              client = clients.get(
                  client_id
              )

              if client:

                  try:

                      await send_json(
                          client,
                          {
                              "type":
                                  "job_result",

                              "job_id":
                                  job_id,

                              "result":
                                  msg,

                              "latency":
                                  job[
                                      "latency"
                                  ]
                          }
                      )

                  except Exception:
                      pass

              await dispatch_jobs()


          # ==========================================================
          # FAIL / RETRY
          # ==========================================================

          async def retry_job(
              job_id,
              reason
          ):

              job = jobs.get(
                  job_id
              )

              if not job:
                  return

              if (
                  job["status"]
                  == "completed"
              ):
                  return

              if (
                  job["attempt"]
                  < job["max_retries"]
              ):

                  job["status"] = (
                      "queued"
                  )

                  job["worker_id"] = None

                  job[
                      "retry_reason"
                  ] = reason

                  queue.appendleft(
                      job_id
                  )

                  state[
                      "jobs_retried"
                  ] += 1

                  record(
                      "job_retry",
                      job_id=job_id,
                      reason=reason,
                      next_attempt=(
                          job["attempt"] + 1
                      )
                  )

              else:

                  job["status"] = (
                      "failed"
                  )

                  job[
                      "failed_utc"
                  ] = now()

                  job[
                      "failure_reason"
                  ] = reason

                  state[
                      "jobs_failed"
                  ] += 1

                  record(
                      "job_failed",
                      job_id=job_id,
                      reason=reason
                  )

                  client_id = job.get(
                      "client_id"
                  )

                  client = clients.get(
                      client_id
                  )

                  if client:

                      try:

                          await send_json(
                              client,
                              {
                                  "type":
                                      "job_failed",

                                  "job_id":
                                      job_id,

                                  "reason":
                                      reason
                              }
                          )

                      except Exception:
                          pass


          # ==========================================================
          # WORKER DEAD DETECTOR
          # ==========================================================

          async def worker_watchdog():

              while True:

                  await asyncio.sleep(
                      5
                  )

                  current = mono()

                  for worker_id, worker in list(
                      workers.items()
                  ):

                      if not worker[
                          "alive"
                      ]:

                          continue

                      age = (
                          current
                          -
                          worker[
                              "last_seen"
                          ]
                      )

                      if (
                          age
                          >
                          WORKER_DEAD_SECONDS
                      ):

                          worker[
                              "alive"
                          ] = False

                          record(
                              "worker_dead",
                              worker_id=worker_id,
                              age_seconds=age
                          )

                          job_id = worker.get(
                              "current_job"
                          )

                          worker[
                              "busy"
                          ] = False

                          worker[
                              "current_job"
                          ] = None

                          if job_id:

                              await retry_job(
                                  job_id,
                                  "worker_dead"
                              )

                  await dispatch_jobs()


          # ==========================================================
          # JOB TIMEOUT WATCHDOG
          # ==========================================================

          async def job_watchdog():

              while True:

                  await asyncio.sleep(
                      2
                  )

                  current = mono()

                  for job_id, job in list(
                      jobs.items()
                  ):

                      if (
                          job["status"]
                          != "running"
                      ):

                          continue

                      started = job.get(
                          "assigned_mono"
                      )

                      if not started:
                          continue

                      age = (
                          current
                          -
                          started
                      )

                      if (
                          age
                          >
                          JOB_TIMEOUT_SECONDS
                      ):

                          worker_id = (
                              job.get(
                                  "worker_id"
                              )
                          )

                          worker = workers.get(
                              worker_id
                          )

                          if worker:

                              worker[
                                  "busy"
                              ] = False

                              worker[
                                  "current_job"
                              ] = None

                          await retry_job(
                              job_id,
                              "job_timeout"
                          )

                  await dispatch_jobs()


          # ==========================================================
          # WORKER CONNECTION
          # ==========================================================

          async def worker_handler(
              ws,
              worker_id
          ):

              workers[
                  worker_id
              ] = {

                  "ws":
                      ws,

                  "worker_id":
                      worker_id,

                  "alive":
                      True,

                  "busy":
                      False,

                  "current_job":
                      None,

                  "last_seen":
                      mono(),

                  "jobs_completed":
                      0,

                  "gpu_name":
                      None

              }

              state[
                  "workers_total"
              ] = len(
                  workers
              )

              record(
                  "worker_connected",
                  worker_id=worker_id
              )

              try:

                  await send_json(
                      ws,
                      {
                          "type":
                              "worker_accepted",

                          "worker_id":
                              worker_id
                      }
                  )

                  async for raw in ws:

                      info = workers.get(
                          worker_id
                      )

                      if not info:
                          break

                      info[
                          "last_seen"
                      ] = mono()

                      try:

                          msg = json.loads(
                              raw
                          )

                      except Exception:

                          continue

                      msg_type = msg.get(
                          "type"
                      )

                      # ------------------------------------------
                      # HELLO
                      # ------------------------------------------

                      if msg_type == "worker_info":

                          info[
                              "gpu_name"
                          ] = msg.get(
                              "gpu_name"
                          )

                          record(
                              "worker_info",
                              worker_id=worker_id,
                              gpu_name=msg.get(
                                  "gpu_name"
                              )
                          )

                      # ------------------------------------------
                      # HEARTBEAT
                      # ------------------------------------------

                      elif msg_type == "heartbeat":

                          await send_json(
                              ws,
                              {
                                  "type":
                                      "heartbeat_ack",

                                  "server_mono":
                                      mono(),

                                  "server_utc":
                                      now()
                              }
                          )

                      # ------------------------------------------
                      # RESULT
                      # ------------------------------------------

                      elif msg_type == "gpu_result":

                          await complete_job(
                              worker_id,
                              msg
                          )

              except Exception as e:

                  record(
                      "worker_exception",
                      worker_id=worker_id,
                      error=repr(e)
                  )

              finally:

                  info = workers.get(
                      worker_id
                  )

                  if info:

                      info[
                          "alive"
                      ] = False

                      job_id = info.get(
                          "current_job"
                      )

                      info[
                          "busy"
                      ] = False

                      info[
                          "current_job"
                      ] = None

                      if job_id:

                          await retry_job(
                              job_id,
                              "worker_connection_lost"
                          )

                  record(
                      "worker_disconnected",
                      worker_id=worker_id
                  )

                  await dispatch_jobs()


          # ==========================================================
          # CLIENT CONNECTION
          # ==========================================================

          async def client_handler(
              ws,
              client_id
          ):

              clients[
                  client_id
              ] = ws

              state[
                  "clients_total"
              ] = len(
                  clients
              )

              record(
                  "client_connected",
                  client_id=client_id
              )

              await send_json(
                  ws,
                  {
                      "type":
                          "client_accepted",

                      "client_id":
                          client_id
                  }
              )

              try:

                  async for raw in ws:

                      try:

                          msg = json.loads(
                              raw
                          )

                      except Exception:

                          await send_json(
                              ws,
                              {
                                  "type":
                                      "error",

                                  "error":
                                      "invalid_json"
                              }
                          )

                          continue

                      msg_type = msg.get(
                          "type"
                      )

                      # ------------------------------------------
                      # SUBMIT JOB
                      # ------------------------------------------

                      if msg_type == "submit":

                          if (
                              len(queue)
                              >=
                              MAX_QUEUE
                          ):

                              await send_json(
                                  ws,
                                  {
                                      "type":
                                          "error",

                                      "error":
                                          "queue_full"
                                  }
                              )

                              continue

                          msg[
                              "client_id"
                          ] = client_id

                          job = create_job(
                              msg
                          )

                          await send_json(
                              ws,
                              {
                                  "type":
                                      "accepted",

                                  "job_id":
                                      job[
                                          "job_id"
                                      ],

                                  "queue_position":
                                      len(
                                          queue
                                      )
                              }
                          )

                          await dispatch_jobs()

                      # ------------------------------------------
                      # STATUS
                      # ------------------------------------------

                      elif msg_type == "status":

                          await send_json(
                              ws,
                              {
                                  "type":
                                      "status",

                                  "queue":
                                      len(queue),

                                  "workers":
                                      {
                                          worker_id:
                                              {
                                                  "alive":
                                                      info[
                                                          "alive"
                                                      ],

                                                  "busy":
                                                      info[
                                                          "busy"
                                                      ],

                                                  "gpu":
                                                      info.get(
                                                          "gpu_name"
                                                      )
                                              }

                                          for
                                          worker_id,
                                          info
                                          in workers.items()
                                      },

                                  "jobs":
                                      {
                                          "submitted":
                                              state[
                                                  "jobs_submitted"
                                              ],

                                          "completed":
                                              state[
                                                  "jobs_completed"
                                              ],

                                          "failed":
                                              state[
                                                  "jobs_failed"
                                              ],

                                          "retried":
                                              state[
                                                  "jobs_retried"
                                              ]
                                      }
                              }
                          )

                      # ------------------------------------------
                      # JOB STATUS
                      # ------------------------------------------

                      elif msg_type == "job_status":

                          job_id = msg.get(
                              "job_id"
                          )

                          job = jobs.get(
                              job_id
                          )

                          if not job:

                              await send_json(
                                  ws,
                                  {
                                      "type":
                                          "error",

                                      "error":
                                          "job_not_found"
                                  }
                              )

                          else:

                              await send_json(
                                  ws,
                                  {
                                      "type":
                                          "job_status",

                                      "job_id":
                                          job_id,

                                      "status":
                                          job[
                                              "status"
                                          ],

                                      "attempt":
                                          job[
                                              "attempt"
                                          ],

                                      "worker_id":
                                          job.get(
                                              "worker_id"
                                          ),

                                      "result":
                                          job.get(
                                              "result"
                                          ),

                                      "latency":
                                          job.get(
                                              "latency"
                                          )
                                  }
                              )

                      # ------------------------------------------
                      # PING
                      # ------------------------------------------

                      elif msg_type == "ping":

                          await send_json(
                              ws,
                              {
                                  "type":
                                      "pong",

                                  "client_mono":
                                      msg.get(
                                          "client_mono"
                                      ),

                                  "relay_mono":
                                      mono(),

                                  "relay_utc":
                                      now()
                              }
                          )

              except Exception as e:

                  record(
                      "client_exception",
                      client_id=client_id,
                      error=repr(e)
                  )

              finally:

                  clients.pop(
                      client_id,
                      None
                  )

                  record(
                      "client_disconnected",
                      client_id=client_id
                  )


          # ==========================================================
          # MAIN ROUTER
          # ==========================================================

          async def handler(
              ws
          ):

              state[
                  "connections"
              ] += 1

              try:

                  raw = await asyncio.wait_for(
                      ws.recv(),
                      timeout=30
                  )

                  msg = json.loads(
                      raw
                  )

              except Exception:

                  await ws.close()

                  return

              if msg.get(
                  "type"
              ) != "auth":

                  await send_json(
                      ws,
                      {
                          "type":
                              "error",

                          "error":
                              "authentication_required"
                      }
                  )

                  await ws.close()

                  return

              role = msg.get(
                  "role"
              )

              token = msg.get(
                  "token"
              )

              # ======================================================
              # WORKER
              # ======================================================

              if role == "worker":

                  if not check_token(
                      token,
                      WORKER_TOKEN
                  ):

                      await send_json(
                          ws,
                          {
                              "type":
                                  "error",

                              "error":
                                  "invalid_worker_token"
                          }
                      )

                      await ws.close()

                      return

                  worker_id = msg.get(
                      "worker_id"
                  )

                  if not worker_id:

                      await ws.close()

                      return

                  await worker_handler(
                      ws,
                      str(worker_id)
                  )

                  return

              # ======================================================
              # CLIENT
              # ======================================================

              if role == "client":

                  if not check_token(
                      token,
                      CLIENT_TOKEN
                  ):

                      await send_json(
                          ws,
                          {
                              "type":
                                  "error",

                              "error":
                                  "invalid_client_token"
                          }
                      )

                      await ws.close()

                      return

                  client_id = str(
                      uuid.uuid4()
                  )

                  await client_handler(
                      ws,
                      client_id
                  )

                  return

              await ws.close()


          # ==========================================================
          # MAIN
          # ==========================================================

          async def main():

              print(
                  "=============================================="
              )

              print(
                  "REAL-TIME GPU JOB RELAY"
              )

              print(
                  "=============================================="
              )

              print(
                  f"MAX QUEUE: {MAX_QUEUE}"
              )

              print(
                  f"WORKER DEAD: {WORKER_DEAD_SECONDS}s"
              )

              print(
                  f"JOB TIMEOUT: {JOB_TIMEOUT_SECONDS}s"
              )

              save()

              asyncio.create_task(
                  worker_watchdog()
              )

              asyncio.create_task(
                  job_watchdog()
              )

              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,

                  ping_interval=20,

                  ping_timeout=60,

                  max_size=
                      100 * 1024 * 1024
              ):

                  print(
                      f"Listening on ws://{HOST}:{PORT}"
                  )

                  while True:

                      await asyncio.sleep(
                          5
                      )

                      state[
                          "workers_alive"
                      ] = sum(
                          1
                          for info
                          in workers.values()
                          if info["alive"]
                      )

                      save()


          if __name__ == "__main__":

              asyncio.run(
                  main()
              )

          PYRELAY


      # ============================================================
