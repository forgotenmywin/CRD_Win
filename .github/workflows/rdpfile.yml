      # ============================================================
      # REAL-TIME STRESS CLIENT
      # ============================================================

      - name: Create stress client
        shell: bash
        run: |
          set -euxo pipefail

          cat > stress_client.py <<'PYCLIENT'

          import asyncio
          import base64
          import json
          import os
          import statistics
          import time
          import uuid

          import websockets


          WSS_URL = os.environ["WSS_URL"]

          CLIENT_TOKEN = os.environ[
              "GPU_CLIENT_TOKEN"
          ]

          COUNT = int(
              os.environ.get(
                  "STRESS_JOBS",
                  "100"
              )
          )


          async def main():

              print(
                  "=============================================="
              )

              print(
                  "GPU API STRESS TEST"
              )

              print(
                  "JOBS:",
                  COUNT
              )

              print(
                  "=============================================="
              )


              async with websockets.connect(
                  WSS_URL,
                  max_size=
                      100 * 1024 * 1024
              ) as ws:

                  await ws.send(
                      json.dumps({
                          "type":
                              "auth",

                          "role":
                              "client",

                          "token":
                              CLIENT_TOKEN
                      })
                  )


                  accepted = await ws.recv()

                  print(
                      "AUTH:",
                      accepted
                  )


                  pending = {}

                  completed = 0

                  latencies = []


                  # ==================================================
                  # SUBMIT JOBS
                  # ==================================================

                  for i in range(
                      COUNT
                  ):

                      client_job_id = str(
                          uuid.uuid4()
                      )

                      # ورودی نسبتاً بزرگ
                      # 1,000,000 float32 ≈ 4 MB
                      n = 1_000_000

                      input_a = (
                          base64.b64encode(
                              (
                                  b""
                                  +
                                  bytes(
                                      n * 4
                                  )
                              )
                          ).decode()
                      )


                      # برای اینکه تست فشار
                      # بیش از حد بزرگ نشود،
                      # ورودی واقعی را برای هر job
                      # فقط در صورت نیاز استفاده کن.
                      #
                      # اینجا vector_add بدون
                      # input_b استفاده می‌شود
                      # تا حجم تست کنترل شود.

                      request = {

                          "type":
                              "submit",

                          "client_job_id":
                              client_job_id,

                          "operation":
                              "vector_add",

                          "n":
                              1024 * 1024,

                          "repeats":
                              5,

                          "max_retries":
                              3

                      }


                      sent = time.monotonic()

                      await ws.send(
                          json.dumps(
                              request
                          )
                      )

                      pending[
                          client_job_id
                      ] = sent


                  # ==================================================
                  # RECEIVE
                  # ==================================================

                  deadline = (
                      time.monotonic()
                      +
                      600
                  )


                  while (
                      completed < COUNT
                      and
                      time.monotonic()
                      < deadline
                  ):

                      timeout = max(
                          1,
                          deadline
                          -
                          time.monotonic()
                      )

                      try:

                          raw = await asyncio.wait_for(
                              ws.recv(),
                              timeout=timeout
                          )

                      except asyncio.TimeoutError:

                          break


                      msg = json.loads(
                          raw
                      )


                      if msg.get(
                          "type"
                      ) == "job_result":

                          completed += 1

                          latency = msg.get(
                              "latency",
                              {}
                          )

                          total = latency.get(
                              "total_relay_ms"
                          )

                          if total is not None:

                              latencies.append(
                                  float(total)
                              )

                          if completed % 10 == 0:

                              print(
                                  f"Completed {completed}/{COUNT}"
                              )


                  print()
                  print(
                      "=============================================="
                  )

                  print(
                      "STRESS TEST RESULT"
                  )

                  print(
                      "=============================================="
                  )

                  print(
                      "Submitted:",
                      COUNT
                  )

                  print(
                      "Completed:",
                      completed
                  )

                  print(
                      "Failed:",
                      COUNT - completed
                  )


                  if latencies:

                      print(
                          "Latency min:",
                          min(latencies),
                          "ms"
                      )

                      print(
                          "Latency avg:",
                          statistics.mean(
                              latencies
                          ),
                          "ms"
                      )

                      print(
                          "Latency max:",
                          max(latencies),
                          "ms"
                      )

                      if len(
                          latencies
                      ) > 1:

                          print(
                              "Latency p50:",
                              statistics.median(
                                  latencies
                              ),
                              "ms"
                          )


                  print(
                      "=============================================="
                  )


          if __name__ == "__main__":

              asyncio.run(
                  main()
              )

          PYCLIENT


      # ============================================================
      # RUN STRESS TEST
      # ============================================================

