name: Kaggle GPU Worker - Real-Time GPU Queue v7

"on":
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      WORKER_COUNT: "2"
      TOTAL_JOBS: "100"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip \
            unzip

          python3 -m pip install --upgrade pip

          python3 -m pip install --upgrade \
            kaggle \
            websockets \
            websocket-client \
            numpy


      # ============================================================
      # KAGGLE AUTH
      # ============================================================

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.kaggle"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"

          kaggle --version

          kaggle kernels list \
            --user "$KAGGLE_USERNAME" \
            --page-size 1


      # ============================================================
      # CREATE AUTH TOKEN
      # ============================================================

      - name: Create internal worker authentication token
        shell: bash
        run: |
          set -euxo pipefail

          AUTH_TOKEN="$(
            python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"

          echo "WORKER_AUTH_TOKEN=$AUTH_TOKEN" >> "$GITHUB_ENV"

          echo "Internal worker authentication token generated."


      # ============================================================
      # INSTALL CLOUDFLARED
      # ============================================================

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest
          )"

          TAG="$(
            printf '%s' "$RELEASE_JSON" |
            jq -r '.tag_name'
          )"

          test -n "$TAG"
          test "$TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared

          sudo install \
            -m 0755 \
            cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version


      # ============================================================
      # CREATE RELAY
      # ============================================================

      - name: Create real-time relay
        shell: bash
        run: |

          cat > relay.py <<'PY'
          import asyncio
          import json
          import os
          import time
          import uuid
          from collections import deque
          from datetime import datetime, timezone


          HOST = "127.0.0.1"
          PORT = 8765

          AUTH_TOKEN = os.environ["WORKER_AUTH_TOKEN"]

          TOTAL_JOBS = int(
              os.environ.get("TOTAL_JOBS", "100")
          )

          WORKER_TIMEOUT = 30
          JOB_TIMEOUT = 60

          STATE_FILE = "relay_result.json"


          # ============================================================
          # TIME
          # ============================================================

          def now():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def monotonic():
              return time.monotonic()


          # ============================================================
          # JOB GENERATION
          # ============================================================

          def create_jobs():

              jobs = []

              for i in range(1, TOTAL_JOBS + 1):

                  # Large input payload.
                  #
                  # Each job contains a requested input size.
                  #
                  # Worker creates the actual GPU input locally
                  # so the queue protocol itself remains lightweight.

                  jobs.append({
                      "job_id": i,

                      "type": "gpu_job",

                      "operation":
                          "matrix_multiply",

                      "matrix_size":
                          1024 if i % 4 == 0 else 512,

                      "repeats":
                          3 if i % 4 == 0 else 5,

                      "payload_bytes":
                          1024 * 1024 * 4,

                      "created_utc":
                          now()
                  })

              return jobs


          JOB_QUEUE = deque(
              create_jobs()
          )


          # ============================================================
          # STATE
          # ============================================================

          state = {

              "started_utc":
                  now(),

              "connections":
                  0,

              "workers_connected":
                  0,

              "workers_alive":
                  0,

              "jobs_total":
                  TOTAL_JOBS,

              "jobs_queued":
                  TOTAL_JOBS,

              "jobs_sent":
                  0,

              "jobs_completed":
                  0,

              "jobs_failed":
                  0,

              "jobs_retried":
                  0,

              "jobs_inflight":
                  0,

              "messages":
                  0,

              "done":
                  False,

              "events":
                  [],

              "job_results":
                  [],

              "workers":
                  {},

              "latency":
                  []
          }


          workers = {}

          inflight = {}

          completed_jobs = set()

          lock = asyncio.Lock()

          finished = asyncio.Event()


          # ============================================================
          # SAVE STATE
          # ============================================================

          def save():

              state["workers_alive"] = len(
                  workers
              )

              state["jobs_queued"] = len(
                  JOB_QUEUE
              )

              state["jobs_inflight"] = len(
                  inflight
              )

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          def record(
              kind,
              **data
          ):

              state["events"].append({

                  "kind":
                      kind,

                  "at_utc":
                      now(),

                  **data
              })

              if len(state["events"]) > 1000:

                  state["events"] = (
                      state["events"][-1000:]
                  )

              save()


          # ============================================================
          # WORKER SEND
          # ============================================================

          async def send_job(
              worker_id,
              worker
          ):

              async with lock:

                  if not JOB_QUEUE:

                      return False

                  if worker_id not in workers:

                      return False

                  job = JOB_QUEUE.popleft()

                  job_id = job["job_id"]

                  sent_mono = monotonic()

                  inflight[job_id] = {

                      "job":
                          job,

                      "worker_id":
                          worker_id,

                      "sent_mono":
                          sent_mono,

                      "attempt":
                          job.get(
                              "attempt",
                              0
                          ) + 1
                  }

                  state["jobs_sent"] += 1

                  job["attempt"] = (
                      inflight[job_id]["attempt"]
                  )

                  job["sent_utc"] = now()

                  try:

                      await worker["ws"].send(
                          json.dumps(job)
                      )

                  except Exception as e:

                      inflight.pop(
                          job_id,
                          None
                      )

                      JOB_QUEUE.appendleft(
                          job
                      )

                      record(
                          "send_error",
                          worker_id=worker_id,
                          job_id=job_id,
                          error=repr(e)
                      )

                      return False

                  record(
                      "job_sent",
                      worker_id=worker_id,
                      job_id=job_id,
                      attempt=job["attempt"]
                  )

                  return True


          # ============================================================
          # FILL WORKER
          # ============================================================

          async def fill_worker(
              worker_id
          ):

              while True:

                  async with lock:

                      worker = workers.get(
                          worker_id
                      )

                  if worker is None:

                      return

                  ok = await send_job(
                      worker_id,
                      worker
                  )

                  if not ok:

                      return


          # ============================================================
          # COMPLETE JOB
          # ============================================================

          async def complete_job(
              worker_id,
              msg
          ):

              job_id = msg.get(
                  "job_id"
              )

              if job_id is None:

                  return

              async with lock:

                  info = inflight.pop(
                      job_id,
                      None
                  )

                  if job_id in completed_jobs:

                      return

                  completed_jobs.add(
                      job_id
                  )

                  state[
                      "jobs_completed"
                  ] += 1

                  if info:

                      latency_ms = (
                          monotonic()
                          -
                          info["sent_mono"]
                      ) * 1000

                      state[
                          "latency"
                      ].append({

                          "job_id":
                              job_id,

                          "worker_id":
                              worker_id,

                          "relay_roundtrip_ms":
                              latency_ms
                      })

                  state[
                      "job_results"
                  ].append(msg)

              record(
                  "job_completed",
                  worker_id=worker_id,
                  job_id=job_id
              )

              if state[
                  "jobs_completed"
              ] >= TOTAL_JOBS:

                  state["done"] = True

                  record(
                      "all_jobs_completed",
                      total=TOTAL_JOBS
                  )

                  finished.set()

                  return

              await fill_worker(
                  worker_id
              )


          # ============================================================
          # REQUEUE DEAD WORKER JOBS
          # ============================================================

          async def remove_worker(
              worker_id,
              reason
          ):

              async with lock:

                  worker = workers.pop(
                      worker_id,
                      None
                  )

                  if worker is None:

                      return

                  dead_jobs = []

                  for job_id, info in list(
                      inflight.items()
                  ):

                      if (
                          info["worker_id"]
                          ==
                          worker_id
                      ):

                          dead_jobs.append(
                              job_id
                          )

                  for job_id in dead_jobs:

                      info = inflight.pop(
                          job_id
                      )

                      job = info["job"]

                      state[
                          "jobs_retried"
                      ] += 1

                      JOB_QUEUE.appendleft(
                          job
                      )

                      record(
                          "job_requeued",
                          worker_id=worker_id,
                          job_id=job_id,
                          reason=reason
                      )

              record(
                  "worker_dead",
                  worker_id=worker_id,
                  reason=reason
              )

              save()


          # ============================================================
          # WORKER HANDLER
          # ============================================================

          async def handler(ws):

              state["connections"] += 1

              worker_id = None

              record(
                  "connection",
                  remote=str(
                      ws.remote_address
                  )
              )

              try:

                  raw = await asyncio.wait_for(
                      ws.recv(),
                      timeout=30
                  )

                  msg = json.loads(raw)

                  if msg.get(
                      "type"
                  ) != "hello":

                      await ws.close()

                      return

                  if msg.get(
                      "auth"
                  ) != AUTH_TOKEN:

                      record(
                          "auth_failed",
                          remote=str(
                              ws.remote_address
                          )
                      )

                      await ws.close()

                      return

                  worker_id = msg.get(
                      "worker_id"
                  )

                  if not worker_id:

                      await ws.close()

                      return

                  async with lock:

                      workers[
                          worker_id
                      ] = {

                          "ws":
                              ws,

                          "connected_mono":
                              monotonic(),

                          "last_seen":
                              monotonic(),

                          "jobs":
                              0
                      }

                  state[
                      "workers_connected"
                  ] += 1

                  record(
                      "worker_ready",
                      worker_id=worker_id
                  )

                  await ws.send(
                      json.dumps({

                          "type":
                              "ready",

                          "worker_id":
                              worker_id,

                          "relay_utc":
                              now()

                      })
                  )

                  await fill_worker(
                      worker_id
                  )

                  async for raw in ws:

                      state[
                          "messages"
                      ] += 1

                      msg = json.loads(
                          raw
                      )

                      async with lock:

                          if worker_id in workers:

                              workers[
                                  worker_id
                              ][
                                  "last_seen"
                              ] = monotonic()

                      msg_type = msg.get(
                          "type"
                      )

                      if msg_type == "heartbeat":

                          await ws.send(
                              json.dumps({

                                  "type":
                                      "heartbeat_ack",

                                  "relay_utc":
                                      now()

                              })
                          )

                      elif msg_type == "gpu_result":

                          await complete_job(
                              worker_id,
                              msg
                          )

                      elif msg_type == "ping":

                          await ws.send(
                              json.dumps({

                                  "type":
                                      "pong",

                                  "id":
                                      msg.get(
                                          "id"
                                      ),

                                  "relay_utc":
                                      now()

                              })
                          )

              except Exception as e:

                  record(
                      "worker_handler_error",
                      worker_id=worker_id,
                      error=repr(e)
                  )

              finally:

                  if worker_id:

                      await remove_worker(
                          worker_id,
                          "connection_closed"
                      )


          # ============================================================
          # DEAD WORKER MONITOR
          # ============================================================

          async def worker_monitor():

              while not finished.is_set():

                  await asyncio.sleep(
                      5
                  )

                  now_mono = monotonic()

                  async with lock:

                      snapshot = list(
                          workers.items()
                      )

                  for (
                      worker_id,
                      worker
                  ) in snapshot:

                      if (
                          now_mono
                          -
                          worker["last_seen"]
                          >
                          WORKER_TIMEOUT
                      ):

                          try:

                              await worker[
                                  "ws"
                              ].close()

                          except Exception:

                              pass

                          await remove_worker(
                              worker_id,
                              "heartbeat_timeout"
                          )


          # ============================================================
          # HEARTBEAT SERVER
          # ============================================================

          async def heartbeat_loop():

              while not finished.is_set():

                  await asyncio.sleep(
                      10
                  )

                  async with lock:

                      snapshot = list(
                          workers.items()
                      )

                  for (
                      worker_id,
                      worker
                  ) in snapshot:

                      try:

                          await worker[
                              "ws"
                          ].send(
                              json.dumps({

                                  "type":
                                      "heartbeat",

                                  "relay_utc":
                                      now()

                              })
                          )

                      except Exception:

                          await remove_worker(
                              worker_id,
                              "heartbeat_send_failed"
                          )


          # ============================================================
          # MAIN
          # ============================================================

          async def main():

              save()

              print(
                  "================================================"
              )

              print(
                  "REAL-TIME GPU RELAY"
              )

              print(
                  f"JOBS: {TOTAL_JOBS}"
              )

              print(
                  f"WORKER TIMEOUT: {WORKER_TIMEOUT}s"
              )

              print(
                  "================================================"
              )

              async with websockets.serve(

                  handler,

                  HOST,

                  PORT,

                  ping_interval=20,

                  ping_timeout=30,

                  max_size=100 * 1024 * 1024

              ):

                  print(
                      f"Relay listening on {HOST}:{PORT}"
                  )

                  tasks = [

                      asyncio.create_task(
                          worker_monitor()
                      ),

                      asyncio.create_task(
                          heartbeat_loop()
                      )

                  ]

                  try:

                      await asyncio.wait_for(

                          finished.wait(),

                          timeout=1800

                      )

                  except asyncio.TimeoutError:

                      record(
                          "global_timeout",
                          completed=
                              state[
                                  "jobs_completed"
                              ],
                          total=TOTAL_JOBS
                      )

                  finally:

                      for task in tasks:

                          task.cancel()

                  save()

                  print(
                      json.dumps(
                          state,
                          indent=2,
                          ensure_ascii=False
                      )
                  )


          if __name__ == "__main__":

              asyncio.run(
                  main()
              )

          PY


      # ============================================================
      # START RELAY
      # ============================================================

      - name: Start relay
        shell: bash
        run: |
          set -euxo pipefail

          rm -f relay_result.json

          nohup python3 relay.py \
            > relay.log 2>&1 &

          echo $! > relay.pid

          sleep 2

          cat relay.log || true

          test -f relay_result.json


      # ============================================================
      # CLOUDFLARE TUNNEL
      # ============================================================

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -u

          rm -f cloudflared.log
          rm -f tunnel_url.txt

          cloudflared tunnel \
            --url http://127.0.0.1:8765 \
            --protocol http2 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" \
            > cloudflared.pid

          echo "Cloudflare PID: $CLOUDFLARED_PID"

          URL=""

          for i in $(seq 1 90); do

            if grep -q \
              'trycloudflare.com' \
              cloudflared.log 2>/dev/null; then

              URL="$(
                grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                cloudflared.log |
                head -n 1
              )"

              if [ -n "$URL" ]; then
                break
              fi

            fi

            if ! kill -0 \
              "$CLOUDFLARED_PID" \
              2>/dev/null; then

              echo "cloudflared died."

              cat cloudflared.log || true

              exit 1

            fi

            echo \
              "Waiting for Cloudflare... $i/90"

            sleep 2

          done

          if [ -z "$URL" ]; then

            echo "Tunnel URL not found."

            cat cloudflared.log || true

            exit 1

          fi

          WSS_URL="$(
            printf '%s' "$URL" |
            sed 's/^https:/wss:/'
          )/ws"

          printf '%s\n' "$URL" \
            > tunnel_url.txt

          printf '%s\n' "$WSS_URL" \
            > wss_url.txt

          echo "TUNNEL_URL=$URL" \
            >> "$GITHUB_ENV"

          echo "WSS_URL=$WSS_URL" \
            >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "CLOUDFLARE READY"
          echo "=============================================="
          echo "HTTP : $URL"
          echo "WSS  : $WSS_URL"
          echo "=============================================="


      # ============================================================
      # CREATE KAGGLE WORKERS
      # ============================================================

      - name: Create Kaggle worker kernels
        shell: bash
        run: |

          set -euxo pipefail

          rm -rf kaggle_workers

          mkdir -p kaggle_workers


          WSS_URL="$(cat wss_url.txt)"

          echo "Worker WSS:"
          echo "$WSS_URL"


          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            mkdir -p "$DIR"


            cat > "$DIR/worker.py" <<PY

          import asyncio
          import json
          import os
          import time
          import traceback
          import uuid

          import numpy as np

          from datetime import datetime, timezone

          import websockets


          WSS_URL = "$WSS_URL"

          AUTH_TOKEN = "$WORKER_AUTH_TOKEN"

          WORKER_ID = (
              "gpu-worker-${WORKER_INDEX}-"
              + uuid.uuid4().hex[:8]
          )


          def now():

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # GPU COMPUTE
          # ============================================================

          def gpu_matrix_job(
              matrix_size,
              repeats
          ):

              from numba import cuda


              if not cuda.is_available():

                  raise RuntimeError(
                      "CUDA is unavailable"
                  )


              @cuda.jit
              def matmul_kernel(
                  a,
                  b,
                  c
              ):

                  row = cuda.blockIdx.x * \
                        cuda.blockDim.x + \
                        cuda.threadIdx.x

                  col = cuda.blockIdx.y * \
                        cuda.blockDim.y + \
                        cuda.threadIdx.y

                  if (
                      row < c.shape[0]
                      and
                      col < c.shape[1]
                  ):

                      value = 0.0

                      for k in range(
                          a.shape[1]
                      ):

                          value += (
                              a[row, k]
                              *
                              b[k, col]
                          )

                      c[row, col] = value


              n = int(
                  matrix_size
              )


              host_a = np.random.rand(
                  n,
                  n
              ).astype(
                  np.float32
              )

              host_b = np.random.rand(
                  n,
                  n
              ).astype(
                  np.float32
              )


              a = cuda.to_device(
                  host_a
              )

              b = cuda.to_device(
                  host_b
              )

              c = cuda.device_array(
                  (
                      n,
                      n
                  ),
                  dtype=np.float32
              )


              threads = (
                  16,
                  16
              )


              blocks = (
                  (n + 15) // 16,
                  (n + 15) // 16
              )


              # JIT warmup

              matmul_kernel[
                  blocks,
                  threads
              ](
                  a,
                  b,
                  c
              )

              cuda.synchronize()


              start = time.perf_counter()


              for _ in range(
                  repeats
              ):

                  matmul_kernel[
                      blocks,
                      threads
                  ](
                      a,
                      b,
                      c
                  )


              cuda.synchronize()


              elapsed = (
                  time.perf_counter()
                  -
                  start
              )


              output = c.copy_to_host()


              return {

                  "backend":
                      "numba_cuda",

                  "gpu":
                      str(
                          cuda.get_current_device().name
                      ),

                  "matrix_size":
                      n,

                  "repeats":
                      repeats,

                  "compute_ms":
                      elapsed * 1000,

                  "output_bytes":
                      int(
                          output.nbytes
                      ),

                  "output_checksum":
                      float(
                          np.mean(output)
                      )
              }


          # ============================================================
          # CONNECT / RECONNECT
          # ============================================================

          async def worker():

              while True:

                  try:

                      print(
                          "Connecting:",
                          WSS_URL
                      )

                      async with websockets.connect(

                          WSS_URL,

                          max_size=
                              100 * 1024 * 1024,

                          ping_interval=20,

                          ping_timeout=30

                      ) as ws:

                          await ws.send(
                              json.dumps({

                                  "type":
                                      "hello",

                                  "worker_id":
                                      WORKER_ID,

                                  "auth":
                                      AUTH_TOKEN,

                                  "worker_utc":
                                      now()

                              })
                          )


                          print(
                              "HELLO SENT"
                          )


                          heartbeat_task = (
                              asyncio.create_task(
                                  heartbeat(
                                      ws
                                  )
                              )
                          )


                          try:

                              async for raw in ws:

                                  msg = json.loads(
                                      raw
                                  )

                                  msg_type = msg.get(
                                      "type"
                                  )


                                  if msg_type == "ready":

                                      print(
                                          "WORKER READY"
                                      )


                                  elif msg_type == "heartbeat":

                                      await ws.send(
                                          json.dumps({

                                              "type":
                                                  "heartbeat_ack",

                                              "worker_utc":
                                                  now()

                                          })
                                      )


                                  elif msg_type == "gpu_job":

                                      await run_job(
                                          ws,
                                          msg
                                      )


                          finally:

                              heartbeat_task.cancel()


                  except Exception as e:

                      print(
                          "WORKER CONNECTION ERROR:",
                          repr(e)
                      )

                      traceback.print_exc()


                  print(
                      "Reconnecting in 3 seconds..."
                  )

                  await asyncio.sleep(
                      3
                  )


          async def heartbeat(ws):

              while True:

                  await asyncio.sleep(
                      10
                  )

                  await ws.send(
                      json.dumps({

                          "type":
                              "heartbeat",

                          "worker_utc":
                              now()

                      })
                  )


          async def run_job(
              ws,
              job
          ):

              job_id = job.get(
                  "job_id"
              )

              started = time.perf_counter()


              try:

                  result = gpu_matrix_job(

                      int(
                          job[
                              "matrix_size"
                          ]
                      ),

                      int(
                          job[
                              "repeats"
                          ]
                      )

                  )


                  response = {

                      "type":
                          "gpu_result",

                      "job_id":
                          job_id,

                      "worker_id":
                          WORKER_ID,

                      "worker_utc":
                          now(),

                      "status":
                          "success",

                      "compute_wall_ms":
                          (
                              time.perf_counter()
                              -
                              started
                          ) * 1000,

                      "result":
                          result

                  }


              except Exception as e:

                  response = {

                      "type":
                          "gpu_result",

                      "job_id":
                          job_id,

                      "worker_id":
                          WORKER_ID,

                      "worker_utc":
                          now(),

                      "status":
                          "error",

                      "error":
                          repr(e),

                      "traceback":
                          traceback.format_exc()

                  }


              await ws.send(
                  json.dumps(
                      response
                  )
              )


              print(
                  "RESULT:",
                  json.dumps(
                      response,
                      ensure_ascii=False
                  )
              )


          asyncio.run(
              worker()
          )

          PY


            cat > "$DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}",
            "title": "gpu-ws-worker-${WORKER_INDEX}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

          done


      # ============================================================
      # PUSH WORKERS
      # ============================================================

      - name: Push Kaggle workers
        shell: bash
        run: |

          set -euxo pipefail

          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do

            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"

            echo
            echo "=============================================="
            echo "PUSHING WORKER $WORKER_INDEX"
            echo "=============================================="

            cat "$DIR/kernel-metadata.json"

            kaggle kernels push \
              -p "$DIR"

          done


      # ============================================================
      # WAIT FOR WORKERS
      # ============================================================

      - name: Wait for workers
        shell: bash
        run: |

          set -u

          echo
          echo "Waiting for Kaggle workers..."

          for i in $(seq 1 90); do

            WORKERS="$(
              jq -r \
                '.workers_alive // 0' \
                relay_result.json \
                2>/dev/null ||
                echo 0
            )"

            echo \
              "[$i/90] workers_alive=$WORKERS"

            if [ "$WORKERS" -ge 1 ]; then

              echo
              echo "At least one GPU worker connected."

              break

            fi

            sleep 5

          done


          WORKERS="$(
            jq -r \
              '.workers_alive // 0' \
              relay_result.json \
              2>/dev/null ||
              echo 0
          )"


          if [ "$WORKERS" -lt 1 ]; then

            echo
            echo "=============================================="
            echo "NO GPU WORKER CONNECTED"
            echo "=============================================="

            echo
            echo "Relay:"
            cat relay.log || true

            echo
            echo "Cloudflare:"
            cat cloudflared.log || true

            echo
            echo "State:"
            cat relay_result.json || true

            echo
            echo "Kaggle statuses:"

            for WORKER_INDEX in \
              $(seq 1 "$WORKER_COUNT"); do

              echo
              echo \
                "Worker $WORKER_INDEX"

              kaggle kernels status \
                "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}" \
                || true

            done

            exit 1

          fi


      # ============================================================
      # STRESS CLIENT
      # ============================================================

      - name: Create stress client
        shell: bash
        run: |

          cat > stress_client.py <<'PY'

          import asyncio
          import json
          import os
          import statistics
          import time

          import websockets


          WSS_URL = open(
              "wss_url.txt",
              "r"
          ).read().strip()


          JOBS = int(
              os.environ.get(
                  "TOTAL_JOBS",
                  "100"
              )
          )


          async def main():

              print(
                  "=============================================="
              )

              print(
                  "GPU API STRESS TEST"
              )

              print(
                  f"JOBS: {JOBS}"
              )

              print(
                  f"WSS: {WSS_URL}"
              )

              print(
                  "=============================================="
              )


              started = time.perf_counter()


              async with websockets.connect(

                  WSS_URL,

                  max_size=
                      100 * 1024 * 1024,

                  open_timeout=30,

                  ping_interval=20,

                  ping_timeout=30

              ) as ws:

                  # This is only a connectivity/latency
                  # measurement channel.
                  #
                  # Actual GPU jobs are already queued
                  # inside the relay.

                  latencies = []


                  for i in range(10):

                      t0 = time.perf_counter()

                      await ws.send(
                          json.dumps({

                              "type":
                                  "ping",

                              "id":
                                  i

                          })
                      )


                      raw = await ws.recv()

                      t1 = time.perf_counter()

                      msg = json.loads(
                          raw
                      )


                      if msg.get(
                          "type"
                      ) == "pong":

                          latencies.append(
                              (
                                  t1 - t0
                              ) * 1000
                          )


                  print()
                  print(
                      "Client ↔ Relay latency"
                  )

                  if latencies:

                      print(
                          "min:",
                          min(
                              latencies
                          ),
                          "ms"
                      )

                      print(
                          "avg:",
                          statistics.mean(
                              latencies
                          ),
                          "ms"
                      )

                      print(
                          "max:",
                          max(
                              latencies
                          ),
                          "ms"
                      )


              elapsed = (
                  time.perf_counter()
                  -
                  started
              )


              print()
              print(
                  "Stress client finished."
              )

              print(
                  "Elapsed:",
                  elapsed,
                  "seconds"
              )


          asyncio.run(
              main()
          )

          PY


      # ============================================================
      # RUN STRESS CLIENT
      # ============================================================

      - name: Run stress client
        shell: bash
        run: |
          set -euxo pipefail

          python3 stress_client.py


      # ============================================================
      # WAIT FOR ALL GPU JOBS
      # ============================================================

      - name: Wait for all GPU jobs
        shell: bash
        run: |

          set -u

          echo
          echo "Waiting for GPU queue..."

          for i in $(seq 1 360); do

            COMPLETED="$(
              jq -r \
                '.jobs_completed // 0' \
                relay_result.json \
                2>/dev/null ||
                echo 0
            )"

            SENT="$(
              jq -r \
                '.jobs_sent // 0' \
                relay_result.json \
                2>/dev/null ||
                echo 0
            )"

            WORKERS="$(
              jq -r \
                '.workers_alive // 0' \
                relay_result.json \
                2>/dev/null ||
                echo 0
            )"

            RETRIES="$(
              jq -r \
                '.jobs_retried // 0' \
                relay_result.json \
                2>/dev/null ||
                echo 0
            )"

            echo \
              "[$i] workers=$WORKERS sent=$SENT completed=$COMPLETED/$TOTAL_JOBS retries=$RETRIES"


            if [ "$COMPLETED" -ge "$TOTAL_JOBS" ]; then

              echo
              echo "=============================================="
              echo "ALL GPU JOBS COMPLETED"
              echo "=============================================="

              break

            fi


            sleep 5

          done


      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Final report
        if: always()
        shell: bash
        run: |

          set +e

          echo
          echo "=============================================="
          echo "FINAL GPU RELAY REPORT"
          echo "=============================================="

          if [ -f relay_result.json ]; then

            jq '.' \
              relay_result.json \
              || cat relay_result.json

          fi


          echo
          echo "=============================================="
          echo "CLOUDFLARE"
          echo "=============================================="

          cat tunnel_url.txt \
            2>/dev/null \
            || true

          cat wss_url.txt \
            2>/dev/null \
            || true


          echo
          echo "=============================================="
          echo "RELAY LOG"
          echo "=============================================="

          cat relay.log \
            2>/dev/null \
            || true


          echo
          echo "=============================================="
          echo "CLOUDFLARED LOG"
          echo "=============================================="

          cat cloudflared.log \
            2>/dev/null \
            || true


          echo
          echo "=============================================="
          echo "KAGGLE WORKER STATUS"
          echo "=============================================="


          for WORKER_INDEX in \
            $(seq 1 "$WORKER_COUNT"); do

            echo
            echo \
              "Worker $WORKER_INDEX"

            kaggle kernels status \
              "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}" \
              || true

          done


      # ============================================================
      # DOWNLOAD KAGGLE OUTPUTS
      # ============================================================

      - name: Download Kaggle outputs
        if: always()
        shell: bash
        run: |

          set +e

          mkdir -p kaggle_output

          for WORKER_INDEX in \
            $(seq 1 "$WORKER_COUNT"); do

            kaggle kernels output \
              "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}" \
              -p \
              "kaggle_output/worker-${WORKER_INDEX}" \
              --force \
              || true

          done


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name:
            kaggle-gpu-realtime-v7

          path: |

            relay_result.json

            relay.log

            cloudflared.log

            tunnel_url.txt

            wss_url.txt

            stress_client.py

            kaggle_output/**

          if-no-files-found:
            warn

          retention-days:
            7
