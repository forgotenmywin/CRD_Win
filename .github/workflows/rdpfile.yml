name: Kaggle GPU Worker - Real-Time GPU Queue v5

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      WORKER_COUNT: "2"
      TOTAL_JOBS: "100"
      MAX_QUEUE: "500"
      WORKER_DEAD_SECONDS: "45"
      JOB_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle websocket-client websockets numpy numba

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.kaggle"

          cat > "$HOME/.kaggle/kaggle.json" <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_API_TOKEN"
          }
          EOF

          chmod 600 "$HOME/.kaggle/kaggle.json"
          kaggle --version
          kaggle kernels list --user "$KAGGLE_USERNAME" --page-size 1

      - name: Generate runtime tokens
        shell: bash
        run: |
          set -euxo pipefail
          echo "WORKER_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "CLIENT_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "User-Agent: GitHub-Actions" \
              https://api.github.com/repos/cloudflare/cloudflared/releases/latest
          )"

          TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          test -n "$TAG"
          test "$TAG" != "null"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${TAG}/cloudflared-linux-amd64"

          chmod +x cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Create relay server
        shell: bash
        run: |
          set -euxo pipefail

          cat > relay.py <<'PY'
          import asyncio
          import base64
          import json
          import os
          import secrets
          import time
          import uuid
          from collections import deque
          from datetime import datetime, timezone

          import websockets

          HOST = "127.0.0.1"
          PORT = 8765

          WORKER_TOKEN = os.environ["WORKER_TOKEN"]
          CLIENT_TOKEN = os.environ["CLIENT_TOKEN"]
          MAX_QUEUE = int(os.environ.get("MAX_QUEUE", "500"))
          WORKER_DEAD_SECONDS = float(os.environ.get("WORKER_DEAD_SECONDS", "45"))
          JOB_TIMEOUT_SECONDS = float(os.environ.get("JOB_TIMEOUT_SECONDS", "120"))
          TOTAL_JOBS = int(os.environ.get("TOTAL_JOBS", "100"))

          STATE_FILE = "relay_result.json"

          workers = {}
          clients = {}
          queue = deque()
          jobs = {}

          state = {
              "started_utc": datetime.now(timezone.utc).isoformat(),
              "connections": 0,
              "workers_total": 0,
              "workers_alive": 0,
              "clients_total": 0,
              "jobs_submitted": 0,
              "jobs_completed": 0,
              "jobs_failed": 0,
              "jobs_retried": 0,
              "queue_size": 0,
              "events": [],
              "latencies_ms": [],
              "done": False,
          }

          completed_jobs = set()
          finished = asyncio.Event()

          def now():
              return datetime.now(timezone.utc).isoformat()

          def mono():
              return time.monotonic()

          def save():
              snap = dict(state)
              snap["workers_total"] = len(workers)
              snap["workers_alive"] = sum(1 for w in workers.values() if w["alive"])
              snap["clients_total"] = len(clients)
              snap["queue_size"] = len(queue)
              snap["workers"] = {
                  wid: {
                      "worker_id": wid,
                      "alive": info["alive"],
                      "busy": info["busy"],
                      "last_seen": info["last_seen"],
                      "jobs_completed": info["jobs_completed"],
                      "gpu_name": info.get("gpu_name"),
                  } for wid, info in workers.items()
              }
              snap["jobs"] = {
                  jid: {
                      "job_id": jid,
                      "status": job["status"],
                      "worker_id": job.get("worker_id"),
                      "attempt": job["attempt"],
                      "created_utc": job["created_utc"],
                      "latency": job.get("latency"),
                      "request": job.get("request"),
                  } for jid, job in jobs.items()
              }
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(snap, f, indent=2, ensure_ascii=False)

          def record(kind, **data):
              state["events"].append({"kind": kind, "at_utc": now(), **data})
              if len(state["events"]) > 1000:
                  state["events"] = state["events"][-1000:]
              save()
              print(json.dumps({"kind": kind, **data}, ensure_ascii=False), flush=True)

          async def send_json(ws, obj):
              await ws.send(json.dumps(obj, separators=(",", ":")))

          def check_token(supplied, expected):
              return bool(supplied) and bool(expected) and secrets.compare_digest(str(supplied), str(expected))

          def make_job_from_request(req):
              job_id = str(uuid.uuid4())
              job = {
                  "job_id": job_id,
                  "status": "queued",
                  "attempt": 0,
                  "max_retries": int(req.get("max_retries", 3)),
                  "created_utc": now(),
                  "created_mono": mono(),
                  "queued_mono": mono(),
                  "worker_id": None,
                  "request": req,
                  "client_id": req.get("client_id"),
                  "result": None,
              }
              jobs[job_id] = job
              queue.append(job_id)
              state["jobs_submitted"] += 1
              record("job_queued", job_id=job_id, operation=req.get("operation"))
              return job

          def get_free_worker():
              for wid, info in workers.items():
                  if info["alive"] and not info["busy"] and info["ws"] is not None:
                      return wid, info
              return None, None

          async def dispatch_jobs():
              while queue:
                  worker_id, worker = get_free_worker()
                  if worker is None:
                      return

                  job_id = queue.popleft()
                  job = jobs.get(job_id)
                  if not job or job["status"] != "queued":
                      continue

                  job["status"] = "running"
                  job["attempt"] += 1
                  job["worker_id"] = worker_id
                  job["assigned_mono"] = mono()
                  worker["busy"] = True
                  worker["current_job"] = job_id

                  payload = dict(job["request"])
                  payload["type"] = "gpu_job"
                  payload["job_id"] = job_id
                  payload["attempt"] = job["attempt"]
                  payload["relay_dispatch_utc"] = now()
                  payload["sent_ns"] = time.perf_counter_ns()

                  try:
                      await send_json(worker["ws"], payload)
                      record("job_sent", job_id=job_id, worker_id=worker_id, attempt=job["attempt"])
                  except Exception as e:
                      worker["busy"] = False
                      worker["current_job"] = None
                      job["status"] = "queued"
                      job["worker_id"] = None
                      queue.appendleft(job_id)
                      record("dispatch_error", job_id=job_id, worker_id=worker_id, error=repr(e))
                      return

          async def retry_job(job_id, reason):
              job = jobs.get(job_id)
              if not job or job["status"] == "completed":
                  return

              if job["attempt"] < job["max_retries"]:
                  job["status"] = "queued"
                  job["worker_id"] = None
                  queue.appendleft(job_id)
                  state["jobs_retried"] += 1
                  record("job_retry", job_id=job_id, reason=reason, next_attempt=job["attempt"] + 1)
              else:
                  job["status"] = "failed"
                  state["jobs_failed"] += 1
                  record("job_failed", job_id=job_id, reason=reason)

                  client = clients.get(job.get("client_id"))
                  if client:
                      try:
                          await send_json(client, {"type": "job_failed", "job_id": job_id, "reason": reason})
                      except Exception:
                          pass

          async def complete_job(worker_id, msg):
              job_id = msg.get("job_id")
              job = jobs.get(job_id)
              if not job or job["status"] in ("completed", "failed"):
                  return

              if job_id in completed_jobs:
                  return

              completed_jobs.add(job_id)

              recv_ns = time.perf_counter_ns()
              sent_ns = msg.get("sent_ns", recv_ns)

              worker = workers.get(worker_id)

              job["status"] = "completed"
              job["result"] = msg
              job["completed_utc"] = now()
              job["completed_mono"] = mono()
              job["latency"] = {
                  "queue_ms": (job["assigned_mono"] - job["created_mono"]) * 1000.0,
                  "worker_to_relay_ms": (recv_ns - int(sent_ns)) / 1_000_000.0,
                  "total_relay_ms": (mono() - job["created_mono"]) * 1000.0,
                  "gpu_compute_ms": float(msg.get("gpu", {}).get("gpu_compute_ms", msg.get("gpu_compute_ms", 0.0))),
              }

              state["jobs_completed"] += 1
              state["latencies_ms"].append(job["latency"]["total_relay_ms"])

              if worker:
                  worker["busy"] = False
                  worker["current_job"] = None
                  worker["jobs_completed"] += 1
                  worker["last_seen"] = mono()

              record("job_completed", job_id=job_id, worker_id=worker_id, latency=job["latency"])

              client = clients.get(job.get("client_id"))
              if client:
                  try:
                      await send_json(client, {
                          "type": "job_result",
                          "job_id": job_id,
                          "result": msg,
                          "latency": job["latency"],
                      })
                  except Exception:
                      pass

              await dispatch_jobs()

              if state["jobs_completed"] >= TOTAL_JOBS:
                  state["done"] = True
                  record("all_jobs_completed", total=TOTAL_JOBS)
                  finished.set()

          async def worker_watchdog():
              while not finished.is_set():
                  await asyncio.sleep(5)
                  current = mono()
                  for worker_id, info in list(workers.items()):
                      if not info["alive"]:
                          continue
                      if current - info["last_seen"] > WORKER_DEAD_SECONDS:
                          info["alive"] = False
                          record("worker_dead", worker_id=worker_id)
                          current_job = info.get("current_job")
                          info["busy"] = False
                          info["current_job"] = None
                          if current_job:
                              await retry_job(current_job, "worker_dead")
                  await dispatch_jobs()

          async def job_watchdog():
              while not finished.is_set():
                  await asyncio.sleep(2)
                  current = mono()
                  for job_id, job in list(jobs.items()):
                      if job["status"] != "running":
                          continue
                      if current - job.get("assigned_mono", current) > JOB_TIMEOUT_SECONDS:
                          wid = job.get("worker_id")
                          if wid in workers:
                              workers[wid]["busy"] = False
                              workers[wid]["current_job"] = None
                          await retry_job(job_id, "job_timeout")
                  await dispatch_jobs()

          async def worker_handler(ws, worker_id):
              workers[worker_id] = {
                  "ws": ws,
                  "alive": True,
                  "busy": False,
                  "current_job": None,
                  "last_seen": mono(),
                  "jobs_completed": 0,
                  "gpu_name": None,
              }
              record("worker_connected", worker_id=worker_id)

              try:
                  await send_json(ws, {"type": "worker_accepted", "worker_id": worker_id})

                  async for raw in ws:
                      info = workers.get(worker_id)
                      if not info:
                          break
                      info["last_seen"] = mono()

                      try:
                          msg = json.loads(raw)
                      except Exception:
                          continue

                      t = msg.get("type")
                      if t == "worker_info":
                          info["gpu_name"] = msg.get("gpu_name")
                          record("worker_info", worker_id=worker_id, gpu_name=msg.get("gpu_name"))
                      elif t == "ping":
                          await send_json(ws, {"type": "pong", "id": msg.get("id"), "relay_utc": now()})
                      elif t == "ready":
                          await dispatch_jobs()
                      elif t == "gpu_result":
                          await complete_job(worker_id, msg)

              except Exception as e:
                  record("worker_exception", worker_id=worker_id, error=repr(e))
              finally:
                  info = workers.get(worker_id)
                  if info:
                      info["alive"] = False
                      current_job = info.get("current_job")
                      info["busy"] = False
                      info["current_job"] = None
                      if current_job:
                          await retry_job(current_job, "worker_connection_lost")
                  record("worker_disconnected", worker_id=worker_id)
                  await dispatch_jobs()

          async def client_handler(ws, client_id):
              clients[client_id] = ws
              record("client_connected", client_id=client_id)

              try:
                  await send_json(ws, {"type": "client_accepted", "client_id": client_id})

                  async for raw in ws:
                      try:
                          msg = json.loads(raw)
                      except Exception:
                          await send_json(ws, {"type": "error", "error": "invalid_json"})
                          continue

                      t = msg.get("type")

                      if t == "submit":
                          if len(queue) >= MAX_QUEUE:
                              await send_json(ws, {"type": "error", "error": "queue_full"})
                              continue

                          msg["client_id"] = client_id
                          msg["source"] = "client_websocket"
                          job = make_job_from_request(msg)
                          await send_json(ws, {"type": "accepted", "job_id": job["job_id"], "queue_position": len(queue)})
                          await dispatch_jobs()

                      elif t == "status":
                          await send_json(ws, {
                              "type": "status",
                              "workers_alive": sum(1 for w in workers.values() if w["alive"]),
                              "workers_total": len(workers),
                              "queue_size": len(queue),
                              "jobs_submitted": state["jobs_submitted"],
                              "jobs_completed": state["jobs_completed"],
                              "jobs_failed": state["jobs_failed"],
                              "jobs_retried": state["jobs_retried"],
                          })

                      elif t == "job_status":
                          job_id = msg.get("job_id")
                          job = jobs.get(job_id)
                          if not job:
                              await send_json(ws, {"type": "error", "error": "job_not_found"})
                          else:
                              await send_json(ws, {
                                  "type": "job_status",
                                  "job_id": job_id,
                                  "status": job["status"],
                                  "attempt": job["attempt"],
                                  "worker_id": job.get("worker_id"),
                                  "result": job.get("result"),
                                  "latency": job.get("latency"),
                              })

                      elif t == "ping":
                          await send_json(ws, {"type": "pong", "relay_utc": now()})

              except Exception as e:
                  record("client_exception", client_id=client_id, error=repr(e))
              finally:
                  clients.pop(client_id, None)
                  record("client_disconnected", client_id=client_id)

          async def handler(ws):
              state["connections"] += 1

              try:
                  raw = await asyncio.wait_for(ws.recv(), timeout=30)
                  msg = json.loads(raw)
              except Exception:
                  await ws.close()
                  return

              if msg.get("type") != "auth":
                  await send_json(ws, {"type": "error", "error": "authentication_required"})
                  await ws.close()
                  return

              role = msg.get("role")
              token = msg.get("token")

              if role == "worker":
                  if not check_token(token, WORKER_TOKEN):
                      await send_json(ws, {"type": "error", "error": "invalid_worker_token"})
                      await ws.close()
                      return
                  worker_id = msg.get("worker_id")
                  if not worker_id:
                      await ws.close()
                      return
                  await worker_handler(ws, str(worker_id))
                  return

              if role == "client":
                  if not check_token(token, CLIENT_TOKEN):
                      await send_json(ws, {"type": "error", "error": "invalid_client_token"})
                      await ws.close()
                      return
                  client_id = str(uuid.uuid4())
                  await client_handler(ws, client_id)
                  return

              await ws.close()

          async def main():
              save()
              asyncio.create_task(worker_watchdog())
              asyncio.create_task(job_watchdog())

              async with websockets.serve(
                  handler,
                  HOST,
                  PORT,
                  ping_interval=20,
                  ping_timeout=60,
                  max_size=50 * 1024 * 1024
              ):
                  print("=" * 70)
                  print("REAL-TIME GPU RELAY")
                  print("=" * 70)
                  print("TOTAL_JOBS:", TOTAL_JOBS)
                  while not finished.is_set():
                      await asyncio.sleep(5)
                      save()

              save()
              print(json.dumps({
                  "jobs_total": state["jobs_submitted"],
                  "jobs_completed": state["jobs_completed"],
                  "jobs_failed": state["jobs_failed"],
                  "workers_alive": sum(1 for w in workers.values() if w["alive"]),
                  "queue_size": len(queue),
              }, indent=2))

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Start relay
        shell: bash
        run: |
          set -euxo pipefail
          nohup python3 relay.py > relay.log 2>&1 &
          echo $! > relay.pid
          sleep 3
          cat relay.log || true

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euxo pipefail
          rm -f cloudflared.log tunnel_url.txt wss_url.txt
          nohup cloudflared tunnel --url http://127.0.0.1:8765 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          for i in $(seq 1 90); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              printf '%s\n' "$URL" > tunnel_url.txt
              break
            fi
            sleep 2
          done

          test -s tunnel_url.txt

          TUNNEL_URL="$(cat tunnel_url.txt)"
          WSS_URL="$(printf '%s' "$TUNNEL_URL" | sed 's#^https:#wss:#')/ws"
          printf '%s\n' "$WSS_URL" > wss_url.txt

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
          echo "WSS_URL=$WSS_URL" >> "$GITHUB_ENV"

          echo "HTTP: $TUNNEL_URL"
          echo "WSS: $WSS_URL"

      - name: Create Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf kaggle_workers
          mkdir -p kaggle_workers

          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do
            WORKER_ID="gpu-worker-${WORKER_INDEX}"
            DIR="kaggle_workers/${WORKER_ID}"
            mkdir -p "$DIR"

            cat > "$DIR/worker.py" <<PY
          import base64
          import hashlib
          import json
          import os
          import time
          import traceback

          import numpy as np
          import websocket
          from numba import cuda


          WSS_URL = "${WSS_URL}"
          WORKER_TOKEN = "${WORKER_TOKEN}"
          WORKER_ID = "${WORKER_ID}"

          RESULT_FILE = "/kaggle/working/worker_result.json"


          @cuda.jit
          def transform_kernel(a, b, c):
              i = cuda.grid(1)
              if i < c.size:
                  c[i] = a[i] * b[i] + 1.0


          def gpu_job(n, repeats):
              if not cuda.is_available():
                  raise RuntimeError("CUDA unavailable")

              a = cuda.to_device(np.ones(n, dtype=np.float32))
              b = cuda.to_device(np.full(n, 2.0, dtype=np.float32))
              c = cuda.device_array(n, dtype=np.float32)

              threads = 256
              blocks = (n + threads - 1) // threads

              transform_kernel[blocks, threads](a, b, c)
              cuda.synchronize()

              start = time.perf_counter_ns()
              for _ in range(repeats):
                  transform_kernel[blocks, threads](a, b, c)
              cuda.synchronize()
              elapsed_ns = time.perf_counter_ns() - start

              gpu = cuda.get_current_device()
              gpu_name = gpu.name.decode(errors="replace") if isinstance(gpu.name, bytes) else gpu.name

              sample = c.copy_to_host()[:10]
              checksum = float(np.sum(sample))

              return {
                  "gpu": gpu_name,
                  "n": n,
                  "repeats": repeats,
                  "gpu_compute_ms": elapsed_ns / 1e6,
                  "sample_checksum": checksum
              }


          def send(msg, ws):
              ws.send(json.dumps(msg, separators=(",", ":")))


          def connect():
              ws = websocket.create_connection(
                  WSS_URL,
                  timeout=120,
                  enable_multithread=True
              )
              send({
                  "type": "auth",
                  "role": "worker",
                  "token": WORKER_TOKEN,
                  "worker_id": WORKER_ID
              }, ws)
              send({
                  "type": "worker_info",
                  "worker_id": WORKER_ID,
                  "worker_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              }, ws)
              send({"type": "ready", "worker_id": WORKER_ID}, ws)
              return ws


          def main():
              result = {
                  "worker": "kaggle_gpu_ws_worker",
                  "worker_id": WORKER_ID,
                  "wss_url": WSS_URL,
                  "start_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "status": "STARTING",
                  "jobs": []
              }

              print("=" * 60)
              print("KAGGLE WORKER")
              print("WORKER:", WORKER_ID)
              print("=" * 60)

              ws = None

              try:
                  while True:
                      try:
                          ws = connect()
                          result["status"] = "CONNECTED"
                          print("CONNECTED", WORKER_ID)

                          heartbeat_id = 0
                          last_heartbeat = time.monotonic()

                          while True:
                              if time.monotonic() - last_heartbeat > 10:
                                  heartbeat_id += 1
                                  send({
                                      "type": "ping",
                                      "id": heartbeat_id,
                                      "worker_id": WORKER_ID
                                  }, ws)
                                  last_heartbeat = time.monotonic()

                              try:
                                  ws.settimeout(5)
                                  raw = ws.recv()
                              except Exception:
                                  continue

                              if raw is None:
                                  raise RuntimeError("connection_closed")

                              msg = json.loads(raw)
                              t = msg.get("type")

                              if t == "all_jobs_done":
                                  print("ALL JOBS DONE", WORKER_ID)
                                  return

                              if t != "gpu_job":
                                  continue

                              job_id = msg.get("job_id")
                              attempt = int(msg.get("attempt", 1))
                              n = int(msg.get("n", 4194304))
                              repeats = int(msg.get("repeats", 20))
                              payload = msg.get("payload", "")
                              sent_ns = msg.get("sent_ns")

                              payload_raw = base64.b64decode(payload)
                              payload_sha256 = hashlib.sha256(payload_raw).hexdigest()

                              print("JOB", job_id, "PAYLOAD", len(payload_raw), "bytes")

                              started = time.perf_counter_ns()
                              try:
                                  gpu = gpu_job(n, repeats)
                                  response = {
                                      "type": "gpu_result",
                                      "job_id": job_id,
                                      "attempt": attempt,
                                      "worker_id": WORKER_ID,
                                      "sent_ns": sent_ns,
                                      "worker_send_mono": time.perf_counter_ns(),
                                      "worker_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                      "payload_bytes": len(payload_raw),
                                      "payload_sha256": payload_sha256,
                                      "gpu": gpu
                                  }
                              except Exception as e:
                                  response = {
                                      "type": "gpu_result",
                                      "job_id": job_id,
                                      "attempt": attempt,
                                      "worker_id": WORKER_ID,
                                      "sent_ns": sent_ns,
                                      "worker_send_mono": time.perf_counter_ns(),
                                      "worker_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                                      "error": repr(e),
                                      "traceback": traceback.format_exc()
                                  }

                              result["jobs"].append(response)
                              send(response, ws)
                              print("RESULT SENT", job_id)

                      except Exception as e:
                          print("WORKER CONNECTION ERROR:", repr(e))
                          time.sleep(3)
                      finally:
                          if ws is not None:
                              try:
                                  ws.close()
                              except Exception:
                                  pass
                              ws = None
              finally:
                  result["status"] = "DONE"
                  with open(RESULT_FILE, "w", encoding="utf-8") as f:
                      json.dump(result, f, indent=2, ensure_ascii=False)
                  print(json.dumps(result, indent=2, ensure_ascii=False))


          if __name__ == "__main__":
              main()
          PY

            cat > "$DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}",
            "title": "gpu-ws-worker-${WORKER_INDEX}",
            "code_file": "worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          done

      - name: Push Kaggle workers
        shell: bash
        run: |
          set -euxo pipefail
          for WORKER_INDEX in $(seq 1 "$WORKER_COUNT"); do
            DIR="kaggle_workers/gpu-worker-${WORKER_INDEX}"
            WORKER_ID="${KAGGLE_USERNAME}/gpu-ws-worker-${WORKER_INDEX}"

            echo "Pushing $WORKER_ID"
            kaggle kernels push -p "$DIR"

            echo "Waiting for $WORKER_ID to run..."
            for i in $(seq 1 60); do
              STATUS="$(kaggle kernels status "$WORKER_ID" 2>/dev/null | tail -n 1 || true)"
              echo "[$WORKER_ID] $STATUS"
              case "$STATUS" in
                *RUNNING*|*QUEUED*)
                  break
                  ;;
                *ERROR*|*FAILED*)
                  echo "Worker kernel failed:"
                  kaggle kernels status "$WORKER_ID" || true
                  exit 1
                  ;;
              esac
              sleep 5
            done
          done

      - name: Wait for workers to connect
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            if [ -f relay_result.json ]; then
              WORKERS="$(jq -r '.workers_alive' relay_result.json 2>/dev/null || echo 0)"
              echo "workers_alive=$WORKERS"
              if [ "$WORKERS" -ge 1 ]; then
                break
              fi
            fi
            sleep 5
          done

      - name: Create stress client
        shell: bash
        run: |
          set -euxo pipefail

          cat > stress_client.py <<'PY'
          import asyncio
          import base64
          import json
          import os
          import statistics
          import time
          import uuid

          import numpy as np
          import websockets


          CLIENT_TOKEN = os.environ["CLIENT_TOKEN"]
          TOTAL = int(os.environ.get("TOTAL_JOBS", "100"))


          def load_wss():
              with open("wss_url.txt", "r", encoding="utf-8") as f:
                  url = f.read().strip()
              if not url.startswith("wss://"):
                  raise RuntimeError(f"Bad WSS URL: {url}")
              return url


          def big_payload(n=500_000):
              arr = np.ones(n, dtype=np.float32)
              return base64.b64encode(arr.tobytes()).decode()


          async def main():
              url = load_wss()
              print("=" * 70)
              print("STRESS TEST")
              print("WSS:", url)
              print("JOBS:", TOTAL)
              print("=" * 70)

              completed = 0
              accepted = 0
              latencies = []

              async with websockets.connect(
                  url,
                  max_size=50 * 1024 * 1024,
                  open_timeout=60,
                  ping_interval=20,
                  ping_timeout=30
              ) as ws:
                  await ws.send(json.dumps({
                      "type": "auth",
                      "role": "client",
                      "token": CLIENT_TOKEN
                  }))

                  first = json.loads(await ws.recv())
                  print("AUTH:", first)

                  # Wait until at least one worker is alive.
                  for _ in range(60):
                      await ws.send(json.dumps({"type": "status"}))
                      status = json.loads(await ws.recv())
                      print("STATUS:", status)
                      if status.get("workers_alive", 0) > 0:
                          break
                      await asyncio.sleep(2)

                  # Submit jobs.
                  for i in range(TOTAL):
                      client_job_id = str(uuid.uuid4())

                      if i % 10 == 0:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "vector_add",
                              "n": 500_000,
                              "repeats": 5,
                              "input_a": big_payload(500_000),
                              "input_b": big_payload(500_000),
                              "max_retries": 3
                          }
                      elif i % 7 == 0:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "matmul",
                              "size": 128,
                              "max_retries": 3
                          }
                      else:
                          request = {
                              "type": "submit",
                              "client_job_id": client_job_id,
                              "operation": "vector_add",
                              "n": 262144,
                              "repeats": 5,
                              "max_retries": 3
                          }

                      await ws.send(json.dumps(request))

                  deadline = time.monotonic() + 1200

                  while completed < TOTAL and time.monotonic() < deadline:
                      timeout = max(1, deadline - time.monotonic())
                      try:
                          raw = await asyncio.wait_for(ws.recv(), timeout=timeout)
                      except asyncio.TimeoutError:
                          break

                      msg = json.loads(raw)

                      if msg.get("type") == "accepted":
                          accepted += 1
                          if accepted % 10 == 0:
                              print(f"accepted={accepted}/{TOTAL}")
                          continue

                      if msg.get("type") == "job_result":
                          completed += 1
                          latency = msg.get("latency", {})
                          total_ms = latency.get("total_relay_ms")
                          if total_ms is not None:
                              latencies.append(float(total_ms))
                          if completed % 10 == 0:
                              print(f"completed={completed}/{TOTAL}")
                          continue

                      if msg.get("type") == "job_failed":
                          completed += 1
                          print("FAILED:", msg)

                  print("=" * 70)
                  print("STRESS RESULT")
                  print("Submitted:", TOTAL)
                  print("Accepted:", accepted)
                  print("Completed:", completed)
                  print("Failed:", TOTAL - completed)
                  if latencies:
                      print("Latency min:", min(latencies), "ms")
                      print("Latency avg:", statistics.mean(latencies), "ms")
                      print("Latency max:", max(latencies), "ms")
                      if len(latencies) > 1:
                          print("Latency p50:", statistics.median(latencies), "ms")

                  with open("stress_results.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "submitted": TOTAL,
                          "accepted": accepted,
                          "completed": completed,
                          "latencies_ms": latencies
                      }, f, indent=2, ensure_ascii=False)

          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Run stress test
        shell: bash
        run: |
          set -euxo pipefail
          python3 stress_client.py

      - name: Wait for all jobs
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 240); do
            if [ -f relay_result.json ]; then
              COMPLETED="$(jq -r '.jobs_completed' relay_result.json 2>/dev/null || echo 0)"
              SENT="$(jq -r '.jobs_submitted' relay_result.json 2>/dev/null || echo 0)"
              WORKERS="$(jq -r '.workers_alive' relay_result.json 2>/dev/null || echo 0)"
              echo "[$i] workers=$WORKERS submitted=$SENT completed=$COMPLETED/$TOTAL_JOBS"
              if [ "$COMPLETED" = "$TOTAL_JOBS" ]; then
                break
              fi
            fi
            sleep 5
          done

      - name: Final report
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== RELAY RESULT ==="
          cat relay_result.json || true
          echo
          echo "=== RELAY LOG ==="
          cat relay.log || true
          echo
          echo "=== CLOUDFLARED LOG ==="
          cat cloudflared.log || true
          echo
          echo "=== STRESS RESULTS ==="
          cat stress_results.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-time-gpu-queue-v5
          path: |
            relay_result.json
            relay.log
            cloudflared.log
            tunnel_url.txt
            wss_url.txt
            stress_results.json
            kaggle_workers/**
          if-no-files-found: warn
          retention-days: 7
