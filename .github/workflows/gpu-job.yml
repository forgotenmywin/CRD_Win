name: Kaggle GPU Job

run-name: GPU-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "Operation"
        required: true
        type: string
        default: "matrix"

      size:
        description: "Matrix size"
        required: true
        type: string
        default: "1024"

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # KAGGLE
      # ==================================================

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          kaggle --version

      # ==================================================
      # CREDENTIAL CHECK
      # ==================================================

      - name: Check Kaggle credentials
        shell: bash
        run: |
          set -e

          if [[ -z "$KAGGLE_USERNAME" ]]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials are configured."

      # ==================================================
      # CREATE KAGGLE WORKER
      # ==================================================

      - name: Create Kaggle worker
        shell: bash
        run: |
          set -e

          rm -rf kaggle_job
          mkdir -p kaggle_job

          # IMPORTANT:
          # No quoted heredoc delimiter here.
          #
          # We intentionally allow GitHub Actions to substitute:
          # ${{ inputs.job_id }}
          # ${{ inputs.operation }}
          # ${{ inputs.size }}

          cat > kaggle_job/script.py <<PYEOF
          import json
          import time
          import traceback
          import subprocess
          import sys

          # ==================================================
          # DIRECT VALUES FROM GITHUB ACTION
          # ==================================================

          JOB_ID = "${{ inputs.job_id }}"
          OPERATION = "${{ inputs.operation }}"
          SIZE = int("${{ inputs.size }}")

          print("=" * 60)
          print("            KAGGLE GPU WORKER")
          print("=" * 60)

          print("JOB_ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("SIZE:", SIZE)

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "size": SIZE,
              "status": "ERROR"
          }

          try:

              # ==================================================
              # NVIDIA INFORMATION
              # ==================================================

              print("")
              print("=" * 60)
              print("             NVIDIA GPU")
              print("=" * 60)

              try:
                  nvidia = subprocess.run(
                      [
                          "nvidia-smi",
                          "--query-gpu=name,memory.total,driver_version",
                          "--format=csv,noheader"
                      ],
                      capture_output=True,
                      text=True
                  )

                  print("nvidia-smi return code:", nvidia.returncode)
                  print(nvidia.stdout)

                  if nvidia.stderr:
                      print(nvidia.stderr)

              except Exception as e:
                  print("nvidia-smi error:", e)

              # ==================================================
              # NUMBA
              # ==================================================

              print("")
              print("=" * 60)
              print("              NUMBA CUDA")
              print("=" * 60)

              try:
                  import numba
              except ImportError:
                  print("Installing Numba...")

                  subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "pip",
                          "install",
                          "--no-cache-dir",
                          "numba==0.60.0"
                      ],
                      check=True
                  )

                  import numba

              from numba import cuda
              import numpy as np

              print("Numba:", numba.__version__)
              print(
                  "CUDA available:",
                  cuda.is_available()
              )

              if not cuda.is_available():
                  raise RuntimeError(
                      "CUDA is not available"
                  )

              # ==================================================
              # GPU
              # ==================================================

              device = cuda.get_current_device()

              gpu_name = str(device.name)

              capability = (
                  device.compute_capability
              )

              print("")
              print("GPU:", gpu_name)
              print(
                  "Compute capability:",
                  capability
              )

              result["gpu"] = gpu_name

              result["compute_capability"] = [
                  int(capability[0]),
                  int(capability[1])
              ]

              result["cuda_available"] = True

              result["numba_version"] = (
                  numba.__version__
              )

              # ==================================================
              # MATRIX KERNEL
              # ==================================================

              if OPERATION != "matrix":
                  raise ValueError(
                      "Unsupported operation: "
                      + OPERATION
                  )

              if SIZE < 1:
                  raise ValueError(
                      "Matrix size must be positive"
                  )

              if SIZE > 4096:
                  raise ValueError(
                      "Matrix size too large"
                  )

              print("")
              print("=" * 60)
              print("             MATRIX TEST")
              print("=" * 60)

              print(
                  "Matrix:",
                  SIZE,
                  "x",
                  SIZE
              )

              @cuda.jit
              def matrix_kernel(a, b, c):

                  row, col = cuda.grid(2)

                  if (
                      row < a.shape[0]
                      and col < b.shape[1]
                  ):

                      total = 0.0

                      for k in range(
                          a.shape[1]
                      ):

                          total += (
                              a[row, k]
                              * b[k, col]
                          )

                      c[row, col] = total

              # ==================================================
              # HOST ARRAYS
              # ==================================================

              a = np.random.rand(
                  SIZE,
                  SIZE
              ).astype(
                  np.float32
              )

              b = np.random.rand(
                  SIZE,
                  SIZE
              ).astype(
                  np.float32
              )

              c = np.zeros(
                  (
                      SIZE,
                      SIZE
                  ),
                  dtype=np.float32
              )

              # ==================================================
              # COPY TO GPU
              # ==================================================

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = (
                  16,
                  16
              )

              blocks = (
                  (SIZE + threads[0] - 1)
                  // threads[0],

                  (SIZE + threads[1] - 1)
                  // threads[1]
              )

              print(
                  "Blocks:",
                  blocks
              )

              print(
                  "Threads:",
                  threads
              )

              # ==================================================
              # EXECUTE
              # ==================================================

              cuda.synchronize()

              start = time.perf_counter()

              matrix_kernel[
                  blocks,
                  threads
              ](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = (
                  time.perf_counter()
                  - start
              )

              # ==================================================
              # COPY RESULT
              # ==================================================

              result_matrix = (
                  d_c.copy_to_host()
              )

              checksum = float(
                  np.sum(result_matrix)
              )

              print("")
              print(
                  "GPU computation successful."
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              print(
                  "Checksum:",
                  checksum
              )

              # ==================================================
              # RESULT
              # ==================================================

              result["status"] = "SUCCESS"

              result["requested_matrix"] = {
                  "size": SIZE,
                  "shape": [
                      SIZE,
                      SIZE
                  ],
                  "time_seconds": elapsed,
                  "checksum": checksum
              }

              # Free memory

              del d_a
              del d_b
              del d_c

              del a
              del b
              del c
              del result_matrix

              print("")
              print("=" * 60)
              print("              GPU SUCCESS")
              print("=" * 60)

          except Exception as e:

              result["status"] = "ERROR"

              result["error"] = str(e)

              result["exception"] = (
                  type(e).__name__
              )

              result["traceback"] = (
                  traceback.format_exc()
              )

              print("")
              print("=" * 60)
              print("               GPU ERROR")
              print("=" * 60)

              print(
                  str(e)
              )

              traceback.print_exc()

          # ==================================================
          # SAVE RESULT
          # ==================================================

          print("")
          print("=" * 60)
          print("              FINAL RESULT")
          print("=" * 60)

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("")
          print(
              "RESULT FILE:"
          )

          print(
              "/kaggle/working/result.json"
          )

          # ==================================================
          # FAIL KAGGLE JOB IF GPU FAILED
          # ==================================================

          if result["status"] != "SUCCESS":

              raise SystemExit(1)

          PYEOF

          # ==================================================
          # METADATA
          # ==================================================

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo ""
          echo "======================================"
          echo "        GENERATED SCRIPT"
          echo "======================================"

          head -20 kaggle_job/script.py

          echo ""
          echo "======================================"
          echo "        KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json

      # ==================================================
      # SUBMIT KAGGLE
      # ==================================================

      - name: Submit Kaggle GPU job
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_job

          echo ""
          echo "Kaggle job submitted."

      # ==================================================
      # WAIT FOR KAGGLE
      # ==================================================

      - name: Wait for Kaggle GPU
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          FINAL_STATUS="UNKNOWN"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS="$(
              kaggle kernels status \
                "$KERNEL" \
                2>&1
            )"

            echo "$STATUS"

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "KAGGLE JOB COMPLETE"

              break
            fi

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "KAGGLE JOB ERROR"

              break
            fi

            sleep 5

          done

          echo ""
          echo "FINAL_STATUS=$FINAL_STATUS"

          # ==================================================
          # DOWNLOAD
          # ==================================================

          echo ""
          echo "======================================"
          echo "       DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"

          kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            --force

          OUTPUT_EXIT=$?

          echo "Output exit code: $OUTPUT_EXIT"

          echo ""
          echo "======================================"
          echo "          OUTPUT FILES"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print || true

          # ==================================================
          # SHOW RESULT
          # ==================================================

          echo ""
          echo "======================================"
          echo "             RESULT.JSON"
          echo "======================================"

          RESULT_FILE="$(
            find kaggle_output \
              -type f \
              -name "result.json" \
              | head -n 1
          )"

          if [[ -n "$RESULT_FILE" ]]
          then

            cat "$RESULT_FILE"

          else

            echo "result.json not found."

          fi

          # ==================================================
          # VALIDATE KAGGLE STATUS
          # ==================================================

          if [[ "$FINAL_STATUS" != "COMPLETE" ]]
          then

            echo ""
            echo "Kaggle job failed."

            exit 1

          fi

          if [[ -z "$RESULT_FILE" ]]
          then

            echo ""
            echo "Kaggle completed but result.json missing."

            exit 1

          fi

      # ==================================================
      # VALIDATE RESULT
      # ==================================================

      - name: Validate result
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       VALIDATING RESULT"
          echo "======================================"

          RESULT_FILE="$(
            find kaggle_output \
              -type f \
              -name "result.json" \
              | head -n 1
          )"

          if [[ -z "$RESULT_FILE" ]]
          then
            echo "result.json not found"
            exit 1
          fi

          cat "$RESULT_FILE"

          EXPECTED_JOB="${{ inputs.job_id }}"

          ACTUAL_JOB="$(
            python -c '
          import json
          import sys

          with open(sys.argv[1]) as f:
              data = json.load(f)

          print(data.get("job_id", ""))
          ' "$RESULT_FILE"
          )"

          echo ""
          echo "Expected: $EXPECTED_JOB"
          echo "Actual: $ACTUAL_JOB"

          if [[ "$ACTUAL_JOB" != "$EXPECTED_JOB" ]]
          then

            echo ""
            echo "ERROR: Job ID mismatch"

            exit 1

          fi

          STATUS="$(
            python -c '
          import json
          import sys

          with open(sys.argv[1]) as f:
              data = json.load(f)

          print(data.get("status", ""))
          ' "$RESULT_FILE"
          )"

          if [[ "$STATUS" != "SUCCESS" ]]
          then

            echo ""
            echo "ERROR: GPU worker failed"

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "       RESULT VALIDATION SUCCESS"
          echo "======================================"

      # ==================================================
      # UPLOAD
      # ==================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: kaggle_output/
          if-no-files-found: warn

      # ==================================================
      # FINAL
      # ==================================================

      - name: Final
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB ID:"
          echo "${{ inputs.job_id }}"

          echo "OPERATION:"
          echo "${{ inputs.operation }}"

          echo "SIZE:"
          echo "${{ inputs.size }}"
