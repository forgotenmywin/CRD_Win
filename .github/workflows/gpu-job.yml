name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "Operation"
        required: true
        default: "matrix"
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==========================================
      # CHECK ENVIRONMENT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install kaggle

          echo "======================================"
          echo "       ENVIRONMENT"
          echo "======================================"

          python --version
          kaggle --version

          echo ""
          echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
          echo "JOB_ID=$JOB_ID"
          echo "OPERATION=$OPERATION"
          echo "MATRIX_SIZE=$MATRIX_SIZE"

      # ==========================================
      # CHECK KAGGLE AUTH
      # ==========================================

      - name: Check Kaggle authentication
        run: |
          set -e

          echo "======================================"
          echo "       KAGGLE AUTH CHECK"
          echo "======================================"

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials exist."

          kaggle kernels list \
            --user "$KAGGLE_USERNAME" \
            --page-size 1 || true

      # ==========================================
      # CREATE KAGGLE KERNEL
      # ==========================================

      - name: Create Kaggle kernel
        run: |
          set -e

          echo "======================================"
          echo "       CREATING KAGGLE JOB"
          echo "======================================"

          rm -rf kaggle_kernel
          mkdir -p kaggle_kernel

          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "main.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "model_sources": [],
            "enable_internet": true
          }
          EOF

          cat > kaggle_kernel/main.py <<'PYEOF'
          import os
          import json
          import time
          import traceback

          JOB_ID = os.environ.get("JOB_ID", "unknown")
          OPERATION = os.environ.get("OPERATION", "matrix")

          try:
              SIZE = int(os.environ.get("MATRIX_SIZE", "1024"))
          except:
              SIZE = 1024

          print("=" * 50)
          print("        KAGGLE GPU WORKER")
          print("=" * 50)

          print("JOB_ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("SIZE:", SIZE)

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "requested_matrix": {
                  "size": SIZE
              },
              "status": "STARTING"
          }

          try:

              # ==========================================
              # GPU DETECTION
              # ==========================================

              print("")
              print("=" * 50)
              print("        GPU DETECTION")
              print("=" * 50)

              import subprocess

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,compute_cap",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print("nvidia-smi return code:", nvidia.returncode)
              print(nvidia.stdout)
              print(nvidia.stderr)

              # ==========================================
              # CUDA / PYTORCH
              # ==========================================

              import torch

              print("")
              print("=" * 50)
              print("        PYTORCH")
              print("=" * 50)

              print("PyTorch:", torch.__version__)
              print("CUDA available:", torch.cuda.is_available())

              result["pytorch_version"] = torch.__version__
              result["cuda"] = torch.cuda.is_available()

              if not torch.cuda.is_available():
                  raise RuntimeError("CUDA is not available")

              device = torch.device("cuda")

              gpu_name = torch.cuda.get_device_name(0)
              capability = torch.cuda.get_device_capability(0)

              print("GPU:", gpu_name)
              print("Compute capability:", capability)

              result["gpu"] = gpu_name
              result["compute_capability"] = list(capability)

              try:
                  result["gpu_memory_mb"] = (
                      torch.cuda.get_device_properties(0).total_memory
                      / 1024 / 1024
                  )
              except Exception:
                  pass

              # ==========================================
              # BASIC GPU TEST
              # ==========================================

              print("")
              print("=" * 50)
              print("        BASIC GPU TEST")
              print("=" * 50)

              a = torch.randn(
                  1024,
                  1024,
                  device=device
              )

              b = torch.randn(
                  1024,
                  1024,
                  device=device
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = torch.matmul(a, b)

              torch.cuda.synchronize()

              elapsed = time.perf_counter() - start

              print("Basic matrix test:", elapsed, "seconds")
              print("Result shape:", tuple(c.shape))

              result["basic_test"] = {
                  "shape": list(c.shape),
                  "time_seconds": elapsed
              }

              del a
              del b
              del c

              torch.cuda.empty_cache()

              # ==========================================
              # REQUESTED MATRIX
              # ==========================================

              if OPERATION == "matrix":

                  print("")
                  print("=" * 50)
                  print("        MATRIX OPERATION")
                  print("=" * 50)

                  print("Matrix size:", SIZE)

                  if SIZE < 1:
                      raise ValueError("SIZE must be greater than zero")

                  if SIZE > 8192:
                      raise ValueError(
                          "SIZE too large for this test"
                      )

                  a = torch.randn(
                      SIZE,
                      SIZE,
                      device=device
                  )

                  b = torch.randn(
                      SIZE,
                      SIZE,
                      device=device
                  )

                  torch.cuda.synchronize()

                  start = time.perf_counter()

                  c = torch.matmul(a, b)

                  torch.cuda.synchronize()

                  elapsed = time.perf_counter() - start

                  print("Matrix completed.")
                  print("Shape:", tuple(c.shape))
                  print("Time:", elapsed)

                  result["requested_matrix"] = {
                      "shape": [SIZE, SIZE],
                      "size": SIZE,
                      "time_seconds": elapsed
                  }

                  del a
                  del b
                  del c

                  torch.cuda.empty_cache()

              else:
                  raise ValueError(
                      f"Unknown operation: {OPERATION}"
                  )

              # ==========================================
              # SUCCESS
              # ==========================================

              result["status"] = "SUCCESS"

              print("")
              print("=" * 50)
              print("        GPU JOB SUCCESS")
              print("=" * 50)

              print(json.dumps(result, indent=2))

              with open("/kaggle/working/result.json", "w") as f:
                  json.dump(result, f, indent=2)

          except Exception as e:

              result["status"] = "ERROR"
              result["error"] = str(e)
              result["traceback"] = traceback.format_exc()

              print("")
              print("=" * 50)
              print("        GPU JOB ERROR")
              print("=" * 50)

              print(str(e))
              traceback.print_exc()

              with open("/kaggle/working/result.json", "w") as f:
                  json.dump(result, f, indent=2)

              raise

          PYEOF

          echo ""
          echo "======================================"
          echo "KAGGLE METADATA"
          echo "======================================"

          cat kaggle_kernel/kernel-metadata.json

          echo ""
          echo "======================================"
          echo "KAGGLE FILES"
          echo "======================================"

          ls -la kaggle_kernel

      # ==========================================
      # PUSH KAGGLE JOB
      # ==========================================

      - name: Submit Kaggle GPU job
        run: |
          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_kernel

          echo ""
          echo "Kaggle job submitted."

      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for Kaggle GPU
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          rm -rf kaggle_output
          mkdir -p kaggle_output

          FINAL_STATUS=""

          for i in $(seq 1 180); do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1)

            CODE=$?

            echo "$STATUS"

            if [ $CODE -ne 0 ]; then
              echo "Could not query Kaggle status."
              sleep 5
              continue
            fi

            if echo "$STATUS" | grep -q "KernelWorkerStatus.COMPLETE"; then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB COMPLETE"
              echo "======================================"

              break
            fi

            if echo "$STATUS" | grep -q "KernelWorkerStatus.ERROR"; then

              FINAL_STATUS="ERROR"

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB ERROR"
              echo "======================================"

              break
            fi

            if echo "$STATUS" | grep -q "KernelWorkerStatus.CANCEL"; then

              FINAL_STATUS="CANCELLED"

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB CANCELLED"
              echo "======================================"

              break
            fi

            echo "Kaggle job still running..."

            sleep 5

          done

          # ==========================================
          # DOWNLOAD OUTPUT
          # ==========================================

          echo ""
          echo "======================================"
          echo "       DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"

          kaggle kernels output "$KERNEL" \
            -p kaggle_output \
            --force

          OUTPUT_CODE=$?

          echo "Output command exit code: $OUTPUT_CODE"

          echo ""
          echo "======================================"
          echo "       OUTPUT FILES"
          echo "======================================"

          find kaggle_output \
            -maxdepth 3 \
            -type f \
            -print

          # ==========================================
          # PRINT RESULT
          # ==========================================

          echo ""
          echo "======================================"
          echo "       RESULT.JSON"
          echo "======================================"

          RESULT=$(find kaggle_output \
            -type f \
            -name "result.json" \
            | head -n 1)

          if [ -n "$RESULT" ]; then
            cat "$RESULT"
          else
            echo "result.json NOT FOUND"
          fi

          # ==========================================
          # PRINT LOG
          # ==========================================

          echo ""
          echo "======================================"
          echo "       KAGGLE LOGS"
          echo "======================================"

          LOG=$(find kaggle_output \
            -type f \
            -name "*.log" \
            | head -n 1)

          if [ -n "$LOG" ]; then

            echo "LOG FILE:"
            echo "$LOG"

            echo ""
            echo "--------------------------------------"

            cat "$LOG"

          else
            echo "No .log file found."
          fi

          # ==========================================
          # FINAL STATUS
          # ==========================================

          echo ""
          echo "======================================"
          echo "       FINAL KAGGLE STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"

          if [ "$FINAL_STATUS" != "COMPLETE" ]; then

            echo ""
            echo "Kaggle job did not complete successfully."

            exit 1
          fi

          echo ""
          echo "Kaggle job completed successfully."

      # ==========================================
      # UPLOAD DEBUG ARTIFACT
      # ==========================================

      - name: Upload Kaggle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-output-${{ inputs.job_id }}
          path: kaggle_output/
          if-no-files-found: warn

      # ==========================================
      # FINAL
      # ==========================================

      - name: Final status
        if: always()
        run: |
          echo "======================================"
          echo "       GPU JOB FINISHED"
          echo "======================================"

          echo "Job ID:"
          echo "$JOB_ID"

          echo "Operation:"
          echo "$OPERATION"

          echo "Size:"
          echo "$MATRIX_SIZE"
