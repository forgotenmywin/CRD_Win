name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: string
        default: matrix

      size:
        description: "Matrix size"
        required: true
        type: string
        default: "1024"

jobs:
  gpu-job:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # INSTALL KAGGLE
      # ==========================================

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          kaggle --version

      # ==========================================
      # CREATE GPU JOB
      # ==========================================

      - name: Create GPU job
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'

          import json
          import subprocess
          import sys
          import time
          import os

          print("======================================")
          print("          KAGGLE GPU WORKER")
          print("======================================")

          JOB_ID = os.environ["JOB_ID"]
          OPERATION = os.environ["OPERATION"]
          MATRIX_SIZE = int(os.environ["MATRIX_SIZE"])

          print("Job ID:", JOB_ID)
          print("Operation:", OPERATION)
          print("Matrix size:", MATRIX_SIZE)

          print("")
          print("Installing compatible PyTorch...")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )

          import torch

          print("")
          print("======================================")
          print("          PYTORCH / CUDA")
          print("======================================")

          print("PyTorch:", torch.__version__)
          print("CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError(
                  "CUDA is not available"
              )

          gpu = torch.cuda.get_device_name(0)

          capability = (
              torch.cuda.get_device_capability(0)
          )

          props = torch.cuda.get_device_properties(0)

          memory_mb = (
              props.total_memory
              / 1024
              / 1024
          )

          print("")
          print("GPU:", gpu)
          print(
              "Compute capability:",
              capability
          )
          print(
              "GPU memory:",
              round(memory_mb, 2),
              "MB"
          )

          # ======================================
          # BASIC GPU TEST
          # ======================================

          print("")
          print("Running basic GPU test...")

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = (
              time.perf_counter()
              - start
          )

          print(
              "Basic GPU test successful."
          )

          # ======================================
          # REQUESTED JOB
          # ======================================

          requested_time = None
          requested_shape = None

          if OPERATION == "matrix":

              print("")
              print(
                  "Running matrix:",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE
              )

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = (
                  time.perf_counter()
                  - start
              )

              requested_shape = list(
                  c.shape
              )

              print(
                  "Matrix GPU job successful."
              )

          else:

              raise ValueError(
                  f"Unknown operation: {OPERATION}"
              )

          # ======================================
          # RESULT
          # ======================================

          result = {

              "job_id": JOB_ID,

              "operation": OPERATION,

              "status": "SUCCESS",

              "cuda": True,

              "gpu": gpu,

              "cuda_version":
                  torch.version.cuda,

              "pytorch_version":
                  torch.__version__,

              "compute_capability":
                  list(capability),

              "gpu_memory_mb":
                  round(memory_mb, 2),

              "basic_test": {

                  "shape":
                      list(y.shape),

                  "time_seconds":
                      elapsed
              },

              "requested_matrix": {

                  "size":
                      MATRIX_SIZE,

                  "shape":
                      requested_shape,

                  "time_seconds":
                      requested_time
              }
          }

          # ======================================
          # SAVE RESULT
          # ======================================

          os.makedirs(
              "/kaggle/working",
              exist_ok=True
          )

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("")
          print("======================================")
          print("             GPU SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print("")
          print(
              "RESULT FILE:"
          )

          print(
              "/kaggle/working/result.json"
          )

          PY

      # ==========================================
      # CREATE NOTEBOOK
      # ==========================================

      - name: Create Kaggle notebook
        run: |

          python - <<'PY'

          import json
          from pathlib import Path

          code = Path(
              "kaggle_job/gpu_job.py"
          ).read_text()

          notebook = {

              "cells": [

                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }

              ],

              "metadata": {

                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },

                  "language_info": {
                      "name": "python"
                  }
              },

              "nbformat": 4,
              "nbformat_minor": 5
          }

          Path(
              "kaggle_job/gpu_job.ipynb"
          ).write_text(
              json.dumps(
                  notebook,
                  indent=2
              )
          )

          PY

      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "       KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json

      # ==========================================
      # SUBMIT KAGGLE JOB
      # ==========================================

      - name: Submit Kaggle GPU job
        run: |

          cd kaggle_job

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          kaggle kernels push -p .

      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for Kaggle GPU job
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          mkdir -p kaggle_output

          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS=$(python -m kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            # ==================================
            # COMPLETE
            # ==================================

            if echo "$STATUS" | grep -Fq "KernelWorkerStatus.COMPLETE"
            then

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB COMPLETE"
              echo "======================================"

              mkdir -p kaggle_output

              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force || true

              if [ -f "kaggle_output/result.json" ]
              then

                echo ""
                echo "RESULT FOUND:"
                cat kaggle_output/result.json

              fi

              exit 0

            fi

            # ==================================
            # ERROR
            # ==================================

            if echo "$STATUS" | grep -Fq "KernelWorkerStatus.ERROR"
            then

              echo ""
              echo "======================================"
              echo "          KAGGLE JOB ERROR"
              echo "======================================"

              exit 1

            fi

            sleep 5

          done

          echo ""
          echo "======================================"
          echo "          KAGGLE JOB TIMEOUT"
          echo "======================================"

          exit 1

      # ==========================================
      # UPLOAD RESULT
      # ==========================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_job/
            kaggle_output/
          if-no-files-found: ignore
