name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string

      operation:
        required: true
        type: string

      size:
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # KAGGLE CLI
      # ==========================================

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          python -m kaggle --version


      # ==========================================
      # CREATE GPU SCRIPT
      # ==========================================

      - name: Create GPU script
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'
          import json
          import subprocess
          import sys
          import time

          print("======================================")
          print("          KAGGLE GPU WORKER")
          print("======================================")

          print("Installing compatible PyTorch...")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )

          import torch

          JOB_ID = "__JOB_ID__"
          OPERATION = "__OPERATION__"
          MATRIX_SIZE = int("__MATRIX_SIZE__")

          print("")
          print("PyTorch:", torch.__version__)
          print("CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError("CUDA is not available")

          gpu = torch.cuda.get_device_name(0)

          capability = torch.cuda.get_device_capability(0)

          props = torch.cuda.get_device_properties(0)

          memory_mb = props.total_memory / 1024 / 1024

          print("")
          print("GPU:", gpu)
          print("Compute capability:", capability)
          print("GPU memory:", round(memory_mb, 2), "MB")

          # ======================================
          # BASIC TEST
          # ======================================

          print("")
          print("Running basic GPU test...")

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          print("Basic GPU test successful.")

          # ======================================
          # REQUESTED JOB
          # ======================================

          requested_time = None
          requested_shape = None

          if OPERATION == "matrix":

              print("")
              print(
                  "Running matrix:",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE
              )

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = time.perf_counter() - start

              requested_shape = list(c.shape)

              print("Matrix GPU job successful.")

          # ======================================
          # RESULT
          # ======================================

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "SUCCESS",

              "cuda": True,

              "gpu": gpu,

              "cuda_version": torch.version.cuda,

              "pytorch_version": torch.__version__,

              "compute_capability": list(capability),

              "gpu_memory_mb": round(
                  memory_mb,
                  2
              ),

              "basic_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },

              "requested_matrix": {
                  "size": MATRIX_SIZE,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          # ======================================
          # SAVE RESULT
          # ======================================

          import os

          os.makedirs(
              "/kaggle/working",
              exist_ok=True
          )

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("")
          print("======================================")
          print("             GPU SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print("")
          print("RESULT FILE:")
          print("/kaggle/working/result.json")

          PY


          # Replace variables safely

          python - <<PY
          from pathlib import Path

          p = Path("kaggle_job/gpu_job.py")

          text = p.read_text()

          text = text.replace(
              "__JOB_ID__",
              "${JOB_ID}"
          )

          text = text.replace(
              "__OPERATION__",
              "${OPERATION}"
          )

          text = text.replace(
              "__MATRIX_SIZE__",
              "${MATRIX_SIZE}"
          )

          p.write_text(text)
          PY


      # ==========================================
      # CREATE NOTEBOOK
      # ==========================================

      - name: Create notebook
        run: |

          python - <<'PY'

          import json

          with open(
              "kaggle_job/gpu_job.py",
              "r"
          ) as f:

              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],

              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },

                  "language_info": {
                      "name": "python"
                  }
              },

              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:

              json.dump(
                  notebook,
                  f,
                  indent=2
              )

          PY


      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "       KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json


      # ==========================================
      # PUSH KAGGLE JOB
      # ==========================================

      - name: Submit Kaggle job
        run: |

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          python -m kaggle kernels push \
            -p kaggle_job

          echo ""
          echo "Kaggle job submitted."


      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for Kaggle completion
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          mkdir -p kaggle_status
          mkdir -p kaggle_output


          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS_FILE="kaggle_status/status-${i}.txt"

            python -m kaggle kernels status \
              "$KERNEL" \
              > "$STATUS_FILE" \
              2>&1 || true

            cat "$STATUS_FILE"


            # ==================================
            # COMPLETE
            # ==================================

            if grep -Fq 'KernelWorkerStatus.COMPLETE' "$STATUS_FILE"
            then

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB COMPLETE"
              echo "======================================"

              exit 0

            fi


            # ==================================
            # ERROR
            # ==================================

            if grep -Fq 'KernelWorkerStatus.ERROR' "$STATUS_FILE"
            then

              echo ""
              echo "======================================"
              echo "          KAGGLE JOB ERROR"
              echo "======================================"

              cat "$STATUS_FILE"

              exit 1

            fi


            # ==================================
            # UNKNOWN / API ERROR
            # ==================================

            if grep -Fq '404 Client Error' "$STATUS_FILE"
            then

              echo ""
              echo "Kaggle status API returned 404."

              echo "Trying output check..."

              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force \
                > output-check.txt \
                2>&1 || true

              cat output-check.txt


              if [ -f "kaggle_output/result.json" ]
              then

                echo ""
                echo "RESULT FOUND."

                exit 0

              fi

            fi


            sleep 5

          done


          echo ""
          echo "======================================"
          echo "          GPU JOB TIMEOUT"
          echo "======================================"

          exit 1


      # ==========================================
      # DOWNLOAD RESULT
      # ==========================================

      - name: Download Kaggle result
        if: success()
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       DOWNLOADING RESULT"
          echo "======================================"

          mkdir -p kaggle_output

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            --force


          echo ""
          echo "======================================"
          echo "          OUTPUT FILES"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print


      # ==========================================
      # VERIFY RESULT
      # ==========================================

      - name: Verify GPU result
        if: success()
        run: |

          echo "======================================"
          echo "          VERIFYING RESULT"
          echo "======================================"


          if [ ! -f "kaggle_output/result.json" ]
          then

            echo "ERROR:"
            echo "result.json was not found."

            echo ""
            echo "Files available:"

            find kaggle_output \
              -type f \
              -print

            exit 1

          fi


          echo ""
          echo "GPU RESULT:"
          echo ""

          cat kaggle_output/result.json


          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: gpu-result-${{ inputs.job_id }}

          path: |
            kaggle_output/
            kaggle_status/

          if-no-files-found: warn


      # ==========================================
      # FINAL
      # ==========================================

      - name: Final
        if: always()
        run: |

          echo ""
          echo "======================================"
          echo "       WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB ID:"
          echo "$JOB_ID"

          echo ""
          echo "OPERATION:"
          echo "$OPERATION"

          echo ""
          echo "MATRIX:"
          echo "$MATRIX_SIZE"
