name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string
      operation:
        description: "GPU operation"
        required: false
        default: "matrix"
        type: string
      matrix_size:
        description: "Matrix size"
        required: false
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.matrix_size }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # KAGGLE CLI
      # ==========================================

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install --upgrade kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          python -m kaggle --version

      # ==========================================
      # CHECK SECRETS
      # ==========================================

      - name: Check Kaggle credentials
        shell: bash
        run: |
          set -e

          echo "Checking Kaggle credentials..."

          if [[ -z "$KAGGLE_USERNAME" ]]; then
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "KAGGLE_USERNAME is configured."
          echo "KAGGLE_API_TOKEN is configured."

      # ==========================================
      # CREATE GPU PYTHON FILE
      # ==========================================

      - name: Create GPU job
        shell: bash
        run: |

          set -e

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'

          import json
          import os
          import subprocess
          import sys
          import time
          import traceback

          print("=" * 60)
          print("              KAGGLE GPU WORKER")
          print("=" * 60)

          JOB_ID = os.environ.get("JOB_ID", "unknown")
          OPERATION = os.environ.get("OPERATION", "matrix")
          MATRIX_SIZE = int(os.environ.get("MATRIX_SIZE", "1024"))

          print("JOB ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("MATRIX SIZE:", MATRIX_SIZE)

          # =====================================================
          # INSTALL PYTORCH
          # =====================================================

          print("")
          print("=" * 60)
          print("       INSTALLING PYTORCH")
          print("=" * 60)

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124",
              ],
              check=True,
          )

          # =====================================================
          # IMPORT TORCH
          # =====================================================

          print("")
          print("=" * 60)
          print("             IMPORT TORCH")
          print("=" * 60)

          import torch

          print("PyTorch:", torch.__version__)
          print("CUDA version:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError(
                  "CUDA is NOT available inside Kaggle GPU worker."
              )

          # =====================================================
          # GPU INFORMATION
          # =====================================================

          gpu = torch.cuda.get_device_name(0)

          capability = torch.cuda.get_device_capability(0)

          props = torch.cuda.get_device_properties(0)

          memory_mb = props.total_memory / 1024 / 1024

          print("")
          print("=" * 60)
          print("              GPU INFORMATION")
          print("=" * 60)

          print("GPU:", gpu)
          print("Compute capability:", capability)
          print("GPU memory MB:", round(memory_mb, 2))

          # =====================================================
          # BASIC GPU TEST
          # =====================================================

          print("")
          print("=" * 60)
          print("            BASIC GPU TEST")
          print("=" * 60)

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          print("Basic matrix multiplication successful.")
          print("Time:", elapsed)

          # =====================================================
          # REQUESTED OPERATION
          # =====================================================

          requested_time = None
          requested_shape = None

          if OPERATION == "matrix":

              print("")
              print("=" * 60)
              print("             MATRIX JOB")
              print("=" * 60)

              print(
                  "Matrix:",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE
              )

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = time.perf_counter() - start

              requested_shape = list(c.shape)

              print("Matrix multiplication successful.")
              print("Time:", requested_time)

              # Make sure GPU actually completed work.
              checksum = float(c[0, 0].item())

              print("Checksum:", checksum)

          else:

              raise ValueError(
                  f"Unknown operation: {OPERATION}"
              )

          # =====================================================
          # RESULT
          # =====================================================

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "SUCCESS",

              "cuda": True,

              "gpu": gpu,

              "cuda_version": torch.version.cuda,

              "pytorch_version": torch.__version__,

              "compute_capability": list(capability),

              "gpu_memory_mb": round(
                  memory_mb,
                  2
              ),

              "basic_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },

              "requested_matrix": {
                  "size": MATRIX_SIZE,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          # =====================================================
          # SAVE RESULT
          # =====================================================

          os.makedirs(
              "/kaggle/working",
              exist_ok=True
          )

          result_path = "/kaggle/working/result.json"

          with open(
              result_path,
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("")
          print("=" * 60)
          print("                GPU SUCCESS")
          print("=" * 60)

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print("")
          print("RESULT FILE:")
          print(result_path)

          PY

          echo "GPU job Python file created."

      # ==========================================
      # CREATE NOTEBOOK
      # ==========================================

      - name: Create Kaggle notebook
        shell: bash
        run: |

          set -e

          python - <<'PY'

          import json
          from pathlib import Path

          source = Path(
              "kaggle_job/gpu_job.py"
          ).read_text()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": source.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          Path(
              "kaggle_job/gpu_job.ipynb"
          ).write_text(
              json.dumps(
                  notebook,
                  indent=2
              )
          )

          PY

          echo "Notebook created."

      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle metadata
        shell: bash
        run: |

          set -e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KERNEL}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_job/kernel-metadata.json

      # ==========================================
      # SUBMIT KAGGLE
      # ==========================================

      - name: Submit Kaggle GPU job
        shell: bash
        run: |

          set -e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          cd kaggle_job

          set +e

          python -m kaggle kernels push \
            -p .

          PUSH_EXIT=$?

          set -e

          if [[ "$PUSH_EXIT" != "0" ]]; then

            echo ""
            echo "======================================"
            echo "       KAGGLE SUBMISSION FAILED"
            echo "======================================"

            exit "$PUSH_EXIT"

          fi

          echo ""
          echo "Kaggle job submitted successfully."

      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for Kaggle GPU
        shell: bash
        run: |

          set -u

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_status
          mkdir -p kaggle_output

          MAX_CHECKS=180

          for i in $(seq 1 "$MAX_CHECKS")
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/$MAX_CHECKS"
            echo "======================================"

            STATUS_FILE="kaggle_status/status-${i}.txt"

            python -m kaggle kernels status \
              "$KERNEL" \
              > "$STATUS_FILE" \
              2>&1

            STATUS_EXIT=$?

            cat "$STATUS_FILE"

            # ==========================================
            # COMPLETE
            # ==========================================

            if grep -Fq "KernelWorkerStatus.COMPLETE" "$STATUS_FILE"
            then

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB COMPLETE"
              echo "======================================"

              break

            fi

            # ==========================================
            # ERROR
            # ==========================================

            if grep -Fq "KernelWorkerStatus.ERROR" "$STATUS_FILE"
            then

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB FAILED"
              echo "======================================"

              echo ""
              echo "Downloading Kaggle output..."

              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force \
                > kaggle_output_download.log \
                2>&1

              cat kaggle_output_download.log

              echo ""
              echo "======================================"
              echo "       KAGGLE OUTPUT FILES"
              echo "======================================"

              find kaggle_output \
                -type f \
                -print || true

              echo ""
              echo "======================================"
              echo "       KAGGLE OUTPUT CONTENT"
              echo "======================================"

              while IFS= read -r FILE
              do
                echo ""
                echo "--------------------------------------"
                echo "FILE: $FILE"
                echo "--------------------------------------"

                cat "$FILE" 2>/dev/null || true

              done < <(
                find kaggle_output \
                  -type f \
                  -print
              )

              echo ""
              echo "======================================"
              echo "       KAGGLE STATUS LOG"
              echo "======================================"

              cat "$STATUS_FILE"

              exit 1

            fi

            # ==========================================
            # API ERROR
            # ==========================================

            if grep -Fq "404 Client Error" "$STATUS_FILE"
            then

              echo ""
              echo "Kaggle status API returned 404."

              echo "Trying output download..."

              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force \
                > output-check.log \
                2>&1 || true

              cat output-check.log

              if [[ -f "kaggle_output/result.json" ]]
              then

                echo ""
                echo "RESULT FOUND."

                break

              fi

            fi

            # ==========================================
            # WAIT
            # ==========================================

            echo ""
            echo "Kaggle job still running..."

            sleep 5

          done

      # ==========================================
      # DOWNLOAD RESULT
      # ==========================================

      - name: Download Kaggle result
        shell: bash
        run: |

          set -u

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          echo "======================================"
          echo "       DOWNLOADING RESULT"
          echo "======================================"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            --force \
            > final-download.log \
            2>&1

          DOWNLOAD_EXIT=$?

          cat final-download.log

          if [[ "$DOWNLOAD_EXIT" != "0" ]]; then

            echo "Kaggle output download failed."

          fi

      # ==========================================
      # SHOW RESULT
      # ==========================================

      - name: Show GPU result
        shell: bash
        run: |

          echo "======================================"
          echo "          GPU RESULT"
          echo "======================================"

          if [[ -f "kaggle_output/result.json" ]]
          then

            cat kaggle_output/result.json

          else

            echo "ERROR: result.json not found."

            echo ""
            echo "Available files:"

            find kaggle_output \
              -type f \
              -print || true

            exit 1

          fi

      # ==========================================
      # UPLOAD DEBUG ARTIFACTS
      # ==========================================

      - name: Upload Kaggle debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-debug-${{ inputs.job_id }}
          path: |
            kaggle_status/
            kaggle_output/
            *.log
          if-no-files-found: ignore
