name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      operation:
        required: true
        type: string
      size:
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle
          python -m kaggle --version

      - name: Create GPU notebook
        run: |
          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'
          import subprocess
          import sys
          import json
          import time

          print("======================================")
          print("       KAGGLE GPU WORKER")
          print("======================================")

          print("Installing PyTorch...")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )

          import torch

          job_id = "__JOB_ID__"
          operation = "__OPERATION__"
          matrix_size = int("__MATRIX_SIZE__")

          print("PyTorch:", torch.__version__)
          print("CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError("CUDA is not available")

          gpu = torch.cuda.get_device_name(0)
          capability = torch.cuda.get_device_capability(0)

          print("GPU:", gpu)
          print("Compute capability:", capability)

          memory = torch.cuda.get_device_properties(0).total_memory

          print(
              "GPU memory:",
              round(memory / 1024 / 1024, 2),
              "MB"
          )

          print("Running basic GPU test...")

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          print("Basic test successful.")
          print("Shape:", y.shape)
          print("Time:", elapsed)

          requested_time = None
          requested_shape = None

          if operation == "matrix":

              print(
                  "Running requested matrix:",
                  matrix_size,
                  "x",
                  matrix_size
              )

              a = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )

              b = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = time.perf_counter() - start

              requested_shape = list(c.shape)

              print("Requested GPU job successful.")
              print("Result shape:", c.shape)
              print("Time:", requested_time)

          result = {
              "job_id": job_id,
              "operation": operation,
              "status": "SUCCESS",
              "cuda": True,
              "gpu": gpu,
              "cuda_version": torch.version.cuda,
              "pytorch_version": torch.__version__,
              "compute_capability": list(capability),
              "gpu_memory_mb": round(
                  memory / 1024 / 1024,
                  2
              ),
              "basic_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },
              "requested_matrix": {
                  "size": matrix_size,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("======================================")
          print("             SUCCESS")
          print("======================================")

          print(json.dumps(result, indent=2))
          PY

          sed -i "s/__JOB_ID__/${JOB_ID}/g" kaggle_job/gpu_job.py
          sed -i "s/__OPERATION__/${OPERATION}/g" kaggle_job/gpu_job.py
          sed -i "s/__MATRIX_SIZE__/${MATRIX_SIZE}/g" kaggle_job/gpu_job.py

      - name: Create notebook
        run: |
          python - <<'PY'
          import json

          with open("kaggle_job/gpu_job.py") as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open("kaggle_job/gpu_job.ipynb", "w") as f:
              json.dump(
                  notebook,
                  f,
                  indent=2
              )
          PY

      - name: Create Kaggle metadata
        run: |
          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_job/kernel-metadata.json

      - name: Submit Kaggle job
        run: |
          cd kaggle_job
          python -m kaggle kernels push

      - name: Wait for GPU
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          for i in $(seq 1 60); do

            STATUS="$(python -m kaggle kernels status "$KERNEL" 2>&1 || true)"

            echo "STATUS $i/60"
            echo "$STATUS"

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.RUNNING"'; then
              echo "GPU SESSION IS RUNNING"
              exit 0
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.ERROR"'; then
              echo "KAGGLE START ERROR"
              exit 1
            fi

            sleep 5
          done

          echo "GPU did not start."
          exit 1

      - name: Wait for completion
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR GPU JOB"
          echo "======================================"

          for i in $(seq 1 180); do

            STATUS="$(python -m kaggle kernels status "$KERNEL" 2>&1 || true)"

            echo "CHECK $i/180"
            echo "$STATUS"

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.COMPLETE"'; then
              echo "GPU JOB COMPLETE"
              exit 0
            fi

            if echo "$STATUS" | grep -Fq 'status "KernelWorkerStatus.ERROR"'; then

              echo "======================================"
              echo "       KAGGLE JOB ERROR"
              echo "======================================"

              echo "$STATUS"

              mkdir -p kaggle_error

              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_error \
                || true

              echo "Kaggle error files:"

              find kaggle_error \
                -type f \
                -print \
                || true

              exit 1
            fi

            sleep 5
          done

          echo "GPU job timeout."
          exit 1

      - name: Download result
        if: success()
        run: |
          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output

          echo "======================================"
          echo "          KAGGLE OUTPUT"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print

      - name: Verify result
        if: success()
        run: |
          if [ ! -f kaggle_output/result.json ]; then
            echo "result.json not found"
            exit 1
          fi

          cat kaggle_output/result.json

          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/
            kaggle_error/
          if-no-files-found: warn

      - name: Final
        if: always()
        run: |
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"
          echo "JOB ID: $JOB_ID"
