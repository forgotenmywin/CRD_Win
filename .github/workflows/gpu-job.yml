name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        default: "matrix"
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # KAGGLE CLI
      # =====================================================

      - name: Install Kaggle
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          python -m kaggle --version


      # =====================================================
      # CHECK CREDENTIALS
      # =====================================================

      - name: Check Kaggle credentials
        shell: bash
        run: |
          set -e

          if [[ -z "$KAGGLE_USERNAME" ]]; then
            echo "KAGGLE_USERNAME is empty"
            exit 1
          fi

          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "KAGGLE_API_TOKEN is empty"
            exit 1
          fi

          echo "Kaggle credentials detected."


      # =====================================================
      # CREATE KAGGLE KERNEL
      # =====================================================

      - name: Create Kaggle kernel
        shell: bash
        run: |
          set -e

          rm -rf kaggle_kernel
          mkdir -p kaggle_kernel

          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "main.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat > kaggle_kernel/main.py <<'PYEOF'

          import os
          import sys
          import json
          import time
          import subprocess
          import traceback


          # =================================================
          # JOB INFORMATION
          # =================================================

          JOB_ID = os.environ.get(
              "JOB_ID",
              "unknown"
          )

          OPERATION = os.environ.get(
              "OPERATION",
              "matrix"
          )

          try:
              MATRIX_SIZE = int(
                  os.environ.get(
                      "MATRIX_SIZE",
                      "1024"
                  )
              )
          except Exception:
              MATRIX_SIZE = 1024


          print("=" * 60)
          print("              KAGGLE GPU WORKER")
          print("=" * 60)

          print("JOB ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("MATRIX SIZE:", MATRIX_SIZE)


          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "STARTING"
          }


          try:

              # =================================================
              # GPU INFORMATION FIRST
              # =================================================

              print("")
              print("=" * 60)
              print("             GPU INFORMATION")
              print("=" * 60)

              nvidia = subprocess.run(
                  [
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader"
                  ],
                  capture_output=True,
                  text=True
              )

              print(
                  "nvidia-smi exit:",
                  nvidia.returncode
              )

              print(
                  nvidia.stdout
              )

              if nvidia.stderr:
                  print(
                      nvidia.stderr
                  )


              # =================================================
              # INSTALL PASCAL-COMPATIBLE PYTORCH
              # =================================================

              print("")
              print("=" * 60)
              print("       INSTALLING PYTORCH 2.3.1")
              print("              CUDA 11.8")
              print("=" * 60)

              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "--no-cache-dir",
                      "--force-reinstall",
                      "torch==2.3.1",
                      "torchvision==0.18.1",
                      "torchaudio==2.3.1",
                      "--index-url",
                      "https://download.pytorch.org/whl/cu118"
                  ],
                  check=True
              )


              # =================================================
              # IMPORT TORCH
              # =================================================

              print("")
              print("=" * 60)
              print("             PYTORCH TEST")
              print("=" * 60)

              import torch


              print(
                  "PyTorch:",
                  torch.__version__
              )

              print(
                  "Torch CUDA:",
                  torch.version.cuda
              )

              print(
                  "CUDA available:",
                  torch.cuda.is_available()
              )


              result["pytorch_version"] = (
                  torch.__version__
              )

              result["cuda_version"] = (
                  torch.version.cuda
              )

              result["cuda"] = (
                  torch.cuda.is_available()
              )


              if not torch.cuda.is_available():

                  raise RuntimeError(
                      "CUDA is not available"
                  )


              # =================================================
              # GPU
              # =================================================

              gpu = torch.cuda.get_device_name(
                  0
              )

              capability = (
                  torch.cuda.get_device_capability(
                      0
                  )
              )

              props = (
                  torch.cuda.get_device_properties(
                      0
                  )
              )

              memory_mb = (
                  props.total_memory
                  / 1024
                  / 1024
              )


              print(
                  "GPU:",
                  gpu
              )

              print(
                  "Compute capability:",
                  capability
              )

              print(
                  "GPU memory:",
                  round(
                      memory_mb,
                      2
                  ),
                  "MB"
              )


              result["gpu"] = gpu

              result["compute_capability"] = (
                  list(capability)
              )

              result["gpu_memory_mb"] = round(
                  memory_mb,
                  2
              )


              # =================================================
              # IMPORTANT P100 CHECK
              # =================================================

              if capability != (6, 0):

                  print(
                      "Warning: GPU is not P100/sm_60."
                  )

              else:

                  print(
                      "Tesla P100 / sm_60 detected."
                  )


              # =================================================
              # BASIC GPU TEST
              # =================================================

              print("")
              print("=" * 60)
              print("              BASIC GPU TEST")
              print("=" * 60)


              a = torch.randn(
                  1024,
                  1024,
                  device="cuda",
                  dtype=torch.float32
              )

              b = torch.randn(
                  1024,
                  1024,
                  device="cuda",
                  dtype=torch.float32
              )


              torch.cuda.synchronize()


              start = time.perf_counter()


              c = torch.matmul(
                  a,
                  b
              )


              torch.cuda.synchronize()


              elapsed = (
                  time.perf_counter()
                  - start
              )


              print(
                  "Basic test successful."
              )

              print(
                  "Shape:",
                  list(c.shape)
              )

              print(
                  "Time:",
                  elapsed
              )


              result["basic_test"] = {
                  "shape": list(c.shape),
                  "time_seconds": elapsed
              }


              del a
              del b
              del c


              torch.cuda.empty_cache()


              # =================================================
              # REQUESTED JOB
              # =================================================

              requested_time = None
              requested_shape = None


              if OPERATION == "matrix":

                  print("")
                  print("=" * 60)
                  print("            MATRIX JOB")
                  print("=" * 60)

                  print(
                      "Size:",
                      MATRIX_SIZE
                  )


                  if MATRIX_SIZE < 1:

                      raise ValueError(
                          "Matrix size must be positive"
                      )


                  if MATRIX_SIZE > 8192:

                      raise ValueError(
                          "Matrix size too large"
                      )


                  a = torch.randn(
                      MATRIX_SIZE,
                      MATRIX_SIZE,
                      device="cuda",
                      dtype=torch.float32
                  )

                  b = torch.randn(
                      MATRIX_SIZE,
                      MATRIX_SIZE,
                      device="cuda",
                      dtype=torch.float32
                  )


                  torch.cuda.synchronize()


                  start = time.perf_counter()


                  c = torch.matmul(
                      a,
                      b
                  )


                  torch.cuda.synchronize()


                  requested_time = (
                      time.perf_counter()
                      - start
                  )


                  requested_shape = (
                      list(c.shape)
                  )


                  # Force result to be read.
                  checksum = float(
                      c[0, 0].item()
                  )


                  print(
                      "Matrix successful."
                  )

                  print(
                      "Shape:",
                      requested_shape
                  )

                  print(
                      "Time:",
                      requested_time
                  )

                  print(
                      "Checksum:",
                      checksum
                  )


                  result["requested_matrix"] = {

                      "size": MATRIX_SIZE,

                      "shape": requested_shape,

                      "time_seconds":
                          requested_time,

                      "checksum":
                          checksum

                  }


                  del a
                  del b
                  del c

                  torch.cuda.empty_cache()


              else:

                  raise ValueError(
                      "Unsupported operation: "
                      + OPERATION
                  )


              # =================================================
              # SUCCESS
              # =================================================

              result["status"] = "SUCCESS"


              print("")
              print("=" * 60)
              print("              GPU SUCCESS")
              print("=" * 60)


              print(
                  json.dumps(
                      result,
                      indent=2
                  )
              )


          except Exception as e:

              result["status"] = "ERROR"

              result["error"] = str(e)

              result["exception"] = (
                  type(e).__name__
              )

              result["traceback"] = (
                  traceback.format_exc()
              )


              print("")
              print("=" * 60)
              print("               GPU ERROR")
              print("=" * 60)


              print(
                  str(e)
              )

              traceback.print_exc()


          # =================================================
          # ALWAYS WRITE RESULT
          # =================================================

          os.makedirs(
              "/kaggle/working",
              exist_ok=True
          )


          result_path = (
              "/kaggle/working/result.json"
          )


          with open(
              result_path,
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print("")
          print(
              "RESULT FILE:",
              result_path
          )


          # If failed, make Kernel fail.
          if result["status"] != "SUCCESS":

              raise RuntimeError(
                  result.get(
                      "error",
                      "GPU job failed"
                  )
              )

          PYEOF

          echo "======================================"
          echo "       KAGGLE KERNEL FILES"
          echo "======================================"

          ls -lah kaggle_kernel

          echo ""
          cat kaggle_kernel/kernel-metadata.json


      # =====================================================
      # PUSH
      # =====================================================

      - name: Submit Kaggle GPU job
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          kaggle kernels push \
            -p kaggle_kernel

          echo ""
          echo "Kaggle kernel submitted."


      # =====================================================
      # WAIT
      # =====================================================

      - name: Wait for Kaggle GPU
        shell: bash
        run: |
          set +e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          FINAL_STATUS=""

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          for i in $(seq 1 180)
          do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"


            STATUS=$(

              kaggle kernels status \
                "$KERNEL" \
                2>&1

            )


            echo "$STATUS"


            # ---------------------------------------------
            # COMPLETE
            # ---------------------------------------------

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.COMPLETE"
            then

              FINAL_STATUS="COMPLETE"

              echo ""
              echo "KAGGLE JOB COMPLETE"

              break

            fi


            # ---------------------------------------------
            # ERROR
            # ---------------------------------------------

            if echo "$STATUS" | grep -q \
              "KernelWorkerStatus.ERROR"
            then

              FINAL_STATUS="ERROR"

              echo ""
              echo "KAGGLE JOB ERROR"

              break

            fi


            sleep 5

          done


          # =================================================
          # DOWNLOAD OUTPUT
          # =================================================

          echo ""
          echo "======================================"
          echo "       DOWNLOADING KAGGLE OUTPUT"
          echo "======================================"


          kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            --force


          OUTPUT_EXIT=$?


          echo ""
          echo "Output exit code:"
          echo "$OUTPUT_EXIT"


          echo ""
          echo "======================================"
          echo "          OUTPUT FILES"
          echo "======================================"


          find kaggle_output \
            -type f \
            -print


          # =================================================
          # SHOW RESULT
          # =================================================

          echo ""
          echo "======================================"
          echo "            RESULT.JSON"
          echo "======================================"


          RESULT_FILE=$(
            find kaggle_output \
              -type f \
              -name "result.json" \
              | head -n 1
          )


          if [[ -n "$RESULT_FILE" ]]
          then

            cat "$RESULT_FILE"

          else

            echo "result.json not found."

          fi


          # =================================================
          # SHOW LOG
          # =================================================

          echo ""
          echo "======================================"
          echo "              LOG FILES"
          echo "======================================"


          find kaggle_output \
            -type f \
            -name "*.log" \
            -print


          # =================================================
          # FINAL
          # =================================================

          echo ""
          echo "======================================"
          echo "        FINAL KAGGLE STATUS"
          echo "======================================"

          echo "FINAL_STATUS=$FINAL_STATUS"


          if [[ "$FINAL_STATUS" != "COMPLETE" ]]
          then

            echo "Kaggle job failed."

            exit 1

          fi


          if [[ ! -f "$RESULT_FILE" ]]
          then

            echo "Kaggle completed but result.json missing."

            exit 1

          fi


          # Check actual worker status.
          WORKER_STATUS=$(
            python -c '
          import json
          import sys

          try:
              with open(sys.argv[1]) as f:
                  d = json.load(f)

              print(d.get("status", "UNKNOWN"))

          except Exception:
              print("UNKNOWN")
          ' "$RESULT_FILE"
          )


          echo "Worker status: $WORKER_STATUS"


          if [[ "$WORKER_STATUS" != "SUCCESS" ]]
          then

            echo "GPU worker reported an error."

            exit 1

          fi


          echo ""
          echo "GPU JOB SUCCESS."


      # =====================================================
      # UPLOAD
      # =====================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/
          if-no-files-found: warn


      # =====================================================
      # FINAL
      # =====================================================

      - name: Final
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB ID:"
          echo "$JOB_ID"

          echo "OPERATION:"
          echo "$OPERATION"

          echo "SIZE:"
          echo "$MATRIX_SIZE"
