name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string

      operation:
        required: true
        type: string

      size:
        required: true
        default: "1024"
        type: string

jobs:

  gpu-job:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # KAGGLE CLI
      # ==========================================

      - name: Install Kaggle
        run: |

          python -m pip install --upgrade pip

          python -m pip install kaggle

          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          python -m kaggle --version


      # ==========================================
      # CREATE GPU PYTHON CODE
      # ==========================================

      - name: Create GPU Worker
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'

          import json
          import subprocess
          import sys
          import time


          print("======================================")
          print("          KAGGLE GPU WORKER")
          print("======================================")


          # ======================================
          # INSTALL PYTORCH
          # ======================================

          print("Installing PyTorch...")


          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )


          import torch


          # ======================================
          # JOB VARIABLES
          # ======================================

          job_id = "__JOB_ID__"

          operation = "__OPERATION__"

          matrix_size = int("__MATRIX_SIZE__")


          print("Job ID:", job_id)
          print("Operation:", operation)
          print("Matrix size:", matrix_size)


          # ======================================
          # CUDA
          # ======================================

          print("PyTorch:", torch.__version__)

          print("CUDA version:", torch.version.cuda)

          print(
              "CUDA available:",
              torch.cuda.is_available()
          )


          if not torch.cuda.is_available():

              raise RuntimeError(
                  "CUDA is not available"
              )


          # ======================================
          # GPU INFORMATION
          # ======================================

          gpu = torch.cuda.get_device_name(0)

          capability = torch.cuda.get_device_capability(0)

          properties = torch.cuda.get_device_properties(0)

          memory = properties.total_memory


          print("GPU:", gpu)

          print(
              "Compute capability:",
              capability
          )

          print(
              "GPU memory:",
              round(
                  memory / 1024 / 1024,
                  2
              ),
              "MB"
          )


          # ======================================
          # BASIC GPU TEST
          # ======================================

          print("======================================")
          print("          BASIC GPU TEST")
          print("======================================")


          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )


          torch.cuda.synchronize()


          start = time.perf_counter()


          y = x @ x


          torch.cuda.synchronize()


          elapsed = (
              time.perf_counter()
              - start
          )


          print(
              "Basic test successful"
          )

          print(
              "Shape:",
              list(y.shape)
          )

          print(
              "Time:",
              elapsed
          )


          # ======================================
          # REQUESTED JOB
          # ======================================

          requested_time = None

          requested_shape = None


          if operation == "matrix":

              print("======================================")

              print(
                  "      REQUESTED MATRIX TEST"
              )

              print("======================================")


              print(
                  "Matrix:",
                  matrix_size,
                  "x",
                  matrix_size
              )


              a = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )


              b = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )


              torch.cuda.synchronize()


              start = time.perf_counter()


              c = a @ b


              torch.cuda.synchronize()


              requested_time = (
                  time.perf_counter()
                  - start
              )


              requested_shape = list(
                  c.shape
              )


              print(
                  "Requested matrix completed"
              )


              print(
                  "Shape:",
                  requested_shape
              )


              print(
                  "Time:",
                  requested_time
              )


          else:

              print(
                  "Unknown operation:",
                  operation
              )


          # ======================================
          # RESULT
          # ======================================

          result = {

              "job_id": job_id,

              "operation": operation,

              "status": "SUCCESS",

              "cuda": True,

              "gpu": gpu,

              "cuda_version": torch.version.cuda,

              "pytorch_version": torch.__version__,

              "compute_capability": list(
                  capability
              ),

              "gpu_memory_mb": round(
                  memory / 1024 / 1024,
                  2
              ),

              "basic_test": {

                  "shape": list(
                      y.shape
                  ),

                  "time_seconds": elapsed

              },

              "requested_matrix": {

                  "size": matrix_size,

                  "shape": requested_shape,

                  "time_seconds": requested_time

              }

          }


          # ======================================
          # SAVE RESULT
          # ======================================

          result_path = "/kaggle/working/result.json"


          with open(
              result_path,
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print("======================================")
          print("             GPU SUCCESS")
          print("======================================")


          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print(
              "RESULT FILE:",
              result_path
          )

          PY


          # ======================================
          # INSERT VARIABLES
          # ======================================

          sed -i \
            "s/__JOB_ID__/${JOB_ID}/g" \
            kaggle_job/gpu_job.py


          sed -i \
            "s/__OPERATION__/${OPERATION}/g" \
            kaggle_job/gpu_job.py


          sed -i \
            "s/__MATRIX_SIZE__/${MATRIX_SIZE}/g" \
            kaggle_job/gpu_job.py


          echo "GPU worker created."


      # ==========================================
      # CREATE NOTEBOOK
      # ==========================================

      - name: Create Kaggle Notebook
        run: |

          python - <<'PY'

          import json


          with open(
              "kaggle_job/gpu_job.py",
              "r"
          ) as f:

              code = f.read()


          notebook = {

              "cells": [

                  {

                      "cell_type": "code",

                      "execution_count": None,

                      "metadata": {},

                      "outputs": [],

                      "source": code.splitlines(
                          True
                      )

                  }

              ],

              "metadata": {

                  "kernelspec": {

                      "display_name": "Python 3",

                      "language": "python",

                      "name": "python3"

                  },

                  "language_info": {

                      "name": "python"

                  }

              },

              "nbformat": 4,

              "nbformat_minor": 5

          }


          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:

              json.dump(
                  notebook,
                  f,
                  indent=2
              )

          PY


          echo "Notebook created."


      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF

          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }

          EOF


          echo "======================================"
          echo "       KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json


      # ==========================================
      # SUBMIT
      # ==========================================

      - name: Submit Kaggle Job
        run: |

          cd kaggle_job

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "        KAGGLE JOB SUBMITTED"
          echo "======================================"


      # ==========================================
      # WAIT FOR KAGGLE
      # ==========================================

      - name: Wait for Kaggle Job
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"


          echo "======================================"
          echo "       WAITING FOR KAGGLE JOB"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"


          mkdir -p kaggle_output

          mkdir -p kaggle_error


          # ======================================
          # WAIT
          # ======================================

          for i in $(seq 1 180); do


            echo ""

            echo "======================================"

            echo "CHECK $i/180"

            echo "======================================"


            STATUS="$(
              python -m kaggle kernels status \
                "$KERNEL" \
                2>&1 \
                || true
            )"


            echo "$STATUS"


            # ==================================
            # COMPLETE
            # ==================================

            if echo "$STATUS" | grep -Fq \
              'KernelWorkerStatus.COMPLETE'
            then

              echo ""

              echo "======================================"

              echo "       KAGGLE JOB COMPLETE"

              echo "======================================"


              echo "Downloading output..."


              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_output \
                --force


              echo ""

              echo "Kaggle output files:"


              find kaggle_output \
                -type f \
                -print


              # ==================================
              # RESULT
              # ==================================

              if [ -f \
                "kaggle_output/result.json"
              ]; then


                echo ""

                echo "======================================"

                echo "          GPU RESULT FOUND"

                echo "======================================"


                cat \
                  kaggle_output/result.json


                exit 0

              fi


              echo ""

              echo "ERROR: result.json not found."


              find kaggle_output \
                -type f \
                -print


              exit 1

            fi


            # ==================================
            # ERROR
            # ==================================

            if echo "$STATUS" | grep -Fq \
              'KernelWorkerStatus.ERROR'
            then

              echo ""

              echo "======================================"

              echo "          KAGGLE JOB ERROR"

              echo "======================================"


              echo "$STATUS"


              echo ""

              echo "Trying to download error output..."


              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_error \
                --force \
                || true


              echo ""

              echo "Error files:"


              find kaggle_error \
                -type f \
                -print \
                || true


              exit 1

            fi


            # ==================================
            # STATUS
            # ==================================

            if echo "$STATUS" | grep -Fq \
              'KernelWorkerStatus.RUNNING'
            then

              echo "GPU job is RUNNING."


            elif echo "$STATUS" | grep -Fq \
              'KernelWorkerStatus.QUEUED'
            then

              echo "GPU job is QUEUED."


            else

              echo "GPU job status not recognized yet."

            fi


            sleep 5

          done


          # ======================================
          # TIMEOUT
          # ======================================

          echo ""

          echo "======================================"

          echo "          GPU JOB TIMEOUT"

          echo "======================================"


          echo "Last status:"


          python -m kaggle kernels status \
            "$KERNEL" \
            2>&1 \
            || true


          exit 1


      # ==========================================
      # VERIFY RESULT
      # ==========================================

      - name: Verify Result
        if: success()
        run: |

          echo "======================================"
          echo "          VERIFYING RESULT"
          echo "======================================"


          if [ ! -f \
            "kaggle_output/result.json"
          ]; then

            echo "result.json not found."

            find kaggle_output \
              -type f \
              -print

            exit 1

          fi


          echo "Result found:"


          cat \
            kaggle_output/result.json


          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload GPU Result
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: gpu-result-${{ inputs.job_id }}

          path: |
            kaggle_output/
            kaggle_error/

          if-no-files-found: warn


      # ==========================================
      # FINAL
      # ==========================================

      - name: Final
        if: always()
        run: |

          echo "======================================"

          echo "          WORKFLOW FINISHED"

          echo "======================================"

          echo "JOB ID: $JOB_ID"
