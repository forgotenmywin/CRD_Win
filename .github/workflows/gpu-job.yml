name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string


jobs:

  gpu-job:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}


    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # INSTALL KAGGLE CLI
      # ==================================================

      - name: Install Kaggle CLI
        run: |

          python -m pip install --upgrade pip

          python -m pip install kaggle

          echo ""
          echo "======================================"
          echo "          KAGGLE VERSION"
          echo "======================================"

          python -m kaggle --version


      # ==================================================
      # SHOW REQUEST
      # ==================================================

      - name: Show GPU request
        run: |

          echo ""
          echo "======================================"
          echo "          GPU JOB REQUEST"
          echo "======================================"

          echo "JOB_ID:"
          echo "$JOB_ID"

          echo "OPERATION:"
          echo "$OPERATION"

          echo "MATRIX_SIZE:"
          echo "$MATRIX_SIZE"


      # ==================================================
      # CREATE KAGGLE NOTEBOOK
      # ==================================================

      - name: Create Kaggle notebook
        run: |

          mkdir -p kaggle_job


          cat > kaggle_job/gpu_job.py <<'PYCODE'

import subprocess
import sys
import json
import time


# ==================================================
# INSTALL PYTORCH INSIDE KAGGLE
# ==================================================

print("======================================")
print("      PREPARING PYTORCH")
print("======================================")

print("Python:", sys.version)


print()
print("Installing PyTorch compatible with Pascal/P100...")


subprocess.run(
    [
        sys.executable,
        "-m",
        "pip",
        "install",
        "--no-cache-dir",
        "-q",
        "torch==2.5.1",
        "--index-url",
        "https://download.pytorch.org/whl/cu124"
    ],
    check=True
)


print()
print("PyTorch installation finished.")


# ==================================================
# IMPORT TORCH AFTER INSTALLATION
# ==================================================

import torch


# ==================================================
# JOB PARAMETERS
# ==================================================

JOB_ID = "__JOB_ID__"
OPERATION = "__OPERATION__"
MATRIX_SIZE = int("__MATRIX_SIZE__")


# ==================================================
# GPU INFORMATION
# ==================================================

print()
print("======================================")
print("          KAGGLE GPU INFO")
print("======================================")


print("PyTorch version:")
print(torch.__version__)


print()
print("PyTorch CUDA:")
print(torch.version.cuda)


print()
print("CUDA available:")

cuda_available = torch.cuda.is_available()

print(cuda_available)


if not cuda_available:

    result = {
        "job_id": JOB_ID,
        "operation": OPERATION,
        "status": "ERROR",
        "cuda": False,
        "error": "CUDA is not available"
    }

    with open(
        "/kaggle/working/result.json",
        "w"
    ) as f:

        json.dump(
            result,
            f,
            indent=2
        )

    raise RuntimeError(
        "CUDA is not available"
    )


# ==================================================
# GPU
# ==================================================

gpu = torch.cuda.get_device_name(0)

capability = torch.cuda.get_device_capability(0)

device = torch.device("cuda")


print()
print("GPU:")
print(gpu)


print()
print("Compute capability:")
print(capability)


print()
print("GPU memory:")

memory = torch.cuda.get_device_properties(0).total_memory

print(
    round(
        memory / 1024 / 1024,
        2
    ),
    "MB"
)


# ==================================================
# BASIC GPU TEST
# ==================================================

print()
print("======================================")
print("        BASIC GPU TEST")
print("======================================")


print("Creating tensor...")


x = torch.randn(
    1024,
    1024,
    device=device
)


torch.cuda.synchronize()


print("Running matrix multiplication...")


start = time.perf_counter()


y = x @ x


torch.cuda.synchronize()


elapsed = time.perf_counter() - start


print()
print("Basic GPU test successful.")


print("Shape:")
print(y.shape)


print("Time:")
print(elapsed)


# ==================================================
# REQUESTED JOB
# ==================================================

requested_time = None

requested_shape = None


if OPERATION == "matrix":

    print()
    print("======================================")
    print("       REQUESTED GPU JOB")
    print("======================================")


    print(
        "Matrix:",
        MATRIX_SIZE,
        "x",
        MATRIX_SIZE
    )


    print()
    print("Allocating tensors...")


    a = torch.randn(
        MATRIX_SIZE,
        MATRIX_SIZE,
        device=device,
        dtype=torch.float32
    )


    b = torch.randn(
        MATRIX_SIZE,
        MATRIX_SIZE,
        device=device,
        dtype=torch.float32
    )


    torch.cuda.synchronize()


    print("Running GPU calculation...")


    start = time.perf_counter()


    c = torch.matmul(
        a,
        b
    )


    torch.cuda.synchronize()


    requested_time = (
        time.perf_counter()
        - start
    )


    requested_shape = list(
        c.shape
    )


    print()
    print("GPU calculation complete.")


    print(
        "Result shape:",
        c.shape
    )


    print(
        "Calculation time:",
        requested_time,
        "seconds"
    )


# ==================================================
# RESULT
# ==================================================

result = {

    "job_id": JOB_ID,

    "operation": OPERATION,

    "status": "SUCCESS",

    "cuda": True,

    "gpu": gpu,

    "cuda_version": torch.version.cuda,

    "pytorch_version": torch.__version__,

    "compute_capability": list(
        capability
    ),

    "gpu_memory_mb": round(
        memory / 1024 / 1024,
        2
    ),

    "basic_test": {

        "shape": list(
            y.shape
        ),

        "time_seconds": elapsed
    },

    "requested_matrix": {

        "size": MATRIX_SIZE,

        "shape": requested_shape,

        "time_seconds": requested_time
    }
}


# ==================================================
# SAVE RESULT
# ==================================================

with open(
    "/kaggle/working/result.json",
    "w"
) as f:

    json.dump(
        result,
        f,
        indent=2
    )


print()
print("======================================")
print("             GPU RESULT")
print("======================================")


print(
    json.dumps(
        result,
        indent=2
    )
)


print()
print("======================================")
print("          GPU JOB SUCCESS")
print("======================================")


PYCODE


          # Replace parameters safely

          sed -i \
            "s/__JOB_ID__/${JOB_ID}/g" \
            kaggle_job/gpu_job.py

          sed -i \
            "s/__OPERATION__/${OPERATION}/g" \
            kaggle_job/gpu_job.py

          sed -i \
            "s/__MATRIX_SIZE__/${MATRIX_SIZE}/g" \
            kaggle_job/gpu_job.py


      # ==================================================
      # CREATE NOTEBOOK
      # ==================================================

      - name: Create notebook
        run: |

          python - <<'PYTHON'

import json


with open(
    "kaggle_job/gpu_job.py",
    "r"
) as f:

    code = f.read()


notebook = {

    "cells": [

        {

            "cell_type": "code",

            "execution_count": None,

            "metadata": {},

            "outputs": [],

            "source": code.splitlines(
                True
            )
        }

    ],

    "metadata": {

        "kernelspec": {

            "display_name": "Python 3",

            "language": "python",

            "name": "python3"
        },

        "language_info": {

            "name": "python"
        }

    },

    "nbformat": 4,

    "nbformat_minor": 5
}


with open(
    "kaggle_job/gpu_job.ipynb",
    "w"
) as f:

    json.dump(
        notebook,
        f,
        indent=2
    )


print(
    "Notebook created."
)

PYTHON


      # ==================================================
      # KAGGLE METADATA
      # ==================================================

      - name: Create Kaggle metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF

          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }

          EOF


          echo ""
          echo "======================================"
          echo "       KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json


      # ==================================================
      # SUBMIT KAGGLE
      # ==================================================

      - name: Submit Kaggle GPU job
        run: |

          cd kaggle_job

          python -m kaggle kernels push


          echo ""
          echo "======================================"
          echo "       KAGGLE GPU JOB SUBMITTED"
          echo "======================================"


      # ==================================================
      # WAIT FOR GPU
      # ==================================================

      - name: Wait for Kaggle GPU
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"


          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"


          for i in $(seq 1 60)
          do

            echo ""
            echo "========== STATUS $i/60 =========="


            STATUS=$(
              python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true
            )


            echo "$STATUS"


            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.RUNNING"'
            then

              echo ""
              echo "======================================"
              echo "       GPU SESSION IS RUNNING"
              echo "======================================"

              exit 0

            fi


            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.ERROR"'
            then

              echo ""
              echo "======================================"
              echo "       GPU START ERROR"
              echo "======================================"

              echo "$STATUS"

              exit 1

            fi


            sleep 5

          done


          echo "GPU did not start."

          exit 1


      # ==================================================
      # WAIT FOR COMPLETION
      # ==================================================

      - name: Wait for GPU job
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"


          echo ""
          echo "======================================"
          echo "       WAITING FOR GPU JOB"
          echo "======================================"


          for i in $(seq 1 180)
          do

            echo ""
            echo "========== CHECK $i/180 =========="


            STATUS=$(
              python -m kaggle kernels status \
              "$KERNEL" 2>&1 || true
            )


            echo "$STATUS"


            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.COMPLETE"'
            then

              echo ""
              echo "======================================"
              echo "       GPU JOB COMPLETE"
              echo "======================================"

              exit 0

            fi


            if echo "$STATUS" | grep -Fq \
              'status "KernelWorkerStatus.ERROR"'
            then

              echo ""
              echo "======================================"
              echo "       KAGGLE JOB ERROR"
              echo "======================================"


              echo "$STATUS"


              echo ""
              echo "Downloading Kaggle output..."


              mkdir -p kaggle_error


              python -m kaggle kernels output \
                "$KERNEL" \
                -p kaggle_error \
                || true


              echo ""
              echo "======================================"
              echo "       KAGGLE ERROR FILES"
              echo "======================================"


              find kaggle_error \
                -type f \
                -print \
                || true


              echo ""
              echo "======================================"
              echo "       KAGGLE ERROR CONTENT"
              echo "======================================"


              find kaggle_error \
                -type f \
                -exec sh -c \
                'echo "----- $1 -----"; cat "$1"' \
                _ {} \; \
                || true


              exit 1

            fi


            sleep 5

          done


          echo "GPU job timeout."

          exit 1


      # ==================================================
      # DOWNLOAD RESULT
      # ==================================================

      - name: Download Kaggle result
        if: success()
        run: |

          mkdir -p kaggle_output


          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"


          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true


          echo ""
          echo "======================================"
          echo "       KAGGLE OUTPUT"
          echo "======================================"


          find kaggle_output \
            -type f \
            -print \
            || true


      # ==================================================
      # VERIFY RESULT
      # ==================================================

      - name: Verify result
        if: success()
        run: |

          echo ""
          echo "======================================"
          echo "       VERIFYING GPU RESULT"
          echo "======================================"


          if [ ! -f kaggle_output/result.json ]
          then

            echo "ERROR:"
            echo "result.json not found."


            echo ""
            echo "Available files:"


            find kaggle_output \
              -type f \
              -print \
              || true


            exit 1

          fi


          echo ""
          cat kaggle_output/result.json


          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json


          echo "SUCCESS" \
            > kaggle_output/status.txt


      # ==================================================
      # UPLOAD ARTIFACT
      # ==================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/
            kaggle_error/
          if-no-files-found: warn


      # ==================================================
      # FINAL
      # ==================================================

      - name: Final status
        if: always()
        run: |

          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB_ID=$JOB_ID"

          echo "OPERATION=$OPERATION"

          echo "MATRIX_SIZE=$MATRIX_SIZE"
