name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # INSTALL KAGGLE
      # ==================================================

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo ""
          echo "Kaggle version:"
          python -m kaggle --version

      # ==================================================
      # SHOW JOB
      # ==================================================

      - name: Show request
        run: |
          echo "======================================"
          echo "          GPU JOB REQUEST"
          echo "======================================"

          echo "JOB_ID=$JOB_ID"
          echo "OPERATION=$OPERATION"
          echo "MATRIX_SIZE=$MATRIX_SIZE"

      # ==================================================
      # CREATE NOTEBOOK
      # ==================================================

      - name: Create Kaggle notebook
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<PY

          import json
          import time
          import torch

          JOB_ID = "${JOB_ID}"
          OPERATION = "${OPERATION}"
          MATRIX_SIZE = int("${MATRIX_SIZE}")

          print("======================================")
          print("          KAGGLE GPU TEST")
          print("======================================")

          print("JOB ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("MATRIX SIZE:", MATRIX_SIZE)

          # ==========================================
          # CUDA TEST
          # ==========================================

          print()
          print("Checking CUDA...")

          cuda = torch.cuda.is_available()

          print("CUDA available:", cuda)

          if not cuda:

              result = {
                  "job_id": JOB_ID,
                  "operation": OPERATION,
                  "status": "ERROR",
                  "error": "CUDA is not available"
              }

              with open(
                  "/kaggle/working/result.json",
                  "w"
              ) as f:
                  json.dump(
                      result,
                      f,
                      indent=2
                  )

              raise RuntimeError(
                  "CUDA is not available"
              )

          # ==========================================
          # GPU INFORMATION
          # ==========================================

          gpu = torch.cuda.get_device_name(0)

          cuda_version = torch.version.cuda

          capability = torch.cuda.get_device_capability(0)

          print()
          print("GPU:", gpu)
          print("CUDA:", cuda_version)
          print("Compute capability:", capability)

          # ==========================================
          # SIMPLE GPU TEST
          # ==========================================

          print()
          print("======================================")
          print("        SIMPLE GPU TEST")
          print("======================================")

          device = torch.device("cuda")

          print("Creating GPU tensor...")

          x = torch.randn(
              1024,
              1024,
              device=device
          )

          print("Running matrix multiplication...")

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          print("GPU calculation finished.")

          print("Result shape:", y.shape)

          print(
              "GPU calculation time:",
              elapsed,
              "seconds"
          )

          # ==========================================
          # OPTIONAL REQUESTED MATRIX
          # ==========================================

          requested_time = None
          requested_shape = None

          if OPERATION == "matrix":

              print()
              print("======================================")
              print("       REQUESTED GPU MATRIX")
              print("======================================")

              print(
                  "Creating",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE
              )

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device=device,
                  dtype=torch.float32
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device=device,
                  dtype=torch.float32
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = (
                  time.perf_counter() - start
              )

              requested_shape = list(c.shape)

              print(
                  "Requested matrix complete."
              )

              print(
                  "Shape:",
                  c.shape
              )

              print(
                  "Time:",
                  requested_time,
                  "seconds"
              )

              del a
              del b
              del c

          # ==========================================
          # RESULT
          # ==========================================

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "SUCCESS",

              "cuda": True,

              "gpu": gpu,

              "cuda_version": cuda_version,

              "compute_capability": list(
                  capability
              ),

              "simple_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },

              "requested_matrix": {
                  "size": MATRIX_SIZE,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          # ==========================================
          # SAVE
          # ==========================================

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print()
          print("======================================")
          print("             RESULT")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print()
          print("======================================")
          print("        GPU TEST SUCCESS")
          print("======================================")

          PY

          # ==================================================
          # CREATE IPYNB
          # ==================================================

          python - <<'PYTHON'

          import json

          with open(
              "kaggle_job/gpu_job.py",
              "r"
          ) as f:

              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],

              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },

                  "language_info": {
                      "name": "python"
                  }
              },

              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:

              json.dump(
                  notebook,
                  f,
                  indent=2
              )

          print(
              "Notebook created successfully."
          )

          PYTHON

      # ==================================================
      # KAGGLE METADATA
      # ==================================================

      - name: Create Kaggle metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          echo "======================================"
          echo "       KAGGLE METADATA"
          echo "======================================"

          cat kaggle_job/kernel-metadata.json

      # ==================================================
      # SUBMIT
      # ==================================================

      - name: Submit Kaggle GPU job
        run: |

          cd kaggle_job

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "       KAGGLE JOB SUBMITTED"
          echo "======================================"

      # ==================================================
      # WAIT FOR START
      # ==================================================

      - name: Wait for Kaggle GPU
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          for i in $(seq 1 60)
          do

              echo ""
              echo "========== STATUS $i/60 =========="

              STATUS=$(
                python -m kaggle kernels status \
                "$KERNEL" 2>&1 || true
              )

              echo "$STATUS"

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.RUNNING"'
              then

                  echo ""
                  echo "======================================"
                  echo "       GPU SESSION IS RUNNING"
                  echo "======================================"

                  exit 0

              fi

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.ERROR"'
              then

                  echo ""
                  echo "======================================"
                  echo "       GPU START ERROR"
                  echo "======================================"

                  echo "$STATUS"

                  exit 1

              fi

              sleep 5

          done

          echo "GPU did not start."

          exit 1

      # ==================================================
      # WAIT FOR COMPLETION
      # ==================================================

      - name: Wait for GPU job
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR GPU JOB"
          echo "======================================"

          for i in $(seq 1 180)
          do

              echo ""
              echo "========== CHECK $i/180 =========="

              STATUS=$(
                python -m kaggle kernels status \
                "$KERNEL" 2>&1 || true
              )

              echo "$STATUS"

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.COMPLETE"'
              then

                  echo ""
                  echo "======================================"
                  echo "       GPU JOB COMPLETE"
                  echo "======================================"

                  exit 0

              fi

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.ERROR"'
              then

                  echo ""
                  echo "======================================"
                  echo "       KAGGLE JOB ERROR"
                  echo "======================================"

                  echo "$STATUS"

                  echo ""
                  echo "Downloading Kaggle output..."

                  mkdir -p kaggle_error

                  python -m kaggle kernels output \
                    "$KERNEL" \
                    -p kaggle_error \
                    || true

                  echo ""
                  echo "======================================"
                  echo "       KAGGLE ERROR FILES"
                  echo "======================================"

                  find kaggle_error \
                    -type f \
                    -print \
                    || true

                  echo ""
                  echo "======================================"
                  echo "       KAGGLE ERROR CONTENT"
                  echo "======================================"

                  find kaggle_error \
                    -type f \
                    -print \
                    -exec sh -c \
                    'echo "----- $1 -----"; cat "$1"' \
                    _ {} \; \
                    || true

                  exit 1

              fi

              sleep 5

          done

          echo "GPU job timeout."

          exit 1

      # ==================================================
      # DOWNLOAD RESULT
      # ==================================================

      - name: Download Kaggle result
        if: success()
        run: |

          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true

          echo ""
          echo "======================================"
          echo "       KAGGLE OUTPUT"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print \
            || true

      # ==================================================
      # VERIFY
      # ==================================================

      - name: Verify GPU result
        if: success()
        run: |

          echo ""
          echo "======================================"
          echo "       VERIFYING RESULT"
          echo "======================================"

          if [ ! -f kaggle_output/result.json ]
          then

              echo "ERROR:"
              echo "result.json was not found."

              echo ""
              echo "Available files:"

              find kaggle_output \
                -type f \
                -print \
                || true

              exit 1

          fi

          echo ""
          cat kaggle_output/result.json

          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json

          echo "SUCCESS" \
            > kaggle_output/status.txt

      # ==================================================
      # UPLOAD ARTIFACT
      # ==================================================

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/
            kaggle_error/
          if-no-files-found: warn

      # ==================================================
      # FINAL
      # ==================================================

      - name: Final status
        if: always()
        run: |

          echo ""
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "Job ID: $JOB_ID"
          echo "Operation: $OPERATION"
          echo "Matrix: $MATRIX_SIZE"
