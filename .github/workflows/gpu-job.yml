name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "4096"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # INSTALL KAGGLE
      # ==========================================

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

          echo ""
          python -m kaggle --version

      # ==========================================
      # SHOW JOB
      # ==========================================

      - name: Show GPU job
        run: |
          echo "======================================"
          echo "          GPU JOB REQUEST"
          echo "======================================"

          echo "JOB_ID: $JOB_ID"
          echo "OPERATION: $OPERATION"
          echo "MATRIX_SIZE: $MATRIX_SIZE"

      # ==========================================
      # CREATE KAGGLE NOTEBOOK
      # ==========================================

      - name: Create Kaggle notebook
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<PYTHON

          import torch
          import json
          import time
          import os

          JOB_ID = "${JOB_ID}"
          OPERATION = "${OPERATION}"
          MATRIX_SIZE = int("${MATRIX_SIZE}")

          print("======================================")
          print("          KAGGLE GPU WORKER")
          print("======================================")

          print("JOB_ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("MATRIX_SIZE:", MATRIX_SIZE)

          # ======================================
          # GPU CHECK
          # ======================================

          print()
          print("Checking CUDA...")

          cuda_available = torch.cuda.is_available()

          print("CUDA available:", cuda_available)

          if not cuda_available:

              result = {
                  "job_id": JOB_ID,
                  "operation": OPERATION,
                  "status": "ERROR",
                  "error": "CUDA is not available"
              }

              with open(
                  "/kaggle/working/result.json",
                  "w"
              ) as f:
                  json.dump(result, f, indent=2)

              raise RuntimeError(
                  "CUDA is not available"
              )

          # ======================================
          # GPU INFORMATION
          # ======================================

          gpu_name = torch.cuda.get_device_name(0)
          cuda_version = torch.version.cuda

          capability = torch.cuda.get_device_capability(0)

          print()
          print("GPU:", gpu_name)
          print("CUDA:", cuda_version)
          print("Compute capability:", capability)

          # ======================================
          # RESULT OBJECT
          # ======================================

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "RUNNING",
              "cuda": True,
              "gpu": gpu_name,
              "cuda_version": cuda_version,
              "compute_capability": list(capability)
          }

          # ======================================
          # GPU INFO
          # ======================================

          if OPERATION == "gpu_info":

              result["status"] = "SUCCESS"

              print()
              print("GPU information requested.")

          # ======================================
          # MATRIX
          # ======================================

          elif OPERATION == "matrix":

              print()
              print("======================================")
              print("       REAL GPU COMPUTATION")
              print("======================================")

              print(
                  "Creating",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE,
                  "matrices..."
              )

              device = torch.device("cuda")

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device=device,
                  dtype=torch.float32
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device=device,
                  dtype=torch.float32
              )

              # Warm-up
              print("GPU warm-up...")

              c = torch.matmul(a, b)

              torch.cuda.synchronize()

              # Real measurement
              start = time.perf_counter()

              c = torch.matmul(a, b)

              torch.cuda.synchronize()

              elapsed = time.perf_counter() - start

              result["status"] = "SUCCESS"
              result["result_shape"] = list(c.shape)
              result["time_seconds"] = elapsed
              result["matrix_size"] = MATRIX_SIZE

              print()
              print("======================================")
              print("       GPU COMPUTATION SUCCESS")
              print("======================================")

              print("GPU:", gpu_name)

              print(
                  "Result shape:",
                  c.shape
              )

              print(
                  "Time:",
                  elapsed,
                  "seconds"
              )

              del a
              del b
              del c

              torch.cuda.empty_cache()

          # ======================================
          # UNKNOWN OPERATION
          # ======================================

          else:

              result["status"] = "ERROR"
              result["error"] = (
                  "Unknown operation: "
                  + OPERATION
              )

          # ======================================
          # SAVE RESULT
          # ======================================

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print()
          print("======================================")
          print("             RESULT")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print()
          print("GPU JOB FINISHED")

          PYTHON

          # ======================================
          # CREATE IPYNB
          # ======================================

          python - <<'PY'

          import json

          with open(
              "kaggle_job/gpu_job.py",
              "r"
          ) as f:

              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],

              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },

                  "language_info": {
                      "name": "python"
                  }
              },

              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:

              json.dump(
                  notebook,
                  f,
                  indent=2
              )

          print("Notebook created.")

          PY

      # ==========================================
      # KAGGLE METADATA
      # ==========================================

      - name: Create Kaggle metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF

          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }

          EOF

          cat kaggle_job/kernel-metadata.json

      # ==========================================
      # SUBMIT TO KAGGLE
      # ==========================================

      - name: Submit to Kaggle
        run: |

          cd kaggle_job

          python -m kaggle kernels push

          echo ""
          echo "======================================"
          echo "       KAGGLE GPU JOB SUBMITTED"
          echo "======================================"

      # ==========================================
      # WAIT FOR GPU START
      # ==========================================

      - name: Wait for GPU
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          for i in $(seq 1 60)
          do

              echo ""
              echo "========== STATUS $i/60 =========="

              STATUS=$(
                python -m kaggle kernels status \
                "$KERNEL" 2>&1 || true
              )

              echo "$STATUS"

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.RUNNING"'
              then

                  echo ""
                  echo "======================================"
                  echo "       GPU SESSION IS RUNNING"
                  echo "======================================"

                  exit 0
              fi

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.ERROR"'
              then

                  echo ""
                  echo "KAGGLE GPU ERROR"
                  exit 1
              fi

              sleep 5

          done

          echo "GPU did not start."

          exit 1

      # ==========================================
      # WAIT FOR COMPLETION
      # ==========================================

      - name: Wait for GPU job completion
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo ""
          echo "======================================"
          echo "       WAITING FOR GPU JOB"
          echo "======================================"

          for i in $(seq 1 180)
          do

              STATUS=$(
                python -m kaggle kernels status \
                "$KERNEL" 2>&1 || true
              )

              echo ""
              echo "========== CHECK $i/180 =========="

              echo "$STATUS"

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.COMPLETE"'
              then

                  echo ""
                  echo "======================================"
                  echo "       GPU JOB COMPLETE"
                  echo "======================================"

                  exit 0
              fi

              if echo "$STATUS" | grep -Fq \
                'status "KernelWorkerStatus.ERROR"'
              then

                  echo ""
                  echo "======================================"
                  echo "          GPU JOB ERROR"
                  echo "======================================"

                  exit 1
              fi

              sleep 5

          done

          echo "GPU job timed out."

          exit 1

      # ==========================================
      # DOWNLOAD RESULT
      # ==========================================

      - name: Download result
        run: |

          mkdir -p kaggle_output

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            || true

          echo ""
          echo "======================================"
          echo "       KAGGLE OUTPUT"
          echo "======================================"

          find kaggle_output \
            -type f \
            -print

      # ==========================================
      # VERIFY RESULT
      # ==========================================

      - name: Verify result
        run: |

          echo ""
          echo "======================================"
          echo "       VERIFYING GPU RESULT"
          echo "======================================"

          if [ ! -f kaggle_output/result.json ]; then

              echo "ERROR: result.json not found."

              exit 1

          fi

          cat kaggle_output/result.json

          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json

          echo "SUCCESS" \
            > kaggle_output/status.txt

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload GPU result
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: kaggle_output/
          if-no-files-found: error

      # ==========================================
      # FINAL
      # ==========================================

      - name: Final status
        run: |

          echo ""
          echo "======================================"
          echo "          GPU JOB SUCCESS"
          echo "======================================"

          echo "Job ID: $JOB_ID"
          echo "Operation: $OPERATION"
          echo "Matrix: $MATRIX_SIZE"

          echo ""
          echo "Result uploaded successfully."
