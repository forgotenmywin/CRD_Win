name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      operation:
        required: true
        type: string
      size:
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          python -m kaggle --version

      - name: Create GPU worker
        run: |
          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'
          import subprocess
          import sys
          import json
          import time

          print("======================================")
          print("       KAGGLE GPU WORKER")
          print("======================================")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )

          import torch

          job_id = "__JOB_ID__"
          operation = "__OPERATION__"
          matrix_size = int("__MATRIX_SIZE__")

          print("JOB ID:", job_id)
          print("OPERATION:", operation)
          print("SIZE:", matrix_size)

          print("PyTorch:", torch.__version__)
          print("CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError("CUDA is not available")

          gpu = torch.cuda.get_device_name(0)
          capability = torch.cuda.get_device_capability(0)

          memory = torch.cuda.get_device_properties(
              0
          ).total_memory

          memory_mb = memory / 1024 / 1024

          print("GPU:", gpu)
          print("Compute capability:", capability)
          print("GPU memory:", round(memory_mb, 2), "MB")

          print("Running basic GPU test...")

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          requested_time = None
          requested_shape = None

          if operation == "matrix":

              print(
                  "Running matrix:",
                  matrix_size,
                  "x",
                  matrix_size
              )

              a = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )

              b = torch.randn(
                  matrix_size,
                  matrix_size,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = (
                  time.perf_counter() - start
              )

              requested_shape = list(c.shape)

              print(
                  "Matrix completed:",
                  requested_shape
              )

              print(
                  "Matrix time:",
                  requested_time
              )

          else:
              raise ValueError(
                  f"Unsupported operation: {operation}"
              )

          result = {
              "job_id": job_id,
              "operation": operation,
              "status": "SUCCESS",
              "cuda": True,
              "gpu": gpu,
              "cuda_version": torch.version.cuda,
              "pytorch_version": torch.__version__,
              "compute_capability": list(capability),
              "gpu_memory_mb": round(
                  memory_mb,
                  2
              ),
              "basic_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },
              "requested_matrix": {
                  "size": matrix_size,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("======================================")
          print("             SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )
          PY

          sed -i \
            "s/__JOB_ID__/${JOB_ID}/g" \
            kaggle_job/gpu_job.py

          sed -i \
            "s/__OPERATION__/${OPERATION}/g" \
            kaggle_job/gpu_job.py

          sed -i \
            "s/__MATRIX_SIZE__/${MATRIX_SIZE}/g" \
            kaggle_job/gpu_job.py

      - name: Create notebook
        run: |
          python - <<'PY'
          import json

          with open(
              "kaggle_job/gpu_job.py",
              "r",
              encoding="utf-8"
          ) as f:
              code = f.read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  },
                  "language_info": {
                      "name": "python"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  notebook,
                  f,
                  indent=2
              )
          PY

      - name: Create Kaggle metadata
        run: |
          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

          cat kaggle_job/kernel-metadata.json

      - name: Submit Kaggle GPU job
        run: |
          cd kaggle_job

          python -m kaggle kernels push

          echo ""
          echo "Kaggle GPU job submitted."

      - name: Wait for Kaggle result
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          mkdir -p kaggle_output
          mkdir -p kaggle_logs

          RESULT_FOUND=0

          for i in $(seq 1 180); do

            echo ""
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            rm -rf kaggle_tmp
            mkdir -p kaggle_tmp

            python -m kaggle kernels output \
              "$KERNEL" \
              -p kaggle_tmp \
              --file-pattern "result.json" \
              > "kaggle_logs/output-${i}.log" 2>&1 || true

            if [[ -f "kaggle_tmp/result.json" ]]; then

              echo "GPU RESULT FOUND"

              cp \
                "kaggle_tmp/result.json" \
                "kaggle_output/result.json"

              RESULT_FOUND=1

              cat \
                "kaggle_output/result.json"

              break
            fi

            echo "Result not ready."
            echo "GPU job still running..."

            sleep 5

          done

          if [[ "$RESULT_FOUND" != "1" ]]; then

            echo ""
            echo "======================================"
            echo "       GPU JOB TIMEOUT"
            echo "======================================"

            echo ""
            echo "Last Kaggle output log:"

            LAST_LOG=$(
              find kaggle_logs \
                -name "output-*.log" \
                -type f \
                | sort \
                | tail -1
            )

            if [[ -n "$LAST_LOG" ]]; then
              cat "$LAST_LOG"
            fi

            exit 1
          fi

      - name: Verify result
        if: success()
        run: |
          echo "======================================"
          echo "         VERIFYING RESULT"
          echo "======================================"

          if [[ ! -f "kaggle_output/result.json" ]]; then
            echo "result.json not found"
            exit 1
          fi

          cat kaggle_output/result.json

          python - <<'PY'
          import json
          import os
          import sys

          with open(
              "kaggle_output/result.json",
              "r",
              encoding="utf-8"
          ) as f:
              result = json.load(f)

          expected = os.environ["JOB_ID"]
          returned = result.get("job_id")

          print("Expected:", expected)
          print("Returned:", returned)

          if returned != expected:
              print("ERROR: JOB ID MISMATCH")
              sys.exit(1)

          if result.get("status") != "SUCCESS":
              print("ERROR: GPU JOB FAILED")
              sys.exit(1)

          print("JOB ID VERIFIED")
          print("GPU RESULT VERIFIED")
          PY

          cp \
            kaggle_output/result.json \
            kaggle_output/gpu_result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/
            kaggle_logs/
          if-no-files-found: warn

      - name: Final
        if: always()
        run: |
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB ID: $JOB_ID"
          echo "OPERATION: $OPERATION"
          echo "MATRIX SIZE: $MATRIX_SIZE"
