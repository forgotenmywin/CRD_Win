name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "GPU operation"
        required: true
        type: string

      matrix_size:
        description: "Matrix size"
        required: true
        type: string

jobs:

  gpu-job:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.matrix_size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install kaggle==2.2.4

      - name: Create Kaggle GPU Job
        run: |

          mkdir -p kaggle_job

          cat > kaggle_job/gpu_job.py <<'PY'

          import json
          import subprocess
          import sys
          import time
          import os

          print("======================================")
          print("          KAGGLE GPU WORKER")
          print("======================================")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--no-cache-dir",
                  "-q",
                  "torch==2.5.1",
                  "--index-url",
                  "https://download.pytorch.org/whl/cu124"
              ],
              check=True
          )

          import torch

          JOB_ID = os.environ["JOB_ID"]
          OPERATION = os.environ["OPERATION"]
          MATRIX_SIZE = int(os.environ["MATRIX_SIZE"])

          print("PyTorch:", torch.__version__)
          print("CUDA:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())

          if not torch.cuda.is_available():
              raise RuntimeError("CUDA is not available")

          gpu = torch.cuda.get_device_name(0)

          capability = torch.cuda.get_device_capability(0)

          props = torch.cuda.get_device_properties(0)

          memory_mb = props.total_memory / 1024 / 1024

          print("GPU:", gpu)
          print("Compute capability:", capability)
          print("GPU memory:", memory_mb, "MB")

          # Basic GPU test

          x = torch.randn(
              1024,
              1024,
              device="cuda"
          )

          torch.cuda.synchronize()

          start = time.perf_counter()

          y = x @ x

          torch.cuda.synchronize()

          elapsed = time.perf_counter() - start

          requested_time = None
          requested_shape = None

          if OPERATION == "matrix":

              print(
                  "Running matrix:",
                  MATRIX_SIZE,
                  "x",
                  MATRIX_SIZE
              )

              a = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              b = torch.randn(
                  MATRIX_SIZE,
                  MATRIX_SIZE,
                  device="cuda"
              )

              torch.cuda.synchronize()

              start = time.perf_counter()

              c = a @ b

              torch.cuda.synchronize()

              requested_time = (
                  time.perf_counter()
                  - start
              )

              requested_shape = list(c.shape)

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "status": "SUCCESS",
              "cuda": True,
              "gpu": gpu,
              "cuda_version": torch.version.cuda,
              "pytorch_version": torch.__version__,
              "compute_capability": list(capability),
              "gpu_memory_mb": round(memory_mb, 2),

              "basic_test": {
                  "shape": list(y.shape),
                  "time_seconds": elapsed
              },

              "requested_matrix": {
                  "size": MATRIX_SIZE,
                  "shape": requested_shape,
                  "time_seconds": requested_time
              }
          }

          os.makedirs(
              "/kaggle/working",
              exist_ok=True
          )

          with open(
              "/kaggle/working/result.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          print("")
          print("======================================")
          print("             GPU SUCCESS")
          print("======================================")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          print("")
          print("RESULT FILE:")
          print("/kaggle/working/result.json")

          PY

      - name: Create Notebook
        run: |

          python - <<'PY'

          import json

          code = open(
              "kaggle_job/gpu_job.py"
          ).read()

          notebook = {
              "cells": [
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": code.splitlines(True)
                  }
              ],
              "metadata": {
                  "kernelspec": {
                      "display_name": "Python 3",
                      "language": "python",
                      "name": "python3"
                  }
              },
              "nbformat": 4,
              "nbformat_minor": 5
          }

          with open(
              "kaggle_job/gpu_job.ipynb",
              "w"
          ) as f:

              json.dump(
                  notebook,
                  f,
                  indent=2
              )

          PY

      - name: Create Kaggle Metadata
        run: |

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "gpu_job.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true
          }
          EOF

      - name: Submit Kaggle Job
        working-directory: kaggle_job
        run: |

          kaggle kernels push

      - name: Wait for Kaggle
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          for i in $(seq 1 180)
          do

            echo ""
            echo "CHECK $i/180"

            STATUS=$(python -m kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "KernelWorkerStatus.COMPLETE"
            then

              echo "Kaggle job complete."

              break

            fi

            if echo "$STATUS" | grep -q "KernelWorkerStatus.ERROR"
            then

              echo "Kaggle job failed."

              exit 1

            fi

            sleep 5

          done

      - name: Download Result
        run: |

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          python -m kaggle kernels output \
            "$KERNEL" \
            -p kaggle_output \
            --force

          echo ""
          echo "======================================"
          echo "          GPU RESULT"
          echo "======================================"

          find kaggle_output -type f -print

          if [ -f "kaggle_output/result.json" ]
          then

            cat kaggle_output/result.json

          else

            echo "result.json not found"

            exit 1

          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: kaggle_output/result.json
