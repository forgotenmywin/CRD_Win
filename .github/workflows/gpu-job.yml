name: Kaggle GPU Job

run-name: GPU-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "Operation"
        required: true
        default: "matrix"
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      SIZE: ${{ inputs.size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaggle
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Check Kaggle
        run: |
          kaggle --version

      - name: Create Kaggle files
        run: |
          mkdir -p kaggle_job
          mkdir -p kaggle_output

          cat > kaggle_job/script.py <<'PY'
          import os
          import json
          import time
          import traceback

          JOB_ID = os.environ.get("JOB_ID", "unknown")
          OPERATION = os.environ.get("OPERATION", "matrix")
          SIZE = int(os.environ.get("SIZE", "1024"))

          print("=" * 60)
          print("KAGGLE GPU WORKER")
          print("=" * 60)

          print("JOB_ID:", JOB_ID)
          print("OPERATION:", OPERATION)
          print("SIZE:", SIZE)

          result = {
              "job_id": JOB_ID,
              "operation": OPERATION,
              "size": SIZE,
              "status": "ERROR"
          }

          try:
              import numba
              from numba import cuda
              import numpy as np

              print()
              print("Numba:", numba.__version__)
              print("CUDA available:", cuda.is_available())

              if not cuda.is_available():
                  raise RuntimeError("CUDA is not available")

              device = cuda.get_current_device()

              print("GPU:", device.name)
              print("Compute capability:", device.compute_capability)

              print("=" * 60)
              print("GPU TEST")
              print("=" * 60)

              @cuda.jit
              def matrix_kernel(a, b, c):
                  row, col = cuda.grid(2)

                  if row < a.shape[0] and col < b.shape[1]:
                      tmp = 0.0

                      for k in range(a.shape[1]):
                          tmp += a[row, k] * b[k, col]

                      c[row, col] = tmp

              n = SIZE

              # کوچک‌تر برای اینکه تست سریع باشد
              a = np.random.rand(n, n).astype(np.float32)
              b = np.random.rand(n, n).astype(np.float32)
              c = np.zeros((n, n), dtype=np.float32)

              d_a = cuda.to_device(a)
              d_b = cuda.to_device(b)
              d_c = cuda.to_device(c)

              threads = (16, 16)
              blocks = (
                  (n + threads[0] - 1) // threads[0],
                  (n + threads[1] - 1) // threads[1]
              )

              start = time.perf_counter()

              matrix_kernel[blocks, threads](
                  d_a,
                  d_b,
                  d_c
              )

              cuda.synchronize()

              elapsed = time.perf_counter() - start

              c = d_c.copy_to_host()

              checksum = float(np.sum(c))

              print()
              print("GPU computation successful!")
              print("Matrix:", n, "x", n)
              print("Time:", elapsed)
              print("Checksum:", checksum)

              result = {
                  "job_id": JOB_ID,
                  "operation": OPERATION,
                  "size": n,
                  "status": "SUCCESS",
                  "gpu": str(device.name),
                  "compute_capability": list(device.compute_capability),
                  "cuda_available": True,
                  "numba_version": numba.__version__,
                  "time_seconds": elapsed,
                  "checksum": checksum
              }

          except Exception as e:

              print()
              print("=" * 60)
              print("GPU JOB ERROR")
              print("=" * 60)

              traceback.print_exc()

              result = {
                  "job_id": JOB_ID,
                  "operation": OPERATION,
                  "size": SIZE,
                  "status": "ERROR",
                  "error": str(e),
                  "traceback": traceback.format_exc()
              }

          print()
          print("=" * 60)
          print("FINAL RESULT")
          print("=" * 60)

          print(json.dumps(result, indent=2))

          with open("/kaggle/working/result.json", "w") as f:
              json.dump(result, f, indent=2)

          if result["status"] != "SUCCESS":
              raise SystemExit(1)
          PY

          cat > kaggle_job/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "script.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": [],
            "model_instance_ids": []
          }
          EOF

      - name: Submit Kaggle job
        working-directory: kaggle_job
        run: |
          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          echo "JOB_ID=$JOB_ID"
          echo "OPERATION=$OPERATION"
          echo "SIZE=$SIZE"

          kaggle kernels push

      - name: Wait for Kaggle
        working-directory: kaggle_job
        run: |
          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          FINAL_STATUS="ERROR"

          for i in $(seq 1 180); do

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)

            echo
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            echo "$STATUS"

            if echo "$STATUS" | grep -q "COMPLETE"; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              FINAL_STATUS="ERROR"
              break
            fi

            if echo "$STATUS" | grep -q "CANCEL"; then
              FINAL_STATUS="ERROR"
              break
            fi

            sleep 5
          done

          echo
          echo "FINAL_STATUS=$FINAL_STATUS"

          mkdir -p ../kaggle_output

          echo "Downloading Kaggle output..."

          kaggle kernels output "$KERNEL" \
            -p ../kaggle_output \
            --force || true

          echo
          echo "Kaggle output:"
          find ../kaggle_output -type f -maxdepth 3 -print || true

          if [ "$FINAL_STATUS" != "COMPLETE" ]; then
            echo "Kaggle job failed."
            exit 1
          fi

      - name: Validate result
        run: |
          echo "======================================"
          echo "       VALIDATING RESULT"
          echo "======================================"

          if [ ! -f kaggle_output/result.json ]; then
            echo "ERROR: result.json not found"
            find kaggle_output -type f -print
            exit 1
          fi

          cat kaggle_output/result.json

          python - <<'PY'
          import json
          import os
          import sys

          path = "kaggle_output/result.json"

          with open(path) as f:
              result = json.load(f)

          expected = os.environ["JOB_ID"]
          actual = result.get("job_id")

          print("Expected:", expected)
          print("Actual:", actual)

          if actual != expected:
              print("ERROR: Job ID mismatch")
              sys.exit(1)

          if result.get("status") != "SUCCESS":
              print("ERROR: GPU computation failed")
              sys.exit(1)

          print("Result validation successful!")
          PY

      - name: Upload GPU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: |
            kaggle_output/result.json
            kaggle_output/*.log
          if-no-files-found: warn

      - name: Final
        run: |
          echo
          echo "======================================"
          echo "          WORKFLOW FINISHED"
          echo "======================================"

          echo "JOB ID:"
          echo "$JOB_ID"

          echo "OPERATION:"
          echo "$OPERATION"

          echo "SIZE:"
          echo "$SIZE"
