name: Kaggle GPU Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "GPU Job ID"
        required: true
        type: string

      operation:
        description: "Operation"
        required: true
        default: "matrix"
        type: string

      size:
        description: "Matrix size"
        required: true
        default: "1024"
        type: string

jobs:
  gpu-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      JOB_ID: ${{ inputs.job_id }}
      OPERATION: ${{ inputs.operation }}
      MATRIX_SIZE: ${{ inputs.size }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Check Kaggle credentials
        run: |
          echo "Checking Kaggle credentials..."

          test -n "$KAGGLE_USERNAME" || {
            echo "ERROR: KAGGLE_USERNAME is empty"
            exit 1
          }

          test -n "$KAGGLE_API_TOKEN" || {
            echo "ERROR: KAGGLE_API_TOKEN is empty"
            exit 1
          }

          echo "Kaggle username configured."

      - name: Create Kaggle kernel
        run: |
          set -e

          mkdir -p kaggle_kernel

          cat > kaggle_kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/gpu-job-${JOB_ID}",
            "title": "GPU Job ${JOB_ID}",
            "code_file": "main.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": [],
            "model_instance_ids": []
          }
          EOF

          cat > kaggle_kernel/main.py <<'PY'
          import json
          import os
          import time
          import traceback

          print("=" * 50)
          print("       KAGGLE GPU WORKER")
          print("=" * 50)

          job_id = os.environ.get("JOB_ID", "unknown")
          operation = os.environ.get("OPERATION", "matrix")
          size = int(os.environ.get("MATRIX_SIZE", "1024"))

          print("Job ID:", job_id)
          print("Operation:", operation)
          print("Matrix size:", size)

          result = {
              "job_id": job_id,
              "operation": operation,
              "requested_matrix": {
                  "size": size
              }
          }

          try:
              import torch

              print()
              print("PyTorch:", torch.__version__)
              print("CUDA available:", torch.cuda.is_available())

              result["pytorch_version"] = torch.__version__
              result["cuda"] = torch.cuda.is_available()

              if not torch.cuda.is_available():
                  raise RuntimeError("CUDA GPU is not available")

              device = torch.device("cuda")

              gpu_name = torch.cuda.get_device_name(0)
              capability = torch.cuda.get_device_capability(0)

              memory_mb = (
                  torch.cuda.get_device_properties(0).total_memory
                  / 1024 / 1024
              )

              result["gpu"] = gpu_name
              result["compute_capability"] = list(capability)
              result["gpu_memory_mb"] = memory_mb

              print("GPU:", gpu_name)
              print("Compute capability:", capability)
              print("GPU memory MB:", memory_mb)

              if operation == "matrix":

                  print()
                  print("Creating matrices...")

                  a = torch.randn(
                      size,
                      size,
                      device=device,
                      dtype=torch.float32
                  )

                  b = torch.randn(
                      size,
                      size,
                      device=device,
                      dtype=torch.float32
                  )

                  torch.cuda.synchronize()

                  start = time.perf_counter()

                  c = torch.matmul(a, b)

                  torch.cuda.synchronize()

                  elapsed = time.perf_counter() - start

                  print("Matrix multiplication complete.")
                  print("Shape:", list(c.shape))
                  print("Time:", elapsed)

                  result["basic_test"] = {
                      "shape": list(c.shape),
                      "time_seconds": elapsed
                  }

                  result["result"] = {
                      "shape": list(c.shape),
                      "time_seconds": elapsed
                  }

                  del a
                  del b
                  del c

                  torch.cuda.empty_cache()

              else:
                  raise ValueError(
                      f"Unknown operation: {operation}"
                  )

              result["status"] = "SUCCESS"

          except Exception as e:

              print()
              print("=" * 50)
              print("             GPU ERROR")
              print("=" * 50)

              print(type(e).__name__ + ":", str(e))
              traceback.print_exc()

              result["status"] = "ERROR"
              result["error"] = str(e)
              result["exception"] = type(e).__name__

          print()
          print("=" * 50)
          print("              RESULT")
          print("=" * 50)

          print(json.dumps(result, indent=2))

          with open("/kaggle/working/result.json", "w") as f:
              json.dump(result, f, indent=2)

          if result["status"] != "SUCCESS":
              raise RuntimeError(result.get("error", "GPU job failed"))

          print()
          print("GPU JOB SUCCESS")
          PY

          echo "Kaggle kernel files:"
          ls -lah kaggle_kernel

      - name: Push Kaggle kernel
        run: |
          set -e

          echo "======================================"
          echo "       SUBMITTING KAGGLE JOB"
          echo "======================================"

          cd kaggle_kernel

          kaggle kernels push -p .

          echo
          echo "Kaggle job submitted."

      - name: Wait for Kaggle GPU
        run: |
          set -e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          echo "======================================"
          echo "       WAITING FOR KAGGLE GPU"
          echo "======================================"

          echo "Kernel:"
          echo "$KERNEL"

          for i in $(seq 1 180); do

            echo
            echo "======================================"
            echo "CHECK $i/180"
            echo "======================================"

            STATUS=$(kaggle kernels status "$KERNEL" 2>&1 || true)

            echo "$STATUS"

            if echo "$STATUS" | grep -q "COMPLETE"; then
              echo
              echo "======================================"
              echo "       KAGGLE JOB COMPLETE"
              echo "======================================"
              break
            fi

            if echo "$STATUS" | grep -q "ERROR"; then
              echo
              echo "======================================"
              echo "          KAGGLE JOB ERROR"
              echo "======================================"

              echo "$STATUS"

              echo
              echo "Trying to download Kaggle output..."

              mkdir -p kaggle_output

              kaggle kernels output "$KERNEL" \
                -p kaggle_output \
                --force || true

              find kaggle_output -maxdepth 2 -type f -print || true

              exit 1
            fi

            if echo "$STATUS" | grep -q "CANCEL"; then
              echo "Kaggle job cancelled."
              exit 1
            fi

            sleep 5

          done

      - name: Download Kaggle result
        run: |
          set -e

          KERNEL="${KAGGLE_USERNAME}/gpu-job-${JOB_ID}"

          mkdir -p kaggle_output

          echo "Downloading Kaggle output..."

          kaggle kernels output "$KERNEL" \
            -p kaggle_output \
            --force

          echo
          echo "Downloaded files:"

          find kaggle_output -maxdepth 3 -type f -print

          if [ -f kaggle_output/result.json ]; then
            echo
            echo "======================================"
            echo "             GPU RESULT"
            echo "======================================"

            cat kaggle_output/result.json
          else
            echo
            echo "ERROR: result.json was not found."

            find kaggle_output -type f -exec sh -c '
              echo "----- $1 -----"
              cat "$1"
              echo
            ' _ {} \;

            exit 1
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gpu-result-${{ inputs.job_id }}
          path: kaggle_output/
          if-no-files-found: error
